<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
let lang='bn';

// ===== ১০ টা ফিক্সড দোয়া =====
const DUAS = [
{qNo:1, catBn:"মা বাবার জন্য দোয়া", catEn:"Dua for Parents", ar:"رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", trBn:"রাব্বির হামহুমা কামা রাব্বায়ানি সাগীরা", trEn:"Rabbir hamhuma kama rabbayani saghira", bn:"হে আমার প্রতিপালক! তাদের প্রতি দয়া করো যেমন তারা শৈশবে আমাকে লালন-পালন করেছেন। (সূরা বনী ইসরাঈল ২৪)", en:"My Lord, have mercy upon them as they brought me up when I was small."},
{qNo:2, catBn:"সন্তানের জন্য দোয়া", catEn:"Dua for Children", ar:"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ", trBn:"রাব্বানা হাব লানা মিন আজওয়াজিনা ওয়া জুররিয়াতিনা কুররাতা আইয়ুন", trEn:"Rabbana hablana min azwajina qurrata a'yun", bn:"হে আমাদের রব! আমাদের স্ত্রী ও সন্তানদের চোখের শীতলতা বানিয়ে দিন।", en:"Our Lord, grant us comfort of eyes from our spouses and offspring."},
{qNo:3, catBn:"ক্ষমার জন্য দোয়া", catEn:"Dua for Forgiveness", ar:"رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ", trBn:"রাব্বিগফিরলী ওয়ালিওয়ালিদাইয়া ওয়ালিল মুমিনীনা ইয়াওমা ইয়াকুমুল হিসাব", trEn:"Rabbighfir li wa liwalidayya", bn:"হে রব! আমাকে, পিতা-মাতাকে ও মুমিনদের ক্ষমা করুন যেদিন হিসাব হবে।", en:"Forgive me, my parents and believers on Day of Reckoning."},
{qNo:4, catBn:"রিজিকের জন্য দোয়া", catEn:"Dua for Rizq", ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ رِزْقًا طَيِّبًا وَعِلْمًا نَافِعًا", trBn:"আল্লাহুম্মা ইন্নি আসআলুকা রিজকান তাইয়্যিবা ওয়া ইলমান নাফিআ", trEn:"Allahumma inni as'aluka rizqan tayyiban", bn:"হে আল্লাহ! পবিত্র রিজিক ও উপকারী জ্ঞান চাই।", en:"O Allah, I ask You for good provision and beneficial knowledge."},
{qNo:5, catBn:"জ্ঞান বৃদ্ধির দোয়া", catEn:"Dua for Knowledge", ar:"رَبِّ زِدْنِي عِلْمًا", trBn:"রাব্বি জিদনী ইলমা", trEn:"Rabbi zidni ilma", bn:"হে আমার রব! আমার জ্ঞান বৃদ্ধি করে দিন।", en:"My Lord, increase me in knowledge."},
{qNo:6, catBn:"বিপদ থেকে মুক্তির দোয়া", catEn:"Dua from Hardship", ar:"لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", trBn:"লা ইলাহা ইল্লা আনতা সুবহানাকা ইন্নি কুনতু মিনাজ জলিমীন", trEn:"La ilaha illa Anta subhanaka", bn:"আপনি ছাড়া কোনো ইলাহ নেই, আপনি পবিত্র, আমি জালিমদের অন্তর্ভুক্ত।", en:"There is no deity except You, exalted are You."},
{qNo:7, catBn:"সুস্থতার দোয়া", catEn:"Dua for Health", ar:"اللَّهُمَّ عَافِنِي فِي بَدَنِي اللَّهُمَّ عَافِنِي فِي سَمْعِي", trBn:"আল্লাহুম্মা আফিনি ফি বাদানি, আল্লাহুম্মা আফিনি ফি সামঈ", trEn:"Allahumma afini fi badani", bn:"হে আল্লাহ! আমার শরীর ও শ্রবণে সুস্থতা দিন।", en:"O Allah grant health in my body and hearing."},
{qNo:8, catBn:"ঘুম থেকে উঠার দোয়া", catEn:"Waking up Dua", ar:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا", trBn:"আলহামদুলিল্লাহিল্লাযি আহইয়ানা বা'দা মা আমাতানা", trEn:"Alhamdulillahilladhi ahyana", bn:"সকল প্রশংসা আল্লাহর যিনি মৃত্যুর পর আমাদের জীবিত করলেন।", en:"All praise to Allah who gave us life after death."},
{qNo:9, catBn:"সফরের দোয়া", catEn:"Travel Dua", ar:"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ", trBn:"সুবহানাল্লাযি সাখখারা লানা হাযা", trEn:"Subhanalladhi sakhkhara lana", bn:"পবিত্র তিনি যিনি একে আমাদের বশীভূত করেছেন।", en:"Glory to Him who subjected this to us."},
{qNo:10, catBn:"হেদায়েতের দোয়া", catEn:"Guidance Dua", ar:"اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ", trBn:"ইহদিনাস সিরাতাল মুস্তাকীম", trEn:"Ihdinas siratal mustaqim", bn:"আমাদের সরল সঠিক পথ দেখান।", en:"Guide us to the straight path."},
{qNo:11, catBn:"অযুর দোয়া", catEn:"For Wudu", ar:"بِسْمِ اللَّهِ", trBn:"বিসমিল্লাহ", trEn:"Bismillah", bn:"আল্লাহর নামে শুরু করছি", en:"In the name of Allah"},

{qNo:12, catBn:"খাবার খাওয়ার দোয়া", catEn:"For Eating Food", ar:"بِسْمِ اللَّهِ وَعَلَى بَرَكَةِ اللَّهِ", trBn:"বিসমিল্লাহি ওয়া আলা বারাকাতিল্লাহ", trEn:"Bismillahi wa ala barakatillah", bn:"আল্লাহর নামে এবং আল্লাহর বরকতের উপর", en:"In the name of Allah and with the blessing of Allah"},

{qNo:13, catBn:"খাবার শেষের দোয়া", catEn:"After Eating Food", ar:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ", trBn:"আলহামদু লিল্লাহিল্লাযী আতআমানী হাযা ওয়া রাযাকানীহি মিন গইরি হাওলিন মিন্নী ওয়ালা কুওয়াহ", trEn:"Alhamdu lillahil-ladhi at'amani hadha wa razaqanihi min ghayri hawlin minni wa la quwwah", bn:"সমস্ত প্রশংসা আল্লাহর, যিনি আমাকে এই খাবার খাইয়েছেন এবং আমার কোনো শক্তি ও সামর্থ্য ছাড়াই তা রিজিক হিসেবে দিয়েছেন", en:"Praise be to Allah who fed me this and provided it for me without any power or strength from me"},

{qNo:14, catBn:"ঘুম থেকে উঠার দোয়া", catEn:"After Waking Up", ar:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", trBn:"আলহামদু লিল্লাহিল্লাযী আহইয়ানা বা'দা মা আমাতানা ওয়া ইলাইহিন নুশূর", trEn:"Alhamdu lillahil-ladhi ahyana ba'da ma amatana wa ilayhin-nushur", bn:"সমস্ত প্রশংসা আল্লাহর, যিনি আমাদের মৃত্যুর মতো ঘুমের পর জীবিত করেছেন এবং তাঁর কাছেই ফিরে যেতে হবে", en:"Praise be to Allah who gave us life after causing us to die, and to Him is the resurrection"},

{qNo:15, catBn:"বাথরুমে ঢোকার দোয়া", catEn:"Entering the Bathroom", ar:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ", trBn:"আল্লাহুম্মা ইন্নী আউযু বিকা মিনাল খুবুছি ওয়াল খাবায়িছ", trEn:"Allahumma inni a'udhu bika minal-khubthi wal-khaba'ith", bn:"হে আল্লাহ! আমি অপবিত্র পুরুষ ও নারী শয়তান থেকে আপনার আশ্রয় চাই", en:"O Allah, I seek refuge in You from the male and female evil spirits"},

{qNo:16, catBn:"বাথরুম থেকে বের হওয়ার দোয়া", catEn:"Leaving the Bathroom", ar:"غُفْرَانَكَ", trBn:"গুফরানাকা", trEn:"Ghufranaka", bn:"হে আল্লাহ! আমি আপনার কাছে ক্ষমা প্রার্থনা করছি", en:"I seek Your forgiveness, O Allah"},

{qNo:17, catBn:"মসজিদে প্রবেশ করার দোয়া", catEn:"Entering the Mosque", ar:"اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", trBn:"আল্লাহুম্মাফতাহ লী আবওয়াবা রহমাতিক", trEn:"Allahumma-ftah li abwaba rahmatik", bn:"হে আল্লাহ! আমার জন্য আপনার রহমতের দরজাগুলো খুলে দিন", en:"O Allah, open for me the doors of Your mercy"},

{qNo:18, catBn:"মসজিদ থেকে বের হওয়ার দোয়া", catEn:"Leaving the Mosque", ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", trBn:"আল্লাহুম্মা ইন্নী আসআলুকা মিন ফাদলিক", trEn:"Allahumma inni as'aluka min fadlik", bn:"হে আল্লাহ! আমি আপনার অনুগ্রহ প্রার্থনা করছি", en:"O Allah, I ask You for Your bounty"},

{qNo:19, catBn:"ঘরে প্রবেশ করার দোয়া", catEn:"Entering the House", ar:"بِسْمِ اللَّهِ وَلَجْنَا وَبِسْمِ اللَّهِ خَرَجْنَا وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا", trBn:"বিসমিল্লাহি ওয়ালাজনা ওয়া বিসমিল্লাহি খারাজনা ওয়া আলাল্লাহি রব্বিনা তাওয়াক্কালনা", trEn:"Bismillahi walajna wa bismillahi kharajna wa alallahi rabbina tawakkalna", bn:"আল্লাহর নামে আমরা প্রবেশ করলাম, আল্লাহর নামে আমরা বের হলাম এবং আমাদের প্রতিপালক আল্লাহর উপর আমরা ভরসা করলাম", en:"In the name of Allah we enter, in the name of Allah we leave, and upon Allah our Lord we rely"},

{qNo:20, catBn:"ঘর থেকে বের হওয়ার দোয়া", catEn:"Leaving the House", ar:"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", trBn:"বিসমিল্লাহি তাওয়াক্কালতু আলাল্লাহি লা হাওলা ওয়ালা কুওয়াতা ইল্লা বিল্লাহ", trEn:"Bismillahi tawakkaltu alallah, la hawla wa la quwwata illa billah", bn:"আল্লাহর নামে বের হচ্ছি, আল্লাহর উপর ভরসা করলাম। আল্লাহ ছাড়া কোনো শক্তি ও সামর্থ্য নেই", en:"In the name of Allah, I rely upon Allah. There is no power or strength except with Allah"},

{qNo:21, catBn:"গাড়িতে উঠার দোয়া", catEn:"When Boarding a Vehicle", ar:"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ۝ وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ", trBn:"সুবহানাল্লাযী সাখখারা লানা হাযা ওয়া মা কুন্না লাহু মুকরিনীন। ওয়া ইন্না ইলা রব্বিনা লামুনকালিবূন", trEn:"Subhanalladhi sakhkhara lana hadha wa ma kunna lahu muqrinin. Wa inna ila rabbina lamunqalibun", bn:"পবিত্র তিনি, যিনি এটিকে আমাদের জন্য বশীভূত করে দিয়েছেন; আমরা নিজেরা এটিকে বশীভূত করতে সক্ষম ছিলাম না। আর নিশ্চয়ই আমরা আমাদের প্রতিপালকের কাছেই ফিরে যাব", en:"Glory be to Him who has subjected this to us, and we could not have controlled it ourselves. And surely to our Lord we will return"},


{qNo:22, catBn:"ঘুমানোর দোয়া", catEn:"Before Sleeping", ar:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", trBn:"বিসমিকা আল্লাহুম্মা আমূতু ওয়া আহইয়া", trEn:"Bismika Allahumma amutu wa ahya", bn:"হে আল্লাহ! আপনার নামেই আমি মৃত্যুবরণ করি এবং জীবিত হই", en:"In Your name, O Allah, I die and I live"},

{qNo:23, catBn:"আজান শোনার পরের দোয়া", catEn:"After Adhan", ar:"اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ", trBn:"আল্লাহুম্মা রব্বা হাযিহিদ দা‘ওয়াতিত তাম্মাতি, ওয়াস্ সালাতিল কায়িমাতি, আতি মুহাম্মাদানিল ওয়াসীলাতা ওয়াল ফাদীলাতা, ওয়াবআছহু মাকামাম মাহমূদানিল্লাযী ওয়াদতাহ", trEn:"Allahumma rabba hadhihid-da'watit-tammati, was-salatil-qa'imati, ati Muhammadanil-wasilata wal-fadilah, wab'ath-hu maqaman mahmudanil-ladhi wa'adtah", bn:"হে আল্লাহ! এই পরিপূর্ণ আহ্বান ও প্রতিষ্ঠিত নামাজের রব, মুহাম্মদ ﷺ-কে ওসিলা ও মর্যাদা দান করুন এবং তাঁকে সেই প্রশংসিত স্থানে পৌঁছান যার প্রতিশ্রুতি আপনি দিয়েছেন", en:"O Allah, Lord of this perfect call and established prayer, grant Muhammad the means and virtue and raise him to the praised station You promised him"},

{qNo:24, catBn:"হাঁচি দেওয়ার দোয়া", catEn:"After Sneezing", ar:"الْحَمْدُ لِلَّهِ", trBn:"আলহামদু লিল্লাহ", trEn:"Alhamdu lillah", bn:"সমস্ত প্রশংসা আল্লাহর", en:"All praise is due to Allah"},

{qNo:25, catBn:"হাঁচির জবাবের দোয়া", catEn:"Reply to a Sneeze", ar:"يَرْحَمُكَ اللَّهُ", trBn:"ইয়ারহামুকাল্লাহ", trEn:"Yarhamukallah", bn:"আল্লাহ আপনার প্রতি রহম করুন", en:"May Allah have mercy on you"},

{qNo:26, catBn:"বিপদে পড়লে দোয়া", catEn:"Supplication in Distress", ar:"لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ", trBn:"লা ইলাহা ইল্লাল্লাহুল আযীমুল হালীম, লা ইলাহা ইল্লাল্লাহু রব্বুল আরশিল আযীম, লা ইলাহা ইল্লাল্লাহু রব্বুস সামাওয়াতি ওয়া রব্বুল আরদি ওয়া রব্বুল আরশিল কারীম", trEn:"La ilaha illallahu al-'Azimul-Halim, la ilaha illallahu Rabbul-'Arshil-'Azim, la ilaha illallahu Rabbus-samawati wa Rabbul-ardi wa Rabbul-'Arshil-Karim", bn:"মহান ও সহনশীল আল্লাহ ছাড়া কোনো উপাস্য নেই। তিনি মহান আরশের রব, আসমান-জমিন ও সম্মানিত আরশের রব", en:"There is no deity except Allah, the Magnificent, the Forbearing. He is the Lord of the Mighty Throne and the Lord of the heavens, earth and the Noble Throne"},

{qNo:27, catBn:"দুশ্চিন্তার দোয়া", catEn:"For Anxiety", ar:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ", trBn:"আল্লাহুম্মা ইন্নী আউযু বিকা মিনাল হাম্মি ওয়াল হাজান, ওয়া আউযু বিকা মিনাল আজযি ওয়াল কাসাল, ওয়া আউযু বিকা মিনাল জুবনি ওয়াল বুখল, ওয়া আউযু বিকা মিন গালাবাতিদ দাইনি ওয়া কাহরির রিজাল", trEn:"Allahumma inni a'udhu bika minal-hammi wal-hazan, wa a'udhu bika minal-'ajzi wal-kasal, wa a'udhu bika minal-jubni wal-bukhl, wa a'udhu bika min ghalabatid-dayni wa qahrir-rijal", bn:"হে আল্লাহ! আমি দুশ্চিন্তা, দুঃখ, অক্ষমতা, অলসতা, কাপুরুষতা, কৃপণতা, ঋণের বোঝা ও মানুষের দমন থেকে আপনার আশ্রয় চাই", en:"O Allah, I seek refuge in You from worry, grief, weakness, laziness, cowardice, miserliness, the burden of debt and being overcome by people"},

{qNo:28, catBn:"ঋণ থেকে মুক্তির দোয়া", catEn:"For Relief from Debt", ar:"اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ", trBn:"আল্লাহুম্মাকফিনী বিহালালিকা আন হারামিক, ওয়া আগনিনী বিফাদলিকা আম্মান সিওয়াক", trEn:"Allahummakfini bihalalika 'an haramika, wa aghnini bifadlika 'amman siwak", bn:"হে আল্লাহ! আপনার হালাল দ্বারা আমাকে হারাম থেকে বাঁচিয়ে যথেষ্ট করুন এবং আপনার অনুগ্রহে আপনি ছাড়া অন্য সবার থেকে আমাকে অমুখাপেক্ষী করুন", en:"O Allah, suffice me with what You have made lawful instead of what You have made unlawful, and make me independent of all besides You by Your bounty"},

{qNo:29, catBn:"ইস্তিগফারের দোয়া", catEn:"Seeking Forgiveness", ar:"رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ", trBn:"রব্বিগফির লী ওয়া তুব আলাইয়্যা, ইন্নাকা আনতাত তাওয়াবুর রহীম", trEn:"Rabbighfir li wa tub 'alayya, innaka antat-Tawwabur-Rahim", bn:"হে আমার রব! আমাকে ক্ষমা করুন এবং আমার তওবা কবুল করুন। নিশ্চয়ই আপনি তওবা কবুলকারী, পরম দয়ালু", en:"My Lord, forgive me and accept my repentance. Surely You are the Accepter of repentance, the Most Merciful"},

{qNo:30, catBn:"সকালের দোয়া", catEn:"Morning Supplication", ar:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ", trBn:"আল্লাহুম্মা বিকা আসবাহনা, ওয়া বিকা আমসাইনা, ওয়া বিকা নাহইয়া, ওয়া বিকা নামূতু, ওয়া ইলাইকাল নুশূর", trEn:"Allahumma bika asbahna, wa bika amsayna, wa bika nahya, wa bika namut, wa ilaykan-nushur", bn:"হে আল্লাহ! আপনারই সাহায্যে আমরা সকালে উপনীত হই, আপনারই সাহায্যে সন্ধ্যায় উপনীত হই, আপনারই দ্বারা জীবিত থাকি, আপনারই দ্বারা মৃত্যুবরণ করি এবং আপনার কাছেই পুনরুত্থান", en:"O Allah, by You we enter the morning, by You we enter the evening, by You we live and by You we die, and to You is the resurrection"},

{qNo:31, catBn:"সন্ধ্যার দোয়া", catEn:"Evening Supplication", ar:"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ", trBn:"আল্লাহুম্মা বিকা আমসাইনা, ওয়া বিকা আসবাহনা, ওয়া বিকা নাহইয়া, ওয়া বিকা নামূতু, ওয়া ইলাইকাল মাসীর", trEn:"Allahumma bika amsayna, wa bika asbahna, wa bika nahya, wa bika namut, wa ilaykal-masir", bn:"হে আল্লাহ! আপনারই সাহায্যে আমরা সন্ধ্যায় উপনীত হই, আপনারই সাহায্যে সকালে উপনীত হই, আপনারই দ্বারা জীবিত থাকি, আপনারই দ্বারা মৃত্যুবরণ করি এবং আপনার কাছেই ফিরে যেতে হবে", en:"O Allah, by You we enter the evening, by You we enter the morning, by You we live and by You we die, and to You is the return"},

{qNo:32, catBn:"বৃষ্টি হলে দোয়া", catEn:"When It Rains", ar:"اللَّهُمَّ صَيِّبًا نَافِعًا", trBn:"আল্লাহুম্মা সাইয়্যিবান নাফিআন", trEn:"Allahumma sayyiban nafi'an", bn:"হে আল্লাহ! এই বৃষ্টিকে উপকারী বৃষ্টি করুন", en:"O Allah, make it beneficial rain"},

{qNo:33, catBn:"বৃষ্টি থামার পরের দোয়া", catEn:"After Rain", ar:"مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ", trBn:"মুতিরনা বিফাদলিল্লাহি ওয়া রহমাতিহি", trEn:"Mutirna bifadlillahi wa rahmatihi", bn:"আল্লাহর অনুগ্রহ ও রহমতে আমাদের উপর বৃষ্টি বর্ষিত হয়েছে", en:"We have been given rain by the فضل and mercy of Allah"},

{qNo:34, catBn:"নতুন পোশাক পরার দোয়া", catEn:"Wearing New Clothes", ar:"اللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ خَيْرَهُ وَخَيْرَ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ", trBn:"আল্লাহুম্মা লাকাল হামদু আনতা কাসাওতানীহি, আসআলুকা খাইরাহু ওয়া খাইরা মা সুনিআ লাহু, ওয়া আউযু বিকা মিন শাররিহি ওয়া শাররি মা সুনিআ লাহু", trEn:"Allahumma lakal-hamdu anta kasawtanihi, as'aluka khayrahu wa khayra ma suni'a lahu, wa a'udhu bika min sharrihi wa sharri ma suni'a lahu", bn:"হে আল্লাহ! সমস্ত প্রশংসা আপনার। আপনিই আমাকে এটি পরিয়েছেন। আমি এর কল্যাণ ও যে উদ্দেশ্যে এটি তৈরি করা হয়েছে তার কল্যাণ চাই এবং এর অকল্যাণ থেকে আপনার আশ্রয় চাই", en:"O Allah, praise is Yours. You have clothed me with it. I ask You for its good and the good for which it was made, and I seek refuge in You from its evil"},

{qNo:35, catBn:"আয়নায় দেখার দোয়া", catEn:"Looking in the Mirror", ar:"اللَّهُمَّ أَحْسَنْتَ خَلْقِي فَأَحْسِنْ خُلُقِي", trBn:"আল্লাহুম্মা আহসানতা খালকী ফা আহসিন খুলুকী", trEn:"Allahumma ahsanta khalqi fa-ahsin khuluqi", bn:"হে আল্লাহ! আপনি আমার আকৃতি সুন্দর করেছেন, অতএব আমার চরিত্রও সুন্দর করুন", en:"O Allah, You have made my form beautiful, so make my character beautiful"},

{qNo:36, catBn:"ইফতারের দোয়া", catEn:"At Iftar", ar:"ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ الْعُرُوقُ، وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ", trBn:"যাহাবায যামাউ, ওয়াবতাল্লাতিল উরূকু, ওয়া সাবাতাল আজরু ইনশাআল্লাহ", trEn:"Dhahabaz-zama'u, wabtallatil-'uruqu, wa thabatal-ajru in sha Allah", bn:"তৃষ্ণা নিবারিত হয়েছে, শিরাগুলো সিক্ত হয়েছে এবং আল্লাহ চাইলে সওয়াব নিশ্চিত হয়েছে", en:"The thirst has gone, the veins are moistened, and the reward is assured, if Allah wills"},

{qNo:37, catBn:"লাইলাতুল কদরের দোয়া", catEn:"Laylatul Qadr", ar:"اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", trBn:"আল্লাহুম্মা ইন্নাকা আফুউউন তুহিব্বুল আফওয়া ফাফু আন্নী", trEn:"Allahumma innaka 'afuwwun tuhibbul-'afwa fa'fu 'anni", bn:"হে আল্লাহ! নিশ্চয়ই আপনি ক্ষমাশীল, আপনি ক্ষমা করতে ভালোবাসেন, তাই আমাকে ক্ষমা করুন", en:"O Allah, You are Most Forgiving and You love to forgive, so forgive me"},

{qNo:38, catBn:"শক্তি ও সামর্থ্যের দোয়া", catEn:"For Strength", ar:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", trBn:"লা হাওলা ওয়ালা কুওয়াতা ইল্লা বিল্লাহ", trEn:"La hawla wa la quwwata illa billah", bn:"আল্লাহ ছাড়া কোনো শক্তি ও সামর্থ্য নেই", en:"There is no power or strength except with Allah"},

{qNo:39, catBn:"জান্নাতের দোয়া", catEn:"For Paradise", ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ", trBn:"আল্লাহুম্মা ইন্নী আসআলুকাল জান্নাতা ওয়া আউযু বিকা মিনান নার", trEn:"Allahumma inni as'alukal-jannata wa a'udhu bika minan-nar", bn:"হে আল্লাহ! আমি আপনার কাছে জান্নাত প্রার্থনা করছি এবং জাহান্নাম থেকে আপনার আশ্রয় চাই", en:"O Allah, I ask You for Paradise and seek refuge in You from the Fire"},
{qNo:40, catBn:"জ্ঞান বৃদ্ধির দোয়া", catEn:"For Increase in Knowledge", ar:"رَبِّ زِدْنِي عِلْمًا", trBn:"রব্বি যিদনী ইলমা", trEn:"Rabbi zidni ilma", bn:"হে আমার রব! আমার জ্ঞান বৃদ্ধি করুন", en:"My Lord, increase me in knowledge"},

{qNo:41, catBn:"সঠিক পথের দোয়া", catEn:"For Guidance", ar:"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ", trBn:"রব্বানা লা তুযিগ কুলুবানা বা'দা ইয হাদাইতানা ওয়া হাব লানা মিল্লাদুনকা রহমাতান, ইন্নাকা আনতাল ওয়াহহাব", trEn:"Rabbana la tuzigh qulubana ba'da idh hadaytana wa hab lana milladunka rahmah, innaka antal-Wahhab", bn:"হে আমাদের রব! হেদায়াত দেওয়ার পর আমাদের অন্তরকে বক্র করবেন না এবং আপনার পক্ষ থেকে আমাদের রহমত দান করুন। নিশ্চয়ই আপনি মহাদাতা", en:"Our Lord, do not let our hearts deviate after You have guided us, and grant us mercy from You. Surely You are the Bestower"},

{qNo:42, catBn:"দুনিয়া ও আখিরাতের কল্যাণের দোয়া", catEn:"For Good in This World and Hereafter", ar:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", trBn:"রব্বানা আতিনা ফিদ্দুনিয়া হাসানাতাও ওয়া ফিল আখিরাতি হাসানাতাও ওয়াকিনা আযাবান নার", trEn:"Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan wa qina adhaban-nar", bn:"হে আমাদের রব! আমাদের দুনিয়াতে কল্যাণ দিন, আখিরাতেও কল্যাণ দিন এবং আগুনের শাস্তি থেকে রক্ষা করুন", en:"Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire"},

{qNo:43, catBn:"মা-বাবার জন্য দোয়া", catEn:"For Parents", ar:"رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ", trBn:"রব্বিগফির লী ওয়া লিওয়ালিদাইয়া ওয়ালিলমুমিনীনা ইয়াওমা ইয়াকূমুল হিসাব", trEn:"Rabbighfir li wa liwalidayya wa lil-mu'minina yawma yaqumul-hisab", bn:"হে আমার রব! আমাকে, আমার মা-বাবাকে এবং সকল মুমিনকে হিসাব প্রতিষ্ঠার দিনে ক্ষমা করুন", en:"My Lord, forgive me, my parents, and the believers on the Day the account is established"},

{qNo:44, catBn:"সন্তানের জন্য দোয়া", catEn:"For Righteous Children", ar:"رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ", trBn:"রব্বি হাব লী মিল্লাদুনকা যুররিয়্যাতান তয়্যিবাতান ইন্নাকা সামীউদ দুয়া", trEn:"Rabbi hab li milladunka dhurriyyatan tayyibatan innaka sami'ud-du'a", bn:"হে আমার রব! আমাকে আপনার পক্ষ থেকে পবিত্র সন্তান দান করুন। নিশ্চয়ই আপনি দোয়া শ্রবণকারী", en:"My Lord, grant me from You a righteous offspring. Surely You are the Hearer of supplication"},

{qNo:45, catBn:"পরিবারের জন্য দোয়া", catEn:"For Family", ar:"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا", trBn:"রব্বানা হাব লানা মিন আজওয়াজিনা ওয়া যুররিয়্যাতিনা কুররাতা আইউনিওঁ ওয়াজআলনা লিলমুত্তাকীনা ইমামা", trEn:"Rabbana hab lana min azwajina wa dhurriyyatina qurrata a'yunin waj'alna lil-muttaqina imama", bn:"হে আমাদের রব! আমাদের স্ত্রী ও সন্তানদের আমাদের চোখের শীতলতা দান করুন এবং আমাদের মুত্তাকীদের নেতা বানান", en:"Our Lord, grant us from our spouses and offspring comfort to our eyes and make us leaders for the righteous"},

{qNo:46, catBn:"তওবার দোয়া", catEn:"For Repentance", ar:"رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ", trBn:"রব্বানা যালামনা আনফুসানা ওয়া ইল্লাম তাগফির লানা ওয়া তারহামনা লানাকূনান্না মিনাল খাসিরীন", trEn:"Rabbana zalamna anfusana wa illam taghfir lana wa tarhamna lanakunanna minal-khasirin", bn:"হে আমাদের রব! আমরা নিজেদের উপর জুলুম করেছি। আপনি যদি আমাদের ক্ষমা না করেন এবং আমাদের প্রতি দয়া না করেন, তবে আমরা অবশ্যই ক্ষতিগ্রস্তদের অন্তর্ভুক্ত হব", en:"Our Lord, we have wronged ourselves. If You do not forgive us and have mercy upon us, we will surely be among the losers"},

{qNo:47, catBn:"কাজ সহজ হওয়ার দোয়া", catEn:"For Ease in a Task", ar:"رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي", trBn:"রব্বিশরহ লী সদরী, ওয়া ইয়াসসির লী আমরী", trEn:"Rabbishrah li sadri, wa yassir li amri", bn:"হে আমার রব! আমার অন্তর প্রশস্ত করে দিন এবং আমার কাজ সহজ করে দিন", en:"My Lord, expand my chest for me and make my task easy for me"},

{qNo:48, catBn:"কষ্টের সময় দোয়া", catEn:"During Hardship", ar:"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", trBn:"হাসবুনাল্লাহু ওয়া নিমাল ওয়াকীল", trEn:"Hasbunallahu wa ni'mal-wakil", bn:"আমাদের জন্য আল্লাহই যথেষ্ট এবং তিনি কতই না উত্তম কর্মবিধায়ক", en:"Allah is sufficient for us, and He is the best disposer of affairs"},

{qNo:49, catBn:"অসুস্থতার সময় দোয়া", catEn:"For Illness", ar:"أَذْهِبِ الْبَأْسَ رَبَّ النَّاسِ، وَاشْفِ أَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا", trBn:"আযহিবিল বাসা রব্বান নাস, ওয়াশফি আনতাশ শাফী, লা শিফাআ ইল্লা শিফাউক, শিফাআন লা ইউগাদিরু সাকামা", trEn:"Adhhib al-ba'sa Rabb an-nas, washfi antash-Shafi, la shifa'a illa shifa'uk, shifa'an la yughadiru saqama", bn:"হে মানুষের রব! কষ্ট দূর করুন এবং আরোগ্য দান করুন। আপনিই আরোগ্যকারী। আপনার আরোগ্য ছাড়া কোনো আরোগ্য নেই—এমন আরোগ্য দিন যা কোনো রোগ অবশিষ্ট রাখে না", en:"Remove the affliction, Lord of mankind, and heal. You are the Healer. There is no healing except Your healing, a healing that leaves no illness"},

{qNo:50, catBn:"কবর জিয়ারতের দোয়া", catEn:"Visiting Graves", ar:"السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَلَاحِقُونَ، نَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ", trBn:"আসসালামু আলাইকুম আহলাদ দিয়ারি মিনাল মুমিনীনা ওয়াল মুসলিমীন, ওয়া ইন্না ইনশাআল্লাহু বিকুম লালাহিকূন, নাসআলুল্লাহা লানা ওয়া লাকুমুল আফিয়াহ", trEn:"Assalamu 'alaykum ahlad-diyari minal-mu'minina wal-muslimin, wa inna in sha Allahu bikum lalaqun, nas'alullaha lana wa lakumul-'afiyah", bn:"হে মুমিন ও মুসলিমদের আবাসস্থলবাসীগণ! আপনাদের উপর শান্তি বর্ষিত হোক। নিশ্চয়ই আল্লাহ চাইলে আমরাও আপনাদের সাথে মিলিত হব। আমরা আল্লাহর কাছে আমাদের ও আপনাদের নিরাপত্তা ও শান্তি প্রার্থনা করি", en:"Peace be upon you, inhabitants of the dwellings, among the believers and Muslims. If Allah wills, we will join you. We ask Allah for well-being for us and for you"},

{qNo:51, catBn:"জান্নাত চাওয়ার দোয়া", catEn:"Asking for Paradise", ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَسْأَلُكَ رِضْوَانَكَ وَالْفَوْزَ بِهَا", trBn:"আল্লাহুম্মা ইন্নী আসআলুকাল জান্নাতা ওয়া আসআলুকা রিদওয়ানাকা ওয়াল ফাওযা বিহা", trEn:"Allahumma inni as'alukal-jannata wa as'aluka ridwanaka wal-fawza biha", bn:"হে আল্লাহ! আমি আপনার কাছে জান্নাত এবং আপনার সন্তুষ্টি ও তাতে সফলতা প্রার্থনা করছি", en:"O Allah, I ask You for Paradise, Your pleasure, and success in attaining it"},

{qNo:52, catBn:"জাহান্নাম থেকে আশ্রয়ের দোয়া", catEn:"Seeking Protection from Hellfire", ar:"اللَّهُمَّ أَجِرْنِي مِنَ النَّارِ", trBn:"আল্লাহুম্মা আজিরনী মিনান নার", trEn:"Allahumma ajirni minan-nar", bn:"হে আল্লাহ! আমাকে জাহান্নামের আগুন থেকে রক্ষা করুন", en:"O Allah, protect me from the Fire"},

{qNo:53, catBn:"ঈমানের উপর অটল থাকার দোয়া", catEn:"For Steadfastness in Faith", ar:"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ", trBn:"রব্বানা আফরিগ আলাইনা সবরাওঁ ওয়া তাওয়াফফানা মুসলিমীন", trEn:"Rabbana afrigh 'alayna sabran wa tawaffana muslimin", bn:"হে আমাদের রব! আমাদের উপর ধৈর্য ঢেলে দিন এবং আমাদের মুসলিম অবস্থায় মৃত্যু দিন", en:"Our Lord, pour upon us patience and let us die as Muslims"},

{qNo:54, catBn:"অন্যায় থেকে বাঁচার দোয়া", catEn:"For Protection from Wrongdoing", ar:"رَبِّ أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ", trBn:"রব্বি আউযু বিকা আন আসআলাকা মা লাইসা লী বিহি ইলম", trEn:"Rabbi a'udhu bika an as'alaka ma laysa li bihi ilm", bn:"হে আমার রব! যে বিষয়ে আমার জ্ঞান নেই তা আপনার কাছে চাওয়া থেকে আমি আপনার আশ্রয় চাই", en:"My Lord, I seek refuge in You from asking You about that of which I have no knowledge"},

{qNo:55, catBn:"সৎকর্মের জন্য দোয়া", catEn:"For Righteous Deeds", ar:"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ", trBn:"রব্বি আওযিনী আন আশকুরা নিমাতাকাল্লাতী আনআমতা আলাইয়া ওয়া আলা ওয়ালিদাইয়া ওয়া আন আমালা সালিহান তারদাহ", trEn:"Rabbi awzi'ni an ashkura ni'mataka allati an'amta 'alayya wa 'ala walidayya wa an a'mala salihan tardah", bn:"হে আমার রব! আপনি আমার ও আমার মা-বাবার প্রতি যে অনুগ্রহ করেছেন তার কৃতজ্ঞতা প্রকাশ করার এবং আপনার পছন্দনীয় সৎকর্ম করার তাওফিক দিন", en:"My Lord, enable me to be grateful for Your favor upon me and my parents and to do righteous deeds that please You"},

{qNo:56, catBn:"আল্লাহর উপর ভরসার দোয়া", catEn:"Trusting Allah", ar:"رَبِّيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", trBn:"রব্বিয়াল্লাহু লা ইলাহা ইল্লা হুয়া আলাইহি তাওয়াক্কালতু ওয়া হুয়া রব্বুল আরশিল আযীম", trEn:"Rabbiyallahu la ilaha illa huwa, 'alayhi tawakkaltu wa huwa Rabbul-'Arshil-'Azim", bn:"আমার রব আল্লাহ। তিনি ছাড়া কোনো উপাস্য নেই। আমি তাঁর উপরই ভরসা করেছি এবং তিনি মহান আরশের রব", en:"My Lord is Allah. There is no deity except Him. Upon Him I rely, and He is the Lord of the Mighty Throne"},

{qNo:57, catBn:"ক্ষমা ও রহমতের দোয়া", catEn:"For Forgiveness and Mercy", ar:"رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", trBn:"রব্বানাগফির লানা যুনুবানা ওয়া ইসরাফানা ফী আমরিনা ওয়া সাব্বিত আকদামানা ওয়ানসুরনা আলাল কাওমিল কাফিরীন", trEn:"Rabbana-ghfir lana dhunubana wa israfana fi amrina wa thabbit aqdamana wansurna 'alal-qawmil-kafirin", bn:"হে আমাদের রব! আমাদের গুনাহ ও কাজে সীমালঙ্ঘন ক্ষমা করুন, আমাদের পদক্ষেপ দৃঢ় রাখুন এবং আমাদের সাহায্য করুন", en:"Our Lord, forgive us our sins and excesses in our affairs, make our feet firm, and help us"},



{qNo:58, catBn:"ইউনুস (আ.)-এর দোয়া", catEn:"Dua of Yunus (AS)", ar:"لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", trBn:"লা ইলাহা ইল্লা আনতা সুবহানাকা ইন্নী কুনতু মিনায যালিমীন", trEn:"La ilaha illa anta subhanaka inni kuntu minaz-zalimin", bn:"আপনি ছাড়া কোনো উপাস্য নেই। আপনি পবিত্র। নিশ্চয়ই আমি জালিমদের অন্তর্ভুক্ত ছিলাম", en:"There is no deity except You. Glory be to You. Indeed, I was among the wrongdoers"},

{qNo:59, catBn:"মূসা (আ.)-এর ক্ষমার দোয়া", catEn:"Dua of Musa for Forgiveness", ar:"رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي", trBn:"রব্বি ইন্নী যালামতু নাফসী ফাগফির লী", trEn:"Rabbi inni zalamtu nafsi faghfir li", bn:"হে আমার রব! আমি নিজের উপর জুলুম করেছি, অতএব আমাকে ক্ষমা করুন", en:"My Lord, I have wronged myself, so forgive me"},

{qNo:60, catBn:"মূসা (আ.)-এর রিজিকের দোয়া", catEn:"Dua of Musa for Provision", ar:"رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ", trBn:"রব্বি ইন্নী লিমা আনযালতা ইলাইয়া মিন খাইরিন ফাকীর", trEn:"Rabbi inni lima anzalta ilayya min khayrin faqir", bn:"হে আমার রব! আপনি আমার প্রতি যে কল্যাণ নাযিল করবেন, আমি তার মুখাপেক্ষী", en:"My Lord, indeed I am in need of whatever good You send down to me"},

{qNo:61, catBn:"ইব্রাহিম (আ.)-এর নামাজের দোয়া", catEn:"Dua for Establishing Prayer", ar:"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ", trBn:"রব্বিজ আলনী মুকীমাস সালাতি ওয়া মিন যুররিয়্যাতী রব্বানা ওয়া তাকাব্বাল দুয়া", trEn:"Rabbij'alni muqimas-salati wa min dhurriyyati rabbana wa taqabbal du'a", bn:"হে আমার রব! আমাকে নামাজ প্রতিষ্ঠাকারী করুন এবং আমার বংশধরদের মধ্য থেকেও। হে আমাদের রব! আমার দোয়া কবুল করুন", en:"My Lord, make me an establisher of prayer, and from my descendants as well. Our Lord, accept my supplication"},

{qNo:62, catBn:"ইব্রাহিম (আ.)-এর নিরাপত্তার দোয়া", catEn:"Dua for Safety", ar:"رَبِّ اجْعَلْ هَٰذَا الْبَلَدَ آمِنًا وَاجْنُبْنِي وَبَنِيَّ أَنْ نَعْبُدَ الْأَصْنَامَ", trBn:"রব্বিজ আল হাযাল বালাদা আমিনাও ওয়াজনুবনী ওয়া বানিয়্যা আন নাবুদাল আসনাম", trEn:"Rabbij'al hadhal-balada aminan wajnubni wa baniyya an na'budal-asnam", bn:"হে আমার রব! এই নগরীকে নিরাপদ করুন এবং আমাকে ও আমার সন্তানদের মূর্তি পূজা থেকে দূরে রাখুন", en:"My Lord, make this city secure and keep me and my children away from worshipping idols"},

{qNo:63, catBn:"ইব্রাহিম (আ.)-এর আমল কবুলের দোয়া", catEn:"For Acceptance of Deeds", ar:"رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ", trBn:"রব্বানা তাকাব্বাল মিননা ইন্নাকা আনতাস সামীউল আলীম", trEn:"Rabbana taqabbal minna innaka antas-Sami'ul-Alim", bn:"হে আমাদের রব! আমাদের পক্ষ থেকে কবুল করুন। নিশ্চয়ই আপনি সর্বশ্রোতা, সর্বজ্ঞ", en:"Our Lord, accept from us. Indeed, You are the All-Hearing, the All-Knowing"},

{qNo:64, catBn:"অন্তর শান্তির দোয়া", catEn:"For a Peaceful Heart", ar:"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ", trBn:"রব্বানা আফরিগ আলাইনা সবরাওঁ ওয়া তাওয়াফফানা মুসলিমীন", trEn:"Rabbana afrigh 'alayna sabran wa tawaffana muslimin", bn:"হে আমাদের রব! আমাদের উপর ধৈর্য ঢেলে দিন এবং আমাদের মুসলিম অবস্থায় মৃত্যু দিন", en:"Our Lord, pour upon us patience and let us die as Muslims"},

{qNo:65, catBn:"জালিমদের বিরুদ্ধে সাহায্যের দোয়া", catEn:"For Help Against Wrongdoers", ar:"رَبَّنَا أَخْرِجْنَا مِنْهَا فَإِنْ عُدْنَا فَإِنَّا ظَالِمُونَ", trBn:"রব্বানা আখরিজনা মিনহা ফা ইন উদনা ফাইন্না যালিমূন", trEn:"Rabbana akhrijna minha fa-in 'udna fa-inna zalimun", bn:"হে আমাদের রব! আমাদের এখান থেকে বের করে দিন। আমরা আবার করলে নিশ্চয়ই আমরা জালিম হব", en:"Our Lord, take us out of it. If we return to wrongdoing, then indeed we will be wrongdoers"},

{qNo:66, catBn:"আল্লাহর রহমতের দোয়া", catEn:"For Allah's Mercy", ar:"رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", trBn:"রব্বানা আতিনা মিল্লাদুনকা রহমাতাও ওয়া হাইয়ি লানা মিন আমরিনা রাশাদা", trEn:"Rabbana atina milladunka rahmatan wa hayyi' lana min amrina rashada", bn:"হে আমাদের রব! আপনার পক্ষ থেকে আমাদের রহমত দান করুন এবং আমাদের কাজ সঠিকভাবে পরিচালনার ব্যবস্থা করুন", en:"Our Lord, grant us mercy from Yourself and guide us rightly in our affairs"},

{qNo:67, catBn:"সন্তানের সৎ হওয়ার দোয়া", catEn:"For Righteous Offspring", ar:"رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ", trBn:"রব্বি হাব লী মিনাস সালিহীন", trEn:"Rabbi hab li minas-salihin", bn:"হে আমার রব! আমাকে একজন সৎকর্মশীল সন্তান দান করুন", en:"My Lord, grant me a righteous offspring"},

{qNo:68, catBn:"আল্লাহর জ্ঞান প্রার্থনার দোয়া", catEn:"For Beneficial Knowledge", ar:"رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", trBn:"রব্বি হাব লী হুকমাও ওয়া আলহিকনী বিস সালিহীন", trEn:"Rabbi hab li hukman wa alhiqni bis-salihin", bn:"হে আমার রব! আমাকে প্রজ্ঞা দান করুন এবং আমাকে সৎকর্মশীলদের অন্তর্ভুক্ত করুন", en:"My Lord, grant me wisdom and join me with the righteous"},

{qNo:69, catBn:"সৎকর্মশীলদের সাথে থাকার দোয়া", catEn:"To Join the Righteous", ar:"رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", trBn:"রব্বি হাব লী হুকমাও ওয়া আলহিকনী বিস সালিহীন", trEn:"Rabbi hab li hukman wa alhiqni bis-salihin", bn:"হে আমার রব! আমাকে প্রজ্ঞা দান করুন এবং সৎকর্মশীলদের সাথে মিলিত করুন", en:"My Lord, grant me wisdom and join me with the righteous"},

{qNo:70, catBn:"ভালো স্মরণ রাখার দোয়া", catEn:"For a Good Mention", ar:"وَاجْعَلْ لِي لِسَانَ صِدْقٍ فِي الْآخِرِينَ", trBn:"ওয়াজআল লী লিসানা সিদকিন ফিল আখিরীন", trEn:"Waj'al li lisana sidqin fil-akhirin", bn:"এবং পরবর্তীদের মধ্যে আমার জন্য সত্য ও সুন্দর স্মরণ রাখুন", en:"And grant me an honorable mention among later generations"},

{qNo:71, catBn:"জান্নাতের উত্তরাধিকারীর দোয়া", catEn:"For Inheriting Paradise", ar:"وَاجْعَلْنِي مِنْ وَرَثَةِ جَنَّةِ النَّعِيمِ", trBn:"ওয়াজআলনী মিন ওয়ারাছাতি জান্নাতিন নাঈম", trEn:"Waj'alni min warathati jannatin-na'im", bn:"এবং আমাকে নেয়ামতের জান্নাতের উত্তরাধিকারীদের অন্তর্ভুক্ত করুন", en:"And make me among the inheritors of the Garden of Delight"},

{qNo:72, catBn:"গুনাহ মাফের দোয়া", catEn:"For Forgiveness of Sins", ar:"رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ", trBn:"রব্বিগফির ওয়ারহাম ওয়া আনতা খাইরুর রাহিমীন", trEn:"Rabbighfir warham wa anta khayrur-rahimin", bn:"হে আমার রব! ক্ষমা করুন ও দয়া করুন। আপনিই সর্বশ্রেষ্ঠ দয়ালু", en:"My Lord, forgive and have mercy, and You are the best of those who show mercy"},

{qNo:73, catBn:"শয়তানের কুমন্ত্রণা থেকে দোয়া", catEn:"Protection from Shaytan", ar:"رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ ۝ وَأَعُوذُ بِكَ رَبِّ أَنْ يَحْضُرُونِ", trBn:"রব্বি আউযু বিকা মিন হামাযাতিশ শায়াতীন, ওয়া আউযু বিকা রব্বি আন ইয়াহদুরূন", trEn:"Rabbi a'udhu bika min hamazatish-shayatin, wa a'udhu bika rabbi an yahdurun", bn:"হে আমার রব! আমি শয়তানদের কুমন্ত্রণা থেকে আপনার আশ্রয় চাই এবং তারা যেন আমার কাছে উপস্থিত না হয়, সে জন্যও আপনার আশ্রয় চাই", en:"My Lord, I seek refuge in You from the whispers of the devils, and I seek refuge in You from their presence"},

{qNo:74, catBn:"ভয় থেকে নিরাপত্তার দোয়া", catEn:"For Safety from Fear", ar:"رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِلَّذِينَ كَفَرُوا وَاغْفِرْ لَنَا رَبَّنَا إِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ", trBn:"রব্বানা লা তাজআলনা ফিতনাতাল লিল্লাযীনা কাফারু ওয়াগফির লানা রব্বানা ইন্নাকা আনতাল আযীযুল হাকীম", trEn:"Rabbana la taj'alna fitnatan lilladhina kafaru waghfir lana rabbana innaka antal-'Azizul-Hakim", bn:"হে আমাদের রব! কাফিরদের জন্য আমাদের পরীক্ষার কারণ করবেন না এবং আমাদের ক্ষমা করুন। নিশ্চয়ই আপনি পরাক্রমশালী, প্রজ্ঞাময়", en:"Our Lord, do not make us a trial for those who disbelieve, and forgive us. Indeed, You are the Mighty, the Wise"},

{qNo:75, catBn:"অন্তরের হিংসা দূর করার দোয়া", catEn:"For Purity of Heart", ar:"رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِلَّذِينَ آمَنُوا", trBn:"রব্বানাগফির লানা ওয়া লিইখওয়ানিনাল্লাযীনা সাবাকূনা বিল ঈমানি ওয়ালা তাজআল ফী কুলুবিনা গিল্লাল লিল্লাযীনা আমানু", trEn:"Rabbanaghfir lana wa li-ikhwaninal-ladhina sabaquna bil-iman, wa la taj'al fi qulubina ghillan lilladhina amanu", bn:"হে আমাদের রব! আমাদের এবং আমাদের পূর্ববর্তী ঈমানদার ভাইদের ক্ষমা করুন এবং মুমিনদের প্রতি আমাদের অন্তরে কোনো বিদ্বেষ রাখবেন না", en:"Our Lord, forgive us and our brothers who preceded us in faith, and do not place in our hearts any resentment toward the believers"},

{qNo:76, catBn:"দ্বীনের উপর অটল থাকার দোয়া", catEn:"For Steadfastness in Religion", ar:"رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِلْقَوْمِ الظَّالِمِينَ ۝ وَنَجِّنَا بِرَحْمَتِكَ مِنَ الْقَوْمِ الْكَافِرِينَ", trBn:"রব্বানা লা তাজআলনা ফিতনাতাল লিল কাওমিয যালিমীন, ওয়া নাজ্জিনা বিরহমাতিকাল মিনাল কাওমিল কাফিরীন", trEn:"Rabbana la taj'alna fitnatan lil-qawmiz-zalimin, wa najjina birahmatika minal-qawmil-kafirin", bn:"হে আমাদের রব! জালিম সম্প্রদায়ের জন্য আমাদের পরীক্ষার কারণ করবেন না এবং আপনার রহমতে আমাদের অবিশ্বাসী সম্প্রদায় থেকে রক্ষা করুন", en:"Our Lord, do not make us a trial for the wrongdoing people, and save us by Your mercy from the disbelieving people"},

{qNo:77, catBn:"আল্লাহর সাহায্য চাওয়ার দোয়া", catEn:"Asking Allah for Help", ar:"رَبِّ أَنْصُرْنِي بِمَا كَذَّبُونِ", trBn:"রব্বি আনসুরনী বিমা কাজ্জাবূন", trEn:"Rabbi unsur-ni bima kadhdhabun", bn:"হে আমার রব! তারা আমাকে যে মিথ্যা প্রতিপন্ন করেছে তার বিরুদ্ধে আমাকে সাহায্য করুন", en:"My Lord, help me against them because they have denied me"},

  {qNo:78, catBn:"আদম (আ.)-এর তওবার দোয়া", catEn:"Dua of Adam (AS)", ar:"رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ", trBn:"রব্বানা যালামনা আনফুসানা ওয়া ইল্লাম তাগফির লানা ওয়া তারহামনা লানাকূনান্না মিনাল খাসিরীন", trEn:"Rabbana zalamna anfusana wa illam taghfir lana wa tarhamna lanakunanna minal-khasirin", bn:"হে আমাদের রব! আমরা নিজেদের উপর জুলুম করেছি। আপনি যদি আমাদের ক্ষমা না করেন এবং দয়া না করেন, তবে আমরা অবশ্যই ক্ষতিগ্রস্তদের অন্তর্ভুক্ত হব", en:"Our Lord, we have wronged ourselves. If You do not forgive us and have mercy on us, we will surely be among the losers"},

{qNo:79, catBn:"ইউসুফ (আ.)-এর দোয়া", catEn:"Dua of Yusuf (AS)", ar:"فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ أَنْتَ وَلِيِّي فِي الدُّنْيَا وَالْآخِرَةِ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", trBn:"ফাতিরাস সামাওয়াতি ওয়াল আরদ, আনতা ওয়ালিয়্যী ফিদ্দুনইয়া ওয়াল আখিরাহ, তাওয়াফফানী মুসলিমান ওয়া আলহিকনী বিস সালিহীন", trEn:"Fatiras-samawati wal-ard, anta waliyyi fid-dunya wal-akhirah, tawaffani musliman wa alhiqni bis-salihin", bn:"হে আসমান ও জমিনের স্রষ্টা! দুনিয়া ও আখিরাতে আপনিই আমার অভিভাবক। আমাকে মুসলিম অবস্থায় মৃত্যু দিন এবং সৎকর্মশীলদের সঙ্গে মিলিত করুন", en:"Creator of the heavens and earth, You are my Protector in this world and the Hereafter. Let me die as a Muslim and join me with the righteous"},

{qNo:80, catBn:"শয়তানের কুমন্ত্রণা থেকে দোয়া", catEn:"Protection from Evil Whispers", ar:"رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ ۝ وَأَعُوذُ بِكَ رَبِّ أَنْ يَحْضُرُونِ", trBn:"রব্বি আউযু বিকা মিন হামাযাতিশ শায়াতীন, ওয়া আউযু বিকা রব্বি আন ইয়াহদুরূন", trEn:"Rabbi a'udhu bika min hamazatish-shayatin, wa a'udhu bika rabbi an yahdurun", bn:"হে আমার রব! আমি শয়তানদের কুমন্ত্রণা থেকে আপনার আশ্রয় চাই এবং তারা যেন আমার কাছে উপস্থিত না হয়, সে জন্যও আপনার আশ্রয় চাই", en:"My Lord, I seek refuge in You from the whispers of the devils and from their presence"},

{qNo:81, catBn:"ইলম বৃদ্ধির দোয়া", catEn:"For Increase in Knowledge", ar:"رَبِّ زِدْنِي عِلْمًا", trBn:"রব্বি যিদনী ইলমা", trEn:"Rabbi zidni ilma", bn:"হে আমার রব! আমার জ্ঞান বৃদ্ধি করুন", en:"My Lord, increase me in knowledge"},

{qNo:82, catBn:"বক্তব্য সহজ হওয়ার দোয়া", catEn:"For Ease in Speech", ar:"وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي ۝ يَفْقَهُوا قَوْلِي", trBn:"ওয়াহলুল উকদাতাম মিল্লিসানী, ইয়াফকাহু কাওলী", trEn:"Wahlul uqdatan min lisani, yafqahu qawli", bn:"আমার জিহ্বার জড়তা দূর করুন, যাতে তারা আমার কথা বুঝতে পারে", en:"Untie the knot from my tongue so that they may understand my speech"},

{qNo:83, catBn:"রোগের কষ্টে দোয়া", catEn:"Dua During Illness", ar:"أَنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", trBn:"আন্নী মাসসানিয়াদ দুররু ওয়া আনতা আরহামুর রাহিমীন", trEn:"Anni massaniyad-durru wa anta arhamur-rahimin", bn:"নিশ্চয়ই আমাকে কষ্ট স্পর্শ করেছে এবং আপনিই সর্বশ্রেষ্ঠ দয়ালু", en:"Indeed, adversity has touched me, and You are the Most Merciful of the merciful"},

{qNo:84, catBn:"অন্ধকারে আল্লাহর সাহায্যের দোয়া", catEn:"For Allah's Help", ar:"لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", trBn:"লা ইলাহা ইল্লা আনতা সুবহানাকা ইন্নী কুনতু মিনায যালিমীন", trEn:"La ilaha illa anta subhanaka inni kuntu minaz-zalimin", bn:"আপনি ছাড়া কোনো উপাস্য নেই। আপনি পবিত্র। নিশ্চয়ই আমি জালিমদের অন্তর্ভুক্ত ছিলাম", en:"There is no deity except You. Glory be to You. Indeed, I was among the wrongdoers"},

{qNo:86, catBn:"আল্লাহর নৈকট্যের দোয়া", catEn:"For Nearness to Allah", ar:"وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ", trBn:"ওয়া ইযা সাআলাকা ইবাদী আন্নী ফাইন্নী কারীবুন উজীবু দাওয়াতাদ দাঈ ইযা দাআন", trEn:"Wa idha sa'alaka 'ibadi 'anni fa-inni qarib, ujibu da'watad-da'i idha da'an", bn:"আমার বান্দারা যখন আমার সম্পর্কে জিজ্ঞাসা করে, নিশ্চয়ই আমি নিকটবর্তী। আহ্বানকারী যখন আমাকে ডাকে, আমি তার ডাকে সাড়া দিই", en:"When My servants ask you about Me, indeed I am near. I respond to the call of the caller when he calls Me"},

// অটো নাম্বার সিস্টেম
function reNumber(){ DUAS.forEach((d,i)=> d.qNo = i+1); }
reNumber();

function renderList(list){
  document.getElementById('duaList').innerHTML = list.map(d=>`
    <div onclick="openPoster(${d.qNo})" class="gorilla-glass shine rounded-[18px] p-4 active:scale-[0.98] cursor-pointer">
      <div class="flex items-center gap-3">
        <span class="w-9 h-9 rounded-full bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center font-black text-[12px] text-black">${d.qNo}</span>
        <p class="font-black text-[14px] text-white">${lang=='bn'?d.catBn:d.catEn}</p>
      </div>
      <p class="mt-3 text-[11px] font-bold text-emerald-300/80 border-t border-white/10 pt-2">👉 সম্পূর্ণ দোয়া দেখতে এখানে ক্লিক করুন</p>
    </div>
  `).join('');
}

function openPoster(no){
  let d=DUAS.find(x=>x.qNo==no);
  document.getElementById('pCategory').innerText=lang=='bn'?d.catBn:d.catEn;
  document.getElementById('pArabic').innerText=d.ar;
  document.getElementById('pTrans').innerText=lang=='bn'?d.trBn:d.trEn;
  document.getElementById('pMeaning').innerText=lang=='bn'?d.bn:d.en;
  document.getElementById('posterModal').classList.remove('hidden');
}
function filterDua(){
  let v=document.getElementById('searchInput').value.toLowerCase();
  if(!v) return renderList(DUAS);
  renderList(DUAS.filter(d=> (d.catBn+d.catEn+String(d.qNo)).toLowerCase().includes(v)));
}
function toggleLang(){
  lang=lang=='bn'?'en':'bn';
  localStorage.setItem('dua_lang',lang);
  document.getElementById('langBtn').innerText=lang=='bn'?'বাংলা':'EN';
  renderList(DUAS);
}
async function sharePoster(){
  let el=document.getElementById('posterCapture');
  let canvas=await html2canvas(el,{scale:3, backgroundColor:null, useCORS:true});
  canvas.toBlob(async blob=>{
    let file=new File([blob],"dua.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Dua"});
    }else{
      let a=document.createElement('a'); a.download='dua.png'; a.href=canvas.toDataURL(); a.click();
    }
  });
}
renderList(DUAS);
</script>
