<!DOCTYPE html>
<html lang="bn" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="robots" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>100 Dua - A-S A2Z</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{font-family:'Hind Siliguri'; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
body{top:0!important; background:#050a06; margin:0; color:white;}
.gorilla-glass{background:linear-gradient(135deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 100%); backdrop-filter:blur(20px); border:1.2px solid rgba(255,255,255,0.18); box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.shine{position:relative; overflow:hidden;}
.shine::after{content:''; position:absolute; top:0; left:-60%; width:50%; height:100%; background:linear-gradient(110deg, transparent, rgba(255,255,255,0.7), transparent); animation:shine 2.8s infinite;}
@keyframes shine{0%{left:-70%}100%{left:140%}}
.arabic{font-family:'Amiri', serif; line-height:1.7;}
.goog-te-banner-frame,.skiptranslate{display:none!important;}
</style>
</head>
<body translate="no" class="notranslate">

<div class="fixed inset-0 -z-10">
  <img src="https://images.unsplash.com/photo-1591604466107-ec97de577aff?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover opacity-40">
  <div class="absolute inset-0 bg-gradient-to-b from-[#0a2814]/90 via-black/85 to-black"></div>
</div>

<div class="max-w-[480px] mx-auto min-h-screen flex flex-col p-3 pb-20">
  <div class="flex justify-between items-center py-2">
    <button onclick="location.href='./islamic.html'" class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center font-black">←</button>
    <div class="flex items-center gap-2">
      <button id="langBtn" onclick="toggleLang()" class="px-4 h-[30px] rounded-full bg-emerald-400 text-black text-[11px] font-black">বাংলা</button>
      <div class="gorilla-glass rounded-full px-4 py-2 font-black text-[11px]">🤲 দোয়া সমূহ</div>
    </div>
    <div class="w-10"></div>
  </div>

  <div class="mt-4 gorilla-glass rounded-full p-2 flex items-center gap-2">
    <span class="pl-3">🔍</span>
    <input id="searchInput" oninput="filterDua()" placeholder="সার্চ: মা বাবা, সন্তান..." class="flex-1 bg-transparent outline-none text-[13px] font-bold placeholder:text-white/40">
  </div>

  <div id="duaList" class="mt-4 grid gap-3"></div>
  <p class="text-center text-[10px] text-white/30 mt-6 font-bold">নতুন দোয়া যোগ করতে কোডে DUAS লিস্টে অ্যাড করুন, অটো নাম্বার হয়ে যাবে</p>
</div>

<!-- Poster Modal -->
<div id="posterModal" class="hidden fixed inset-0 z-[99] bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
  <div class="w-full max-w-[360px]">
    <div id="posterCapture" class="bg-gradient-to-br from-[#102a18] via-[#123d22] to-black rounded-[28px] p-7 border border-emerald-400/20 relative overflow-hidden">
      <div class="text-center relative z-10">
        <p class="text-amber-300 text-[11px] font-black tracking-[3px]">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</p>
        <p id="pCategory" class="mt-3 bg-white/10 border border-white/20 inline-block px-4 py-1.5 rounded-full text-[10px] font-black"></p>
        <h2 id="pArabic" class="arabic text-[26px] mt-5 leading-[38px] text-white"></h2>
        <p id="pTrans" class="mt-4 text-[12px] text-emerald-200/70 font-bold italic"></p>
        <div class="mt-4 h-[1px] bg-white/20"></div>
        <p id="pMeaning" class="mt-4 text-[13.5px] leading-[22px] font-bold text-white/90"></p>
        <p class="mt-7 text-[9px] text-white/25 font-black tracking-[3px]">A-S A2Z • QARI MD JUBAYER AHMED SIYAM</p>
      </div>
    </div>
    <div class="mt-4 flex gap-3">
      <button onclick="sharePoster()" class="flex-1 bg-gradient-to-r from-emerald-400 to-teal-500 text-black font-black py-4 rounded-full text-[13px]">📤 শেয়ার করুন</button>
      <button onclick="document.getElementById('posterModal').classList.add('hidden')" class="w-14 h-14 rounded-full bg-white/15 flex items-center justify-center font-black">✕</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
let lang='bn';

// ===== ১০ টা ফিক্সড দোয়া =====
const DUAS = [
{qNo:1, catBn:"মা বাবার জন্য দোয়া", catEn:"Dua for Parents", ar:"رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", trBn:"রাব্বির হামহুমা কামা রাব্বায়ানি সাগীরা", trEn:"Rabbir hamhuma kama rabbayani saghira", bn:"হে আমার প্রতিপালক! তাদের প্রতি দয়া করো যেমন তারা শৈশবে আমাকে লালন-পালন করেছেন। (সূরা বনী ইসরাঈল ২৪)", en:"My Lord, have mercy upon them as they brought me up when I was small."},
{qNo:2, catBn:"সন্তানের জন্য দোয়া", catEn:"Dua for Children", ar:"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ", trBn:"রাব্বানা হাব লানা মিন আজওয়াজিনা ওয়া জুররিয়াতিনা কুররাতা আইয়ুন", trEn:"Rabbana hablana min azwajina qurrata a'yun", bn:"হে আমাদের রব! আমাদের স্ত্রী ও সন্তানদের চোখের শীতলতা বানিয়ে দিন।", en:"Our Lord, grant us comfort of eyes from our spouses and offspring."},
{qNo:3, catBn:"ক্ষমার জন্য দোয়া", catEn:"Dua for Forgiveness", ar:"رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ", trBn:"রাব্বিগফিরলী ওয়ালিওয়ালিদাইয়া ওয়ালিল মুমিনীনা ইয়াওমা ইয়াকুমুল হিসাব", trEn:"Rabbighfir li wa liwalidayya", bn:"হে রব! আমাকে, পিতা-মাতাকে ও মুমিনদের ক্ষমা করুন যেদিন হিসাব হবে।", en:"Forgive me, my parents and believers on Day of Reckoning."},
{qNo:4, catBn:"রিজিকের জন্য দোয়া", catEn:"Dua for Rizq", ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ رِزْقًا طَيِّبًا وَعِلْمًا نَافِعًا", trBn:"আল্লাহুম্মা ইন্নি আসআলুকা রিজকান তাইয়্যিবা ওয়া ইলমান নাফিআ", trEn:"Allahumma inni as'aluka rizqan tayyiban", bn:"হে আল্লাহ! পবিত্র রিজিক ও উপকারী জ্ঞান চাই।", en:"O Allah, I ask You for good provision and beneficial knowledge."},
{qNo:5, catBn:"জ্ঞান বৃদ্ধির দোয়া", catEn:"Dua for Knowledge", ar:"رَبِّ زِدْنِي عِلْمًا", trBn:"রাব্বি জিদনী ইলমা", trEn:"Rabbi zidni ilma", bn:"হে আমার রব! আমার জ্ঞান বৃদ্ধি করে দিন।", en:"My Lord, increase me in knowledge."},
{qNo:6, catBn:"বিপদ থেকে মুক্তির দোয়া", catEn:"Dua from Hardship", ar:"لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", trBn:"লা ইলাহা ইল্লা আনতা সুবহানাকা ইন্নি কুনতু মিনাজ জলিমীন", trEn:"La ilaha illa Anta subhanaka", bn:"আপনি ছাড়া কোনো ইলাহ নেই, আপনি পবিত্র, আমি জালিমদের অন্তর্ভুক্ত।", en:"There is no deity except You, exalted are You."},
{qNo:7, catBn:"সুস্থতার দোয়া", catEn:"Dua for Health", ar:"اللَّهُمَّ عَافِنِي فِي بَدَنِي اللَّهُمَّ عَافِنِي فِي سَمْعِي", trBn:"আল্লাহুম্মা আফিনি ফি বাদানি, আল্লাহুম্মা আফিনি ফি সামঈ", trEn:"Allahumma afini fi badani", bn:"হে আল্লাহ! আমার শরীর ও শ্রবণে সুস্থতা দিন।", en:"O Allah grant health in my body and hearing."},
{qNo:8, catBn:"ঘুম থেকে উঠার দোয়া", catEn:"Waking up Dua", ar:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا", trBn:"আলহামদুলিল্লাহিল্লাযি আহইয়ানা বা'দা মা আমাতানা", trEn:"Alhamdulillahilladhi ahyana", bn:"সকল প্রশংসা আল্লাহর যিনি মৃত্যুর পর আমাদের জীবিত করলেন।", en:"All praise to Allah who gave us life after death."},
{qNo:9, catBn:"সফরের দোয়া", catEn:"Travel Dua", ar:"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ", trBn:"সুবহানাল্লাযি সাখখারা লানা হাযা", trEn:"Subhanalladhi sakhkhara lana", bn:"পবিত্র তিনি যিনি একে আমাদের বশীভূত করেছেন।", en:"Glory to Him who subjected this to us."},
{qNo:10, catBn:"হেদায়েতের দোয়া", catEn:"Guidance Dua", ar:"اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ", trBn:"ইহদিনাস সিরাতাল মুস্তাকীম", trEn:"Ihdinas siratal mustaqim", bn:"আমাদের সরল সঠিক পথ দেখান।", en:"Guide us to the straight path."},
];

// === আপনি এখানে নতুন দোয়া অ্যাড করবেন ===
// উদাহরণ: DUAS.push({catBn:"নতুন দোয়া", catEn:"New Dua", ar:"আরবি", trBn:"উচ্চারণ", trEn:"Trans", bn:"অর্থ", en:"Meaning"})
// নাম্বার অটো হয়ে যাবে, আপনাকে qNo দিতে হবে না

// অটো নাম্বার সিস্টেম
function reNumber(){ DUAS.forEach((d,i)=> d.qNo = i+1); }
reNumber();

function renderList(list){
  document.getElementById('duaList').innerHTML = list.map(d=>`
    <div onclick="openPoster(${d.qNo})" class="gorilla-glass shine rounded-[18px] p-4 active:scale-[0.98] cursor-pointer">
      <div class="flex items-center gap-3">
        <span class="w-9 h-9 rounded-full bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center font-black text-[12px] text-black">${d.qNo}</span>
        <p class="font-black text-[14px] text-white">${lang=='bn'?d.catBn:d.catEn}</p>
      </div>
      <p class="mt-3 text-[11px] font-bold text-emerald-300/80 border-t border-white/10 pt-2">👉 সম্পূর্ণ দোয়া দেখতে এখানে ক্লিক করুন</p>
    </div>
  `).join('');
}

function openPoster(no){
  let d=DUAS.find(x=>x.qNo==no);
  document.getElementById('pCategory').innerText=lang=='bn'?d.catBn:d.catEn;
  document.getElementById('pArabic').innerText=d.ar;
  document.getElementById('pTrans').innerText=lang=='bn'?d.trBn:d.trEn;
  document.getElementById('pMeaning').innerText=lang=='bn'?d.bn:d.en;
  document.getElementById('posterModal').classList.remove('hidden');
}
function filterDua(){
  let v=document.getElementById('searchInput').value.toLowerCase();
  if(!v) return renderList(DUAS);
  renderList(DUAS.filter(d=> (d.catBn+d.catEn+String(d.qNo)).toLowerCase().includes(v)));
}
function toggleLang(){
  lang=lang=='bn'?'en':'bn';
  localStorage.setItem('dua_lang',lang);
  document.getElementById('langBtn').innerText=lang=='bn'?'বাংলা':'EN';
  renderList(DUAS);
}
async function sharePoster(){
  let el=document.getElementById('posterCapture');
  let canvas=await html2canvas(el,{scale:3, backgroundColor:null, useCORS:true});
  canvas.toBlob(async blob=>{
    let file=new File([blob],"dua.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Dua"});
    }else{
      let a=document.createElement('a'); a.download='dua.png'; a.href=canvas.toDataURL(); a.click();
    }
  });
}
renderList(DUAS);
</script>
</body>
</html>
