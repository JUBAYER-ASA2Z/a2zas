while(raw.length<500){
  let b=raw[raw.length%50];
  raw.push([b[0]+` ${raw.length+1}`, b[1]+` ${raw.length+1}`, b[2], b[3]]);
}

let all = raw.map((d,i)=>({id:i+1,bnQ:`${i+1}. ${d[0]}`,enQ:`${i+1}. ${d[1]}`,bnA:d[2],enA:d[3],key:(d[0]+d[2]).toLowerCase()}));

function setLang(l){
  lang=l; localStorage.setItem('isLang',l);
  document.getElementById('bBn').className=l=='bn'?'active':'';
  document.getElementById('bEn').className=l=='en'?'active':'';
  document.getElementById('s').placeholder=l=='bn'?'সার্চ করুন ২-৩ শব্দ...':'Search 2-3 words...';
  doSearch();
}
function doSearch(){
  let s=document.getElementById('s').value.toLowerCase().trim();
  let f = s.length>=2? all.filter(x=>x.key.includes(s) || x.bnQ.toLowerCase().includes(s)) : all;
  if(s) f.sort((a,b)=>a.key.indexOf(s)-b.key.indexOf(s));
  document.getElementById('found').innerText=f.length;
  let list=document.getElementById('list'); list.innerHTML='';
  f.slice(0,150).forEach(d=>{
    let div=document.createElement('div'); div.className='item';
    div.innerHTML=`<div class="q">${lang=='bn'?d.bnQ:d.enQ}</div><div class="a">✅ ${lang=='bn'?d.bnA:d.enA}</div>`;
    list.appendChild(div);
  });
  if(f.length>150){
    let m=document.createElement('div'); m.style.textAlign='center'; m.style.padding='12px'; m.innerText=`আরও ${f.length-150} টি আছে, সার্চ আরও নির্দিষ্ট করুন`;
    list.appendChild(m);
  }
}
if(navigator.getBattery){ navigator.getBattery().then(b=>{ document.getElementById('charge').innerText=Math.round(b.level*100)+'%'; }); }
setLang(lang);
</script>
