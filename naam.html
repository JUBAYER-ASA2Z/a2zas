 <!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অর্থ বুঝে নাম রাখুন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{font-family:'Hind Siliguri'; -webkit-tap-highlight-color:transparent;}
body{
  background: #fff;
  background-image:
    radial-gradient(at 20% 30%, #ffd6e7 0%, transparent 50%),
    radial-gradient(at 80% 20%, #c7d2fe 0%, transparent 50%),
    radial-gradient(at 50% 80%, #fef3c7 0%, transparent 50%),
    url('https://www.transparenttextures.com/patterns/white-marble.png');
  background-color: #fff8fa;
  min-height:100vh;
}
.marble-card{
  background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,248,250,0.9) 100%);
  backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255,255,255,0.8);
  box-shadow:
    0 8px 32px rgba(255,105,135,0.12),
    0 2px 8px rgba(0,0,0,0.05),
    inset 0 1px 0 rgba(255,255,255,0.9);
}
.glossy-btn{
  box-shadow: 0 8px 20px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.8);
  transition: all 0.2s;
}
.glossy-btn:active{transform:scale(0.96);}
.poster{
  background:
    radial-gradient(circle at 30% 20%, #ffe4ec 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, #e0e7ff 0%, transparent 40%),
    linear-gradient(180deg, #ffffff 0%, #fff5f8 100%);
  position:relative; overflow:hidden;
  border:6px solid white;
  box-shadow: 0 25px 80px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,182,193,0.3);
}
.poster::before{
  content:""; position:absolute; inset:0;
  background: url('https://www.transparenttextures.com/patterns/white-marble.png');
  opacity:0.3; pointer-events:none;
}
.watermark{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%) rotate(-30deg);
  font-size:17px; font-weight:900;
  color:rgba(0,0,0,0.020);
  letter-spacing:5px; white-space:nowrap; pointer-events:none;
}
.shiny-header{
  background: linear-gradient(135deg, #ec4899 0%, #f43f5e 50%, #8b5cf6 100%);
  box-shadow: 0 10px 30px rgba(236,72,153,0.3);
}
.name-item{
  background: linear-gradient(135deg, #ffffff 0%, #fffafb 100%);
  border: 1.5px solid transparent;
  background-clip: padding-box;
  position:relative;
}
.name-item::before{
  content:""; position:absolute; inset:0; border-radius:20px; padding:1.5px;
  background: linear-gradient(135deg, #ffd6e0, #c7d2fe, #fde68a);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events:none;
}
</style>
</head>
<body class="min-h-screen flex flex-col items-center">

<!-- Header Marble Shiny -->
<div class="w-full max-w-[480px] shiny-header p-6 text-center text-white rounded-b-[35px] sticky top-0 z-50">
  <button onclick="location.href='./islamic.html'" class="absolute left-4 top-6 w-10 h-10 bg-white/20 backdrop-blur rounded-full text-[20px] border border-white/30">←</button>
  <h1 class="font-black text-[21px] drop-shadow">অর্থ বুঝে নাম রাখুন</h1>
  <p class="text-[12px] mt-1 opacity-90 font-semibold tracking-wide">আপনার নামের অর্থ জেনে নিন ✨</p>
</div>

<!-- Buttons Colorful Glossy -->
<div class="w-full max-w-[480px] px-4 mt-6 flex gap-3">
  <button id="btnMale" class="glossy-btn flex-1 py-4 rounded-full font-black text-[16px] bg-gradient-to-r from-blue-500 to-indigo-600 text-white border border-white">👦 পুরুষ</button>
  <button id="btnFemale" class="glossy-btn flex-1 py-4 rounded-full font-black text-[16px] bg-white text-pink-600 border-2 border-pink-200">👧 মহিলা</button>
</div>

<!-- Search Marble -->
<div class="w-full max-w-[480px] px-4 mt-5">
  <div class="marble-card rounded-full px-6 py-4 flex gap-3 items-center">
    <span class="text-[20px]">🔍</span>
    <input id="searchInput" type="text" placeholder="জু / ay লিখলেই আসবে" class="flex-1 outline-none font-bold bg-transparent text-[15px] placeholder:text-zinc-400">
  </div>
</div>

<div id="nameList" class="w-full max-w-[480px] px-4 mt-5 pb-10 space-y-4"></div>

<!-- Poster -->
<div id="posterModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-5">
  <div class="w-full max-w-[360px]">
    <div id="posterCard" class="poster rounded-[36px] p-9 text-center">
      <div class="watermark">Qari MD jubayer Ahmed siyam</div>
      <div class="relative z-10">
        <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-br from-pink-400 via-rose-400 to-purple-400 flex items-center justify-center text-[40px] shadow-xl border-4 border-white">🌸</div>
        <h2 id="pName" class="font-black text-[36px] mt-4 bg-gradient-to-r from-zinc-800 to-zinc-600 bg-clip-text text-transparent"></h2>
        <p id="pEng" class="text-[12px] font-black tracking-[4px] uppercase bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent"></p>

        <div class="mt-7 marble-card rounded-[22px] p-5">
          <p class="text-[10px] text-pink-400 font-black tracking-widest uppercase">নামের অর্থ</p>
          <p id="pMeaning" class="font-black text-[19px] text-zinc-800 mt-1"></p>
        </div>
        <div class="mt-4 bg-gradient-to-r from-pink-50 to-purple-50 rounded-[18px] p-4 border border-pink-100">
          <p id="pQuote" class="text-[13px] italic font-semibold text-zinc-600"></p>
        </div>
      </div>
    </div>
    <div class="flex gap-3 mt-6">
      <button onclick="closePoster()" class="glossy-btn flex-1 py-4 bg-white rounded-full font-black shadow">বন্ধ</button>
      <button onclick="sharePosterImage()" class="glossy-btn flex-1 py-4 bg-gradient-to-r from-pink-600 to-purple-600 text-white rounded-full font-black shadow-lg">📤 শেয়ার</button>
    </div>
  </div>
</div>

<script>
let allNames = {male:[], female:[]};
let gender = 'male';

async function loadNames(){
  try{
    const m = await fetch('./male.json').then(r=>r.json());
    const f = await fetch('./female.json').then(r=>r.json());
    allNames.male = m; allNames.female = f;
  }catch(e){
    allNames.male = [{bn:"জুবায়ের",en:"Jubayer",meaning:"সাহসী",quote:"সাহসীরাই বিজয়ী"}];
    allNames.female = [{bn:"আয়েশা",en:"Ayesha",meaning:"জীবন",quote:"জীবনকে সাজাও"}];
  }
  renderNames();
}

function renderNames(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const list = document.getElementById('nameList');
  list.innerHTML = '';
  const data = allNames[gender];

  data.forEach((item,i)=>{
    const full = (item.bn+' '+item.en).toLowerCase();
    if(q){
      let ok = full.includes(q);
      if(!ok && q.length>=2){ let c=0; for(let ch of q){ if(full.includes(ch)) c++; } if(c/q.length>=0.5) ok=true; }
      if(!ok) return;
    }
    const div = document.createElement('div');
    div.className = 'name-item rounded-[20px] p-5 flex justify-between items-center cursor-pointer shadow-sm active:scale-[0.97] transition';
    div.innerHTML = `<div><p class="font-black text-[18px] text-zinc-800">${i+1}. ${item.bn} <span class="text-zinc-400 font-bold text-[14px]">/ ${item.en}</span></p><p class="text-[11px] text-zinc-500 mt-1">✨ অর্থ জানতে ক্লিক করুন</p></div><div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-100 to-purple-100 flex items-center justify-center text-pink-600 font-black">›</div>`;
    div.onclick = ()=>openPoster(item);
    list.appendChild(div);
  });
}

document.getElementById('btnMale').onclick = ()=>{ gender='male'; document.getElementById('btnMale').className='glossy-btn flex-1 py-4 rounded-full font-black text-[16px] bg-gradient-to-r from-blue-500 to-indigo-600 text-white border border-white'; document.getElementById('btnFemale').className='glossy-btn flex-1 py-4 rounded-full font-black text-[16px] bg-white text-pink-600 border-2 border-pink-200'; renderNames(); }
document.getElementById('btnFemale').onclick = ()=>{ gender='female'; document.getElementById('btnFemale').className='glossy-btn flex-1 py-4 rounded-full font-black text-[16px] bg-gradient-to-r from-pink-500 to-rose-500 text-white border border-white'; document.getElementById('btnMale').className='glossy-btn flex-1 py-4 rounded-full font-black text-[16px] bg-white text-blue-600 border-2 border-blue-200'; renderNames(); }
document.getElementById('searchInput').addEventListener('input', renderNames);

function openPoster(item){ document.getElementById('pName').innerText=item.bn; document.getElementById('pEng').innerText=item.en; document.getElementById('pMeaning').innerText=item.meaning; document.getElementById('pQuote').innerText='“ '+item.quote+' ”'; document.getElementById('posterModal').classList.remove('hidden'); }
function closePoster(){ document.getElementById('posterModal').classList.add('hidden'); }
async function sharePosterImage(){ const card=document.getElementById('posterCard'); const canvas=await html2canvas(card,{scale:3, backgroundColor:null}); canvas.toBlob(async(b)=>{ const f=new File([b],'name.png',{type:'image/png'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); }else{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='islamic-name-poster.png'; a.click(); } }); }

loadNames();
</script>
</body>
</html>
