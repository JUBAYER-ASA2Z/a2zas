<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>অর্থ বুঝে নাম রাখুন - A-S A2Z</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="male_names.js"></script>
<script src="female_names.js"></script>
<style>
*{font-family:'Hind Siliguri'; box-sizing:border-box;}
body{margin:0; min-height:100vh; overflow-x:hidden;}
.marble-bg{position:fixed; inset:0; z-index:-3; background: radial-gradient(120% 120% at 10% 10%, #fff 0%, #ffe4ec 25%, #ffc2d4 55%, #ff9ebf 85%, #ff7aa8 100%);}
.marble-glow{position:fixed; inset:0; z-index:-2; background: radial-gradient(ellipse at top left, rgba(255,255,255,0.9) 0%, transparent 50%), radial-gradient(ellipse at bottom right, rgba(255,105,180,0.3) 0%, transparent 60%);}
.marble-shine{position:fixed; inset:0; z-index:-1; pointer-events:none; background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.7) 35%, rgba(255,255,255,0.9) 40%, transparent 60%); animation: shineMove 4s infinite ease-in-out; mix-blend-mode: overlay;}
@keyframes shineMove{0%{transform:translateX(-100%)} 100%{transform:translateX(100%)}}
.sparkle{position:fixed; width:3px; height:3px; background:white; border-radius:50%; box-shadow:0 0 10px white, 0 0 20px #ff69b4; animation: sparkleAnim 2s infinite alternate; pointer-events:none; z-index:-1;}
@keyframes sparkleAnim{0%{opacity:0.2; transform:scale(0.5)} 100%{opacity:1; transform:scale(1.8)}}
.glass-card{background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 100%); backdrop-filter: blur(20px); border:1px solid rgba(255,255,255,0.8); box-shadow: 0 10px 40px rgba(255,105,180,0.25), inset 0 1px 0 rgba(255,255,255,0.9);}
.name-card{background: linear-gradient(135deg, #ffffff 0%, #fff8fb 50%, #ffeef5 100%); border:1px solid rgba(255,182,193,0.4); box-shadow: 0 8px 25px rgba(255,105,180,0.15), inset 0 1px 0 white; position:relative; overflow:hidden;}
.name-card::before{content:''; position:absolute; top:0; left:-50%; width:50%; height:100%; background: linear-gradient(120deg, transparent, rgba(255,255,255,0.8), transparent); animation: cardShine 3s infinite;}
@keyframes cardShine{0%{transform:translateX(-100%)} 100%{transform:translateX(250%)}}
.poster-bg{background: radial-gradient(circle at 30% 20%, #fff 0%, #ffe4ec 30%, #ffc2d4 70%, #ff9ebf 100%); position:relative; overflow:hidden;}
</style>
</head>
<body>
<div class="marble-bg"></div><div class="marble-glow"></div><div class="marble-shine"></div>
<span class="sparkle" style="left:10%; top:15%; animation-delay:0s"></span>
<span class="sparkle" style="left:85%; top:20%; animation-delay:0.3s"></span>
<span class="sparkle" style="left:25%; top:60%; animation-delay:0.6s"></span>
<span class="sparkle" style="left:70%; top:75%; animation-delay:0.9s"></span>

<div class="max-w-[480px] mx-auto min-h-screen relative pb-10">
<div class="px-5 pt-6 pb-5">
  <div class="glass-card rounded-[28px] p-5 text-center relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-gradient-to-br from-pink-200 to-rose-300 rounded-full blur-[20px] opacity-60"></div>
    <h1 class="relative font-black text-[22px] text-transparent bg-clip-text bg-gradient-to-r from-[#d81b60] to-[#ad1457]">অর্থ বুঝে নাম রাখুন</h1>
    <p class="relative font-bold text-[13px] mt-1 text-[#880e4f] opacity-80">আপনার নামের অর্থ জেনে নিন</p>
    <p class="relative text-[11px] mt-2 font-semibold text-pink-600 bg-white/70 inline-block px-3 py-1 rounded-full">ইসলামিক সুন্দর নাম 🌸</p>
  </div>
</div>

<div class="px-5 grid grid-cols-2 gap-4">
  <button id="btnMale" onclick="showGender('male')" class="glass-card rounded-[20px] p-4 text-center border-2 border-pink-500 shadow-[0_0_20px_rgba(236,72,153,0.4)]">
    <div class="w-14 h-14 mx-auto rounded-[16px] bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-[24px] shadow-lg">👦</div>
    <p class="font-black text-[15px] mt-2 text-slate-800">ছেলে</p>
    <p class="text-[10px] text-slate-500 font-bold" id="maleCount">10 টি নাম</p>
  </button>
  <button id="btnFemale" onclick="showGender('female')" class="glass-card rounded-[20px] p-4 text-center opacity-70">
    <div class="w-14 h-14 mx-auto rounded-[16px] bg-gradient-to-br from-pink-500 to-rose-500 flex items-center justify-center text-white text-[24px] shadow-lg">👧</div>
    <p class="font-black text-[15px] mt-2 text-slate-800">মেয়ে</p>
    <p class="text-[10px] text-slate-500 font-bold" id="femaleCount">10 টি নাম</p>
  </button>
</div>

<div class="px-5 mt-5">
  <div class="glass-card rounded-[18px] flex items-center px-4 py-3 gap-3">
    <span class="text-pink-500 font-black">🔍</span>
    <input id="searchInput" oninput="doSearch()" placeholder="নাম লিখুন... যেমন: 1, Jubayer, ফাতিমা" class="flex-1 bg-transparent outline-none text-[13px] font-bold text-slate-700 placeholder:text-slate-400">
    <span id="searchCount" class="text-[10px] font-black bg-pink-500 text-white px-2 py-1 rounded-full">10</span>
  </div>
</div>

<div id="nameList" class="px-5 mt-4 space-y-3"></div>

<div class="mt-8 text-center pb-6"><p class="text-[10px] font-black text-pink-300 tracking-[3px]">A-S A 2 Z</p><p class="text-[11px] font-bold text-slate-400 mt-1">Qari MD Jubayer Ahmed Siyam</p></div>
</div>

<div id="posterModal" class="fixed inset-0 z-[100] hidden bg-black/60 backdrop-blur-[8px] flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="w-full max-w-[380px] bg-white rounded-t-[32px] sm:rounded-[32px] overflow-hidden shadow-[0_20px_80px_rgba(0,0,0,0.4)]">
    <canvas id="posterCanvas" width="1080" height="1350" class="hidden"></canvas>
    <div id="posterView" class="poster-bg p-7 text-center relative">
      <button onclick="closePoster()" class="absolute top-4 right-4 w-8 h-8 bg-black/10 rounded-full font-black">✕</button>
      <div class="inline-block bg-white/80 px-3 py-1 rounded-full text-[10px] font-black text-pink-600 tracking-widest">ISLAMIC NAME</div>
      <p id="pArabic" class="font-black text-[32px] mt-3 text-[#ad1457]">زبير</p>
      <h2 id="pName" class="font-black text-[28px] leading-[32px] mt-1 text-slate-900">জুবায়ের / Jubayer</h2>
      <div class="w-16 h-[3px] bg-gradient-to-r from-pink-400 to-rose-500 mx-auto mt-3 rounded-full"></div>
      <div class="mt-5 bg-white/90 rounded-[20px] p-4 shadow-[0_8px_25px_rgba(0,0,0,0.08)] border border-white">
        <p class="text-[10px] font-black tracking-widest text-pink-500">নামের অর্থ</p>
        <p id="pMeaning" class="font-bold text-[16px] mt-1 text-slate-800">সাহসী, শক্তিশালী</p>
      </div>
      <div class="mt-4 bg-gradient-to-br from-slate-900 to-slate-800 rounded-[18px] p-4 text-white relative">
        <p id="pQuote" class="text-[13px] leading-[19px] font-semibold">সাহসীরা কখনো হার মানে না...</p>
      </div>
      <p class="mt-6 text-[10px] font-black text-slate-400 tracking-[3px]">A-S A 2 Z</p>
      <div class="mt-4 grid grid-cols-2 gap-3">
        <button onclick="sharePoster()" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white font-black py-3 rounded-[14px] text-[13px]">📤 শেয়ার</button>
        <button onclick="downloadPoster()" class="bg-slate-900 text-white font-black py-3 rounded-[14px] text-[13px]">⬇️ সেভ</button>
      </div>
      <p class="mt-3 text-[8px] font-bold text-[#c9a86a]/60 tracking-widest">Qari MD Jubayer Ahmed Siyam</p>
    </div>
  </div>
</div>

<script>
const NAMES_DB = { male: MALE_NAMES, female: FEMALE_NAMES };
let currentGender='male';
let filtered=[];
document.getElementById('maleCount').innerText = MALE_NAMES.length + ' টি নাম';
document.getElementById('femaleCount').innerText = FEMALE_NAMES.length + ' টি নাম';
function showGender(g){
  currentGender=g;
  document.getElementById('btnMale').className = g=='male'? "glass-card rounded-[20px] p-4 text-center border-2 border-pink-500 shadow-[0_0_20px_rgba(236,72,153,0.4)]" : "glass-card rounded-[20px] p-4 text-center opacity-70";
  document.getElementById('btnFemale').className = g=='female'? "glass-card rounded-[20px] p-4 text-center border-2 border-pink-500 shadow-[0_0_20px_rgba(236,72,153,0.4)]" : "glass-card rounded-[20px] p-4 text-center opacity-70";
  document.getElementById('searchInput').value='';
  renderList(NAMES_DB[g]);
}
function renderList(list){
  filtered=list;
  document.getElementById('searchCount').innerText=list.length;
  let html='';
  list.forEach(item=>{
    html+=`
    <div onclick="openPoster(${item.id})" class="name-card rounded-[20px] p-4 flex items-center gap-4 active:scale-[0.98] cursor-pointer">
      <div class="w-[48px] h-[48px] rounded-[14px] bg-gradient-to-br ${currentGender=='male'? 'from-blue-500 to-indigo-600' : 'from-pink-400 to-rose-500'} flex items-center justify-center text-white font-black text-[16px] shadow-md">${item.id}</div>
      <div class="flex-1">
        <p class="font-black text-[16px] text-slate-900">${item.bn} <span class="text-slate-400">/</span> <span class="text-pink-600">${item.en}</span></p>
        <p class="text-[10px] font-bold text-pink-500 mt-[2px]">অর্থ জানতে ক্লিক করুন ➤</p>
      </div>
      <span class="text-pink-300">🌸</span>
    </div>`;
  });
  document.getElementById('nameList').innerHTML = html || `<p class="text-center py-10 font-bold text-pink-400">কোন নাম পাওয়া যায়নি</p>`;
}
function doSearch(){
  let q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){ renderList(NAMES_DB[currentGender]); return; }
  let list = NAMES_DB[currentGender].filter(it=> it.bn.toLowerCase().includes(q) || it.en.toLowerCase().includes(q) || it.id.toString()==q );
  renderList(list);
}
let currentItem=null;
function openPoster(id){
  currentItem = NAMES_DB[currentGender].find(x=>x.id==id);
  if(!currentItem) return;
  document.getElementById('pArabic').innerText = currentItem.arabic;
  document.getElementById('pName').innerText = currentItem.bn + ' / ' + currentItem.en;
  document.getElementById('pMeaning').innerText = currentItem.meaning;
  document.getElementById('pQuote').innerText = currentItem.quote;
  document.getElementById('posterModal').classList.remove('hidden');
  drawCanvas();
}
function closePoster(){ document.getElementById('posterModal').classList.add('hidden'); }
function drawCanvas(){
  let c=document.getElementById('posterCanvas'), ctx=c.getContext('2d');
  let grad=ctx.createLinearGradient(0,0,0,1350);
  grad.addColorStop(0,'#fff'); grad.addColorStop(0.3,'#ffe4ec'); grad.addColorStop(0.7,'#ffc2d4'); grad.addColorStop(1,'#ff9ebf');
  ctx.fillStyle=grad; ctx.fillRect(0,0,1080,1350);
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(250,250,400,250, -0.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ad1457'; ctx.font='900 90px Hind Siliguri'; ctx.textAlign='center'; ctx.fillText(currentItem.arabic, 540, 300);
  ctx.fillStyle='#111'; ctx.font='900 70px Hind Siliguri'; ctx.fillText(currentItem.bn + ' / ' + currentItem.en, 540, 420, 900);
  ctx.fillStyle='#880e4f'; ctx.font='700 42px Hind Siliguri'; ctx.fillText(currentItem.meaning, 540, 620, 900);
  ctx.fillStyle='#fff'; ctx.fillRect(80, 720, 920, 200); ctx.fillStyle='#111'; ctx.font='600 36px Hind Siliguri';
  let words=currentItem.quote.split(' '), line='', y=780;
  for(let n=0;n<words.length;n++){ let test=line+words[n]+' '; if(ctx.measureText(test).width>860){ ctx.fillText(line,540,y); line=words[n]+' '; y+=50; } else line=test; } ctx.fillText(line,540,y);
  ctx.fillStyle='rgba(201,168,106,0.35)'; ctx.font='700 26px Poppins'; ctx.fillText('Qari MD Jubayer Ahmed Siyam', 540, 1300);
}
function sharePoster(){
  let c=document.getElementById('posterCanvas');
  c.toBlob(async (blob)=>{
    let file=new File([blob], 'name-poster.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: currentItem.bn});
    } else {
      let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=file.name; a.click();
    }
  });
}
function downloadPoster(){ sharePoster(); }
showGender('male');
</script>
</body>
</html>
