<!DOCTYPE html>
<html lang="bn" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Islamic Quiz Live</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Hind Siliguri'; -webkit-tap-highlight-color:transparent;}
body{background:#0a0a0f; overflow:hidden; position:fixed; width:100%; height:100%;}
.gorilla-glass{background:linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 100%); backdrop-filter:blur(22px); border:1.5px solid rgba(255,255,255,0.22);}
</style>
</head>
<body class="notranslate min-h-screen text-white">
<div class="fixed inset-0 -z-10 bg-gradient-to-br from-[#1a1033] via-[#0a0a0f] to-black"></div>

<div class="max-w-[480px] mx-auto h-[100dvh] flex flex-col p-3 pb-[20px] overflow-y-auto">

<div class="flex justify-between items-center py-2 shrink-0">
  <button onclick="location.href='account.html'" class="w-10 h-10 rounded-full bg-white/15 backdrop-blur flex items-center justify-center font-black">←</button>
  <div class="gorilla-glass rounded-full px-4 py-1.5 font-black text-[11px]">🕌 ইসলামিক কুইজ লাইভ</div>
  <button id="controlBtn" class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-black font-black">⚙️</button>
</div>

<div id="broadcastBar" class="hidden mt-3 bg-[#facc15] border-2 border-black rounded-[14px] px-3 py-2 flex items-center gap-2 shrink-0">
  <span class="bg-black text-[#facc15] text-[9px] font-black px-2 py-1 rounded-full">MESSAGE</span>
  <p id="broadcastText" class="flex-1 font-black text-[13px] text-black"></p>
  <button onclick="document.getElementById('broadcastBar').classList.add('hidden')" class="text-black font-black">✕</button>
</div>

<div id="loginNeeded" class="hidden mt-3 bg-red-500/20 border border-red-500/30 rounded-[18px] p-4 text-center">
  <p class="font-black text-[14px]">আগে Account খুলুন</p>
  <button onclick="location.href='account.html'" class="mt-2 bg-white text-black font-black px-6 py-2 rounded-full text-[12px]">Go to Account</button>
</div>

<div id="welcomeBar" class="hidden mt-3 gorilla-glass rounded-[18px] p-3 flex justify-between items-center shrink-0">
  <p class="font-black text-[13px]">👋 <span id="userNameShow"></span> (<span id="userIdShow"></span>)</p>
  <span class="bg-amber-400 text-black font-black px-3 py-1 rounded-full text-[11px]" id="myGold">💰 0 Gold</span>
</div>

<div id="stage" class="flex-1 mt-4 flex flex-col items-center justify-center text-center">
  <div id="idleView">
    <div class="text-[84px]">🕌</div>
    <h1 class="font-black text-[28px] leading-[30px] mt-3">ইসলামিক কুইজ<br><span class="text-amber-300">লাইভ ইভেন্ট</span></h1>
    <p class="mt-3 text-[13px] text-white/70">হোস্ট START করলে শুরু হবে<br>১০ টি প্রশ্ন • প্রতিটিতে ১০ Gold</p>
    <div class="mt-6 gorilla-glass rounded-full px-6 py-2 text-[11px] font-bold">🔴 Live • উত্তর দিলে Gold Account এ জমা হবে</div>
  </div>
  <div id="startingView" class="hidden">
    <h1 class="font-black text-[40px] gorilla-glass px-8 py-8 rounded-[28px]">কুইজ শুরু!</h1>
  </div>
  <div id="questionView" class="hidden w-full">
    <div class="flex justify-between items-center w-full mb-3">
      <span class="bg-white text-black font-black px-4 py-1.5 rounded-full text-[12px]">প্রশ্ন <span id="qNo">1</span>/10</span>
      <span id="timer" class="bg-red-500 font-black px-4 py-1.5 rounded-full text-[13px]">10s</span>
    </div>
    <div class="gorilla-glass rounded-[24px] p-5 w-full"><p id="qText" class="font-black text-[18px]"></p></div>
    <div id="optionsBox" class="grid grid-cols-1 gap-3 mt-4 w-full"></div>
    <p id="blockMsg" class="hidden mt-3 text-[11px] bg-red-500/40 border px-4 py-1.5 rounded-full">⏱️ সময় শেষ</p>
  </div>
</div>

</div>

<div id="controlModal" class="hidden fixed inset-0 z-[99] bg-black/75 backdrop-blur-md flex items-center justify-center p-4">
  <div class="bg-white text-black rounded-[24px] p-5 w-full max-w-[360px]">
    <p class="font-black text-[18px]">🔐 Control</p>
    <input id="codeInput" type="password" placeholder="Code" class="w-full mt-3 border-2 border-zinc-200 rounded-full px-4 py-3 font-black outline-none">
    <div id="controlPanel" class="hidden mt-4 space-y-3">
      <button onclick="controlAction('start')" class="w-full bg-violet-600 text-white font-black py-3 rounded-full">🚀 START</button>
      <button onclick="controlAction('next')" class="w-full bg-black text-white font-black py-3 rounded-full">⏭️ Next Question</button>
      <button onclick="controlAction('reset')" class="w-full bg-red-100 text-red-600 border font-black py-3 rounded-full">🔄 RESET</button>
      <div class="bg-yellow-50 border-2 border-yellow-200 rounded-[16px] p-3">
        <input id="broadcastInput" placeholder="Message..." class="w-full border rounded-full px-3 py-2 text-[12px] font-bold">
        <div class="flex gap-2 mt-2"><button onclick="sendBroadcast()" class="flex-1 bg-black text-[#facc15] font-black py-2 rounded-full text-[11px]">SEND</button><button onclick="clearBroadcast()" class="flex-1 bg-white border font-bold py-2 rounded-full text-[11px]">Clear</button></div>
      </div>
    </div>
    <button id="verifyBtn" onclick="verifyCode()" class="w-full mt-3 bg-black text-white font-black py-3 rounded-full">VERIFY</button>
    <button onclick="document.getElementById('controlModal').classList.add('hidden')" class="w-full mt-3 text-[12px] font-bold text-zinc-500">Close</button>
  </div>
</div>

<script>
// --- আপনাদের দুইটা API ---
const QUIZ_API = "https://script.google.com/macros/s/AKfycbz5MtF6dmRya92uXaKoCh6Bxr65PK_PsEiYc_CcrB2qqljodv-qIFH7WODI8bM4DBGN/exec";
const GOLD_API = "https://script.google.com/macros/s/AKfycbw_oRlZS8lwB9JnkZQeUCQOfn-BVrMSPtEyqVvBuKUjH9KMAyMABT0PER46gTqB4P4J/exec";

// --- নতুন ১০ টা ইসলামিক প্রশ্ন ---
const DATA_BN = [
  {q:"কুরআন নাজিল হতে কত বছর লেগেছে?", options:["২৩ বছর","২০ বছর","২৫ বছর","৩০ বছর"], ans:0, gold:10},
  {q:"কোন ফেরেশতা ওহী নিয়ে আসতেন?", options:["ইসরাফিল (আ)","জিবরাঈল (আ)","মিকাঈল (আ)","আজরাঈল (আ)"], ans:1, gold:10},
  {q:"মুসলমানদের প্রথম কিবলা কোনটি?", options:["কাবা","বায়তুল মুকাদ্দাস","মসজিদে নববী","মসজিদে কুবা"], ans:1, gold:10},
  {q:"সাওম অর্থ কি?", options:["নামাজ","রোজা","হজ্ব","যাকাত"], ans:1, gold:10},
  {q:"কোন সূরায় বিসমিল্লাহ নেই?", options:["সূরা তাওবা","সূরা ফাতিহা","সূরা নাস","সূরা ফালাক"], ans:0, gold:10},
  {q:"ইসলামের ২য় খলিফা কে?", options:["আবু বকর (রা)","ওমর (রা)","উসমান (রা)","আলী (রা)"], ans:1, gold:10},
  {q:"কুরআনের কোন সূরা দুইবার নাজিল হয়েছে?", options:["ফাতিহা","ইখলাস","বাকারা","রহমান"], ans:0, gold:10},
  {q:"জুমার নামাজ কত রাকাত ফরজ?", options:["২ রাকাত","৪ রাকাত","৩ রাকাত","১০ রাকাত"], ans:0, gold:10},
  {q:"কোন নবী নৌকা তৈরি করেছিলেন?", options:["মূসা (আ)","নূহ (আ)","ইব্রাহিম (আ)","আদম (আ)"], ans:1, gold:10},
  {q:"লাইলাতুল কদর কোন মাসে?", options:["রজব","রমজান","শাবান","শাওয়াল"], ans:1, gold:10},
];

let currentQIndex=-1, lastStateQ=-99, answerLocked=false, correctShuffledIndex=-1, shuffledOptions=[];
let a2z_userId = localStorage.getItem('a2z_userId');
let a2z_name = localStorage.getItem('a2z_name');

// --- Account Check ---
function checkLogin(){
  a2z_userId = localStorage.getItem('a2z_userId');
  if(!a2z_userId){
    document.getElementById('loginNeeded').classList.remove('hidden');
    document.getElementById('welcomeBar').classList.add('hidden');
    return false;
  } else {
    document.getElementById('loginNeeded').classList.add('hidden');
    document.getElementById('welcomeBar').classList.remove('hidden');
    document.getElementById('userIdShow').innerText = a2z_userId;
    document.getElementById('userNameShow').innerText = localStorage.getItem('a2z_name') || a2z_userId;
    refreshGold();
    return true;
  }
    let res=await fetch(QUIZ_API+"?action=getState&t="+Date.now()).then(r=>r.json());
    let q=parseInt(res.currentQ??"-1"); let started=res.started=="1";
    if(res.broadcastMsg && res.broadcastMsg!=""){ document.getElementById('broadcastBar').classList.remove('hidden'); document.getElementById('broadcastText').innerText=res.broadcastMsg; } else if(res.broadcastMsg==="") document.getElementById('broadcastBar').classList.add('hidden');
    if(!started) return;
    if(q!=lastStateQ && q>=0){ lastStateQ=q; startQuestionFlow(q); }
  }catch(e){}
}
function startQuestionFlow(qIndex){ currentQIndex=qIndex; document.getElementById('idleView').classList.add('hidden'); document.getElementById('startingView').classList.remove('hidden'); document.getElementById('questionView').classList.add('hidden'); setTimeout(()=>{ document.getElementById('startingView').classList.add('hidden'); showQuestion(qIndex); }, 1000); }
function shuffleArray(arr){ let a=[...arr]; for(let i=a.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function showQuestion(idx){
  let qObj=DATA_BN[idx];
  document.getElementById('idleView').classList.add('hidden'); document.getElementById('startingView').classList.add('hidden'); document.getElementById('questionView').classList.remove('hidden');
  document.getElementById('qNo').innerText=idx+1; document.getElementById('qText').innerText=qObj.q;
  let optsWithIndex=qObj.options.map((text,i)=>({text, originalIndex:i}));
  shuffledOptions=shuffleArray(optsWithIndex);
  correctShuffledIndex=shuffledOptions.findIndex(o=>o.originalIndex==qObj.ans);
  let box=document.getElementById('optionsBox'); box.innerHTML=""; answerLocked=false;
  document.getElementById('blockMsg').classList.add('hidden');
  shuffledOptions.forEach((o,i)=>{
    let label=["A","B","C","D"][i];
    let div=document.createElement('div');
    div.className="gorilla-glass rounded-[16px] p-3.5 flex justify-between items-center cursor-pointer active:scale-[0.98]";
    div.id="opt-"+i;
    div.innerHTML=`<span class="flex items-center gap-3"><span class="w-8 h-8 rounded-full bg-white text-black font-black flex items-center justify-center text-[12px]">${label}</span><span class="font-bold text-[14px]">${o.text}</span></span>`;
    div.onclick=()=>selectOption(i);
    box.appendChild(div);
  });
  let timeLeft=10; document.getElementById('timer').innerText=timeLeft+"s";
  let timer=setInterval(()=>{ timeLeft--; document.getElementById('timer').innerText=timeLeft+"s"; if(timeLeft==5){ answerLocked=true; document.getElementById('blockMsg').classList.remove('hidden'); } if(timeLeft<=0){ clearInterval(timer); revealAnswer(); } },1000);
}
function selectOption(shuffledIdx){
  if(answerLocked) return;
  if(!checkLogin()) return;
  let isCorrect=(shuffledIdx==correctShuffledIndex);
  let qObj=DATA_BN[currentQIndex];

  // চিটিং বন্ধ - একই প্রশ্নে ২ বার Gold নিতে পারবে না
  let key = `gold_${a2z_userId}_${currentQIndex}`;
  if(localStorage.getItem(key)) { alert("এই প্রশ্নের Gold আপনি পেয়ে গেছেন"); return; }

  document.getElementById('opt-'+shuffledIdx).style.outline="3px solid #facc15";
  answerLocked=true;

  if(isCorrect){
    // --- REAL GOLD ADD TO ACCOUNT ---
    fetch(`${GOLD_API}?action=addEventGold&userId=${a2z_userId}&amount=${qObj.gold}`)
   .then(r=>r.json()).then(d=>{
      if(d.ok){
        alert(`সঠিক! ${qObj.gold} Gold আপনার Account এ যোগ হয়েছে`);
        localStorage.setItem(key, "done");
        refreshGold();
      }
    });
  } else {
    alert("ভুল উত্তর!");
  }
  // Answer পাঠানো (পুরানো সিস্টেমের জন্য রাখলাম, চাইলে বাদ দিতে পারেন)
  fetch(QUIZ_API, {method:"POST", mode:"no-cors", body:JSON.stringify({action:"answer", deviceId:a2z_userId, name:a2z_name, qno:String(currentQIndex), option:String(shuffledIdx), isCorrect})});
}
function revealAnswer(){
  shuffledOptions.forEach((_,i)=>{
    let el=document.getElementById('opt-'+i);
    if(i==correctShuffledIndex) el.style.background="#22c55e"; else el.style.background="rgba(239,68,68,0.5)";
  });
}

document.getElementById('controlBtn').onclick=()=>{ document.getElementById('controlModal').classList.remove('hidden'); };
checkLogin();
setInterval(pollState, 1500);
pollState();
</script>
</body>
</html>
