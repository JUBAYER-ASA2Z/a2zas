<!DOCTYPE html>
<html lang="bn" translate="no" class="notranslate">
<head>
<meta charset="UTF-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Event Live - 10 Q + Gold + BN/EN</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Hind Siliguri';box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{top:0!important;background:#050510;position:fixed;width:100%;height:100%;overflow:hidden}
.glass{background:linear-gradient(135deg,rgba(255,255,255,0.18),rgba(255,255,255,0.06));backdrop-filter:blur(24px);border:1.5px solid rgba(255,255,255,0.22)}
@keyframes pop{0%{transform:translate(-50%,-150%) scale(0.5);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.big-toast{animation:pop 0.5s cubic-bezier(0.175,0.885,0.32,1.275)}
.goog-te-banner-frame,.skiptranslate{display:none!important}
</style>
</head>
<body class="text-white">
<div class="fixed inset-0 -z-10 bg-gradient-to-br from-[#1a1033] via-black to-[#1a1033]"></div>

<div id="bigAlert" class="hidden fixed top-3 left-1/2 -translate-x-1/2 z-[9999] w-[96%] max-w-[500px]">
<div id="bigAlertInner" class="big-toast rounded-[22px] p-5 border-[3px] border-black shadow-2xl text-center">
<p id="bigAlertTitle" class="font-black text-[20px]"></p><p id="bigAlertSub" class="font-bold text-[12px] mt-1"></p>
</div>
</div>

<div class="max-w-[480px] mx-auto h-[100dvh] flex flex-col p-3 overflow-y-auto">
<div class="flex justify-between items-center py-2">
<button onclick="location.href='account.html'" class="w-10 h-10 rounded-full bg-white/15 font-black">←</button>
<div class="flex gap-1.5">
<div id="btnBN" onclick="setLang('bn')" class="px-5 py-2 rounded-full text-[11px] font-black bg-white text-black cursor-pointer">BN</div>
<div id="btnEN" onclick="setLang('en')" class="px-5 py-2 rounded-full text-[11px] font-black bg-white/15 cursor-pointer">EN</div>
</div>
<button id="adminBtn" class="w-10 h-10 rounded-full bg-white/10">•••</button>
</div>

<div id="topBar" class="hidden mt-3 glass rounded-[18px] p-3 flex justify-between"><p class="font-black text-[12px]">👋 <span id="uName"></span></p><span id="uGold" class="bg-amber-400 text-black font-black px-4 py-1 rounded-full text-[12px]">💰 0 Gold</span></div>

<div id="stage" class="flex-1 flex flex-col items-center justify-center text-center mt-4">
<div id="vIdle"><div class="text-[80px]">🕌</div><h1 id="t_idle" class="font-black text-[26px] leading-[28px]"></h1><p id="t_idleSub" class="mt-2 text-[11px] opacity-60"></p><div id="qListPreview" class="mt-4 text-left bg-white/10 rounded-[16px] p-3 max-h-[140px] overflow-y-auto"></div></div>
<div id="vCount" class="hidden"><h1 id="countNum" class="font-black text-[90px]">5</h1><p id="t_count" class="font-black"></p></div>
<div id="vNext" class="hidden"><div class="w-12 h-12 border-4 border-white/20 border-t-amber-400 rounded-full animate-spin mx-auto"></div><h1 id="t_next" class="font-black mt-4"></h1></div>
<div id="vQ" class="hidden w-full"><div class="flex justify-between mb-3"><span class="bg-white text-black font-black px-4 py-1.5 rounded-full text-[11px]"><span id="t_q"></span> <span id="qNo">1</span>/10</span><span id="timer" class="bg-red-500 font-black px-4 py-1.5 rounded-full">4s</span></div><div class="glass rounded-[24px] p-5"><p id="qText" class="font-black text-[18px]"></p></div><div id="optBox" class="grid gap-3 mt-4"></div><p id="lockMsg" class="hidden mt-3 bg-red-500/20 border border-red-500/40 px-4 py-1.5 rounded-full text-[11px] font-bold"><span id="t_lock"></span></p><p id="goldMsg" class="hidden mt-2 text-[11px] font-black text-amber-300"></p></div>
</div>
</div>

<div id="adminModal" class="hidden fixed inset-0 z-[99] bg-black/80 backdrop-blur flex items-center justify-center p-4">
<div class="bg-white text-black rounded-[24px] p-5 w-full max-w-[380px]">
<p class="font-black text-[18px]">🔐 Admin - 10 Question Control</p>
<input id="codeIn" type="password" placeholder="Code" class="w-full mt-3 border-2 rounded-full px-4 py-3 font-black text-center tracking-[8px] outline-none">
<div id="aPanel" class="hidden mt-4 space-y-2">
<div class="grid grid-cols-3 gap-2"><button onclick="doAct('start')" class="bg-violet-600 text-white font-black py-3 rounded-full text-[12px]">START</button><button onclick="doAct('next')" class="bg-black text-white font-black py-3 rounded-full text-[12px]">NEXT</button><button onclick="doAct('reset')" class="bg-red-500 text-white font-black py-3 rounded-full text-[12px]">RESET</button></div>
<button onclick="location.reload()" class="w-full bg-zinc-200 text-black font-black py-2.5 rounded-full text-[11px]">♻️ REPLACE / Refresh All Users</button>
<div id="adminQList" class="max-h-[200px] overflow-y-auto bg-zinc-100 rounded-[16px] p-2 mt-2 text-[11px]"></div>
<p id="aStat" class="text-[11px] font-bold text-center text-green-600"></p>
</div>
<button id="vBtn" onclick="verify()" class="w-full mt-3 bg-black text-white font-black py-3 rounded-full">VERIFY</button>
<button onclick="adminModal.classList.add('hidden')" class="w-full mt-2 text-[11px] opacity-40">Close</button>
</div>
</div>

<script>
const QUIZ_API="https://script.google.com/macros/s/AKfycbzbCL7gQlj3wqVAPYpQAhWWe7afGiKdB3hdq489PMvdJ7UG8gKOtJl5-UilBhsrAtsOyQ/exec";
const GOLD_API="https://script.google.com/macros/s/AKfycbw_oRlZS8lwB9JnkZQeUCQOfn-BVrMSPtEyqVvBuKUjH9KMAyMABT0PER46gTqB4P4J/exec";
const _sec="321123";

// ১০ টা প্রশ্ন বাংলা + ইংরেজি - ফুল লিস্ট
const DATA_BN=[
{q:"১. কুরআন নাজিল হতে কত বছর লেগেছে?",o:["২৩ বছর","২০ বছর","২৫ বছর","৩০ বছর"],a:0},
{q:"২. কোন ফেরেশতা ওহী আনতেন?",o:["ইসরাফিল","জিবরাঈল","মিকাঈল","আজরাঈল"],a:1},
{q:"৩. প্রথম কিবলা কোনটি?",o:["কাবা","বায়তুল মুকাদ্দাস","মসজিদে নববী","কুবা"],a:1},
{q:"৪. সাওম শব্দের অর্থ কি?",o:["নামাজ","রোজা","হজ্ব","যাকাত"],a:1},
{q:"৫. কোন সূরায় বিসমিল্লাহ নেই?",o:["সূরা তাওবা","সূরা ফাতিহা","সূরা নাস","সূরা ফালাক"],a:0},
{q:"৬. ইসলামের ২য় খলিফা কে?",o:["আবু বকর (রা)","ওমর (রা)","উসমান (রা)","আলী (রা)"],a:1},
{q:"৭. কোন সূরা দুবার নাজিল হয়েছে?",o:["সূরা ফাতিহা","সূরা ইখলাস","সূরা বাকারা","সূরা রহমান"],a:0},
{q:"৮. জুমার ফরজ নামাজ কত রাকাত?",o:["২ রাকাত","৪ রাকাত","৩ রাকাত","১০ রাকাত"],a:0},
{q:"৯. কে নৌকা বানিয়েছিলেন?",o:["মূসা (আ)","নূহ (আ)","ইব্রাহিম (আ)","আদম (আ)"],a:1},
{q:"১০. লাইলাতুল কদর কোন মাসে?",o:["রজব","রমজান","শাবান","শাওয়াল"],a:1}
];
const DATA_EN=[
{q:"1. How many years to reveal Quran?",o:["23 Years","20 Years","25 Years","30 Years"],a:0},
{q:"2. Which Angel brought Wahi?",o:["Israfil","Jibrail","Mikail","Azrail"],a:1},
{q:"3. First Qibla?",o:["Kaaba","Baitul Muqaddas","Nabawi","Quba"],a:1},
{q:"4. What does Sawm mean?",o:["Salah","Fasting","Hajj","Zakat"],a:1},
{q:"5. Which Surah has no Bismillah?",o:["Tawbah","Fatiha","Nas","Falaq"],a:0},
{q:"6. Who is 2nd Caliph?",o:["Abu Bakr","Umar","Usman","Ali"],a:1},
{q:"7. Surah revealed twice?",o:["Fatiha","Ikhlas","Baqarah","Rahman"],a:0},
{q:"8. Fard in Jumuah?",o:["2 Rakats","4 Rakats","3 Rakats","10 Rakats"],a:0},
{q:"9. Who built the Ark?",o:["Musa","Nuh","Ibrahim","Adam"],a:1},
{q:"10. Lailatul Qadr in which month?",o:["Rajab","Ramadan","Shaban","Shawwal"],a:1}
];
const TXT={
bn:{idle:'ইসলামিক কুইজ<br><span class="text-amber-300">লাইভ ইভেন্ট - 10 প্রশ্ন</span>',idleSub:'Admin START করলে ৫ সেকেন্ড পর ১০টি প্রশ্ন শুরু হবে। প্রতিটি সঠিক উত্তরে 10 Gold Account এ যোগ হবে।',count:'শুরু হচ্ছে...',next:'পরবর্তী প্রশ্ন আসছে...',q:'প্রশ্ন',lock:'⏱️ সময় শেষ - উত্তর লক',correct:'✅ সঠিক! 10 Gold যোগ হয়েছে',wrong:'❌ ভুল উত্তর!',already:'এই প্রশ্নের Gold পেয়ে গেছেন',goldAdd:'💰 10 Gold আপনার Account এ যোগ হয়েছে'},
en:{idle:'Islamic Quiz<br><span class="text-amber-300">Live Event - 10 Questions</span>',idleSub:'Starts 5s after Admin START. 10 questions, 10 Gold for each correct answer directly to your Account.',count:'Starting...',next:'Next question coming...',q:'Question',lock:'⏱️ Time up - Locked',correct:'✅ Correct! 10 Gold Added',wrong:'❌ Wrong Answer!',already:'Already got Gold for this question',goldAdd:'💰 10 Gold added to your Account'}
};

let lang=localStorage.getItem('quiz_lang')||'bn',lastQ=-99,locked=false,correctIdx=-1,shuffled=[],timer=null,uid=null,ctx=null,curQ=-1;

function sound(t){try{if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); let o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); if(t=='click'){o.frequency.value=850;g.gain.setValueAtTime(0.3,ctx.currentTime);o.start();o.stop(ctx.currentTime+0.12);} if(t=='correct'){o.frequency.value=500;o.frequency.linearRampToValueAtTime(1300,ctx.currentTime+0.4);g.gain.setValueAtTime(0.45,ctx.currentTime);o.start();o.stop(ctx.currentTime+0.5);} if(t=='wrong'){o.frequency.value=180;g.gain.setValueAtTime(0.4,ctx.currentTime);o.start();o.stop(ctx.currentTime+0.35);} if(t=='start'){[300,600,950].forEach((f,i)=>{let os=ctx.createOscillator(),ga=ctx.createGain();os.connect(ga);ga.connect(ctx.destination);os.frequency.value=f;ga.gain.setValueAtTime(0.35,ctx.currentTime+i*0.12);os.start(ctx.currentTime+i*0.12);os.stop(ctx.currentTime+i*0.12+0.2);});}}catch{}}
function bigToast(title,sub,type){let box=document.getElementById('bigAlert'),inner=document.getElementById('bigAlertInner');bigAlertTitle.innerHTML=title;bigAlertSub.innerHTML=sub||"";box.classList.remove('hidden');if(type=='success') inner.className="big-toast rounded-[22px] p-5 border-[3px] border-black shadow-2xl text-center bg-[#facc15] text-black";else if(type=='error') inner.className="big-toast rounded-[22px] p-5 border-[3px] border-black shadow-2xl text-center bg-red-500 text-white";else inner.className="big-toast rounded-[22px] p-5 border-[3px] border-black shadow-2xl text-center bg-white text-black";setTimeout(()=>box.classList.add('hidden'),3500);}
function setLang(l){
 lang=l;localStorage.setItem('quiz_lang',l);
 btnBN.className=l=='bn'?"px-5 py-2 rounded-full text-[11px] font-black bg-white text-black":"px-5 py-2 rounded-full text-[11px] font-black bg-white/15";
 btnEN.className=l=='en'?"px-5 py-2 rounded-full text-[11px] font-black bg-white text-black":"px-5 py-2 rounded-full text-[11px] font-black bg-white/15";
 t_idle.innerHTML=TXT[l].idle; t_idleSub.innerText=TXT[l].idleSub; t_count.innerText=TXT[l].count; t_next.innerText=TXT[l].next; t_q.innerText=TXT[l].q; t_lock.innerText=TXT[l].lock;
 let D=l=='bn'?DATA_BN:DATA_EN;
 qListPreview.innerHTML=D.map(x=>`<div class="py-1 border-b border-white/10 text-[10px]">${x.q}</div>`).join('');
 adminQList.innerHTML=D.map((x,i)=>`<div class="py-1.5 font-bold">Q${i+1}: ${x.q} - Ans: ${x.o[x.a]}</div>`).join('');
 if(curQ>=0) showQ(curQ,true);
}
function checkAcc(){uid=localStorage.getItem('a2z_userId');let nm=localStorage.getItem('a2z_name');if(!uid){topBar.classList.add('hidden');return false;}else{topBar.classList.remove('hidden');uName.innerText=nm;refreshGold();return true;}}
async function refreshGold(){if(!uid) return;try{let r=await fetch(GOLD_API+"?action=getGold&userId="+uid+"&t="+Date.now()).then(x=>x.json());if(r.ok) uGold.innerText="💰 "+(r.gold||0)+" Gold";}catch{}}
async function poll(){try{let res=await fetch(QUIZ_API+"?action=getState&t="+Date.now()).then(r=>r.json());let q=parseInt(res.currentQ||"-1"),started=res.started=="1";if(!started){lastQ=-99;vIdle.classList.remove('hidden');vQ.classList.add('hidden');vCount.classList.add('hidden');vNext.classList.add('hidden');return;}if(q!=lastQ&&q>=0){if(lastQ==-99){sound('start');bigToast("🚀 LIVE STARTED","5s পর 10 টি প্রশ্ন শুরু","info");vIdle.classList.add('hidden');vQ.classList.add('hidden');vNext.classList.add('hidden');vCount.classList.remove('hidden');let c=5;countNum.innerText=c;let iv=setInterval(()=>{c--;countNum.innerText=c;if(c<=0){clearInterval(iv);vCount.classList.add('hidden');curQ=q;showQ(q);}},1000);}else{vQ.classList.add('hidden');vNext.classList.remove('hidden');setTimeout(()=>{vNext.classList.add('hidden');curQ=q;showQ(q);},2000);}lastQ=q;}}catch{}}
function shuffleArr(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function showQ(idx,isLang){let D=lang=='bn'?DATA_BN:DATA_EN;let qo=D[idx];if(!qo) return;vIdle.classList.add('hidden');vCount.classList.add('hidden');vNext.classList.add('hidden');vQ.classList.remove('hidden');qNo.innerText=idx+1;qText.innerText=qo.q;goldMsg.classList.add('hidden');if(!isLang){let withI=qo.o.map((t,i)=>({t,i}));shuffled=shuffleArr(withI);correctIdx=shuffled.findIndex(o=>o.i==qo.a);}optBox.innerHTML="";locked=false;lockMsg.classList.add('hidden');shuffled.forEach((o,i)=>{let d=document.createElement('div');d.className="glass rounded-[16px] p-3.5 flex items-center gap-3 cursor-pointer active:scale-[0.97]";d.id="opt-"+i;d.innerHTML=`<span class="w-8 h-8 rounded-full bg-white text-black font-black flex items-center justify-center text-[11px]">${["A","B","C","D"][i]}</span><span class="font-bold text-[14px]">${o.t}</span>`;d.onclick=()=>pick(i);optBox.appendChild(d);});if(!isLang){let tl=4;timer.innerText=tl+"s";clearInterval(timer);timer=setInterval(()=>{tl--;timer.innerText=tl+"s";if(tl<=0){clearInterval(timer);locked=true;lockMsg.classList.remove('hidden');setTimeout(()=>reveal(),3000);}},1000);}}
function pick(i){
 if(locked) return;if(!checkAcc()){location.href='account.html';return;}sound('click');
 let key=`gold_${uid}_${curQ}`;if(localStorage.getItem(key)){bigToast(TXT[lang].already,"","info");return;}
 let el=document.getElementById('opt-'+i);if(el) el.style.outline="3px solid #facc15";locked=true;
 if(i==correctIdx){
  sound('correct');
  fetch(`${GOLD_API}?action=addEventGold&userId=${uid}&amount=10`).then(r=>r.json()).then(d=>{
   if(d.ok){
    bigToast(TXT[lang].correct,TXT[lang].goldAdd,"success");
    goldMsg.innerText=TXT[lang].goldAdd; goldMsg.classList.remove('hidden');
    localStorage.setItem(key,"done"); refreshGold();
   } else { bigToast("Gold API Error","Account API চেক করুন","error"); }
  });
 } else { sound('wrong'); bigToast(TXT[lang].wrong,"সঠিক উত্তর ৩ সেকেন্ড পর দেখাবে","error"); setTimeout(()=>reveal(),1000); }
}
function reveal(){shuffled.forEach((_,i)=>{let el=document.getElementById('opt-'+i);if(!el) return;if(i==correctIdx) el.style.background="#22c55e";else el.style.background="rgba(239,68,68,0.45)";});}
function verify(){if(codeIn.value.trim()===_sec){aPanel.classList.remove('hidden');vBtn.classList.add('hidden');}else bigToast("Wrong Code","","error");}
async function doAct(act){aStat.innerText="...";await fetch(QUIZ_API+"?action="+act+"&t="+Date.now());aStat.innerText=act.toUpperCase()+" DONE - "+new Date().toLocaleTimeString();bigToast(act.toUpperCase()+" DONE","","info");if(act=='reset') setTimeout(()=>location.reload(),800);}

adminBtn.onclick=()=>adminModal.classList.remove('hidden');
setLang(lang);checkAcc();setInterval(poll,1000);setInterval(refreshGold,3000);poll();
</script>
</body>
</html>
