<!DOCTYPE html>
<html lang="bn" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Event Story Live</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Hind Siliguri';-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html{translate:no} body{top:0!important;background:#0a0a0f;overflow:hidden;position:fixed;width:100%;height:100%;}
.glass{background:linear-gradient(135deg,rgba(255,255,255,0.18),rgba(255,255,255,0.06));backdrop-filter:blur(22px);border:1.5px solid rgba(255,255,255,0.22);}
#google_translate_element,.goog-te-banner-frame,.skiptranslate,#goog-gt-tt{display:none!important}
</style>
</head>
<body class="notranslate text-white">
<div class="fixed inset-0 -z-10 bg-gradient-to-br from-[#1a1033] via-[#0a0a0f] to-black"></div>

<div class="max-w-[480px] mx-auto h-[100dvh] flex flex-col p-3">
<!-- Header -->
<div class="flex justify-between items-center py-2">
  <button onclick="location.href='account.html'" class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center font-black">←</button>
  <div class="flex items-center gap-1.5">
    <div id="btnBN" onclick="setLang('bn')" class="px-3 py-1.5 rounded-full text-[11px] font-black bg-white text-black">BN</div>
    <div id="btnEN" onclick="setLang('en')" class="px-3 py-1.5 rounded-full text-[11px] font-black bg-white/15 text-white">EN</div>
  </div>
  <button id="adminTrigger" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">•••</button>
</div>

<!-- Live Badge -->
<div id="liveBadge" class="hidden mt-3 bg-red-500 rounded-full px-4 py-2 flex items-center justify-center gap-2">
  <span class="w-2 h-2 bg-white rounded-full animate-ping"></span>
  <span class="font-black text-[12px]" id="t_live">🔴 LIVE চলছে</span>
  <span id="liveEventId" class="bg-white text-red-500 text-[10px] font-black px-2 py-0.5 rounded-full"></span>
</div>

<div id="broadcastBar" class="hidden mt-3 bg-[#facc15] border-2 border-black rounded-[14px] px-3 py-2 flex items-center gap-2"><p id="broadcastText" class="flex-1 font-black text-[13px] text-black"></p></div>

<div class="glass rounded-full px-4 py-2 text-center font-black text-[12px] mt-3" id="t_title">🎬 ইভেন্ট স্টোরি লাইভ</div>

<!-- Events List -->
<div id="eventsList" class="mt-4 flex-1 overflow-y-auto space-y-3 pb-5">
  <div class="text-center py-10 opacity-60 font-bold" id="t_loading">লোড হচ্ছে...</div>
</div>
</div>

<!-- Admin Modal - CODE HIDDEN -->
<div id="adminModal" class="hidden fixed inset-0 z-[99] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
<div class="bg-white text-black rounded-[24px] p-5 w-full max-w-[360px]">
  <h2 class="font-black text-[18px]">🔐 Admin Access</h2>
  <p class="text-[11px] opacity-60 font-bold mt-1">Security verification required</p>
  <input id="adminCodeInput" type="password" placeholder="Enter security code" class="w-full mt-4 border-2 border-zinc-200 rounded-full px-4 py-3 font-black outline-none text-center tracking-[6px]">
  <div id="adminPanel" class="hidden mt-5 space-y-3">
    <input id="newEventTitleBN" placeholder="ইভেন্ট নাম (BN)" class="w-full border-2 rounded-full px-4 py-2.5 text-[13px] font-bold">
    <input id="newEventTitleEN" placeholder="Event Title (EN)" class="w-full border-2 rounded-full px-4 py-2.5 text-[13px] font-bold">
    <button onclick="createEvent()" class="w-full bg-black text-white font-black py-3 rounded-full text-[13px]">+ নতুন ইভেন্ট তৈরি</button>
    <div class="h-[1px] bg-zinc-200 my-2"></div>
    <p class="font-black text-[12px]">Live Control</p>
    <div class="flex gap-2">
      <input id="eventIdToLive" placeholder="Event ID" class="flex-1 border-2 rounded-full px-3 py-2 text-[12px] font-bold">
      <button onclick="startLive()" class="bg-green-600 text-white font-black px-5 py-2 rounded-full text-[12px]">START</button>
    </div>
    <button onclick="stopLive()" class="w-full bg-red-100 text-red-600 border font-black py-2.5 rounded-full text-[12px]">⏹️ STOP LIVE</button>
    <div class="flex gap-2">
      <input id="broadcastMsg" placeholder="Broadcast message" class="flex-1 border-2 rounded-full px-3 py-2 text-[12px]">
      <button onclick="sendBroadcast()" class="bg-[#facc15] font-black px-4 py-2 rounded-full text-[12px]">SEND</button>
    </div>
    <p id="adminStatus" class="text-[11px] font-bold text-center text-green-600"></p>
  </div>
  <button id="verifyBtn" onclick="verifyAdmin()" class="w-full mt-4 bg-black text-white font-black py-3 rounded-full">VERIFY</button>
  <button onclick="closeAdmin()" class="w-full mt-3 text-[12px] font-bold text-zinc-500">Close</button>
</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyms9tHrSbE04E7DZfwZ-vVS4gP9XWu0D_3EpmTTmZEYAez-ekb1tGnj-JFS4Ku1y8/exec";
// HIDDEN SECURITY CODE - কোথাও দেখা যাবে না
const _0xsec = "321123";

let curLang = localStorage.getItem('quiz_lang')||'bn';
let isAdmin = false;

const TXT = {
  bn:{title:"🎬 ইভেন্ট স্টোরি লাইভ", live:"🔴 LIVE চলছে", loading:"লোড হচ্ছে...", noEvent:"কোনো ইভেন্ট নেই", upcoming:"আসন্ন", liveSt:"লাইভ", ended:"শেষ"},
  en:{title:"🎬 EVENT STORY LIVE", live:"🔴 LIVE NOW", loading:"Loading...", noEvent:"No events", upcoming:"Upcoming", liveSt:"Live", ended:"Ended"}
};

function setLang(l){
  curLang=l; localStorage.setItem('quiz_lang',l);
  document.getElementById('btnBN').className = l=='bn'?"px-3 py-1.5 rounded-full text-[11px] font-black bg-white text-black":"px-3 py-1.5 rounded-full text-[11px] font-black bg-white/15 text-white";
  document.getElementById('btnEN').className = l=='en'?"px-3 py-1.5 rounded-full text-[11px] font-black bg-white text-black":"px-3 py-1.5 rounded-full text-[11px] font-black bg-white/15 text-white";
  document.getElementById('t_title').innerText = TXT[l].title;
  document.getElementById('t_live').innerText = TXT[l].live;
  document.getElementById('t_loading').innerText = TXT[l].loading;
  loadEvents();
}
setLang(curLang);

document.getElementById('adminTrigger').onclick=()=>{ document.getElementById('adminModal').classList.remove('hidden'); };

function closeAdmin(){ document.getElementById('adminModal').classList.add('hidden'); }

function verifyAdmin(){
  if(document.getElementById('adminCodeInput').value.trim()===_0xsec){
    isAdmin=true;
    document.getElementById('adminPanel').classList.remove('hidden');
    document.getElementById('verifyBtn').classList.add('hidden');
    document.getElementById('adminStatus').innerText="✅ Verified";
  }else{
    alert("Wrong code");
  }
}

async function pollLive(){
  try{
    let r = await fetch(API+"?action=getLive&t="+Date.now()).then(x=>x.json());
    if(r.started=="1"){
      document.getElementById('liveBadge').classList.remove('hidden');
      document.getElementById('liveEventId').innerText=r.currentEventId||"";
    }else{
      document.getElementById('liveBadge').classList.add('hidden');
    }
    if(r.broadcast && r.broadcast!=""){
      document.getElementById('broadcastBar').classList.remove('hidden');
      document.getElementById('broadcastText').innerText=r.broadcast;
    }else document.getElementById('broadcastBar').classList.add('hidden');
  }catch{}
}

async function loadEvents(){
  try{
    let list = await fetch(API+"?action=getEvents&t="+Date.now()).then(x=>x.json());
    let box = document.getElementById('eventsList');
    if(!list || list.length==0){ box.innerHTML=`<div class="text-center py-10 opacity-60 font-bold">${TXT[curLang].noEvent}</div>`; return; }
    box.innerHTML="";
    list.reverse().forEach(ev=>{
      let title = curLang=='bn'?ev.titleBN:ev.titleEN;
      let badge = ev.status=="live"?"bg-red-500":ev.status=="ended"?"bg-zinc-600":"bg-amber-400 text-black";
      let div = document.createElement('div');
      div.className="glass rounded-[20px] p-4";
      div.innerHTML=`<div class="flex justify-between items-start"><p class="font-black text-[15px] flex-1">${title}</p><span class="text-[9px] font-black px-2.5 py-1 rounded-full ${badge} text-white ml-2">${ev.status||'upcoming'}</span></div><div class="flex justify-between mt-2 text-[11px] opacity-70 font-bold"><span>ID: ${ev.id}</span><span>${ev.date?new Date(ev.date).toLocaleDateString():''}</span></div><div class="mt-2 text-[11px] font-black">💰 ${ev.gold||0} Gold</div>`;
      box.appendChild(div);
    });
  }catch(e){ document.getElementById('eventsList').innerHTML="<div class='text-center py-10'>Error loading</div>"; }
}

async function createEvent(){
  let bn=document.getElementById('newEventTitleBN').value.trim();
  let en=document.getElementById('newEventTitleEN').value.trim();
  if(!bn) return alert("Title needed");
  let id="EVT"+Date.now().toString().slice(-5);
  document.getElementById('adminStatus').innerText="Creating...";
  await fetch(API,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"createEvent", id:id, titleBN:bn, titleEN:en||bn})});
  document.getElementById('adminStatus').innerText="✅ Created "+id;
  loadEvents();
}

async function startLive(){
  let eid=document.getElementById('eventIdToLive').value.trim();
  if(!eid) return;
  await fetch(API+"?action=startEvent&eventId="+eid);
  document.getElementById('adminStatus').innerText="🔴 LIVE Started "+eid;
  pollLive();
}
async function stopLive(){
  await fetch(API+"?action=stopEvent");
  document.getElementById('adminStatus').innerText="⏹️ Stopped";
  pollLive();
}
async function sendBroadcast(){
  let msg=document.getElementById('broadcastMsg').value.trim();
  if(!msg) return;
  await fetch(API,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"broadcast", msg:msg})});
  document.getElementById('adminStatus').innerText="📢 Sent";
}

setInterval(pollLive,2000);
setInterval(loadEvents,5000);
pollLive(); loadEvents();
</script>
</body>
</html>
