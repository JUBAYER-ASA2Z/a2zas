function render(data){
 document.getElementById('list').innerHTML = data.map(i=>`
  <div class="bg-[#111] border border-zinc-800 rounded-[16px] p-4 flex justify-between items-center">
   <div class="flex-1">
    <p class="text-white font-bold text-[13px]">${i.nameBn}</p>
    <p class="text-zinc-400 text-[11px]">${i.nameEn}</p>
   </div>
   <div class="flex items-center gap-2">
    <a href="tel:${i.num}" class="bg-white text-black font-black px-4 py-2 rounded-full text-[13px]">${i.num}</a>
    <a href="tel:${i.num}" class="w-9 h-9 bg-green-500 rounded-full flex items-center justify-center">📞</a>
   </div>
  </div>`).join('');
}
function showTab(t){
 current=t;
 document.getElementById('btn1').className = t=='emergency'? 'bg-yellow-400 text-black font-black py-3 rounded-[12px] text-[13px]' : 'bg-[#111] border border-zinc-800 text-white font-bold py-3 rounded-[12px] text-[13px]';

 render(t=='emergency'? emergency : banks);
}
function doSearch(){
 let q=document.getElementById('search').value.toLowerCase();
 let all = current=='emergency'? emergency : banks;
 let f = all.filter(i=> i.nameBn.toLowerCase().includes(q) || i.nameEn.toLowerCase().includes(q) || i.num.includes(q));
 render(f);
}
