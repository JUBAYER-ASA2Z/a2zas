function render(list){
 document.getElementById('uktiList').innerHTML = list.map((t,i)=>`
  <div class="bg-[#0f0f0f] border border-zinc-800 rounded-[18px] p-4 flex justify-between gap-3">
   <div class="flex gap-3 flex-1">
    <div class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center font-black text-[13px] shrink-0">${i+1}</div>
    <p class="text-[#e5e5e5] text-[14px] leading-[22px]">${t}</p>
   </div>
   <div class="flex flex-col gap-2 shrink-0">
    <button onclick="copyUkti(\`${t.replace(/`/g,'')}\`)" class="w-9 h-9 rounded-full bg-[#1a1a1a] border border-zinc-700 flex items-center justify-center text-[13px]">📋</button>
    <button onclick="shareUkti(\`${t.replace(/`/g,'')}\`)" class="w-9 h-9 rounded-full bg-[#25D366] flex items-center justify-center text-[13px]">📤</button>
   </div>
  </div>`).join('');
}
function copyUkti(t){ navigator.clipboard.writeText(t); alert('কপি হয়েছে ✓'); }
function shareUkti(t){
 if(navigator.share){ navigator.share({text:t, title:'উক্তি'}); }
 else { window.open(`https://wa.me/?text=${encodeURIComponent(t)}`,'_blank'); }
}
