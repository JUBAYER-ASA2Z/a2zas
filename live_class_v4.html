
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Live Class - A-S A2Z</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{font-family:'Hind Siliguri';-webkit-tap-highlight-color:transparent;user-select:none;box-sizing:border-box}
body{margin:0;background:#0f172a;overflow:hidden;height:100dvh}
button,label{pointer-events:auto !important;touch-action:manipulation !important;cursor:pointer}
#boardWrap{position:absolute;inset:56px 0 76px 0;display:flex;align-items:center;justify-content:center;background:#0f172a;padding:6px;overflow:hidden}
#board{position:relative;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px #334155;height:100%;aspect-ratio:4 / 5;max-width:100%;flex-shrink:0}
#boardImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.finger{position:absolute;width:52px;height:68px;display:flex;flex-direction:column;align-items:center;z-index:50;touch-action:none;will-change:left,top;transform:translate(-50%,-50%)}
.finger .emoji{font-size:42px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6))}
.finger .label{margin-top:2px;background:#000;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1.5px solid #fff}
.finger.mine .emoji{filter:drop-shadow(0 0 12px rgba(34,197,94,0.9)) drop-shadow(0 4px 8px rgba(0,0,0,0.6))}
.finger.mine .label{background:#22c55e}
.finger.locked{pointer-events:none !important}
#alertBox{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,rgba(15,23,42,0.85),rgba(30,27,75,0.9));backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
#alertBox.show{display:flex}
#alertCard{background:#fff;border-radius:28px;padding:24px 20px;width:100%;max-width:320px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.4)}
#alertIcon{font-size:48px}
#alertMsg{font-weight:900;font-size:16px;color:#0f172a;margin:10px 0 16px;line-height:1.4}
#alertBtn{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;width:100%;padding:12px;border-radius:999px;font-weight:900;font-size:14px;border:none}
</style>
</head>
<body>

<div id="alertBox" onclick="hideAlert()">
  <div id="alertCard" onclick="event.stopPropagation()">
    <div id="alertIcon">🔔</div>
    <div id="alertMsg">---</div>
    <button id="alertBtn" onclick="hideAlert()">ঠিক আছে</button>
  </div>
</div>

<div class="absolute top-0 left-0 right-0 z-[100] bg-black/60 backdrop-blur px-3 py-2 flex items-center gap-2">
  <button onclick="leaveAndBack()" class="w-9 h-9 bg-white text-black rounded-full font-black shrink-0">←</button>
  <div class="flex-1 min-w-0">
    <p class="text-white font-black text-[13px] leading-none" data-t="liveClass">📚 Live Class</p>
    <p class="text-white/60 text-[10px] font-bold mt-0.5"><span data-t="room">Room</span>: <span id="roomLabel">---</span> • <span class="text-emerald-400">● Live</span></p>
  </div>
  <button onclick="toggleLang()" id="langBtn" class="w-11 h-9 bg-white text-black rounded-full text-[11px] font-black shrink-0">EN</button>
  <label class="bg-emerald-500 text-white text-[11px] font-black px-3 py-2 rounded-full cursor-pointer shrink-0"><span data-t="photo">📸 ছবি</span><input type="file" id="imgInput" accept="image/*" class="hidden"></label>
  <button onclick="deleteImage()" class="bg-red-500 text-white text-[11px] font-black px-3 py-2 rounded-full shrink-0"><span data-t="delete">🗑️ মুছুন</span></button>
</div>

<div id="joinBox" class="absolute inset-0 z-[200] bg-slate-900/95 flex items-center justify-center p-6">
  <div class="bg-white rounded-[24px] p-6 w-full max-w-[340px] text-center">
    <p class="text-[48px]">👆👆</p>
    <p class="font-black text-[20px] mt-2" data-t="joinTitle">Live Class</p>
    <input id="roomInput" placeholder="রুম কোড" class="w-full mt-4 border-2 border-slate-200 rounded-full px-4 py-3 text-center font-black text-[16px] outline-none" inputmode="numeric">
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button onclick="joinAs('teacher')" class="bg-blue-600 text-white py-4 rounded-full font-black text-[14px] active:scale-95" data-t="teacherBtn">👆 টিচার</button>
      <button onclick="joinAs('student')" class="bg-emerald-600 text-white py-4 rounded-full font-black text-[14px] active:scale-95" data-t="studentBtn">👆 স্টুডেন্ট</button>
    </div>
    <button onclick="createRoom()" class="w-full mt-2 bg-slate-900 text-white py-4 rounded-full font-black text-[13px] active:scale-95" data-t="createRoom">+ নতুন রুম বানান</button>
    <p class="text-[11px] text-slate-500 mt-4 font-black">Developer JUBAYER A S</p>
  </div>
</div>

<div id="pinModal" class="hidden fixed inset-0 z-[300] bg-slate-900/80 backdrop-blur flex items-center justify-center p-6">
  <div class="bg-white rounded-[24px] p-6 w-full max-w-[300px] text-center">
    <p class="text-[40px]">🔐</p>
    <p class="font-black text-[17px] mt-2" data-t="pinTitle">টিচার কোড দিন</p>
    <p class="text-slate-500 text-[11px] font-bold mt-1" data-t="pinDesc">টিচার ছাড়া কেউ এই কোড জানে না</p>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="•••" class="w-full mt-4 border-2 border-blue-200 rounded-full px-4 py-3 text-center font-black text-[20px] outline-none tracking-[8px]">
    <button onclick="checkTeacherPin()" class="w-full mt-3 bg-blue-600 text-white py-3 rounded-full font-black text-[13px]" data-t="enter">প্রবেশ করুন</button>
    <button onclick="closePin()" class="w-full mt-2 bg-slate-100 text-slate-600 py-3 rounded-full font-black text-[12px]" data-t="cancel">বাতিল</button>
  </div>
</div>

<div id="boardWrap">
  <div id="board">
    <p id="noImgText" class="absolute inset-0 flex items-center justify-center text-white/40 font-black text-[14px] text-center px-6" data-t="uploadText">📸 উপরে ছবি আপলোড করুন</p>
    <img id="boardImg" class="hidden">
    <div id="teacherFinger" class="finger locked" style="left:20%;top:30%;"><span class="emoji">👆</span><span class="label" data-t="teacherLabel">টিচার</span></div>
    <div id="studentFinger" class="finger locked" style="left:70%;top:30%;"><span class="emoji">👆</span><span class="label" data-t="studentLabel">স্টুডেন্ট</span></div>
  </div>
</div>

<div class="absolute bottom-0 left-0 right-0 z-[100] bg-black/80 backdrop-blur px-4 py-3 flex items-center justify-between gap-3">
  <div class="flex items-center gap-2 min-w-0">
    <span id="myRoleBadge" class="bg-white/20 text-white text-[11px] font-black px-3 py-1.5 rounded-full shrink-0">---</span>
    <span id="voiceStatus" class="text-white/70 text-[11px] font-bold" data-t="micOff">🎤 কথা বন্ধ</span>
  </div>
  <div class="flex gap-2 shrink-0">
    <button id="speakerBtn" onclick="toggleSpeaker()" class="w-12 h-12 bg-white rounded-full text-[22px] flex items-center justify-center shadow">🔊</button>
    <button id="micBtn" onclick="toggleMic()" class="w-12 h-12 bg-red-500 text-white rounded-full text-[22px] flex items-center justify-center shadow">🔇</button>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>

<script>
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNxqVW6RX0eH9e9JCTVNvF2hLBfgRZy972_gavzXE2axmSADefYV04gqWh0sFxpIoBgA/exec";
var TEACHER_PIN = "123";
var lang = localStorage.getItem('live_lang') || 'bn';
var T = {
bn:{liveClass:'📚 Live Class',room:'Room',photo:'📸 ছবি',delete:'🗑️ মুছুন',joinTitle:'Live Class',teacherBtn:'👆 টিচার',studentBtn:'👆 স্টুডেন্ট',createRoom:'+ নতুন রুম বানান',pinTitle:'টিচার কোড দিন',pinDesc:'টিচার ছাড়া কেউ এই কোড জানে না',enter:'প্রবেশ করুন',cancel:'বাতিল',uploadText:'📸 উপরে ছবি আপলোড করুন',teacherLabel:'টিচার',studentLabel:'স্টুডেন্ট',micOff:'🎤 কথা বন্ধ',micOn:'🎤 আপনার কথা সবাই শুনছে',speakerOn:'🔊 অপর প্রান্তের কথা শুনছেন',speakerOff:'🔇 স্পিকার বন্ধ',roomPlaceholder:'রুম কোড',alertRoom:'রুম কোড দিন',alertWrongPin:'ভুল কোড! টিচার কোড সঠিক নয়',alertWrongRoom:'ভুল রুম কোড! সঠিক কোড দিন',alertCheck:'রুম চেক করা যাচ্ছে না, আবার চেষ্টা করুন',alertMic:'Mic Permission Allow করেন',alertRoomCode:'আপনার রুম কোড: ',badgeTeacher:'👆 টিচার',badgeStudent:'👆 স্টুডেন্ট'},
en:{liveClass:'📚 Live Class',room:'Room',photo:'📸 Photo',delete:'🗑️ Delete',joinTitle:'Live Class',teacherBtn:'👆 Teacher',studentBtn:'👆 Student',createRoom:'+ Create New Room',pinTitle:'Enter Teacher Code',pinDesc:'Only teacher knows this code',enter:'Enter',cancel:'Cancel',uploadText:'📸 Upload photo from top',teacherLabel:'Teacher',studentLabel:'Student',micOff:'🎤 Muted',micOn:'🎤 Everyone can hear you',speakerOn:'🔊 You can hear them',speakerOff:'🔇 Speaker Off',roomPlaceholder:'Room Code',alertRoom:'Enter Room Code',alertWrongPin:'Wrong Code! Teacher code is not correct',alertWrongRoom:'Wrong Room Code! Enter correct code',alertCheck:'Cannot check room, try again',alertMic:'Please Allow Mic Permission',alertRoomCode:'Your Room Code: ',badgeTeacher:'👆 Teacher',badgeStudent:'👆 Student'}
};
function showAlert(msg,icon){ document.getElementById('alertMsg').innerText=msg; document.getElementById('alertIcon').innerText=icon||'🔔'; document.getElementById('alertBox').classList.add('show'); document.getElementById('alertBtn').innerText=lang==='bn'?'ঠিক আছে':'OK'; }
function hideAlert(){ document.getElementById('alertBox').classList.remove('show'); }
function applyLang(){
  document.querySelectorAll('[data-t]').forEach(function(el){ var k=el.getAttribute('data-t'); if(T[lang][k]) el.innerText=T[lang][k]; });
  document.getElementById('roomInput').placeholder=T[lang].roomPlaceholder;
  document.getElementById('langBtn').innerText=lang==='bn'?'EN':'BN';
  if(myRole){ document.getElementById('myRoleBadge').innerText=myRole==='teacher'?T[lang].badgeTeacher:T[lang].badgeStudent; document.getElementById('voiceStatus').innerText=micOn?T[lang].micOn:T[lang].micOff; }
}
function toggleLang(){ lang=lang==='bn'?'en':'bn'; localStorage.setItem('live_lang',lang); applyLang(); }
var myRole='',roomId='',myPeer=null,myStream=null,speakerOn=true,micOn=false;
var myId='U'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
var lastImg='',pollTimer=null,calledPeers={};
var dataConns={};
var pendingRole='';
var fingerTarget={teacher:{x:20,y:30},student:{x:70,y:30}};
var fingerCurrent={teacher:{x:20,y:30},student:{x:70,y:30}};
function unlockAudio(){
  var a=document.getElementById('remoteAudio');
  a.muted=false; a.volume=1;
  var p=a.play(); if(p) p.catch(function(){});
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ if(!window.myAC) window.myAC=new AC(); if(window.myAC.state==='suspended') window.myAC.resume(); } }catch(e){}
}
document.addEventListener('click',unlockAudio);
document.addEventListener('touchstart',unlockAudio);
function releaseMic(){
  micOn=false;
  var b=document.getElementById('micBtn'); if(b){ b.style.background='#ef4444'; b.innerText='🔇'; }
  if(myStream){ try{ myStream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} }); }catch(e){} myStream=null; }
  var a=document.getElementById('remoteAudio'); if(a){ a.srcObject=null; }
  if(myPeer){ try{ myPeer.destroy(); }catch(e){} myPeer=null; }
  Object.values(dataConns).forEach(function(c){ try{ c.close(); }catch(e){} }); dataConns={};
  if(pollTimer) clearInterval(pollTimer);
}
function smoothLoop(){
  ['teacher','student'].forEach(function(k){
    var cur=fingerCurrent[k], tgt=fingerTarget[k];
    cur.x += (tgt.x - cur.x) * 0.35;
    cur.y += (tgt.y - cur.y) * 0.35;
    if(Math.abs(tgt.x-cur.x)<0.1) cur.x=tgt.x;
    if(Math.abs(tgt.y-cur.y)<0.1) cur.y=tgt.y;
    var el=document.getElementById(k==='teacher'?'teacherFinger':'studentFinger');
    if(el){ el.style.left=cur.x+'%'; el.style.top=cur.y+'%'; }
  });
  requestAnimationFrame(smoothLoop);
}
smoothLoop();
function setFinger(key,x,y){
  fingerTarget[key]={x:x,y:y};
  var myKey=myRole==='teacher'?'teacher':'student';
  if(key===myKey) fingerCurrent[key]={x:x,y:y};
}
function createRoom(){ var code=Math.floor(1000+Math.random()*9000).toString(); document.getElementById('roomInput').value=code; sendToSheet({room:code,type:'createRoom'}); sendToSheet({room:code,type:'clearAll'}); showAlert(T[lang].alertRoomCode+code,'🎉'); }
function joinAs(role){
  unlockAudio();
  roomId=document.getElementById('roomInput').value.trim();
  if(!roomId){ showAlert(T[lang].alertRoom,'⚠️'); return; }
  if(role==='teacher'){ pendingRole='teacher'; document.getElementById('pinInput').value=''; document.getElementById('pinModal').classList.remove('hidden'); setTimeout(function(){ document.getElementById('pinInput').focus(); },100); return; }
  enterRoom('student');
}
function closePin(){ document.getElementById('pinModal').classList.add('hidden'); pendingRole=''; }
function checkTeacherPin(){
  unlockAudio();
  var pin=document.getElementById('pinInput').value.trim();
  if(pin!==TEACHER_PIN){ showAlert(T[lang].alertWrongPin,'❌'); document.getElementById('pinInput').value=''; return; }
  document.getElementById('pinModal').classList.add('hidden'); enterRoom('teacher');
}
function enterRoom(role){
  if(role==='teacher'){ sendToSheet({room:roomId,type:'createRoom'}); sendToSheet({room:roomId,type:'clearAll'}); sendToSheet({room:roomId,type:'createRoom'}); }
  fetch(APPS_SCRIPT_URL+"?action=checkRoom&room="+roomId+"&t="+Date.now())
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data.exists){ showAlert(T[lang].alertWrongRoom,'❌'); return; }
    myRole=role; document.getElementById('joinBox').style.display='none'; document.getElementById('roomLabel').innerText=roomId;
    document.getElementById('myRoleBadge').innerText=role==='teacher'?T[lang].badgeTeacher:T[lang].badgeStudent;
    var t=document.getElementById('teacherFinger'), s=document.getElementById('studentFinger');
    if(role==='teacher'){ t.classList.remove('locked'); t.classList.add('mine'); t.style.pointerEvents='auto'; s.classList.remove('mine'); s.classList.add('locked'); s.style.pointerEvents='none'; makeDraggable(t,'teacher'); }
    else{ s.classList.remove('locked'); s.classList.add('mine'); s.style.pointerEvents='auto'; t.classList.remove('mine'); t.classList.add('locked'); t.style.pointerEvents='none'; makeDraggable(s,'student'); }
    startPolling(); initVoice();
  }).catch(function(){ showAlert(T[lang].alertCheck,'⚠️'); });
}
function sendToSheet(p){ try{ fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(p)}); }catch(e){} }
function sendFingerFast(key,x,y){
  var hasPeer=Object.keys(dataConns).length>0;
  if(hasPeer){
    var msg=key==='teacher'?('t:'+Math.round(x*10)+','+Math.round(y*10)):('s:'+Math.round(x*10)+','+Math.round(y*10));
    Object.values(dataConns).forEach(function(c){ try{ if(c.open) c.send(msg); }catch(e){} });
  } else {
    sendToSheet({room:roomId,type:'pointer',key:key,x:x,y:y,sender:myId});
  }
}
function onFingerData(d){
  if(typeof d!=='string') return;
  var isT=d.charAt(0)==='t'; var parts=d.slice(2).split(','); var x=parseFloat(parts[0])/10, y=parseFloat(parts[1])/10;
  if(isNaN(x)||isNaN(y)) return;
  setFinger(isT?'teacher':'student',x,y);
}
function setupDataConn(conn){
  dataConns[conn.peer]=conn;
  conn.on('data',function(d){ onFingerData(d); });
  conn.on('close',function(){ delete dataConns[conn.peer]; });
}
function poll(){
  if(!roomId) return;
  fetch(APPS_SCRIPT_URL+"?action=getState&room="+roomId+"&t="+Date.now())
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(Object.keys(dataConns).length===0 && data.pointer){
      if(data.pointer.teacher && data.pointer.teacher.sender!==myId) setFinger('teacher',data.pointer.teacher.x,data.pointer.teacher.y);
      if(data.pointer.student && data.pointer.student.sender!==myId) setFinger('student',data.pointer.student.x,data.pointer.student.y);
    }
    if(data.image && data.image.data){ if(data.image.data!==lastImg){ lastImg=data.image.data; showImage(data.image.data); } }
    else{ if(lastImg!==''){ lastImg=''; hideImage(); } }
    if(data.peers && myStream){
      Object.values(data.peers).forEach(function(p){
        if(!myPeer || p.peerId===myPeer.id) return;
        if(!calledPeers[p.peerId]){
          calledPeers[p.peerId]=true;
          try{ var conn=myPeer.connect(p.peerId); setupDataConn(conn); }catch(e){}
          try{ var call=myPeer.call(p.peerId,myStream); call.on('stream',function(rs){ playRemote(rs); }); }catch(e){}
        }
      });
    }
  }).catch(function(){});
}
function startPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=setInterval(poll,500); }
function playRemote(rs){ var a=document.getElementById('remoteAudio'); a.srcObject=rs; a.muted=!speakerOn; a.volume=1; unlockAudio(); a.play().catch(function(){ document.addEventListener('click',function(){ a.play(); },{once:true}); }); }
function makeDraggable(el,key){
  var dragging=false,sx=0,sy=0,ox=0,oy=0,lastSend=0,pending=null;
  el.addEventListener('pointerdown',function(e){
    if((myRole==='teacher'&&key!=='teacher')||(myRole==='student'&&key!=='student')) return;
    dragging=true; try{ el.setPointerCapture(e.pointerId); }catch(err){}
    var b=document.getElementById('board').getBoundingClientRect(); sx=e.clientX; sy=e.clientY; var r=el.getBoundingClientRect(); ox=((r.left+26-b.left)/b.width)*100; oy=((r.top+34-b.top)/b.height)*100;
  });
  el.addEventListener('pointermove',function(e){
    if(!dragging) return; if((myRole==='teacher'&&key!=='teacher')||(myRole==='student'&&key!=='student')) return;
    var b=document.getElementById('board').getBoundingClientRect();
    var px=Math.max(2,Math.min(98,ox+((e.clientX-sx)/b.width)*100));
    var py=Math.max(5,Math.min(95,oy+((e.clientY-sy)/b.height)*100));
    setFinger(key,px,py); pending={x:px,y:py};
    var now=Date.now(); if(now-lastSend>30){ lastSend=now; if(pending) sendFingerFast(key,pending.x,pending.y); }
  });
  var end=function(){ if(!dragging) return; dragging=false; if(pending) sendFingerFast(key,pending.x,pending.y); };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
}
document.getElementById('imgInput').addEventListener('change',function(e){
  var file=e.target.files[0]; if(!file) return; var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var targetW=640, targetH=800;
      var c=document.createElement('canvas'); c.width=targetW; c.height=targetH;
      var ctx=c.getContext('2d'); ctx.fillStyle='#000'; ctx.fillRect(0,0,targetW,targetH);
      var scale=Math.max(targetW/img.width, targetH/img.height);
      var w=img.width*scale, h=img.height*scale;
      ctx.drawImage(img,(targetW-w)/2,(targetH-h)/2,w,h);
      var d=c.toDataURL('image/jpeg',0.45);
      showImage(d);
      sendToSheet({room:roomId,type:'image',data:d});
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});
function showImage(d){ var img=document.getElementById('boardImg'); img.src=d; img.classList.remove('hidden'); document.getElementById('noImgText').style.display='none'; }
function hideImage(){ document.getElementById('boardImg').classList.add('hidden'); document.getElementById('noImgText').style.display='flex'; }
function deleteImage(){ lastImg=''; hideImage(); sendToSheet({room:roomId,type:'clearImage'}); }
function initVoice(){
  myPeer=new Peer('a2z-'+roomId+'-'+myRole+'-'+myId,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}});
  myPeer.on('open',function(){
    sendToSheet({room:roomId,type:'peer',peerId:myPeer.id,role:myRole});
    getClearAudio().then(function(st){
      myStream=st;
      myStream.getAudioTracks().forEach(function(t){ t.enabled=false; });
    }).catch(function(){ showAlert(T[lang].alertMic,'🎤'); });
  });
  myPeer.on('connection',function(conn){ setupDataConn(conn); });
  myPeer.on('call',function(call){
    if(myStream){ call.answer(myStream); }
    else{ getClearAudio().then(function(st){ myStream=st; myStream.getAudioTracks().forEach(function(t){ t.enabled=micOn; }); call.answer(myStream); }).catch(function(){ call.answer(); }); }
    call.on('stream',function(rs){ playRemote(rs); });
  });
}
function getClearAudio(){ return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,sampleRate:16000},video:false}); }
function toggleSpeaker(){
  speakerOn=!speakerOn;
  document.getElementById('speakerBtn').innerText=speakerOn?'🔊':'🔇';
  var a=document.getElementById('remoteAudio'); a.muted=!speakerOn; a.volume=1;
  document.getElementById('voiceStatus').innerText=speakerOn?T[lang].speakerOn:T[lang].speakerOff;
  if(speakerOn){ unlockAudio(); a.play().catch(function(){}); }
}
function toggleMic(){
  unlockAudio();
  micOn=!micOn;
  document.getElementById('micBtn').style.background=micOn?'#22c55e':'#ef4444'; document.getElementById('micBtn').innerText=micOn?'🎤':'🔇'; document.getElementById('voiceStatus').innerText=micOn?T[lang].micOn:T[lang].micOff;
  if(myStream){
    myStream.getAudioTracks().forEach(function(t){ t.enabled=micOn; });
  } else if(micOn){
    getClearAudio().then(function(st){
      myStream=st; myStream.getAudioTracks().forEach(function(t){ t.enabled=true; });
      calledPeers={}; sendToSheet({room:roomId,type:'peer',peerId:myPeer.id,role:myRole});
    }).catch(function(){ showAlert(T[lang].alertMic,'🎤'); micOn=false; document.getElementById('micBtn').style.background='#ef4444'; });
  }
}
function leaveAndBack(){
  if(roomId){ try{ sendToSheet({room:roomId,type:'leave',peerId:myPeer?myPeer.id:myId}); sendToSheet({room:roomId,type:'clearAll'}); }catch(e){} }
  releaseMic();
  lastImg=''; location.href='./digital_home.html?v='+Date.now();
}
window.addEventListener('pagehide',function(){ releaseMic(); if(roomId){ try{ navigator.sendBeacon(APPS_SCRIPT_URL,JSON.stringify({room:roomId,type:'clearAll'})); }catch(e){} } });
window.addEventListener('beforeunload',function(){ releaseMic(); });
applyLang();
</script>
