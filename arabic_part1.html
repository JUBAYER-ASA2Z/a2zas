<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arabic Pure Voice - No Beep</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Hind Siliguri'; -webkit-tap-highlight-color:transparent;}
.gorilla{background:linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 100%); backdrop-filter:blur(20px); border:1.2px solid rgba(255,255,255,0.2);}
.arabic{font-family:'Amiri', serif;}
.letter-card.active{background:#10b981!important; transform:scale(1.08); box-shadow:0 0 20px #10b981;}
</style>
</head>
<body class="bg-black text-white">
<div class="max-w-[480px] mx-auto min-h-screen p-3">
  <div class="flex justify-between items-center">
    <button onclick="location.href='./digital_home.html'" class="w-10 h-10 rounded-full bg-white/15">←</button>
    <div class="gorilla rounded-full px-4 py-2 text-[11px] font-black">📖 খাঁটি আরবি - No Beep</div>
    <div class="w-10 h-10"></div>
  </div>

  <div class="mt-3 gorilla rounded-[22px] p-5 text-center">
    <h1 id="bigArabic" class="arabic text-[60px]">ا</h1>
    <p id="bigArabicName" class="arabic text-[26px] text-emerald-300">أَلِفْ</p>
    <p id="bigName" class="font-black text-[13px]">আলিফ</p>
  </div>

  <div id="horofGrid" class="grid grid-cols-4 gap-2 mt-4"></div>
</div>

<!-- Real Human Voice Player -->
<audio id="realAudio" preload="auto" playsinline></audio>

<script>
const HOROFS=[
{a:"ا", bn:"আলিফ", ar:"ألف"},
{a:"ب", bn:"বা", ar:"باء"},
{a:"ت", bn:"তা", ar:"تاء"},
{a:"ث", bn:"ছা", ar:"ثاء"},
{a:"ج", bn:"জীম", ar:"جيم"},
{a:"ح", bn:"হা", ar:"حاء"},
{a:"خ", bn:"খা", ar:"خاء"},
{a:"د", bn:"দাল", ar:"دال"},
{a:"ذ", bn:"যাল", ar:"ذال"},
{a:"ر", bn:"রা", ar:"راء"},
{a:"ز", bn:"যা", ar:"زاي"},
{a:"س", bn:"সীন", ar:"سين"},
{a:"ش", bn:"শীন", ar:"شين"},
{a:"ص", bn:"সোয়াদ", ar:"صاد"},
{a:"ض", bn:"দোয়াদ", ar:"ضاد"},
{a:"ط", bn:"ত্বা", ar:"طاء"},
{a:"ظ", bn:"য্বা", ar:"ظاء"},
{a:"ع", bn:"আইন", ar:"عين"},
{a:"غ", bn:"গাইন", ar:"غين"},
{a:"ف", bn:"ফা", ar:"فاء"},
{a:"ق", bn:"ক্বফ", ar:"قاف"},
{a:"ك", bn:"কাফ", ar:"كاف"},
{a:"ل", bn:"লাম", ar:"لام"},
{a:"م", bn:"মীম", ar:"ميم"},
{a:"ن", bn:"নূন", ar:"نون"},
{a:"و", bn:"ওয়াও", ar:"واو"},
{a:"ه", bn:"হা", ar:"هاء"},
{a:"ء", bn:"হামজা", ar:"همزة"},
{a:"ي", bn:"ইয়া", ar:"ياء"},
];

let audioPlayer = document.getElementById('realAudio');

// ১০০% Real Human Voice - Google এর আরবি মানুষের কণ্ঠ
function playArabicPure(arText){
  // কোনো Beep নাই, সরাসরি মানুষের ভয়েস
  let url = "https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=" + encodeURIComponent(arText);
  audioPlayer.src = url;
  audioPlayer.play().catch(()=>{
    // যদি Google ব্লক করে, তাহলে ফোনের নিজের আরবি TTS দিয়ে বলবে (তাও মানুষের মতো)
    let utter = new SpeechSynthesisUtterance(arText);
    utter.lang = 'ar-SA';
    utter.rate = 0.7;
    utter.volume = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  });
}

function render(){
  document.getElementById('horofGrid').innerHTML=HOROFS.map((h,i)=>`
    <div onclick="selectHaraf(${i})" id="card-${i}" class="letter-card gorilla bg-white rounded-[16px] p-2 text-center cursor-pointer">
      <p class="arabic text-[32px] text-black font-bold leading-[32px]">${h.a}</p>
      <p class="text-[9px] font-black text-black/60">${h.bn}</p>
    </div>
  `).join('');
}

function selectHaraf(i){
  let h=HOROFS[i];
  document.querySelectorAll('.letter-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('card-'+i).classList.add('active');
  document.getElementById('bigArabic').innerText=h.a;
  document.getElementById('bigArabicName').innerText=h.ar;
  document.getElementById('bigName').innerText=h.bn;

  playArabicPure(h.ar);
  if(navigator.vibrate) navigator.vibrate(20);
}

render();

// APK তে প্রথম টাচে Audio Unlock - এটা জরুরি
document.body.addEventListener('touchstart', function unlock(){
  audioPlayer.play().then(()=>{ audioPlayer.pause(); }).catch(()=>{});
  let u = new SpeechSynthesisUtterance('');
  speechSynthesis.speak(u);
}, {once:true});

</script>
</body>
</html>
