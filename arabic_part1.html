<!DOCTYPE html>
<html lang="ar" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arabic Real Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Hind Siliguri'; user-select:none; -webkit-tap-highlight-color:transparent; box-sizing:border-box;}
body{background:#050a06; margin:0;}
.gorilla{background:linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 100%); backdrop-filter:blur(20px); border:1.2px solid rgba(255,255,255,0.2);}
.arabic{font-family:'Amiri', serif;}
.letter-card.active{background:#10b981!important; transform:scale(1.08); box-shadow:0 0 20px #10b981;}
.letter-card.active p{color:white!important;}
</style>
</head>
<body class="text-white">
<div class="fixed inset-0 -z-10 bg-gradient-to-b from-emerald-900 via-black to-black"></div>
<div class="max-w-[480px] mx-auto min-h-screen flex flex-col p-3 pb-10">
  <div class="flex justify-between items-center">
    <button onclick="location.href='./digital_home.html'" class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center font-black">←</button>
    <div class="gorilla rounded-full px-5 py-2 font-black text-[11px]">📖 আরবি হরফ - খাঁটি আরবি</div>
    <button onclick="toggleMute()" id="muteBtn" class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center">🔊</button>
  </div>

  <div class="mt-3 gorilla rounded-[26px] p-5 text-center border border-emerald-400/30">
    <div class="w-[90px] h-[90px] mx-auto rounded-full bg-white flex items-center justify-center border-4 border-emerald-400">
      <h1 id="bigArabic" class="arabic text-[52px] text-black font-bold">ا</h1>
    </div>
    <p id="bigArabicName" class="arabic font-black text-[24px] mt-2 text-emerald-300">أَلِفْ</p>
    <p id="bigName" class="font-black text-[14px]">আলিফ</p>
    <p id="soundStatus" class="text-[10px] text-white/50 mt-1">👇 হরফে ক্লিক করুন</p>
  </div>

  <div id="horofGrid" class="grid grid-cols-4 gap-3 mt-4"></div>
</div>

<script>
let isMuted=false;
// খাঁটি আরবি নাম - এটাই বলবে
const HOROFS=[
{a:"ا", bn:"আলিফ", ar:"أَلِفْ"},
{a:"ب", bn:"বা", ar:"بَاءْ"},
{a:"ت", bn:"তা", ar:"تَاءْ"},
{a:"ث", bn:"ছা", ar:"ثَاءْ"},
{a:"ج", bn:"জীম", ar:"جِيمْ"},
{a:"ح", bn:"হা", ar:"حَاءْ"},
{a:"خ", bn:"খা", ar:"خَاءْ"},
{a:"د", bn:"দাল", ar:"دَالْ"},
{a:"ذ", bn:"যাল", ar:"ذَالْ"},
{a:"ر", bn:"রা", ar:"رَاءْ"},
{a:"ز", bn:"যা", ar:"زَايْ"},
{a:"س", bn:"সীন", ar:"سِينْ"},
{a:"ش", bn:"শীন", ar:"شِينْ"},
{a:"ص", bn:"সোয়াদ", ar:"صَادْ"},
{a:"ض", bn:"দোয়াদ", ar:"ضَادْ"},
{a:"ط", bn:"ত্বা", ar:"طَاءْ"},
{a:"ظ", bn:"য্বা", ar:"ظَاءْ"},
{a:"ع", bn:"আইন", ar:"عَيْنْ"},
{a:"غ", bn:"গাইন", ar:"غَيْنْ"},
{a:"ف", bn:"ফা", ar:"فَاءْ"},
{a:"ق", bn:"ক্বফ", ar:"قَافْ"},
{a:"ك", bn:"কাফ", ar:"كَافْ"},
{a:"ل", bn:"লাম", ar:"لَامْ"},
{a:"م", bn:"মীম", ar:"مِيمْ"},
{a:"ن", bn:"নূন", ar:"نُونْ"},
{a:"و", bn:"ওয়াও", ar:"وَاوْ"},
{a:"ه", bn:"হা", ar:"هَاءْ"},
{a:"ء", bn:"হামজা", ar:"هَمْزَةْ"},
{a:"ي", bn:"ইয়া", ar:"يَاءْ"},
];

function playArabic(arText, bnText){
  if(isMuted) return;
  try{
    window.speechSynthesis.cancel();
    let utter = new SpeechSynthesisUtterance(arText);
    utter.lang = 'ar-SA'; // খাঁটি আরবি
    utter.rate = 0.6; // একটু ধীরে, স্পষ্ট
    utter.pitch = 1.0;
    utter.volume = 1;

    // আরবি ভয়েস খুঁজে বের করা - থাকলে সেটা ব্যবহার করবে
    let voices = speechSynthesis.getVoices();
    let arVoice = voices.find(v => v.lang.includes('ar') || v.lang.includes('AR'));
    if(arVoice) utter.voice = arVoice;

    utter.onstart = () => {
      document.getElementById('soundStatus').innerText = "🔊 " + arText;
    };
    utter.onend = () => {
      document.getElementById('soundStatus').innerText = "✅ " + bnText;
    };
    speechSynthesis.speak(utter);
  }catch(e){
    console.log(e);
  }
}

function render(){
  document.getElementById('horofGrid').innerHTML=HOROFS.map((h,i)=>`
    <div onclick="selectHaraf(${i})" id="card-${i}" class="letter-card gorilla bg-white rounded-[18px] p-3 text-center cursor-pointer">
      <p class="arabic text-[34px] leading-[34px] text-black font-bold">${h.a}</p>
      <p class="text-[9px] font-black text-black/60 mt-1">${h.bn}</p>
    </div>
  `).join('');
}

function selectHaraf(i){
  let h=HOROFS[i];
  document.querySelectorAll('.letter-card').forEach(c=>c.classList.remove('active'));
  document.getElementById(`card-${i}`).classList.add('active');
  document.getElementById('bigArabic').innerText=h.a;
  document.getElementById('bigArabicName').innerText=h.ar;
  document.getElementById('bigName').innerText=h.bn;

  playArabic(h.ar, h.bn);

  if(navigator.vibrate) navigator.vibrate(30);
}

function toggleMute(){
  isMuted=!isMuted;
  document.getElementById('muteBtn').innerText=isMuted?'🔇':'🔊';
}

render();

// ভয়েস লোড হওয়ার জন্য - এটা খুব জরুরি
speechSynthesis.getVoices();
setTimeout(()=>{ speechSynthesis.getVoices(); selectHaraf(0); }, 300);

// প্রথম টাচে অডিও আনলক হবে APK তে
document.body.addEventListener('touchstart', ()=>{
  speechSynthesis.getVoices();
  let u = new SpeechSynthesisUtterance('');
  speechSynthesis.speak(u);
}, {once:true});
</script>
</body>
</html>
