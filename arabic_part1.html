<!DOCTYPE html>
<html lang="bn" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital Arabic Offline</title>
<style>
*{font-family:system-ui,sans-serif; -webkit-tap-highlight-color:transparent; box-sizing:border-box; margin:0; padding:0;}
body{background:#080808; color:#fff; overflow:hidden; height:100vh; height:100dvh;}
.gorilla{background:linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 100%); backdrop-filter:blur(20px); border:1.2px solid rgba(255,255,255,0.18);}
.arabic{font-family:serif;}
.letter-card.active{background:#ef4444!important; transform:scale(1.05); box-shadow:0 0 20px rgba(239,68,68,0.6);}
.letter-card.active p{color:white!important;}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
@keyframes pop{0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1.05)}}
.active{animation:pop 0.2s ease;}

/* FIXED HEADER */
.fixed-top{position:sticky; top:0; z-index:50; background:#080808; padding:12px 12px 14px 12px; border-bottom:1px solid rgba(255,255,255,0.08); box-shadow:0 10px 30px rgba(0,0,0,0.8);}
.scroll-area{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px; padding-bottom:30px;}
.scroll-area::-webkit-scrollbar{display:none;}
.scroll-area{scrollbar-width:none;}
</style>
</head>
<body>
<div style="max-width:480px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column; background:#080808;">

  <!-- FIXED TOP - এটা নড়বে না -->
  <div class="fixed-top">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button onclick="history.back()" style="width:42px; height:42px; border-radius:999px; background:rgba(255,255,255,0.12); color:#fff; font-weight:900; border:1px solid rgba(255,255,255,0.2);">←</button>
      <div class="gorilla" style="border-radius:999px; padding:9px 20px; font-weight:900; font-size:12px; letter-spacing:0.3px;">📖 ডিজিটাল আরবি শিক্ষা</div>
      <button onclick="toggleMute()" id="muteBtn" style="width:42px; height:42px; border-radius:999px; background:#10b981; border:none; font-size:18px;">🔊</button>
    </div>

    <div class="gorilla" style="margin-top:14px; border-radius:28px; padding:20px; text-align:center; border:1px solid rgba(16,185,129,0.25); box-shadow:0 10px 30px rgba(0,0,0,0.4);">
      <h1 id="bigArabic" class="arabic" style="font-size:64px; line-height:1; font-weight:700;">ا</h1>
      <p id="bigName" style="font-weight:900; font-size:20px; margin-top:8px;">আলিফ</p>
      <p id="bigEn" style="font-size:11px; background:#10b981; color:#000; padding:5px 14px; border-radius:999px; display:inline-block; margin-top:6px; font-weight:900;">Alif</p>
      <p id="soundStatus" style="font-size:11px; color:#6ee7b7; margin-top:10px; font-weight:700;">👇 হরফে ক্লিক করুন</p>
    </div>
  </div>

  <!-- SCROLLABLE BOTTOM - এটা স্ক্রল হবে -->
  <div class="scroll-area">
    <div id="horofGrid" class="grid"></div>
  </div>

</div>

<audio id="harafAudio" preload="auto" playsinline></audio>

<script>
let isMuted = false;
const audioPlayer = document.getElementById('harafAudio');

const HOROFS=[
{a:"ا", bn:"আলিফ", en:"Alif", file:"ac_alif_drillheat.m4a"},
{a:"ب", bn:"বা", en:"Ba", file:"ac_ba_drillheat.m4a"},
{a:"ت", bn:"তা", en:"Ta", file:"ac_ta_drillheat.m4a"},
{a:"ث", bn:"ছা", en:"Sa", file:"ac_sa_drillheat.m4a"},
{a:"ج", bn:"জীম", en:"Jeem", file:"ac_jeem_drillheat.m4a"},
{a:"ح", bn:"হা", en:"Hha", file:"ac_hha_drillheat.m4a"},
{a:"خ", bn:"খা", en:"Kha", file:"ac_kha_drillheat.m4a"},
{a:"د", bn:"দাল", en:"Dal", file:"ac_dal_drillheat.m4a"},
{a:"ذ", bn:"যাল", en:"Zal", file:"ac_zal_drillheat.m4a"},
{a:"ر", bn:"রা", en:"Ra", file:"ac_ra_drillheat.m4a"},
{a:"ز", bn:"যা", en:"Za", file:"ac_za_drillheat.m4a"},
{a:"س", bn:"সীন", en:"Seen", file:"ac_seen_drillheat.m4a"},
{a:"ش", bn:"শীন", en:"Sheen", file:"ac_sheen_drillheat.m4a"},
{a:"ص", bn:"সোয়াদ", en:"Saad", file:"ac_saad_drillheat.m4a"},
{a:"ض", bn:"দোয়াদ", en:"Daad", file:"ac_daad_drillheat.m4a"},
{a:"ط", bn:"ত্বা", en:"Taa", file:"ac_taa_drillheat.m4a"},
{a:"ظ", bn:"য্বা", en:"Dhaa", file:"ac_dhaa_drillheat.m4a"},
{a:"ع", bn:"আইন", en:"Ain", file:"ac_ain_drillheat.m4a"},
{a:"غ", bn:"গাইন", en:"Ghain", file:"ac_ghain_drillheat.m4a"},
{a:"ف", bn:"ফা", en:"Fa", file:"ac_fa_drillheat.m4a"},
{a:"ق", bn:"ক্বফ", en:"Qaf", file:"ac_qaf_drillheat.m4a"},
{a:"ك", bn:"কাফ", en:"Kaf", file:"ac_kaf_drillheat.m4a"},
{a:"ل", bn:"লাম", en:"Lam", file:"ac_lam_drillheat.m4a"},
{a:"م", bn:"মীম", en:"Meem", file:"ac_meem_drillheat.m4a"},
{a:"ن", bn:"নূন", en:"Nun", file:"ac_nun_drillheat.m4a"},
{a:"و", bn:"ওয়াও", en:"Waw", file:"ac_waw_drillheat.m4a"},
{a:"ه", bn:"হা", en:"Ha", file:"ac_ha_drillheat.m4a"},
{a:"ء", bn:"হামজা", en:"Hamza", file:"ac_hamza_drillheat.m4a"},
{a:"ي", bn:"ইয়া", en:"Ya", file:"ac_ya_drillheat.m4a"},
];

function render(){
  document.getElementById('horofGrid').innerHTML=HOROFS.map((h,i)=>`
    <div onclick="selectHaraf(${i})" id="card-${i}" class="letter-card gorilla" style="background:#fff; border-radius:18px; padding:14px 6px; text-align:center; cursor:pointer; transition:0.2s;">
      <p class="arabic" style="font-size:38px; line-height:38px; color:#000; font-weight:700;">${h.a}</p>
      <p style="font-size:10px; font-weight:900; color:rgba(0,0,0,0.8); margin-top:6px;">${h.bn}</p>
    </div>
  `).join('');
}

function selectHaraf(i){
  let h=HOROFS[i];
  document.querySelectorAll('.letter-card').forEach(c=>c.classList.remove('active'));
  document.getElementById(`card-${i}`).classList.add('active');
  document.getElementById('bigArabic').innerText=h.a;
  document.getElementById('bigName').innerText=h.bn;
  document.getElementById('bigEn').innerText=h.en;
  playMp3(h.file, h.bn);
  if(navigator.vibrate) navigator.vibrate(30);
}

function playMp3(fileName, bnName){
  if(isMuted) return;
  audioPlayer.src = './' + fileName;
  document.getElementById('soundStatus').innerText = "🔊 বলছে: " + bnName;
  audioPlayer.load();
  const p = audioPlayer.play();
  if(p!== undefined){
    p.then(()=>{ document.getElementById('soundStatus').innerText = "✅ " + bnName + " - বাজছে"; })
   .catch(e=>{
        document.getElementById('soundStatus').innerText = "⚠️ অডিও পাওয়া যায়নি: " + fileName;
     });
  }
}

function toggleMute(){
  isMuted=!isMuted;
  document.getElementById('muteBtn').innerText=isMuted?'🔇':'🔊';
  if(isMuted) audioPlayer.pause();
}

render();
document.body.addEventListener('touchstart', function unlock(){
  audioPlayer.play().then(()=>{ audioPlayer.pause(); audioPlayer.currentTime=0; }).catch(()=>{});
}, {once:true});
</script>
</body>
</html>
