<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster Maker 30 - Fixed - Qari Jubayer</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Hind+Siliguri:wght@700;900&family=Noto+Nastaliq+Urdu:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#000;color:#fff;display:flex;flex-direction:column;min-height:100vh}
.top{background:#0f0f0f;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:99}
.home-btn{background:#fff;color:#000;padding:8px 20px;border-radius:22px;text-decoration:none;font-weight:900;font-size:14px}
.wrap{max-width:500px;margin:auto;width:100%;padding:14px;flex:1}
.upload{background:linear-gradient(135deg,#111,#1e1e3a);border:1px dashed #444;border-radius:16px;padding:14px;text-align:center}
.inputs{display:grid;gap:10px;margin-top:12px}
.inputs input{background:#1c1c1e;border:1px solid #333;padding:14px;border-radius:12px;color:#fff;font-size:15px;font-weight:700}
.canvas-area{background:#111;border:1px solid #222;border-radius:20px;padding:12px;margin-top:14px;text-align:center}
#posterCanvas{width:100%;max-width:420px;border-radius:18px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.controls button{padding:13px;border:none;border-radius:14px;font-weight:900}
.next{background:#222;color:#fff;border:1px solid #333}
.down{background:linear-gradient(90deg,#00e676,#00c853);color:#000}
.share{width:100%;margin-top:10px;padding:15px;border:none;border-radius:14px;background:linear-gradient(90deg,#25D366,#128C7E);color:#fff;font-weight:900;font-size:16px}
.dname{margin-top:8px;color:#00e676;font-weight:900;font-size:12px}
.footer{text-align:center;padding:20px;color:#555;font-size:11px;border-top:1px solid #151515;margin-top:16px}
.footer b{color:#aaa;font-size:13px}
</style>
</head>
<body>

<div class="top">
  <div style="font-weight:900">🎨 POSTER 30 DESIGN</div>
  <a href="index.html" class="home-btn">HOME</a>
</div>

<div class="wrap">
  <div class="upload"><b>📸 ছবি আপলোড করুন</b><br><input type="file" id="imgInput" accept="image/*" style="margin-top:8px"></div>
  <div class="inputs">
    <input id="nameInput" value="Qari Jubayer Ahmed Siyam">
    <input id="quoteInput" value="নিশ্চয়ই কষ্টের সাথে স্বস্তি আছে - 94:6">
  </div>
  <div class="canvas-area">
    <canvas id="posterCanvas" width="1080" height="1350"></canvas>
    <div class="dname" id="dname"></div>
    <div class="controls">
      <button class="next" onclick="prevDesign()">← PREV</button>
      <button class="next" onclick="nextDesign()">NEXT →</button>
    </div>
    <div class="controls" style="margin-top:8px">
      <button class="down" onclick="downloadPoster()">⬇ DOWNLOAD</button>
      <button class="next" onclick="randomDesign()">🎲 RANDOM</button>
    </div>
    <button class="share" onclick="sharePoster()">📤 SHARE POSTER</button>
  </div>
</div>

<div class="footer"><b>US Qari MD Jubayer Ahmed Siyam</b><br>এই লেখা পোস্টারে থাকবে না<br>© 2026</div>

<script>
const canvas=document.getElementById('posterCanvas');
const ctx=canvas.getContext('2d');
let uploadedImg=null;
let current=0;

// imgSize: small, medium, big, circleSmall, circleBig, wide, tall
const designs=[
{bg1:'#0f0c29',bg2:'#302b63',bg3:'#24243e',a:'#00ff88',a2:'#ffeb3b',n:'Galaxy', size:380, shape:'circle', y:340},
{bg1:'#ff512f',bg2:'#dd2476',bg3:'#ff512f',a:'#fff',a2:'#ffeb3b',n:'Sunset', size:520, shape:'square', y:320},
{bg1:'#004e92',bg2:'#000428',bg3:'#004e92',a:'#00e5ff',a2:'#fff',n:'Ocean', size:320, shape:'circle', y:300},
{bg1:'#0f9b0f',bg2:'#000',bg3:'#0f9b0f',a:'#a8ff00',a2:'#fff',n:'Jannah', size:450, shape:'circle', y:360},
{bg1:'#8e2de2',bg2:'#4a00e0',bg3:'#8e2de2',a:'#ff6ec7',a2:'#fff',n:'Royal', size:300, shape:'square', y:280},
{bg1:'#f7971e',bg2:'#ffd200',bg3:'#f7971e',a:'#000',a2:'#fff',n:'Kaaba', size:500, shape:'circle', y:350},
{bg1:'#232526',bg2:'#414345',bg3:'#232526',a:'#00e676',a2:'#ffeb3b',n:'Elite', size:340, shape:'hex', y:330},
{bg1:'#1a2a6c',bg2:'#b21f1f',bg3:'#fdbb2d',a:'#fff',a2:'#00ffcc',n:'Rainbow', size:420, shape:'square', y:310},
{bg1:'#00b09b',bg2:'#96c93d',bg3:'#00b09b',a:'#fff',a2:'#000',n:'Taqwa', size:280, shape:'circle', y:290},
{bg1:'#fc4a1a',bg2:'#f7b733',bg3:'#fc4a1a',a:'#fff',a2:'#000',n:'Desert', size:480, shape:'circle', y:370},
{bg1:'#20002c',bg2:'#cbb4d4',bg3:'#20002c',a:'#ff6ec7',a2:'#fff',n:'Pink', size:360, shape:'square', y:300},
{bg1:'#3a1c71',bg2:'#d76d77',bg3:'#ffaf7b',a:'#fff',a2:'#ffeb3b',n:'Sabr', size:400, shape:'circle', y:340},
{bg1:'#000428',bg2:'#004e92',bg3:'#00f260',a:'#fff',a2:'#ffeb3b',n:'Aqua', size:310, shape:'circle', y:310},
{bg1:'#7b4397',bg2:'#dc2430',bg3:'#7b4397',a:'#fff',a2:'#ffeb3b',n:'Maghrib', size:550, shape:'square', y:380},
{bg1:'#0d324d',bg2:'#7f5a83',bg3:'#0d324d',a:'#00ff88',a2:'#fff',n:'Dark', size:330, shape:'circle', y:300},
{bg1:'#141e30',bg2:'#243b55',bg3:'#141e30',a:'#00e5ff',a2:'#ffeb3b',n:'Midnight', size:390, shape:'square', y:320},
{bg1:'#ff416c',bg2:'#ff4b2b',bg3:'#ff416c',a:'#fff',a2:'#000',n:'Red', size:290, shape:'circle', y:290},
{bg1:'#0cebeb',bg2:'#20e3b2',bg3:'#29ffc6',a:'#000',a2:'#fff',n:'Cyan', size:460, shape:'circle', y:350},
{bg1:'#333399',bg2:'#ff00cc',bg3:'#333399',a:'#fff',a2:'#ffeb3b',n:'Neon', size:350, shape:'square', y:310},
{bg1:'#e65c00',bg2:'#f9d423',bg3:'#e65c00',a:'#000',a2:'#fff',n:'Gold', size:420, shape:'circle', y:340},
{bg1:'#0f0f0f',bg2:'#00ff88',bg3:'#0f0f0f',a:'#00ff88',a2:'#fff',n:'NeonG', size:300, shape:'circle', y:300},
{bg1:'#23074d',bg2:'#cc5333',bg3:'#23074d',a:'#ffb800',a2:'#fff',n:'Sufi', size:520, shape:'square', y:360},
{bg1:'#000',bg2:'#434343',bg3:'#000',a:'#ffd700',a2:'#fff',n:'B-Gold', size:370, shape:'circle', y:330},
{bg1:'#3a6186',bg2:'#89253e',bg3:'#3a6186',a:'#fff',a2:'#ffeb3b',n:'Wine', size:410, shape:'circle', y:340},
{bg1:'#11998e',bg2:'#38ef7d',bg3:'#11998e',a:'#fff',a2:'#000',n:'Zikr', size:320, shape:'square', y:300},
{bg1:'#5433ff',bg2:'#20bdff',bg3:'#a5fecb',a:'#000',a2:'#fff',n:'Sky', size:480, shape:'circle', y:370},
{bg1:'#2c3e50',bg2:'#fd746c',bg3:'#2c3e50',a:'#fff',a2:'#ffeb3b',n:'Rose', size:340, shape:'circle', y:310},
{bg1:'#000046',bg2:'#1cb5e0',bg3:'#000046',a:'#fff',a2:'#00ffcc',n:'Sea', size:360, shape:'square', y:320},
{bg1:'#5f2c82',bg2:'#49a09d',bg3:'#5f2c82',a:'#ffeb3b',a2:'#fff',n:'Mystic', size:400, shape:'hex', y:340},
{bg1:'#0b486b',bg2:'#f56217',bg3:'#0b486b',a:'#fff',a2:'#ffeb3b',n:'Fire', size:290, shape:'circle', y:280},
];

document.getElementById('imgInput').addEventListener('change', e=>{
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=ev=>{ let im=new Image(); im.onload=()=>{ uploadedImg=im; draw(); }; im.src=ev.target.result; }; r.readAsDataURL(f);
});
document.getElementById('nameInput').addEventListener('input', draw);
document.getElementById('quoteInput').addEventListener('input', draw);

function nextDesign(){ current=(current+1)%designs.length; draw(); }
function prevDesign(){ current=(current-1+designs.length)%designs.length; draw(); }
function randomDesign(){ current=Math.floor(Math.random()*designs.length); draw(); }

function draw(){
 let d=designs[current];
 document.getElementById('dname').innerText=`Design ${current+1}/30 - ${d.n} | Photo: ${d.size}px ${d.shape}`;

 let grad=ctx.createLinearGradient(0,0,1080,1350);
 grad.addColorStop(0,d.bg1); grad.addColorStop(0.5,d.bg2); grad.addColorStop(1,d.bg3);
 ctx.fillStyle=grad; ctx.fillRect(0,0,1080,1350);

 // Stars & Moon Deco
 ctx.save(); ctx.globalAlpha=0.18; ctx.fillStyle=d.a2;
 ctx.beginPath(); ctx.arc(900,180,140,0,Math.PI*2); ctx.fill();
 ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(940,160,125,0,Math.PI*2); ctx.fill(); ctx.restore();
 ctx.fillStyle=d.a; ctx.globalAlpha=0.6;
 for(let i=0;i<40;i++){ ctx.beginPath(); ctx.arc(Math.random()*1080, Math.random()*450, Math.random()*2.5+0.5,0,Math.PI*2); ctx.fill(); }
 ctx.globalAlpha=1;

 // Border
 ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=2; ctx.strokeRect(22,22,1036,1306);
 ctx.strokeStyle=d.a; ctx.lineWidth=2.5; ctx.strokeRect(42,42,996,1266);

 // --- IMAGE BOX SMALLER ---
 let size=d.size; // 280 - 550 varies
 let y=d.y; // different y position
 let x=540-size/2;

 if(uploadedImg){
   ctx.save();
   if(d.shape==='circle'){
     ctx.beginPath(); ctx.arc(540, y+size/2, size/2, 0, Math.PI*2); ctx.clip();
   }else if(d.shape==='hex'){
     ctx.beginPath();
     for(let i=0;i<6;i++){ let ang=Math.PI/3*i - Math.PI/6; let px=540 + size/2*Math.cos(ang); let py=y+size/2 + size/2*Math.sin(ang); if(i==0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
     ctx.closePath(); ctx.clip();
   }else{
     ctx.beginPath(); ctx.roundRect(x, y, size, size, 28); ctx.clip();
   }
   let s=Math.max(size/uploadedImg.width, size/uploadedImg.height);
   let w=uploadedImg.width*s, h=uploadedImg.height*s;
   ctx.drawImage(uploadedImg, 540-w/2, y+size/2-h/2, w, h);
   ctx.restore();

   // frame
   ctx.save(); ctx.shadowColor=d.a; ctx.shadowBlur=20; ctx.strokeStyle=d.a2; ctx.lineWidth=5;
   if(d.shape==='circle'){ ctx.beginPath(); ctx.arc(540,y+size/2,size/2,0,Math.PI*2); ctx.stroke(); }
   else if(d.shape==='hex'){ ctx.beginPath(); for(let i=0;i<6;i++){ let ang=Math.PI/3*i - Math.PI/6; let px=540 + size/2*Math.cos(ang); let py=y+size/2 + size/2*Math.sin(ang); if(i==0) ctx.moveTo(px,py); else ctx.lineTo(px,py); } ctx.closePath(); ctx.stroke(); }
   else { ctx.beginPath(); ctx.roundRect(x,y,size,size,28); ctx.stroke(); }
   ctx.restore();
 }else{
   ctx.fillStyle='#00000066';
   if(d.shape==='circle'){ ctx.beginPath(); ctx.arc(540,y+size/2,size/2,0,Math.PI*2); ctx.fill(); }
   else { ctx.beginPath(); ctx.roundRect(x,y,size,size,22); ctx.fill(); }
   ctx.fillStyle='#fff'; ctx.font='700 22px Hind Siliguri'; ctx.textAlign='center'; ctx.fillText('ছবি দিন',540,y+size/2);
 }

 // --- BIGGER TEXT ---
 ctx.textAlign='center';
 let name=document.getElementById('nameInput').value||'Your Name';
 ctx.save(); ctx.shadowColor=d.a; ctx.shadowBlur=25;
 ctx.fillStyle='#fff';
 ctx.font='900 86px Amiri'; // MORE BIG
 ctx.strokeStyle=d.a; ctx.lineWidth=1;
 let nameY= y+size+110; // dynamic below image
 wrapText(name,540,nameY,980,78, true);
 ctx.restore();

 let quote=document.getElementById('quoteInput').value||'';
 ctx.fillStyle=d.a2; ctx.font='700 42px Noto Nastaliq Urdu'; // BIGGER QUOTE
 wrapText(quote,540,nameY+130,940,52,false);

 ctx.fillStyle=d.a2; ctx.font='700 38px Amiri'; ctx.fillText('﷽',540,95);
 ctx.fillStyle=d.a; ctx.fillRect(360, nameY+35, 360, 5);
}

function wrapText(t,x,y,maxW,lh, isName){
 let words=t.split(' '); let line=''; let yy=y;
 ctx.textAlign='center';
 for(let n=0;n<words.length;n++){
  let test=line+words[n]+' ';
  if(ctx.measureText(test).width>maxW && n>0){
    if(isName){ ctx.fillText(line.trim(),x,yy); ctx.strokeText(line.trim(),x,yy); } else ctx.fillText(line.trim(),x,yy);
    line=words[n]+' '; yy+=lh;
  }
  else line=test;
 }
 if(isName){ ctx.fillText(line.trim(),x,yy); ctx.strokeText(line.trim(),x,yy); } else ctx.fillText(line.trim(),x,yy);
}

function downloadPoster(){
 let link=document.createElement('a');
 link.download=`Poster-${designs[current].n}-${Date.now()}.png`;
 link.href=canvas.toDataURL('image/png',1.0); link.click();
 setTimeout(()=> window.open(canvas.toDataURL('image/png'),'_blank'), 300);
}
async function sharePoster(){
 canvas.toBlob(async (blob)=>{
  const file=new File([blob], `poster-${Date.now()}.png`, {type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
   try{ await navigator.share({title:'Islamic Poster', text: document.getElementById('quoteInput').value+' - '+document.getElementById('nameInput').value, files:[file]}); return; }catch(e){}
  }
  let txt=encodeURIComponent(`*${document.getElementById('nameInput').value}*\n${document.getElementById('quoteInput').value}\n\nUS Qari MD Jubayer Ahmed Siyam`);
  if(confirm('WhatsApp এ শেয়ার করবেন?')){ window.open(`https://wa.me/?text=${txt}`,'_blank'); downloadPoster(); }else downloadPoster();
 }, 'image/png',1.0);
}
draw();
</script>
</body>
</html>
