<!DOCTYPE html>
<html lang="bn" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Halal Basket Pro - Silver Points</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Hind Siliguri'; user-select:none; -webkit-tap-highlight-color:transparent; box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0}
body{background:#020617;display:flex;justify-content:center;overflow:hidden}
.app{width:100vw;max-width:none;height:100vh;height:100dvh;min-height:100vh;background:radial-gradient(circle at 50% 0%,#1e293b,#020617 70%);position:relative;overflow:hidden;touch-action:none}
.lang-btn{border:1.5px solid rgba(255,255,255,0.3);border-radius:999px;padding:5px 14px;font-size:11px;font-weight:900;cursor:pointer}
.lang-btn.active{background:white;color:black}
.basket{position:absolute;bottom:20px;width:84px;height:44px;background:linear-gradient(180deg,#e5e7eb,#9ca3af 55%,#6b7280);border:2px solid #f8fafc;border-radius:10px 10px 22px 22px;display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 2px 3px rgba(255,255,255,.7);z-index:20;touch-action:none}
.item{position:absolute;width:46px;height:46px;background:rgba(255,255,255,.97);border:1px solid rgba(203,213,225,.8);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 15px rgba(0,0,0,.3);z-index:10}
.silver-score{background:linear-gradient(135deg,#f8fafc,#cbd5e1,#f1f5f9);color:#1f2937;border:1px solid #fff;box-shadow:0 2px 12px rgba(203,213,225,.2)}
.stat-label{font-size:9px;opacity:.8;margin-right:3px}
.plus{position:absolute;font-weight:900;font-size:22px;animation:pop 0.8s forwards;pointer-events:none;z-index:30}
@keyframes pop{0%{transform:translateY(0) scale(0.5);opacity:1}100%{transform:translateY(-70px) scale(1.3);opacity:0}}
</style>
</head>
<body>
<div class="app" id="gameArea">
  <div class="absolute top-0 w-full z-20 px-3 py-3 flex justify-between items-center gap-2 bg-black/40 backdrop-blur">
    <button onclick="location.href='./game_home.html'" class="w-8 h-8 shrink-0 bg-white/20 rounded-full text-white">‹</button>
    <div class="silver-score font-black px-3 py-1 rounded-full text-[12px]">🥈 <span id="scoreLabel">সিলভার পয়েন্ট</span> <span id="score">0</span></div>
    <div class="bg-red-500/20 border border-red-400/30 px-2 py-1 rounded-full text-[10px] text-white font-bold whitespace-nowrap">❌ <span id="haramLabel">হারাম</span> <span id="haramCount">0</span>/4</div>
    <button id="fullBtn" onclick="toggleFullscreen()" class="shrink-0 w-8 h-8 rounded-full bg-white/20 text-white text-lg" aria-label="Fullscreen">⛶</button>
  </div>
  <div id="basket" class="basket" style="left:calc(50% - 42px)">🧺</div>

  <div id="startScreen" class="absolute inset-0 z-30 bg-[#020617]/90 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
    <div class="flex gap-2 mb-4">
      <div id="btnBN" onclick="setLang('bn')" class="lang-btn active text-white">BN</div>
      <div id="btnEN" onclick="setLang('en')" class="lang-btn text-white">EN</div>
    </div>
    <div class="w-20 h-20 rounded-[24px] bg-white flex items-center justify-center text-[40px]">🧺</div>
    <p id="t_title" class="text-white font-black text-[22px] mt-4">HALAL BASKET <span class="text-cyan-400">PRO</span></p>
    <p id="t_desc" class="text-zinc-400 text-[12px] mt-2">বাটি টেনে হালাল ধরো • ৪০ টি আইটেম</p>
    <div id="t_rule" class="mt-4 bg-amber-500/10 border border-amber-500/30 text-amber-300 rounded-xl px-4 py-2 text-[11px] font-bold">🧺 ৪ টা হারাম বাটিতে ঢুকলে গেম শেষ</div>
    <button id="t_startBtn" onclick="startGame()" class="mt-6 w-full bg-white text-black font-black py-3.5 rounded-full">START ▶️</button>
    <p class="text-[8px] text-zinc-500 mt-4 tracking-widest">40 ITEMS • DEVELOPED BY JUBAYER</p>
  </div>

  <div id="overScreen" class="hidden absolute inset-0 z-30 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
    <div class="text-[60px]">💀</div>
    <p id="t_overTitle" class="text-white font-black text-[22px] mt-2">GAME OVER</p>
    <div class="silver-score font-black mt-4 px-6 py-2 rounded-full text-[18px]">🥈 <span id="finalScoreLabel">সিলভার পয়েন্ট</span> <span id="finalScore">0</span></div>
    <div class="silver-score font-black mt-3 px-5 py-2 rounded-full text-[14px]">🏆 <span id="highScoreLabel">সর্বোচ্চ স্কোর</span>: <span id="highScore">0</span></div>
    <p id="t_overReason" class="text-zinc-400 text-[12px] mt-3"></p>
    <button id="t_retryBtn" onclick="startGame()" class="mt-6 w-full bg-white text-black font-black py-3.5 rounded-full">RETRY 🔄</button>
  </div>
</div>

<script>
const T={
bn:{title:'HALAL BASKET <span class="text-cyan-400">PRO</span>',desc:'বাটি আঙুল দিয়ে টেনে হালাল ধরো • মোট ৪০টি আইটেম',rule:'🧺 ৪টি হারাম আইটেম ধরলে গেম শেষ',startBtn:'শুরু করো ▶️',overTitle:'গেম শেষ!',retryBtn:'আবার খেলো 🔄',overReason:'আপনার স্কোর: ',scoreLabel:'সিলভার পয়েন্ট',haramLabel:'হারাম',highScoreLabel:'সর্বোচ্চ স্কোর',finalScoreLabel:'সিলভার পয়েন্ট'},
en:{title:'HALAL BASKET <span class="text-cyan-400">PRO</span>',desc:'Drag the basket to catch Halal items • 40 items',rule:'🧺 Catch 4 Haram items to end the game',startBtn:'START ▶️',overTitle:'GAME OVER!',retryBtn:'PLAY AGAIN 🔄',overReason:'Your score: ',scoreLabel:'Silver Points',haramLabel:'Haram',highScoreLabel:'High Score',finalScoreLabel:'Silver Points'}
};
let lang=localStorage.getItem('halal_lang')||'bn';
function setLang(l){
lang=l; localStorage.setItem('halal_lang',l);
document.getElementById('btnBN').classList.toggle('active',l==='bn');
document.getElementById('btnEN').classList.toggle('active',l==='en');
document.getElementById('t_title').innerHTML=T[l].title;
document.getElementById('t_desc').innerText=T[l].desc;
document.getElementById('t_rule').innerText=T[l].rule;
document.getElementById('t_startBtn').innerText=T[l].startBtn;
document.getElementById('t_overTitle').innerText=T[l].overTitle;
document.getElementById('t_retryBtn').innerText=T[l].retryBtn;
 document.getElementById('scoreLabel').innerText=T[l].scoreLabel;
 document.getElementById('haramLabel').innerText=T[l].haramLabel;
 document.getElementById('highScoreLabel').innerText=T[l].highScoreLabel;
 document.getElementById('finalScoreLabel').innerText=T[l].finalScoreLabel;
 document.getElementById('highScore').innerText=localStorage.getItem('halal_high_score')||'0';
}
setLang(lang);
document.getElementById('highScore').innerText=localStorage.getItem('halal_high_score')||'0';

// === মোট ৪০ টা আইটেম ===
const HALAL = [
'🥛','🍎','🐟','🍯','🥚','🍇','🥖','🍌','🥜','🍉',
'🥭','🍊','🍋','🍐','🍓','🥝','🍅','🥕','🌽','🍚',
'🍗','🥩','🫒','🥒','🥬'
]; // 25 টা হালাল
const HARAM = [
'🍺','🍷','🐖','🚬','🥓','🍸','💊','🎰','🍾','🥃',
'🐷','🍻','🍹','💉','🚬'
]; // 15 টা হারাম = মোট 40

let score=0, haram=0, game=false, speed=1.3, spawnInt, moveInt, speedInt, items=[], basketX=0, audioCtx;
let highScore=Number(localStorage.getItem('halal_high_score')||0);
function initAudio(){ const AC=window.AudioContext||window.webkitAudioContext; if(!audioCtx && AC) audioCtx=new AC(); }
function tone(f,t,d,v=0.3){ initAudio(); if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type=t; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(v,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+d); o.start(); o.stop(audioCtx.currentTime+d); }
function playHalal(){ tone(800,'sine',0.15,0.4); setTimeout(()=>tone(1200,'sine',0.2,0.4),100); }
function playHaram(){ tone(180,'sawtooth',0.4,0.5); }

const basket=document.getElementById('basket');
const area=document.getElementById('gameArea');

async function startGame(){
// Request immersive full-screen mode from the user's Start/Retry tap where supported.
try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch(e) {}
score=0; haram=0; speed=1.3; items.forEach(i=>i.el.remove()); items=[];
 clearInterval(speedInt);
document.getElementById('score').innerText=0; document.getElementById('haramCount').innerText=0;
document.getElementById('startScreen').classList.add('hidden'); document.getElementById('overScreen').classList.add('hidden');
game=true; basketX=(area.clientWidth- basket.offsetWidth)/2; basket.style.left=basketX+'px';
clearInterval(spawnInt); clearInterval(moveInt);
spawnInt=setInterval(spawnItem, 650);
moveInt=setInterval(gameLoop, 16);
initAudio();
speedInt=setInterval(()=>{ if(game) speed=Math.min(speed+0.08,5.5); }, 3000);
}

async function toggleFullscreen(){
  try {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen) {
      await document.exitFullscreen();
    }
  } catch(e) { /* Some browsers only allow fullscreen from supported contexts. */ }
  setTimeout(()=>{ if(game){ basketX=Math.max(0,Math.min(area.clientWidth-basket.offsetWidth,basketX)); basket.style.left=basketX+'px'; } },120);
}
window.addEventListener('resize',()=>{
  if(!area || !basket) return;
  basketX=Math.max(0,Math.min(area.clientWidth-basket.offsetWidth,basketX));
  basket.style.left=basketX+'px';
});

function spawnItem(){
if(!game) return;
const isHalal=Math.random()>0.35;
const pool=isHalal?HALAL:HARAM;
const emoji=pool[Math.floor(Math.random()*pool.length)];
const el=document.createElement('div'); el.className='item'; el.innerText=emoji;
const x=Math.random()*(area.clientWidth-52);
el.style.left=x+'px'; el.style.top='-60px';
area.appendChild(el);
items.push({el,x,y:-60,type:isHalal?'halal':'haram'});
}
function gameLoop(){
if(!game) return;
for(let i=items.length-1;i>=0;i--){
let it=items[i]; it.y+=speed; it.el.style.top=it.y+'px';
const basketTop=area.clientHeight-basket.offsetHeight-20;
const itemCenter=it.x+it.el.offsetWidth/2;
const basketLeft=basketX, basketRight=basketX+basket.offsetWidth;
// Only a downward entry through the basket opening counts; touching its sides does not.
const itemBottom=it.y+it.el.offsetHeight;
const crossedTop=(itemBottom>=basketTop && itemBottom<=basketTop+Math.max(speed,8));
const insideOpening=(itemCenter>basketLeft+9 && itemCenter<basketRight-9);
if(crossedTop && insideOpening){
if(it.type==='halal'){ score+=15; playHalal(); showPlus(it.x,it.y,'+15 🥈','#e2e8f0'); }
else { haram++; playHaram(); showPlus(it.x,it.y,'HARAM','#f87171'); document.getElementById('haramCount').innerText=haram; if(haram>=4){ endGame(); return; } }
document.getElementById('score').innerText=score;
it.el.remove(); items.splice(i,1);
}else if(it.y>area.clientHeight){ it.el.remove(); items.splice(i,1); }
}
}
function showPlus(x,y,txt,color){ const p=document.createElement('div'); p.className='plus'; p.style.left=x+'px'; p.style.top=y+'px'; p.style.color=color; p.innerText=txt; area.appendChild(p); setTimeout(()=>p.remove(),800); }
function endGame(){
 game=false; clearInterval(spawnInt); clearInterval(moveInt); clearInterval(speedInt);
 highScore=Math.max(highScore,score); localStorage.setItem('halal_high_score',String(highScore));
 document.getElementById('finalScore').innerText=score;
 document.getElementById('highScore').innerText=highScore;
 document.getElementById('t_overReason').innerText=T[lang].overReason+score;
 document.getElementById('overScreen').classList.remove('hidden');
}

let dragging=false, startX=0, startBasketX=0;
function getX(e){ return e.touches?e.touches[0].clientX:e.clientX; }
basket.addEventListener('touchstart', (e)=>{ dragging=true; startX=getX(e); startBasketX=basketX; });
basket.addEventListener('mousedown', (e)=>{ dragging=true; startX=getX(e); startBasketX=basketX; });
window.addEventListener('touchmove', (e)=>{ if(!dragging||!game) return; e.preventDefault(); let dx=getX(e)-startX; basketX=Math.max(0, Math.min(area.clientWidth-basket.offsetWidth, startBasketX+dx)); basket.style.left=basketX+'px'; },{passive:false});
window.addEventListener('mousemove', (e)=>{ if(!dragging||!game) return; let dx=getX(e)-startX; basketX=Math.max(0, Math.min(area.clientWidth-basket.offsetWidth, startBasketX+dx)); basket.style.left=basketX+'px'; });
window.addEventListener('touchend', ()=>dragging=false);
window.addEventListener('mouseup', ()=>dragging=false);
</script>
</body>
</html>
