
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>দারুন কিরাত মজিদিয়া ফুলতলী ট্রাস্ট</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:"Noto Sans Bengali","Nirmala UI",Arial,sans-serif;color:#123c2d;background:linear-gradient(135deg,#e7f7ef,#faf3df 50%,#e7f7ef);min-height:100vh}
.page{width:min(1100px,100%);margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.home{background:#075c43;color:#fff;border:0;border-radius:12px;padding:9px 16px;font-size:16px;font-weight:bold;cursor:pointer}
.tag{background:#fff8dc;border:1px solid #e4c86d;color:#765700;padding:6px 11px;border-radius:20px;font-size:13px}
.hero{background:rgba(255,255,255,.88);text-align:center;border:1px solid rgba(7,92,67,.12);border-radius:25px;padding:21px 12px;box-shadow:0 12px 35px rgba(33,77,57,.10)}
.logo{width:120px;height:120px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 8px 25px rgba(0,0,0,.10)}
h1{margin:10px 0 3px;color:#075c43;font-size:clamp(24px,5vw,40px);line-height:1.25}
.sub{margin:0;color:#8b6918;font-size:14px}
.line{height:2px;width:170px;background:#d2a62b;margin:13px auto 0}
.title{text-align:center;margin:25px 0 14px}
.title h2{margin:0;color:#075c43;font-size:26px}
.title p{margin:2px 0;color:#68746e;font-size:13px}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.book{background:#fff;border:1px solid rgba(7,92,67,.12);border-radius:18px;padding:9px;box-shadow:0 10px 25px rgba(35,79,58,.10)}
.cover{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;cursor:pointer;background:#eaf7f1}
.open{display:block;text-align:center;text-decoration:none;color:#fff;background:#075c43;border-radius:10px;padding:10px;font-size:14px;font-weight:700;margin-top:8px}
.placeholder{width:100%;aspect-ratio:3/4;border-radius:12px;border:2px dashed #9bc7b5;background:linear-gradient(145deg,#f8fffb,#eaf7f1);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#52796b;padding:15px}
.placeholder .icon{font-size:50px;margin-bottom:8px}
.placeholder b{font-size:18px;color:#276650}
.placeholder span{font-size:12px;margin-top:4px}
footer{text-align:center;margin:28px 0 6px;color:#53645d;font-size:14px}
footer strong{display:block;color:#075c43;margin-top:3px}
@media(max-width:700px){.page{padding:9px}.logo{width:96px;height:96px}h1{font-size:24px}.books{gap:8px}.book{padding:6px;border-radius:13px}.open{font-size:12px;padding:9px 3px}}
</style>
</head>
<body>
<div class="page">
<div class="top">
<button class="home" onclick="goBack()">← Back</button>
<span class="tag">ইসলামিক কিতাব</span>
</div>

<section class="hero">
<img class="logo" src="darul_qirat/logo.png" alt="লোগো">
<h1>দারুন কিরাত মজিদিয়া ফুলতলী ট্রাস্ট</h1>
<p class="sub">কুরআন ও তাজবীদ শিক্ষার বইসমূহ</p>
<div class="line"></div>
</section>

<div class="title"><h2>📚 বইসমূহ</h2><p>বইয়ের ছবিতে অথবা বই খুলুন বাটনে ক্লিক করুন</p></div>

<section class="books">

<!-- বই ১ : প্রাথমিক তাজবীদ -->
<article class="book">
<a href="darul_qirat/prathomik-tajweed.pdf" target="_blank">
<img class="cover" src="darul_qirat/prathomik-tajweed-cover.jpg" alt="প্রাথমিক তাজবীদ">
</a>
<a class="open" href="darul_qirat/prathomik-tajweed.pdf" target="_blank">বই খুলুন ↗</a>
</article>

<!-- বই ২ : আল-কাউলুছ ছাদীদ - ৫টা নাম ট্রাই করবে -->
<article class="book">
<a href="darul_qirat/al-qawlus-sadeed.pdf" target="_blank">
<img class="cover" id="qawlusCover" src="darul_qirat/al-qawlus-sadeed-cover.jpg?v=3" alt="আল কাউলুছ ছাদীদ" onerror="tryNextCover(this)">
</a>
<a class="open" href="darul_qirat/al-qawlus-sadeed.pdf" target="_blank">বই খুলুন ↗</a>
</article>

<!-- বই ৩ : নতুন বই -->
<article class="book">
<div class="placeholder"><div class="icon">📖</div><b>তৃতীয় বই</b><span>নতুন বই পরে এখানে যুক্ত করা হবে</span></div>
<a class="open" href="#" onclick="return false" style="background:#9db8ad">শীঘ্রই যুক্ত হবে</a>
</article>

</section>

<footer>Qari Md Jubayer ahmed siyam<strong>এর পক্ষ থেকে সম্পূর্ণ ফ্রি</strong></footer>
</div>
<script>
function goBack(){
  if(window.history.length > 1){ window.history.back(); }
  else { window.location.href = 'index.html'; }
}

// আল-কাউলুছ এর জন্য ৫টা সম্ভাব্য নাম - একটা না মিললে পরেরটা
const qawlusNames = [
  "darul_qirat/al-qawlus-sadeed-cover.jpg",
  "darul_qirat/al-qawlus-sadeed-cover.jpeg",
  "darul_qirat/al-qawlus-sadeed-cover.png",
  "darul_qirat/al-qawlus-sadeed-cover.JPG",
  "darul_qirat/al-qawlus-sadeed-cover.webp",
  "darul_qirat/al-qawlus-sadeed-cover.jpg?v=3"
];
let qawlusTry = 0;
function tryNextCover(img){
  qawlusTry++;
  if(qawlusTry < qawlusNames.length){
    img.src = qawlusNames[qawlusTry];
  } else {
    img.onerror = null;
    img.style.display = 'none';
  }
}
</script>
</body>
</html>
