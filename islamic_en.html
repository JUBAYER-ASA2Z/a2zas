function render(){

  document.getElementById('score').innerText=score;
  document.getElementById('progress').style.width=((idx+1)/questions.length*100)+'%';
  let html=`<div class="q-card"><h2>${idx+1}. ${qq.q}</h2>`;
  qq.o.forEach((opt,i)=>{
    let cls='opt';
    if(answered[idx]!==null){
      if(i==qq.a) cls+=' correct';
      else if(i==answered[idx]) cls+=' wrong';
    }
    html+=`<button class="${cls}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${opt}</button>`;
  });
  html+=`<div class="meta"><span style="color:${answered[idx]!==null? (answered[idx]==qq.a? '#00e676':'#ff3b30'):'#888'}">${answered[idx]!==null? (answered[idx]==qq.a? '✅ Correct +5':'❌ Wrong -15') : '👉 Select one answer to unlock Next'}</span><span>${idx+1}/${questions.length}</span></div></div>`;
  document.getElementById('quiz').innerHTML=html;

  let nextBtn=document.getElementById('nextBtn');
  if(answered[idx]===null) nextBtn.classList.add('locked');
  else nextBtn.classList.remove('locked');
}
function choose(i){
  if(answered[idx]!==null) return;
  answered[idx]=i;
  if(i==questions[idx].a) score+=5;
  else { score-=15; if(score<0) score=0; }
  localStorage.islamicENScore=score;
  render();
}
function next(){
  if(answered[idx]===null){
    alert('⚠️ Please select an answer first! You must answer before going to next quiz.');
    return;
  }
  if(idx<questions.length-1){ idx++; render(); scrollTo(0,0); }
  else { alert('🎉 Alhamdulillah! Finished 200 Quizzes! Final Score: '+score); }
}
function prev(){ if(idx>0){ idx--; render(); scrollTo(0,0);} }
function restartQuiz(){
  if(confirm('🔴 Restart from Question 1? Score will reset to 0.')){
    idx=0; score=0; answered=Array(questions.length).fill(null);
    localStorage.islamicENScore=0;
    render(); scrollTo(0,0);
  }
}
render();
</script>
</body>
</html>
