<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নূরানী কায়েদা</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Hind Siliguri';}
.book-wrap{perspective:1200px;}
.page{
  position:absolute; width:100%; height:100%; top:0; left:0;
  background:white; border-radius:18px; overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
  transform-origin:left center;
  transition:transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
  backface-visibility:hidden;
}
.page.flipped{transform:rotateY(-180deg);}
#finger{
  position:absolute; width:80px; height:80px; z-index:99;
  font-size:50px; touch-action:none; cursor:grab; filter:drop-shadow(0 5px 10px rgba(0,0,0,0.3));
  user-select:none;
}
</style>
</head>
<body class="bg-[#e8f5e9] min-h-screen flex flex-col items-center">

<div class="w-full max-w-[480px] bg-green-700 p-4 flex justify-between items-center text-white">
  <button onclick="history.back()" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">←</button>
  <h1 class="font-black">নূরানী কায়েদা</h1>
  <span id="pageNum" class="text-[12px] bg-white/20 px-3 py-1 rounded-full">1 / 5</span>
</div>

<div class="w-full max-w-[420px] mt-6 px-4">
  <div id="book" class="book-wrap relative w-full h-[520px]">
    <!-- Pages will load here -->
  </div>
  <div class="flex justify-between mt-6 gap-3">
    <button onclick="prevPage()" class="flex-1 py-3 bg-white rounded-full font-black shadow">আগের পাতা</button>
    <button onclick="nextPage()" class="flex-1 py-3 bg-green-600 text-white rounded-full font-black shadow">পরের পাতা →</button>
  </div>
</div>

<div id="finger">👆</div>

<script>
// ==== এখানে আপনি ছবি যোগ করবেন ====
const pages = [
  "https://i.ibb.co/1.jpg", // পাতা ১ এর ছবি লিংক
  "https://i.ibb.co/2.jpg", // পাতা ২ এর ছবি লিংক
  "https://i.ibb.co/3.jpg",
  "https://i.ibb.co/4.jpg",
  "https://i.ibb.co/5.jpg"
];
// ==================================

let current = 0;
const book = document.getElementById('book');
const pageNum = document.getElementById('pageNum');

function render(){
  book.innerHTML = '';
  pages.forEach((src, i)=>{
    const div = document.createElement('div');
    div.className = 'page' + (i < current? ' flipped' : '');
    div.style.zIndex = pages.length - i;
    div.innerHTML = `<img src="${src}" class="w-full h-full object-contain bg-white">`;
    book.appendChild(div);
  });
  pageNum.innerText = (current+1) + ' / ' + pages.length;
}
function nextPage(){ if(current < pages.length-1){current++; render();} }
function prevPage(){ if(current > 0){current--; render();} }
render();

// Finger drag system
const finger = document.getElementById('finger');
let isDragging=false, startX, startY;
finger.addEventListener('touchstart', (e)=>{isDragging=true; const t=e.touches[0]; startX=t.clientX-finger.offsetLeft; startY=t.clientY-finger.offsetTop;});
finger.addEventListener('touchmove', (e)=>{if(!isDragging)return; const t=e.touches[0]; finger.style.left=(t.clientX-startX)+'px'; finger.style.top=(t.clientY-startY)+'px';});
finger.addEventListener('touchend', ()=>isDragging=false);
finger.addEventListener('mousedown', (e)=>{isDragging=true; startX=e.clientX-finger.offsetLeft; startY=e.clientY-finger.offsetTop;});
document.addEventListener('mousemove', (e)=>{if(!isDragging)return; finger.style.left=(e.clientX-startX)+'px'; finger.style.top=(e.clientY-startY)+'px';});
document.addEventListener('mouseup', ()=>isDragging=false);
// initial position
finger.style.left='200px'; finger.style.top='400px';

// swipe to change page
let sx=0;
book.addEventListener('touchstart', e=>sx=e.touches[0].clientX);
book.addEventListener('touchend', e=>{
  let dx = e.changedTouches[0].clientX - sx;
  if(dx < -50) nextPage();
  if(dx > 50) prevPage();
});
</script>
</body>
</html>
