<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Game Zone - A-S A2Z</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
  font-family:'Inter',sans-serif;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  display:flex;
  justify-content:center;
  background:#f8f8f8;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  background:#fff;
  position:relative;
}

/* =========================
   GORILLA GLASS
========================= */

.gorilla-glass{
  background:linear-gradient(
    135deg,
    rgba(255,255,255,0.38) 0%,
    rgba(255,255,255,0.15) 100%
  );

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1.5px solid rgba(255,255,255,0.7);

  box-shadow:
    0 8px 25px rgba(0,0,0,0.18),
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 0 18px rgba(0,200,255,0.35);

  position:relative;
  overflow:hidden;
}

.gorilla-glass::before{
  content:'';
  position:absolute;
  top:0;
  left:-60%;
  width:60%;
  height:100%;

  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.9),
    transparent
  );

  animation:shine 2.2s infinite;
}

@keyframes shine{
  0%{
    transform:translateX(-100%);
  }

  100%{
    transform:translateX(260%);
  }
}

.gorilla-icon{
  background:linear-gradient(
    135deg,
    #00d2ff 0%,
    #3a7bd5 100%
  );

  box-shadow:0 4px 12px rgba(0,210,255,0.5);
}

/* =========================
   GAME CARD
========================= */

.game-card{
  border-radius:18px;
  padding:12px 8px;

  text-align:center;
  cursor:pointer;

  position:relative;

  transition:
    transform .12s,
    box-shadow .12s;

  background:white;

  border:1.5px solid #f1f5f9;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.04);
}

.game-card:active{
  transform:scale(.94);
}

.game-card.locked{
  background:#f8fafc;
  opacity:.6;
}

.icon-box{
  width:48px;
  height:48px;

  border-radius:13px;

  margin:0 auto 7px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;

  position:relative;
}

/* =========================
   BALLOON BLAST CARD
========================= */

.balloon-card{
  background:
    linear-gradient(
      135deg,
      rgba(14,165,233,.95),
      rgba(124,58,237,.95)
    );

  border:1.5px solid rgba(255,255,255,.85);

  box-shadow:
    0 8px 22px rgba(99,102,241,.28),
    inset 0 1px 0 rgba(255,255,255,.75);

  color:white;
}

.balloon-icon{
  background:
    linear-gradient(
      135deg,
      #38bdf8,
      #8b5cf6
    );

  box-shadow:
    0 5px 15px rgba(56,189,248,.45);
}

.play-badge{
  position:absolute;
  top:-6px;
  right:-6px;

  background:#10b981;
  color:white;

  font-size:7px;
  font-weight:900;

  padding:3px 7px;

  border-radius:999px;

  box-shadow:
    0 3px 8px rgba(16,185,129,.35);
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:50;

  background:rgba(255,255,255,.96);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border-bottom:1px solid #e5e7eb;

  padding:12px 16px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.back-button{
  width:40px;
  height:40px;

  background:#000;
  color:#fff;

  border-radius:50%;

  font-size:25px;
  font-weight:900;

  display:flex;
  align-items:center;
  justify-content:center;

  border:none;
}

.header-title{
  font-size:16px;
  font-weight:900;
  color:#000;
}

.header-subtitle{
  font-size:9px;
  color:#a1a1aa;
  font-weight:700;
}

.english-badge{
  padding:7px 11px;

  border-radius:999px;

  background:#000;
  color:white;

  font-size:9px;
  font-weight:900;

  letter-spacing:.5px;
}

/* =========================
   TOP HERO
========================= */

.hero{
  margin:18px 12px 16px;

  padding:18px;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #111827,
      #312e81
    );

  color:white;

  box-shadow:
    0 8px 25px rgba(17,24,39,.18);
}

.hero-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.5px;
}

.hero-desc{
  margin-top:4px;

  font-size:10px;

  color:#d4d4d8;

  font-weight:600;
}

/* =========================
   GAME GRID
========================= */

.games-area{
  padding:0 12px 40px;
}

.games-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-width:360px){

  .games-grid{
    gap:7px;
  }

  .game-card{
    padding:10px 5px;
  }

  .icon-box{
    width:44px;
    height:44px;
    font-size:20px;
  }

}
</style>
</head>
