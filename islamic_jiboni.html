const stories={
1:{
 bn:`হযরত উমর (রাঃ) একদিন তিনি হেঁটে কোথাও যাচ্ছিলেন। কিছুদূর যাওয়ার পরেই দেখলেন এক বৃদ্ধাকে। বৃদ্ধা কি যেন বিড়বিড় করছে। হযরত উমর তার কাছে গেলেন। তার খোঁজখবর নিলেন। জিজ্ঞেস করলেন, "আচ্ছা বুড়িমা, খলিফা উমর সম্পর্কে তোমার ধারণা কি?" বুড়ি হযরত উমরকে আগে কখনো দেখেনি, তাই তাকে সে চিনতে পারেনি।

বুড়ি হযরত উমরের কথা শুনে কিছুটা বিরক্ত হলো। বললো, "উমর-টুমর দিয়ে আমি কি করব? আমার কি এমন ঠেকা পড়ল যে আমার তার খবর নিতে হবে? নিজের চিন্তায় বাঁচি না!" বুড়ির কথায় ছিল রাগ আর অসন্তোষের ছাপ।

হযরত উমর আবার তাকে জিজ্ঞাসা করলেন, "বুড়িমা, উমরের ওপর তোমার এতো রাগ কেন?" বুড়ি চেঁচিয়ে জবাব দেয়, "রাগ হবে না কেন? এই যে সে খলিফা হয়েছে, তো আমায় কি একটা পয়সাও দিয়েছে? নাকি কোনোদিন আমার খোঁজখবর নিয়েছে, যে আমি কি হালে আছি? ও মানুষ না!"

হযরত উমর বুড়ির কথা শুনে বড়ই চিন্তিত হলেন। "ঠিকই তো, আমি তো তার তেমন খোঁজখবর নিতে পারিনি।" তিনি কিছুটা নরম হয়ে বুড়িকে আবার জিজ্ঞাসা করলেন, "আচ্ছা, তুমি কি অবস্থায় আছো উমর কি করে জানবে? তুমি গিয়ে উমরকে সব জানিয়ে আসলেই তো পারতে।"

বুড়ি জবাব দেয়, "কেন? আমি জানাতে যাব কেন? উমরই তো আমিরুল মুমিনীন, সেই তো সবার খোঁজখবর নেবে আর এই জন্যই রাষ্ট্রের দায়িত্ব গ্রহণ করেছে।"

হযরত উমর শান্তভাবে আবারও বললেন, "আচ্ছা, উমর খলিফা হওয়ার পর তুমি যে কষ্ট পেয়েছো, সেই কষ্টের বিনিময়ে তুমি কত টাকা পেলে উমরকে মাফ করে দেবে?"

বৃদ্ধার সাথে এসব কথা চলছে, এমন সময় হযরত আলী এবং আব্দুল্লাহ ইবনে মাসুদ (রাঃ) তারা এসে হাজির হলেন। তারা এসে সালাম দিলেন: "আসসালামু আলাইকুম ইয়া আমিরুল মুমিনীন।"

আগন্তুক দুই ব্যক্তির মুখে 'আমিরুল মুমিনীন' শব্দ শুনে বুড়ি তাজ্জব হয়ে গেল। সে ভয়ে কাঁপতে লাগলো। হযরত উমর বৃদ্ধাকে সান্ত্বনা দিলেন এবং বৃদ্ধার হাতে পঁচিশটি স্বর্ণমুদ্রা দিয়ে বললেন, "বুড়িমা, তুমি এই চামড়ায় লিখে দাও যে, কিয়ামতের দিন উমরের কাছে আমার কোনো দাবি নেই।"

হযরত উমর (রাঃ) তালি লাগানো জামা পরতেন। যখন তিনি বায়তুল মুকাদ্দাস জয় করার জন্য বের হচ্ছিলেন, সেই সময় তার পরিহিত জামায় ১৭টি তালি লাগানো ছিল। সাহাবারা বললেন ভালো কাপড় পরতে। হযরত আয়েশা (রাঃ) তাকে ডেকে বললেন ভালো জামা পরতে।

খলিফা কেঁদে ফেললেন। বললেন, "আম্মা! আপনি কি আমাকে রাসূলুল্লাহ (সাঃ) থেকে দূরে সরিয়ে রাখতে চাচ্ছেন? আপনার কি মনে নেই যে দিনের পর দিন নবীজি (সাঃ) উপবাস থেকেছেন, তিন দিন পর্যন্ত চুলায় আগুন জ্বলেনি। নবীজি (সাঃ) তালিযুক্ত কাপড় পরিধান করেছেন?"

সিরাতের কিতাবে আছে, খলিফা যখন রাসূলের অসহায়ত্বের কথা বলছিলেন, তখন হযরত আয়েশা এবং হাফসা দুজনেই অঝোরে কাঁদছিলেন।

অতঃপর তিনি তালিযুক্ত কাপড় পরেই বায়তুল মুকাদ্দাস জয়ের জন্য বের হলেন। জেরুজালেমের দ্বারপ্রান্তে ২২ লক্ষ বর্গমাইলের খলিফার হাতে উটের রশি, উটের উপর বসে আছে খাদেম। সেনাপতি আবু উবায়দা বললেন ভালো পোশাক পরতে।

হযরত উমর রেগে গিয়ে বললেন, "আমি হচ্ছি সেই জাতি, যাদের মহান আল্লাহ ইসলাম দ্বারা সম্মানিত করেছেন। আমরা যদি ইসলাম ছাড়া অন্য কোনো উপায়ে সম্মান খুঁজি, তাহলে আল্লাহ আমাদের অসম্মানিত করবেন।"`,
 en:`Hazrat Umar (RA) was walking one day. After going some distance, he saw an old woman muttering to herself. Hazrat Umar went to her and asked, "Old mother, what do you think about Khalifa Umar?" The old woman had never seen him before, so she did not recognize him. The old woman became annoyed and said, "What will I do with Umar? Do I have to keep his news? I can barely survive with my own worries!" Umar asked again, "Why are you so angry with Umar?" She shouted, "Why wouldn't I be angry? He became Khalifa, but did he give me a single coin? Did he ever check how I am living? He is not a human!" Hearing this, Umar became very concerned. He softly asked, "How would Umar know your condition? You could have gone and told him." She replied, "Why should I go? Umar is Amirul Muminin, he should check on everyone. That is why he took the responsibility of the state." Umar calmly said, "How much money would you take to forgive Umar for the hardship you faced?" While they were talking, Hazrat Ali and Abdullah ibn Masud (RA) arrived and said, "Assalamu Alaikum Ya Amirul Muminin." Hearing 'Amirul Muminin', the old woman was shocked and trembled with fear. Hazrat Umar consoled her and gave her twenty-five gold coins and said, "Write on this leather that on the Day of Judgment, I have no claim against Umar." And Hazrat Ali signed as a witness. Hazrat Umar used to wear patched clothes. When he went to conquer Baitul Muqaddas, his dress had 17 patches. The companions requested him to wear better clothes as he was going to the land of Christians and Jews. They asked Ayesha (RA) to tell him. Hazrat Ayesha (RA) called him and said, "Amirul Muminin, please change this patched shirt for now." The Khalifa started crying and said, "Mother! Do you want to distance me from Rasulullah (SAW)? Don't you remember the days when the Prophet (SAW) remained hungry for days, no fire burned in his stove for three days? The Prophet wore patched clothes. The taste Umar feels in this torn patched clothing cannot be explained." It is recorded that when Umar was describing the helplessness of Rasulullah, both Ayesha and Hafsa cried profusely. Then he went to conquer Baitul Muqaddas wearing the patched clothes. At the gate of Jerusalem, the Khalifa of 2.2 million square miles was holding the camel's rope, while his servant was sitting on the camel. Commander Abu Ubaida said to wear better clothes. Hazrat Umar became angry and said, "We are the nation whom Allah has honored with Islam. If we seek honor through anything other than Islam, Allah will dishonor us."`
},
2:{
 bn:`হযরত আবু বকর (রাঃ) - ইসলামের প্রথম খলিফা, সিদ্দিকে আকবর। রাসূলুল্লাহ (সাঃ) এর সবচেয়ে ঘনিষ্ঠ সাহাবী। তিনি ছিলেন অত্যন্ত নরম হৃদয়ের, দানশীল ও সত্যবাদী।`,
 en:`Hazrat Abu Bakr (RA) - First Khalifa of Islam, Siddiq-e-Akbar. Closest companion of Rasulullah (SAW).`
}
};

function toggleLang(){lang=lang==='bn'?'en':'bn';document.getElementById('langBtn').innerText=lang==='bn'?'EN':'BN';document.getElementById('title').innerText=lang==='bn'?'ইসলামিক জীবনী':'Islamic Biography';document.querySelectorAll('[data-bn]').forEach(e=>{e.innerText=e.getAttribute(lang==='bn'?'data-bn':'data-en');});if(!document.getElementById('storyView').classList.contains('hidden')){renderText();loadAudioSrc();}}

function openStory(id){curId=id;document.getElementById('listView').classList.add('hidden');let v=document.getElementById('storyView');v.classList.remove('hidden');v.classList.add('flex');document.getElementById('storyTitle').innerText=id==1?(lang==='bn'?'উমর ও বুড়িমা':'Umar & Old Woman'):(lang==='bn'?'আবু বকর (রাঃ)':'Abu Bakr');renderText();loadAudioSrc();}

function renderText(){let t=stories[curId][lang];let parts=t.split(/(\s+)/);let html='';parts.forEach((w,i)=>{if(w.trim()) html+=`<span id="w${i}" class="word">${w}</span> `; else html+=w;});document.getElementById('storyText').innerHTML=html;words=parts;}

function loadAudioSrc(){let src=audioFiles[curId][lang];audio.src=src;audio.load();}

function toggleAudio(){if(!audio.src || audio.src.includes('undefined')){alert('অডিও পাওয়া যায়নি!\n'+audioFiles[curId][lang]+'\nফোল্ডারে রাখুন');return;}if(isPlay){audio.pause();isPlay=false;document.getElementById('playBtn').innerText='▶';}else{audio.play().catch(()=>alert('অডিও ফাইল নেই: '+audioFiles[curId][lang]));isPlay=true;document.getElementById('playBtn').innerText='⏸';}}

audio.addEventListener('timeupdate',()=>{
 let cur=audio.currentTime,dur=audio.duration||1;
 document.getElementById('cur').innerText=fmt(cur);
 document.getElementById('dur').innerText=fmt(dur);
 document.getElementById('progress').style.width=(cur/dur*100)+'%';
 document.getElementById('pct').innerText=Math.floor(cur/dur*100)+'%';
 let idx=Math.floor(cur/0.45);
 document.querySelectorAll('.word').forEach(w=>w.classList.remove('active'));
 let el=document.getElementById('w'+idx);
 if(el){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'center'});}
});
audio.addEventListener('ended',()=>{isPlay=false;document.getElementById('playBtn').innerText='▶';});
function fmt(s){if(isNaN(s))return'00:00';let m=Math.floor(s/60),sc=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');}
function backList(){audio.pause();isPlay=false;document.getElementById('playBtn').innerText='▶';document.getElementById('storyView').classList.add('hidden');document.getElementById('storyView').classList.remove('flex');document.getElementById('listView').classList.remove('hidden');}
function goHome(){audio.pause();location.href='./islamic.html';}
</script>

</html>
