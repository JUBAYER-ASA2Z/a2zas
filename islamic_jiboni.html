<!DOCTYPE html>
<html lang="bn" translate="no" class="notranslate">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Islamic Jiboni - A-S A2Z</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:'Hind Siliguri'}body{top:0!important}.bg-pro{background:linear-gradient(135deg,#064e3b,#0a3d1f)}.word{display:inline-block;margin:1px;padding:2px 4px;border-radius:6px;transition:0.2s}.word.active{background:#facc15!important;color:black!important;font-weight:900;box-shadow:0 2px 10px rgba(250,204,21,0.8);transform:scale(1.08)}</style>
</head>
<body class="bg-pro min-h-screen">
<div class="max-w-[480px] mx-auto min-h-screen flex flex-col bg-white/5">

<div class="p-4 flex justify-between items-center sticky top-0 z-20 bg-black/30 backdrop-blur">
<button onclick="location.href='./islamic.html'" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-black">←</button>
<div class="text-center"><h1 class="font-black text-white text-[15px]">ইসলামিক জীবনী</h1><p class="text-white/60 text-[9px]">NO FOLDER • ROOT AUDIO</p></div>
<button id="langBtn" onclick="toggleLang()" class="px-3 py-1.5 rounded-full bg-white text-[11px] font-black">EN</button>
</div>

<div id="listView" class="p-3 space-y-3">
<div onclick="openStory(1)" class="bg-white rounded-[20px] p-4 flex gap-3 shadow-xl border-l-[6px] border-emerald-600 active:scale-95 cursor-pointer"><div class="w-12 h-12 rounded-xl bg-emerald-700 text-white flex items-center justify-center font-black">1</div><div class="flex-1"><h3 class="font-black text-[14px]">হযরত উমর ও বুড়িমা</h3><p class="text-[9px] text-zinc-500">umar-burima-bn.mp3 (root)</p></div><span>▶</span></div>
<div onclick="openStory(2)" class="bg-white rounded-[20px] p-4 flex gap-3 shadow-xl border-l-[6px] border-amber-500 active:scale-95 cursor-pointer"><div class="w-12 h-12 rounded-xl bg-amber-600 text-white flex items-center justify-center font-black">2</div><div class="flex-1"><h3 class="font-black text-[14px]">হযরত আবু বকর</h3><p class="text-[9px] text-zinc-500">abubakar-bn.mp3 (root)</p></div><span>▶</span></div>
</div>

<div id="storyView" class="hidden flex-col bg-[#fffef5] min-h-screen">
<div class="bg-emerald-800 p-4 text-white sticky top-0 z-10">
<div class="flex justify-between items-center"><button onclick="backList()" class="w-9 h-9 bg-white/20 rounded-full">←</button><div id="stitle" class="font-black text-[12px] flex-1 text-center"></div><button onclick="toggleAudio()" id="playBtn" class="w-12 h-12 bg-yellow-400 text-black rounded-full font-black text-[20px]">▶</button></div>
<audio id="audioPlayer" preload="auto" playsinline></audio>
<div class="mt-3"><div class="h-2.5 bg-white/20 rounded-full overflow-hidden"><div id="bar" class="h-full bg-yellow-400 w-0"></div></div><div class="flex justify-between text-[11px] mt-1 font-bold"><span id="cur">00:00</span><span id="dur">00:00</span><span id="pct">0%</span></div></div>
<div id="debug" class="text-[9px] mt-2 opacity-70"></div>
</div>
<div id="storyText" class="p-5 text-[18px] leading-[36px]"></div>
</div>
</div>

<script>
let lang='bn',curId=1,words=[],isPlay=false,timer=null;
const audio=document.getElementById('audioPlayer');
// এখন রুটে খুঁজবে, ফোল্ডার নেই
const audioFiles={
 1:{bn:'umar-burima-bn.mp3',en:'umar-burima-en.mp3'},
 2:{bn:'abubakar-bn.mp3',en:'abubakar-en.mp3'}
};
const rootPaths=['./','/','https://jubayer-asa2z.github.io/',''];

const stories={
1:{bn:`হযরত উমর (রাঃ) একদিন তিনি হেঁটে কোথাও যাচ্ছিলেন। কিছুদূর যাওয়ার পরেই দেখলেন এক বৃদ্ধাকে। বৃদ্ধা কি যেন বিড়বিড় করছে। হযরত উমর তার কাছে গেলেন। তার খোঁজখবর নিলেন। জিজ্ঞেস করলেন, "আচ্ছা বুড়িমা, খলিফা উমর সম্পর্কে তোমার ধারণা কি?" বুড়ি হযরত উমরকে আগে কখনো দেখেনি, তাই তাকে সে চিনতে পারেনি। বুড়ি হযরত উমরের কথা শুনে কিছুটা বিরক্ত হলো। বললো, "উমর-টুমর দিয়ে আমি কি করব? আমার কি এমন ঠেকা পড়ল যে আমার তার খবর নিতে হবে? নিজের চিন্তায় বাঁচি না!" হযরত উমর আবার তাকে জিজ্ঞাসা করলেন, "বুড়িমা, উমরের ওপর তোমার এতো রাগ কেন?" বুড়ি চেঁচিয়ে জবাব দেয়, "রাগ হবে না কেন? এই যে সে খলিফা হয়েছে, তো আমায় কি একটা পয়সাও দিয়েছে? নাকি কোনোদিন আমার খোঁজখবর নিয়েছে? ও মানুষ না!" হযরত উমর বুড়ির কথা শুনে বড়ই চিন্তিত হলেন। "ঠিকই তো, আমি তো তার তেমন খোঁজখবর নিতে পারিনি।" তিনি নরম হয়ে জিজ্ঞাসা করলেন, "তুমি কি অবস্থায় আছো উমর কি করে জানবে?" বুড়ি জবাব দেয়, "কেন? আমি জানাতে যাব কেন? উমরই তো আমিরুল মুমিনীন, সেই তো সবার খোঁজখবর নেবে।" হযরত উমর শান্তভাবে বললেন, "আচ্ছা, তুমি কত টাকা পেলে উমরকে মাফ করে দেবে?" এমন সময় হযরত আলী এবং আব্দুল্লাহ ইবনে মাসুদ (রাঃ) এসে হাজির হলেন। তারা সালাম দিলেন: "আসসালামু আলাইকুম ইয়া আমিরুল মুমিনীন।" 'আমিরুল মুমিনীন' শব্দ শুনে বুড়ি তাজ্জব হয়ে গেল। সে ভয়ে কাঁপতে লাগলো। হযরত উমর বৃদ্ধাকে সান্ত্বনা দিলেন এবং পঁচিশটি স্বর্ণমুদ্রা দিয়ে বললেন, "বুড়িমা, তুমি এই চামড়ায় লিখে দাও যে, কিয়ামতের দিন উমরের কাছে আমার কোনো দাবি নেই।" হযরত উমর তালি লাগানো জামা পরতেন। যখন তিনি বায়তুল মুকাদ্দাস জয় করতে বের হচ্ছিলেন, তার জামায় ১৭টি তালি ছিল। সাহাবারা বললেন ভালো কাপড় পরতে। হযরত আয়েশা (রাঃ) তাকে ডেকে বললেন ভালো জামা পরতে। খলিফা কেঁদে ফেললেন। বললেন, "আম্মা! আপনি কি আমাকে রাসূলুল্লাহ (সাঃ) থেকে দূরে সরাতে চাচ্ছেন? আপনার কি মনে নেই নবীজি (সাঃ) দিনের পর দিন উপবাস থেকেছেন, তিন দিন চুলায় আগুন জ্বলেনি।" সিরাতের কিতাবে আছে, খলিফা যখন রাসূলের অসহায়ত্বের কথা বলছিলেন, তখন আয়েশা এবং হাফসা দুজনেই অঝোরে কাঁদছিলেন। অতঃপর তিনি তালিযুক্ত কাপড় পরেই বায়তুল মুকাদ্দাস জয়ের জন্য বের হলেন। জেরুজালেমের দ্বারে ২২ লক্ষ বর্গমাইলের খলিফার হাতে উটের রশি, উটের উপর খাদেম। সেনাপতি আবু উবায়দা বললেন ভালো পোশাক পরতে। হযরত উমর রেগে বললেন, "আমরা সেই জাতি, যাদের আল্লাহ ইসলাম দ্বারা সম্মানিত করেছেন। আমরা যদি ইসলাম ছাড়া অন্য উপায়ে সম্মান খুঁজি, আল্লাহ আমাদের অসম্মানিত করবেন।"`,en:`Hazrat Umar was walking one day. He saw an old woman muttering. He asked about Khalifa Umar. She said why should I care? He became concerned. He gave 25 gold coins and said write that on Day of Judgment you have no claim. He wore patched clothes with 17 patches. He said we are honored by Islam.`},
2:{bn:`হযরত আবু বকর (রাঃ) ইসলামের প্রথম খলিফা।`,en:`Hazrat Abu Bakr first Khalifa.`}
};

function toggleLang(){lang=lang==='bn'?'en':'bn';document.getElementById('langBtn').innerText=lang==='bn'?'EN':'BN';if(!document.getElementById('storyView').classList.contains('hidden')){renderText();loadRoot();}}
function openStory(id){curId=id;document.getElementById('listView').classList.add('hidden');let v=document.getElementById('storyView');v.classList.remove('hidden');v.classList.add('flex');document.getElementById('stitle').innerText=id==1?'উমর ও বুড়িমা':'আবু বকর';renderText();loadRoot();}
function renderText(){let t=stories[curId][lang];let parts=t.split(/(\s+)/);let html='';parts.forEach((w,i)=>{if(w.trim()&&w!=='\n'){html+=`<span id="w${i}" class="word">${w}</span> `}else html+=w.includes('\n')?'<br>':w;});document.getElementById('storyText').innerHTML=html;words=parts;}

async function loadRoot(){
 let file=audioFiles[curId][lang];
 document.getElementById('debug').innerText='খুঁজছি: '+file+' (root এ)';
 for(let base of rootPaths){
   let url=base+file;
   try{
     let r=await fetch(url,{method:'HEAD'});
     if(r.ok){audio.src=url;document.getElementById('debug').innerText='✅ পাওয়া গেছে: '+url;return;}
   }catch(e){}
 }
 audio.src='./'+file;
 document.getElementById('debug').innerText='❌ রুটে পাওয়া যায়নি, সরাসরি আপলোড করুন: '+file;
}

function toggleAudio(){
 if(!audio.src){loadRoot();return;}
 if(isPlay){audio.pause();isPlay=false;document.getElementById('playBtn').innerText='▶';clearInterval(timer);return;}
 audio.play().then(()=>{
   isPlay=true;document.getElementById('playBtn').innerText='⏸';
   timer=setInterval(()=>{
     let cur=audio.currentTime||0,dur=audio.duration||1;
     let idx=Math.floor(cur/0.45);
     document.querySelectorAll('.word').forEach(w=>w.classList.remove('active'));
     let el=document.getElementById('w'+idx);
     if(el){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'center'});}
     document.getElementById('bar').style.width=(cur/dur*100)+'%';
     document.getElementById('cur').innerText=fmt(cur);
     document.getElementById('dur').innerText=fmt(dur);
     document.getElementById('pct').innerText=Math.floor(cur/dur*100)+'%';
   },150);
 }).catch(e=>{
   alert('অডিও পাওয়া যায়নি: '+audio.src+'\n\nGitHub এ '+audioFiles[curId][lang]+' নামে রুটে আপলোড করুন');
 });
}

function fmt(s){if(isNaN(s))return'00:00';let m=Math.floor(s/60),sc=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');}
function backList(){audio.pause();isPlay=false;clearInterval(timer);document.getElementById('playBtn').innerText='▶';document.getElementById('storyView').classList.add('hidden');document.getElementById('listView').classList.remove('hidden');}
</script>
</body>
</html>
