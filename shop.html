<!DOCTYPE html>
<html lang="bn" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Hind Siliguri'; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:#0f0f14; overscroll-behavior:none; user-select:none;}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.1);position:sticky;top:0;z-index:20}
.back-btn{background:#fff;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:800}
.gold-pill{background:linear-gradient(135deg,#FFD700,#FF8C00);color:#000;padding:8px 18px;border-radius:30px;font-weight:900;box-shadow:0 4px 15px rgba(255,215,0,0.4)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;max-width:480px;margin:auto}
.card{border-radius:22px;padding:12px;position:relative;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg, rgba(255,255,255,0.2), transparent);pointer-events:none}
.img-box{width:100%;height:130px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.img-box img{width:100%;height:100%;object-fit:cover;transition:0.3s}
.card:hover.img-box img{transform:scale(1.08)}
.badge{position:absolute;top:12px;left:12px;background:#000;color:#fff;font-size:10px;padding:4px 8px;border-radius:20px;font-weight:800;z-index:2}
.card h3{color:#fff;font-size:14px;margin:10px 0 2px 0;font-weight:800;line-height:16px}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{color:#FFD700;font-weight:900;font-size:14px}
.buy{border:none;padding:7px 14px;border-radius:20px;font-weight:900;font-size:12px;cursor:pointer;background:#fff;color:#000}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);padding:14px 24px;border-radius:30px;font-weight:900;z-index:10000;transition:0.5s cubic-bezier(0.34,1.56,0.64,1);opacity:0;color:#fff}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{background:linear-gradient(135deg,#00e676,#00a152)}
#toast.error{background:linear-gradient(135deg,#ff5252,#d32f2f)}
.lang{border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;padding:6px 14px;border-radius:20px;font-weight:800}
.policy{max-width:480px;margin:10px auto;padding:10px;font-size:10px;color:rgba(255,255,255,0.5);text-align:center}
.goog-te-banner-frame{display:none!important}
</style>
</head>
<body class="notranslate">
<div id="toast"></div>
<div class="top-bar">
<div style="display:flex;align-items:center;gap:8px"><button class="back-btn" onclick="location.href='account.html'">←</button><b style="color:#fff" id="title">🛍️ Premium Shop</b></div>
<div style="display:flex;gap:8px;align-items:center"><button class="lang" id="langBtn" onclick="toggleLang()">EN</button><div id="goldDisplay" class="gold-pill">💰 0</div></div>
</div>

<div class="grid" id="shopGrid"></div>

<div class="policy"><span id="policyText">সব প্রোডাক্ট ভার্চুয়াল কালেকশন, রিয়েল ডেলিভারি নয়। Gold এর কোনো বাস্তব মূল্য নেই।</span></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_oRlZS8lwB9JnkZQeUCQOfn-BVrMSPtEyqVvBuKUjH9KMAyMABT0PER46gTqB4P4J/exec";
let lang = localStorage.getItem('a2z_lang') || 'bn';
const dict = {
 bn: {title:"🛍️ প্রিমিয়াম শপ", buy:"কিনুন", policy:"সব প্রোডাক্ট ভার্চুয়াল কালেকশন, রিয়েল ডেলিভারি নয়। Gold এর কোনো বাস্তব মূল্য নেই।", toastNoGold:"Gold কম আছে", toastSuccess:"সফলভাবে কেনা হয়েছে!"},
 en: {title:"🛍️ Premium Shop", buy:"Buy", policy:"All products are virtual collections, no real delivery. Gold has no real value.", toastNoGold:"Not enough Gold", toastSuccess:"Purchased successfully!"}
};

const products = [
  {id:"attar", name_bn:"প্রিমিয়াম আতর বক্স", name_en:"Premium Attar Box", price:500, color:"linear-gradient(135deg,#FF9A9E,#FECFEF)", img:"https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400"},
  {id:"mic", name_bn:"প্রো মাইক্রোফোন", name_en:"Pro Microphone", price:600, color:"linear-gradient(135deg,#667eea,#764ba2)", img:"https://images.unsplash.com/photo-1590602847861-f357a3f2a4c2?w=400"},
  {id:"drone", name_bn:"4K ড্রোন", name_en:"4K Drone", price:4000, color:"linear-gradient(135deg,#43cea2,#185a9d)", img:"https://images.unsplash.com/photo-1473968512647-3e447244af8f?w=400"},
  {id:"bicycle", name_bn:"স্পোর্টস বাইসাইকেল", name_en:"Sports Bicycle", price:11000, color:"linear-gradient(135deg,#ff9966,#ff5e62)", img:"https://images.unsplash.com/photo-1484156818044-c0402b43b4ad?w=400"},
  {id:"book", name_bn:"ইসলামিক বই সেট", name_en:"Islamic Book Set", price:300, color:"linear-gradient(135deg,#f6d365,#fda085)", img:"https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400"},
  {id:"watch", name_bn:"স্মার্ট ওয়াচ", name_en:"Smart Watch", price:2500, color:"linear-gradient(135deg,#a1c4fd,#c2e9fb)", img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"},
  {id:"headphone", name_bn:"গেমিং হেডফোন", name_en:"Gaming Headphone", price:1200, color:"linear-gradient(135deg,#ffecd2,#fcb69f)", img:"https://images.unsplash.com/photo-1484704849700-f032a568e944?w=400"},
  {id:"perfume", name_bn:"আরবিয়ান পারফিউম", name_en:"Arabian Perfume", price:800, color:"linear-gradient(135deg,#d299c2,#fef9d7)", img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=400"},
];

function toast(m,type="success"){let e=document.getElementById('toast');e.innerText=m;e.className=type;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
function toggleLang(){lang=lang=='bn'?'en':'bn';localStorage.setItem('a2z_lang',lang);applyLang()}
function applyLang(){
  document.getElementById('langBtn').innerText=lang=='bn'?'EN':'বাংলা';
  document.getElementById('title').innerText=dict[lang].title;
  document.getElementById('policyText').innerText=dict[lang].policy;
  render();
}

function render(){
  let g=document.getElementById('shopGrid'); g.innerHTML="";
  products.forEach(p=>{
    let name=lang=='bn'?p.name_bn:p.name_en;
    g.innerHTML+=`
    <div class="card" style="background:${p.color}">
      <div class="badge">NEW</div>
      <div class="img-box"><img src="${p.img}" loading="lazy"></div>
      <h3>${name}</h3>
      <div class="price-row"><span class="price">💰 ${p.price}</span><button class="buy" onclick="buyProduct('${p.id}',${p.price})">${dict[lang].buy}</button></div>
    </div>`;
  });
}

function refreshGold(){let u=localStorage.getItem('a2z_userId'); if(!u)return; fetch(`${SCRIPT_URL}?action=getUserData&userId=${u}`).then(r=>r.json()).then(d=>{document.getElementById('goldDisplay').innerText="💰 "+(d.gold||0);});}
function buyProduct(id,price){
  let u=localStorage.getItem('a2z_userId'); if(!u){toast("Login first","error");return;}
  fetch(`${SCRIPT_URL}?action=getUserData&userId=${u}`).then(r=>r.json()).then(d=>{
    if((d.gold||0)<price){toast(dict[lang].toastNoGold,"error");return;}
    if(!confirm((lang=='bn'?`💰 ${price} Gold দিয়ে কিনবেন?`:`Buy for ${price} Gold?`)))return;
    fetch(`${SCRIPT_URL}?action=buyProduct&userId=${u}&amount=${price}&productId=${id}`).then(r=>r.json()).then(res=>{
      if(res.ok){toast("🎉 "+dict[lang].toastSuccess,"success");refreshGold();}
      else toast("Failed","error");
    });
  });
}

applyLang(); refreshGold();
</script>
</body>
</html>
