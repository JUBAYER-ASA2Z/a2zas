let idx=0, score=parseInt(localStorage.islamicBNScore||0), answered=Array(questions.length).fill(null);
function render(){
  let qq=questions[idx];
  document.getElementById('qnum').innerText=idx+1;
  document.getElementById('score').innerText=score;
  document.getElementById('progress').style.width=((idx+1)/questions.length*100)+'%';
  let html=`<div class="q-card"><h2>${idx+1}. ${qq.q}</h2>`;
  qq.o.forEach((opt,i)=>{
    let cls='opt';
    if(answered[idx]!==null){
      if(i==qq.a) cls+=' correct';
      else if(i==answered[idx]) cls+=' wrong';
    }
    html+=`<button class="${cls}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${opt}</button>`;
  });
  html+=`<div class="meta"><span style="color:${answered[idx]!==null? (answered[idx]==qq.a? '#00e676':'#ff3b30'):'#888'}">${answered[idx]!==null? (answered[idx]==qq.a? '✅ সঠিক +5':'❌ ভুল -15') : '👉 একটা উত্তর দিন, তারপর Next'}</span><span>${idx+1}/200</span></div></div>`;
  document.getElementById('quiz').innerHTML=html;
  let nextBtn=document.getElementById('nextBtn');
  if(answered[idx]===null) nextBtn.classList.add('locked'); else nextBtn.classList.remove('locked');
}
function choose(i){
  if(answered[idx]!==null) return;
  answered[idx]=i;
  if(i==questions[idx].a) score+=5; else { score-=15; if(score<0) score=0; }
  localStorage.islamicBNScore=score; render();
}
function next(){
  if(answered[idx]===null){ alert('⚠️ আগে উত্তর দিন! যেকোনো একটা অপশনে ক্লিক করুন।'); return; }
  if(idx<questions.length-1){ idx++; render(); scrollTo(0,0); }
  else alert('🎉 আলহামদুলিল্লাহ! 200 টা শেষ! ফাইনাল স্কোর: '+score);
}
