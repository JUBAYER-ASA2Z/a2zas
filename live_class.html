<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Class - A-S A2Z</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{font-family:'Hind Siliguri';-webkit-tap-highlight-color:transparent;user-select:none;box-sizing:border-box}
body{margin:0;background:#0f172a;overflow:hidden;height:100dvh}
.finger{position:absolute;width:60px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;z-index:50;touch-action:none;background:transparent;border:none;box-shadow:none}
.finger .emoji{font-size:48px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6));}
.finger .label{margin-top:2px;background:#000;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1.5px solid #fff}
.finger.mine .emoji{filter:drop-shadow(0 0 12px rgba(34,197,94,0.9)) drop-shadow(0 4px 8px rgba(0,0,0,0.6));}
.finger.mine .label{background:#22c55e}
.finger.locked{pointer-events:none !important;}
#boardImg{max-width:100%;max-height:100%;object-fit:contain;transition:transform .15s}
</style>
</head>
<body>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNxqVW6RX0eH9e9JCTVNvF2hLBfgRZy972_gavzXE2axmSADefYV04gqWh0sFxpIoBgA/exec";
const TEACHER_PIN = "123";
</script>

<!-- TOP BAR -->
<div class="absolute top-0 left-0 right-0 z-[100] bg-black/60 backdrop-blur px-3 py-2 flex items-center gap-2">
  <button onclick="leaveAndBack()" class="w-9 h-9 bg-white text-black rounded-full font-black">←</button>
  <div class="flex-1">
    <p class="text-white font-black text-[13px] leading-none" data-t="liveClass">📚 Live Class</p>
    <p class="text-white/60 text-[10px] font-bold mt-0.5"><span data-t="room">Room</span>: <span id="roomLabel">---</span></p>
  </div>
  <button onclick="toggleLang()" id="langBtn" class="w-11 h-9 bg-white text-black rounded-full text-[11px] font-black">EN</button>
  <label class="bg-emerald-500 text-white text-[11px] font-black px-3 py-2 rounded-full cursor-pointer"><span data-t="photo">📸 ছবি</span><input type="file" id="imgInput" accept="image/*" class="hidden"></label>
  <button onclick="deleteImage()" class="bg-red-500 text-white text-[11px] font-black px-3 py-2 rounded-full"><span data-t="delete">🗑️ মুছুন</span></button>
</div>

<!-- JOIN -->
<div id="joinBox" class="absolute inset-0 z-[200] bg-slate-900/95 flex items-center justify-center p-6">
  <div class="bg-white rounded-[24px] p-6 w-full max-w-[340px] text-center">
    <p class="text-[48px]">👆👆</p>
    <p class="font-black text-[20px] mt-2" data-t="joinTitle">Live Class</p>
    <input id="roomInput" placeholder="রুম কোড" class="w-full mt-4 border-2 border-slate-200 rounded-full px-4 py-3 text-center font-black text-[16px] outline-none" inputmode="numeric">
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button onclick="joinAs('teacher')" class="bg-blue-600 text-white py-3 rounded-full font-black text-[13px]" data-t="teacherBtn">👆 টিচার</button>
      <button onclick="joinAs('student')" class="bg-emerald-600 text-white py-3 rounded-full font-black text-[13px]" data-t="studentBtn">👆 স্টুডেন্ট</button>
    </div>
    <button onclick="createRoom()" class="w-full mt-2 bg-slate-900 text-white py-3 rounded-full font-black text-[12px]" data-t="createRoom">+ নতুন রুম বানান</button>
    <p class="text-[11px] text-slate-500 mt-4 font-black">Developer JUBAYER A S</p>
  </div>
</div>

<!-- TEACHER PIN MODAL -->
<div id="pinModal" class="hidden fixed inset-0 z-[300] bg-slate-900/80 backdrop-blur flex items-center justify-center p-6">
  <div class="bg-white rounded-[24px] p-6 w-full max-w-[300px] text-center">
    <p class="text-[40px]">🔐</p>
    <p class="font-black text-[17px] mt-2" data-t="pinTitle">টিচার কোড দিন</p>
    <p class="text-slate-500 text-[11px] font-bold mt-1" data-t="pinDesc">টিচার ছাড়া কেউ এই কোড জানে না</p>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="•••" class="w-full mt-4 border-2 border-blue-200 rounded-full px-4 py-3 text-center font-black text-[20px] outline-none tracking-[8px]">
    <button onclick="checkTeacherPin()" class="w-full mt-3 bg-blue-600 text-white py-3 rounded-full font-black text-[13px]" data-t="enter">প্রবেশ করুন</button>
    <button onclick="closePin()" class="w-full mt-2 bg-slate-100 text-slate-600 py-3 rounded-full font-black text-[12px]" data-t="cancel">বাতিল</button>
  </div>
</div>

<!-- BOARD -->
<div id="board" class="absolute inset-0 top-[56px] bottom-[76px] flex items-center justify-center bg-slate-900 overflow-hidden">
  <p id="noImgText" class="text-white/40 font-black text-[14px] text-center px-6" data-t="uploadText">📸 উপরে ছবি আপলোড করুন</p>
  <img id="boardImg" class="hidden">
  <div id="zoomBox" class="hidden absolute bottom-3 right-3 z-[60] flex gap-2">
    <button onclick="zoom(-0.2)" class="w-11 h-11 bg-white rounded-full font-black text-[20px] shadow">−</button>
    <button onclick="zoom(0.2)" class="w-11 h-11 bg-white rounded-full font-black text-[20px] shadow">+</button>
    <button onclick="resetZoom()" class="px-3 h-11 bg-white rounded-full font-black text-[11px] shadow" data-t="reset">Reset</button>
  </div>
</div>

<!-- টিচার 👆 -->
<div id="teacherFinger" class="finger locked" style="left:20px;top:140px;">
  <span class="emoji">👆</span>
  <span class="label" data-t="teacherLabel">টিচার</span>
</div>
<!-- স্টুডেন্ট 👆 -->
<div id="studentFinger" class="finger locked" style="left:120px;top:140px;">
  <span class="emoji">👆</span>
  <span class="label" data-t="studentLabel">স্টুডেন্ট</span>
</div>

<!-- BOTTOM -->
<div class="absolute bottom-0 left-0 right-0 z-[100] bg-black/80 backdrop-blur px-4 py-3 flex items-center justify-between gap-3">
  <div class="flex items-center gap-2">
    <span id="myRoleBadge" class="bg-white/20 text-white text-[11px] font-black px-3 py-1.5 rounded-full">---</span>
    <span id="voiceStatus" class="text-white/70 text-[11px] font-bold" data-t="micOff">🎤 কথা বন্ধ</span>
  </div>
  <div class="flex gap-2">
    <button id="speakerBtn" onclick="toggleSpeaker()" class="w-12 h-12 bg-white rounded-full text-[22px] flex items-center justify-center shadow">🔊</button>
    <button id="micBtn" onclick="toggleMic()" class="w-12 h-12 bg-red-500 text-white rounded-full text-[22px] flex items-center justify-center shadow">🔇</button>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>

<script>
// ✅ বাংলা / English - সব লেখা
let lang = localStorage.getItem('live_lang') || 'bn';
const T = {
bn:{
  liveClass:'📚 Live Class', room:'Room', photo:'📸 ছবি', delete:'🗑️ মুছুন',
  joinTitle:'Live Class', teacherBtn:'👆 টিচার', studentBtn:'👆 স্টুডেন্ট', createRoom:'+ নতুন রুম বানান',
  pinTitle:'টিচার কোড দিন', pinDesc:'টিচার ছাড়া কেউ এই কোড জানে না', enter:'প্রবেশ করুন', cancel:'বাতিল',
  uploadText:'📸 উপরে ছবি আপলোড করুন', reset:'Reset',
  teacherLabel:'টিচার', studentLabel:'স্টুডেন্ট',
  micOff:'🎤 কথা বন্ধ', micOn:'🎤 আপনার কথা সবাই শুনছে', speakerOn:'🔊 অপর প্রান্তের কথা শুনছেন', speakerOff:'🔇 স্পিকার বন্ধ',
  roomPlaceholder:'রুম কোড', alertRoom:'রুম কোড দিন', alertWrongPin:'ভুল কোড! টিচার কোড সঠিক নয়',
  alertWrongRoom:'ভুল রুম কোড! সঠিক কোড দিন', alertCheck:'রুম চেক করা যাচ্ছে না, আবার চেষ্টা করুন',
  alertMic:'Mic Permission Allow করেন', alertRoomCode:'আপনার রুম কোড: ',
  badgeTeacher:'👆 টিচার', badgeStudent:'👆 স্টুডেন্ট'
},
en:{
  liveClass:'📚 Live Class', room:'Room', photo:'📸 Photo', delete:'🗑️ Delete',
  joinTitle:'Live Class', teacherBtn:'👆 Teacher', studentBtn:'👆 Student', createRoom:'+ Create New Room',
  pinTitle:'Enter Teacher Code', pinDesc:'Only teacher knows this code', enter:'Enter', cancel:'Cancel',
  uploadText:'📸 Upload photo from top', reset:'Reset',
  teacherLabel:'Teacher', studentLabel:'Student',
  micOff:'🎤 Muted', micOn:'🎤 Everyone can hear you', speakerOn:'🔊 You can hear them', speakerOff:'🔇 Speaker Off',
  roomPlaceholder:'Room Code', alertRoom:'Enter Room Code', alertWrongPin:'Wrong Code! Teacher code is not correct',
  alertWrongRoom:'Wrong Room Code! Enter correct code', alertCheck:'Cannot check room, try again',
  alertMic:'Please Allow Mic Permission', alertRoomCode:'Your Room Code: ',
  badgeTeacher:'👆 Teacher', badgeStudent:'👆 Student'
}
};
function applyLang(){
  document.querySelectorAll('[data-t]').forEach(el=>{
    let k = el.getAttribute('data-t');
    if(T[lang][k]) el.innerText = T[lang][k];
  });
  document.getElementById('roomInput').placeholder = T[lang].roomPlaceholder;
  document.getElementById('langBtn').innerText = lang==='bn' ? 'EN' : 'BN';
  // ফিঙ্গার লেবেল + ব্যাজ আপডেট
  let tL = document.querySelector('#teacherFinger .label');
  let sL = document.querySelector('#studentFinger .label');
  if(tL) tL.innerText = T[lang].teacherLabel;
  if(sL) sL.innerText = T[lang].studentLabel;
  if(myRole){
    document.getElementById('myRoleBadge').innerText = myRole==='teacher' ? T[lang].badgeTeacher : T[lang].badgeStudent;
    document.getElementById('voiceStatus').innerText = micOn ? T[lang].micOn : T[lang].micOff;
  }
}
function toggleLang(){
  lang = lang==='bn' ? 'en' : 'bn';
  localStorage.setItem('live_lang', lang);
  applyLang();
}

let myRole='', roomId='', myPeer=null, myStream=null, speakerOn=true, micOn=false;
let scale=1, myId='U'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let lastImg = '', lastPointerSent = 0;
let pendingRole = '';

function createRoom(){
  let code = Math.floor(1000 + Math.random()*9000).toString();
  document.getElementById('roomInput').value = code;
  sendToSheet({room: code, type:'createRoom'});
  alert(T[lang].alertRoomCode + code);
}
async function joinAs(role){
  roomId = document.getElementById('roomInput').value.trim();
  if(!roomId){ alert(T[lang].alertRoom); return; }
  if(role === 'teacher'){
    pendingRole = 'teacher';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinModal').classList.remove('hidden');
    document.getElementById('pinInput').focus();
    return;
  }
  await enterRoom('student');
}
function closePin(){
  document.getElementById('pinModal').classList.add('hidden');
  pendingRole = '';
}
async function checkTeacherPin(){
  let pin = document.getElementById('pinInput').value.trim();
  if(pin !== TEACHER_PIN){
    alert(T[lang].alertWrongPin);
    document.getElementById('pinInput').value = '';
    return;
  }
  document.getElementById('pinModal').classList.add('hidden');
  await enterRoom('teacher');
}
async function enterRoom(role){
  if(role === 'teacher'){
    await sendToSheet({room: roomId, type:'createRoom'});
  }
  try{
    let res = await fetch(APPS_SCRIPT_URL + "?action=checkRoom&room=" + roomId + "&t=" + Date.now());
    let data = await res.json();
    if(!data.exists){
      alert(T[lang].alertWrongRoom);
      return;
    }
  }catch(e){
    alert(T[lang].alertCheck);
    return;
  }
  myRole = role;
  document.getElementById('joinBox').style.display='none';
  document.getElementById('roomLabel').innerText = roomId;
  document.getElementById('myRoleBadge').innerText = role==='teacher' ? T[lang].badgeTeacher : T[lang].badgeStudent;
  let t = document.getElementById('teacherFinger');
  let s = document.getElementById('studentFinger');
  if(role === 'teacher'){
    t.classList.remove('locked'); t.classList.add('mine'); t.style.pointerEvents = 'auto';
    s.classList.remove('mine'); s.classList.add('locked'); s.style.pointerEvents = 'none';
    makeDraggable(t, 'teacher');
  } else {
    s.classList.remove('locked'); s.classList.add('mine'); s.style.pointerEvents = 'auto';
    t.classList.remove('mine'); t.classList.add('locked'); t.style.pointerEvents = 'none';
    makeDraggable(s, 'student');
  }
  startPolling();
  initVoice();
}
async function sendToSheet(payload){
  try{ await fetch(APPS_SCRIPT_URL, {method:'POST', mode:'no-cors', body: JSON.stringify(payload)}); }catch(e){}
}
async function poll(){
  if(!roomId) return;
  try{
    let res = await fetch(APPS_SCRIPT_URL + "?action=getState&room=" + roomId + "&t=" + Date.now());
    let data = await res.json();
    if(data.pointer){
      if(data.pointer.teacher && data.pointer.teacher.by !== myId){
        let el = document.getElementById('teacherFinger');
        el.style.left = data.pointer.teacher.x+'px'; el.style.top = data.pointer.teacher.y+'px';
      }
      if(data.pointer.student && data.pointer.student.by !== myId){
        let el = document.getElementById('studentFinger');
        el.style.left = data.pointer.student.x+'px'; el.style.top = data.pointer.student.y+'px';
      }
    }
    if(data.image && data.image.data){
      if(data.image.data !== lastImg){ lastImg = data.image.data; showImage(data.image.data); }
    } else {
      if(lastImg !== ''){ lastImg=''; hideImage(); }
    }
    if(data.peers && myStream && micOn){
      Object.values(data.peers).forEach(p=>{
        if(p.peerId === myPeer.id) return;
        if(!window._called) window._called = {};
        if(window._called[p.peerId]) return;
        window._called[p.peerId] = true;
        try{
          let call = myPeer.call(p.peerId, myStream);
          call.on('stream', rs=>{ let a=document.getElementById('remoteAudio'); a.srcObject=rs; a.muted=!speakerOn; a.play().catch(()=>{}); });
        }catch(e){}
      });
    }
  }catch(e){}
}
function startPolling(){ setInterval(poll, 150); }
function makeDraggable(el, key){
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  el.addEventListener('pointerdown', e=>{
    if((myRole==='teacher' && key!=='teacher') || (myRole==='student' && key!=='student')) return;
    dragging=true; el.setPointerCapture(e.pointerId); sx=e.clientX; sy=e.clientY; ox=el.offsetLeft; oy=el.offsetTop;
  });
  el.addEventListener('pointermove', e=>{
    if(!dragging) return;
    if((myRole==='teacher' && key!=='teacher') || (myRole==='student' && key!=='student')) return;
    let x = Math.max(0, Math.min(window.innerWidth-60, ox + (e.clientX - sx)));
    let y = Math.max(56, Math.min(window.innerHeight-150, oy + (e.clientY - sy)));
    el.style.left = x+'px'; el.style.top = y+'px';
    let now = Date.now();
    if(now - lastPointerSent > 30){
      lastPointerSent = now;
      sendToSheet({room: roomId, type:'pointer', key:key, x:x, y:y, by: myId});
    }
  });
  el.addEventListener('pointerup', ()=>{
    if(!dragging) return;
    dragging=false;
    sendToSheet({room: roomId, type:'pointer', key:key, x: el.offsetLeft, y: el.offsetTop, by: myId});
  });
}
document.getElementById('imgInput').addEventListener('change', e=>{
  let file = e.target.files[0]; if(!file) return;
  let reader = new FileReader();
  reader.onload = ()=>{
    let img = new Image();
    img.onload = ()=>{
      let canvas = document.createElement('canvas');
      let maxW = 550; let r = Math.min(1, maxW/img.width);
      canvas.width = img.width*r; canvas.height = img.height*r;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      let dataUrl = canvas.toDataURL('image/jpeg', 0.45);
      showImage(dataUrl);
      sendToSheet({room: roomId, type:'image', data: dataUrl, by: myId});
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});
function showImage(d){ let img=document.getElementById('boardImg'); img.src=d; img.classList.remove('hidden'); document.getElementById('noImgText').style.display='none'; document.getElementById('zoomBox').classList.remove('hidden'); scale=1; img.style.transform='scale(1)'; }
function hideImage(){ document.getElementById('boardImg').classList.add('hidden'); document.getElementById('noImgText').style.display='block'; document.getElementById('zoomBox').classList.add('hidden'); }
function deleteImage(){ lastImg=''; hideImage(); sendToSheet({room: roomId, type:'clearImage'}); }
function zoom(d){ scale=Math.max(0.5, Math.min(4, scale+d)); document.getElementById('boardImg').style.transform='scale('+scale+')'; }
function resetZoom(){ scale=1; document.getElementById('boardImg').style.transform='scale(1)'; }
function initVoice(){
  myPeer = new Peer('a2z-'+roomId+'-'+myRole+'-'+myId, {
    config: { iceServers: [{urls:'stun:stun.l.google.com:19302'}, {urls:'stun:global.stun.twilio.com:3478'}] }
  });
  myPeer.on('open', ()=>{ sendToSheet({room: roomId, type:'peer', peerId: myPeer.id, role: myRole}); });
  myPeer.on('call', call=>{
    getClearAudio().then(stream=>{
      myStream = stream;
      try{
        let sender = call.peerConnection.getSenders().find(s=> s.track && s.track.kind==='audio');
        if(sender && sender.setParameters){
          let params = sender.getParameters();
          if(!params.encodings) params.encodings = [{}];
          params.encodings[0].maxBitrate = 16000;
          sender.setParameters(params);
        }
      }catch(e){}
      call.answer(stream);
      call.on('stream', rs=>{ let a=document.getElementById('remoteAudio'); a.srcObject=rs; a.muted=!speakerOn; a.play().catch(()=>{}); });
    });
  });
}
async function getClearAudio(){
  return await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:1, sampleRate:24000 },
    video:false
  });
}
function toggleSpeaker(){
  speakerOn = !speakerOn;
  document.getElementById('speakerBtn').innerText = speakerOn ? '🔊' : '🔇';
  document.getElementById('remoteAudio').muted = !speakerOn;
  document.getElementById('voiceStatus').innerText = speakerOn ? T[lang].speakerOn : T[lang].speakerOff;
}
async function toggleMic(){
  micOn = !micOn;
  document.getElementById('micBtn').style.background = micOn ? '#22c55e' : '#ef4444';
  document.getElementById('micBtn').innerText = micOn ? '🎤' : '🔇';
  document.getElementById('voiceStatus').innerText = micOn ? T[lang].micOn : T[lang].micOff;
  if(micOn){
    try{
      myStream = await getClearAudio();
      myStream.getAudioTracks().forEach(t=> t.enabled = true);
      sendToSheet({room: roomId, type:'peer', peerId: myPeer.id, role: myRole});
      window._called = {};
    }catch(e){ alert(T[lang].alertMic); micOn=false; }
  } else {
    if(myStream) myStream.getAudioTracks().forEach(t=> t.enabled = false);
  }
}
function leaveAndBack(){
  if(roomId){
    sendToSheet({room: roomId, type:'leave', peerId: myPeer ? myPeer.id : myId});
    sendToSheet({room: roomId, type:'clearImage'});
  }
  location.href='./digital_home.html';
}
window.addEventListener('beforeunload', ()=>{
  if(roomId){ navigator.sendBeacon(APPS_SCRIPT_URL, JSON.stringify({room: roomId, type:'clearImage'})); }
});
applyLang();
</script>
</body>
</html>
