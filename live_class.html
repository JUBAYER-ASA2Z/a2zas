
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Live Class - A-S A2Z</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{font-family:'Hind Siliguri';-webkit-tap-highlight-color:transparent;user-select:none;box-sizing:border-box}
body{margin:0;background:#0f172a;overflow:hidden;height:100dvh}
#frameWrap{position:absolute;inset:56px 0 76px 0;display:flex;align-items:center;justify-content:center;background:#0f172a;overflow:hidden}
#board{position:relative;width:100%;height:100%;max-width:900px;max-height:100%;background:#000;overflow:hidden;touch-action:none}
#boardImg{width:100%;height:100%;object-fit:contain}
.finger{position:absolute;width:60px;height:80px;display:flex;flex-direction:column;align-items:center;z-index:50;touch-action:none;transform:translate(-50%,-50%);background:transparent}
.finger .emoji{font-size:48px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6));}
.finger .label{margin-top:2px;background:#000;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1.5px solid #fff}
.finger.mine .emoji{filter:drop-shadow(0 0 12px rgba(34,197,94,0.9)) drop-shadow(0 4px 8px rgba(0,0,0,0.6));}
.finger.mine .label{background:#22c55e}
.finger.locked{pointer-events:none !important;}
</style>
</head>
<body>
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNxqVW6RX0eH9e9JCTVNvF2hLBfgRZy972_gavzXE2axmSADefYV04gqWh0sFxpIoBgA/exec";
const TEACHER_PIN = "123";
if('caches' in window){ caches.keys().then(n=>n.forEach(k=>caches.delete(k))); }
</script>

<!-- TOP -->
<div class="absolute top-0 left-0 right-0 z-[100] bg-black/60 backdrop-blur px-3 py-2 flex items-center gap-2">
  <button onclick="leaveAndBack()" class="w-9 h-9 bg-white text-black rounded-full font-black">←</button>
  <div class="flex-1">
    <p class="text-white font-black text-[13px] leading-none" data-t="liveClass">📚 Live Class</p>
    <p class="text-white/60 text-[10px] font-bold mt-0.5"><span data-t="room">Room</span>: <span id="roomLabel">---</span> • <span class="text-emerald-400">● Live</span></p>
  </div>
  <button onclick="toggleLang()" id="langBtn" class="w-11 h-9 bg-white text-black rounded-full text-[11px] font-black">EN</button>
  <label class="bg-emerald-500 text-white text-[11px] font-black px-3 py-2 rounded-full cursor-pointer"><span data-t="photo">📸 ছবি</span><input type="file" id="imgInput" accept="image/*" class="hidden"></label>
  <button onclick="deleteImage()" class="bg-red-500 text-white text-[11px] font-black px-3 py-2 rounded-full"><span data-t="delete">🗑️ মুছুন</span></button>
</div>

<!-- JOIN -->
<div id="joinBox" class="absolute inset-0 z-[200] bg-slate-900/95 flex items-center justify-center p-6">
  <div class="bg-white rounded-[24px] p-6 w-full max-w-[340px] text-center">
    <p class="text-[48px]">👆👆</p>
    <p class="font-black text-[20px] mt-2" data-t="joinTitle">Live Class</p>
    <input id="roomInput" placeholder="রুম কোড" class="w-full mt-4 border-2 border-slate-200 rounded-full px-4 py-3 text-center font-black text-[16px] outline-none" inputmode="numeric">
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button onclick="joinAs('teacher')" class="bg-blue-600 text-white py-3 rounded-full font-black text-[13px]" data-t="teacherBtn">👆 টিচার</button>
      <button onclick="joinAs('student')" class="bg-emerald-600 text-white py-3 rounded-full font-black text-[13px]" data-t="studentBtn">👆 স্টুডেন্ট</button>
    </div>
    <button onclick="createRoom()" class="w-full mt-2 bg-slate-900 text-white py-3 rounded-full font-black text-[12px]" data-t="createRoom">+ নতুন রুম বানান</button>
    <p class="text-[11px] text-slate-500 mt-4 font-black">Developer JUBAYER A S</p>
  </div>
</div>

<!-- PIN -->
<div id="pinModal" class="hidden fixed inset-0 z-[300] bg-slate-900/80 backdrop-blur flex items-center justify-center p-6">
  <div class="bg-white rounded-[24px] p-6 w-full max-w-[300px] text-center">
    <p class="text-[40px]">🔐</p>
    <p class="font-black text-[17px] mt-2" data-t="pinTitle">টিচার কোড দিন</p>
    <p class="text-slate-500 text-[11px] font-bold mt-1" data-t="pinDesc">টিচার ছাড়া কেউ এই কোড জানে না</p>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="•••" class="w-full mt-4 border-2 border-blue-200 rounded-full px-4 py-3 text-center font-black text-[20px] outline-none tracking-[8px]">
    <button onclick="checkTeacherPin()" class="w-full mt-3 bg-blue-600 text-white py-3 rounded-full font-black text-[13px]" data-t="enter">প্রবেশ করুন</button>
    <button onclick="closePin()" class="w-full mt-2 bg-slate-100 text-slate-600 py-3 rounded-full font-black text-[12px]" data-t="cancel">বাতিল</button>
  </div>
</div>

<!-- একই ফ্রেম - কোনো জুম নাই -->
<div id="frameWrap">
  <div id="board">
    <p id="noImgText" class="absolute inset-0 flex items-center justify-center text-white/40 font-black text-[14px] text-center px-6" data-t="uploadText">📸 উপরে ছবি আপলোড করুন</p>
    <img id="boardImg" class="hidden">
    <div id="teacherFinger" class="finger locked" style="left:20%;top:30%;">
      <span class="emoji">👆</span><span class="label" data-t="teacherLabel">টিচার</span>
    </div>
    <div id="studentFinger" class="finger locked" style="left:70%;top:30%;">
      <span class="emoji">👆</span><span class="label" data-t="studentLabel">স্টুডেন্ট</span>
    </div>
  </div>
</div>

<!-- BOTTOM -->
<div class="absolute bottom-0 left-0 right-0 z-[100] bg-black/80 backdrop-blur px-4 py-3 flex items-center justify-between gap-3">
  <div class="flex items-center gap-2">
    <span id="myRoleBadge" class="bg-white/20 text-white text-[11px] font-black px-3 py-1.5 rounded-full">---</span>
    <span id="voiceStatus" class="text-white/70 text-[11px] font-bold" data-t="micOff">🎤 কথা বন্ধ</span>
  </div>
  <div class="flex gap-2">
    <button id="speakerBtn" onclick="toggleSpeaker()" class="w-12 h-12 bg-white rounded-full text-[22px] flex items-center justify-center shadow">🔊</button>
    <button id="micBtn" onclick="toggleMic()" class="w-12 h-12 bg-red-500 text-white rounded-full text-[22px] flex items-center justify-center shadow">🔇</button>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>

<script>
let lang=localStorage.getItem('live_lang')||'bn';
const T={
bn:{liveClass:'📚 Live Class',room:'Room',photo:'📸 ছবি',delete:'🗑️ মুছুন',joinTitle:'Live Class',teacherBtn:'👆 টিচার',studentBtn:'👆 স্টুডেন্ট',createRoom:'+ নতুন রুম বানান',pinTitle:'টিচার কোড দিন',pinDesc:'টিচার ছাড়া কেউ এই কোড জানে না',enter:'প্রবেশ করুন',cancel:'বাতিল',uploadText:'📸 উপরে ছবি আপলোড করুন',teacherLabel:'টিচার',studentLabel:'স্টুডেন্ট',micOff:'🎤 কথা বন্ধ',micOn:'🎤 আপনার কথা যাচ্ছে',speakerOn:'🔊 শুনছেন',speakerOff:'🔇 স্পিকার বন্ধ',roomPlaceholder:'রুম কোড',alertRoom:'রুম কোড দিন',alertWrongPin:'ভুল কোড! টিচার কোড সঠিক নয়',alertWrongRoom:'ভুল রুম কোড! সঠিক কোড দিন',alertCheck:'রুম চেক করা যাচ্ছে না, আবার চেষ্টা করুন',alertMic:'Mic Permission Allow করেন',alertRoomCode:'আপনার রুম কোড: ',badgeTeacher:'👆 টিচার',badgeStudent:'👆 স্টুডেন্ট'},
en:{liveClass:'📚 Live Class',room:'Room',photo:'📸 Photo',delete:'🗑️ Delete',joinTitle:'Live Class',teacherBtn:'👆 Teacher',studentBtn:'👆 Student',createRoom:'+ Create New Room',pinTitle:'Enter Teacher Code',pinDesc:'Only teacher knows this code',enter:'Enter',cancel:'Cancel',uploadText:'📸 Upload photo from top',teacherLabel:'Teacher',studentLabel:'Student',micOff:'🎤 Muted',micOn:'🎤 Your voice is going',speakerOn:'🔊 Listening',speakerOff:'🔇 Speaker Off',roomPlaceholder:'Room Code',alertRoom:'Enter Room Code',alertWrongPin:'Wrong Code! Teacher code is not correct',alertWrongRoom:'Wrong Room Code! Enter correct code',alertCheck:'Cannot check room, try again',alertMic:'Please Allow Mic Permission',alertRoomCode:'Your Room Code: ',badgeTeacher:'👆 Teacher',badgeStudent:'👆 Student'}
};
function applyLang(){ document.querySelectorAll('[data-t]').forEach(el=>{let k=el.getAttribute('data-t'); if(T[lang][k]) el.innerText=T[lang][k];}); document.getElementById('roomInput').placeholder=T[lang].roomPlaceholder; document.getElementById('langBtn').innerText=lang==='bn'?'EN':'BN'; if(myRole){document.getElementById('myRoleBadge').innerText=myRole==='teacher'?T[lang].badgeTeacher:T[lang].badgeStudent; document.getElementById('voiceStatus').innerText=micOn?T[lang].micOn:T[lang].micOff;} }
function toggleLang(){ lang=lang==='bn'?'en':'bn'; localStorage.setItem('live_lang',lang); applyLang(); }

let myRole='',roomId='',myPeer=null,myStream=null,speakerOn=true,micOn=false;
let myId='U'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let lastImg='',lastPointerSent=0,pendingRole='', pollTimer=null, calledPeers={};

function createRoom(){ let code=Math.floor(1000+Math.random()*9000).toString(); document.getElementById('roomInput').value=code; sendToSheet({room:code,type:'createRoom'}); sendToSheet({room:code,type:'clearAll'}); alert(T[lang].alertRoomCode+code); }
async function joinAs(role){
  roomId=document.getElementById('roomInput').value.trim();
  if(!roomId){ alert(T[lang].alertRoom); return; }
  if(role==='teacher'){ pendingRole='teacher'; document.getElementById('pinInput').value=''; document.getElementById('pinModal').classList.remove('hidden'); document.getElementById('pinInput').focus(); return; }
  await enterRoom('student');
}
function closePin(){ document.getElementById('pinModal').classList.add('hidden'); pendingRole=''; }
async function checkTeacherPin(){
  let pin=document.getElementById('pinInput').value.trim();
  if(pin!==TEACHER_PIN){ alert(T[lang].alertWrongPin); document.getElementById('pinInput').value=''; return; }
  document.getElementById('pinModal').classList.add('hidden'); await enterRoom('teacher');
}
async function enterRoom(role){
  if(role==='teacher'){ await sendToSheet({room:roomId,type:'createRoom'}); await sendToSheet({room:roomId,type:'clearAll'}); await sendToSheet({room:roomId,type:'createRoom'}); }
  try{ let res=await fetch(APPS_SCRIPT_URL+"?action=checkRoom&room="+roomId+"&t="+Date.now()); let data=await res.json(); if(!data.exists){ alert(T[lang].alertWrongRoom); return; } }catch(e){ alert(T[lang].alertCheck); return; }
  myRole=role; document.getElementById('joinBox').style.display='none'; document.getElementById('roomLabel').innerText=roomId;
  document.getElementById('myRoleBadge').innerText=role==='teacher'?T[lang].badgeTeacher:T[lang].badgeStudent;
  let t=document.getElementById('teacherFinger'), s=document.getElementById('studentFinger');
  if(role==='teacher'){ t.classList.remove('locked'); t.classList.add('mine'); t.style.pointerEvents='auto'; s.classList.remove('mine'); s.classList.add('locked'); s.style.pointerEvents='none'; makeDraggable(t,'teacher'); }
  else{ s.classList.remove('locked'); s.classList.add('mine'); s.style.pointerEvents='auto'; t.classList.remove('mine'); t.classList.add('locked'); t.style.pointerEvents='none'; makeDraggable(s,'student'); }
  startPolling(); initVoice();
}
async function sendToSheet(p){ try{ await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(p)}); }catch(e){} }
async function poll(){
  if(!roomId) return;
  try{
    let res=await fetch(APPS_SCRIPT_URL+"?action=getState&room="+roomId+"&t="+Date.now());
    let data=await res.json();
    if(data.pointer){
      if(data.pointer.teacher && data.pointer.teacher.by!==myId){ let el=document.getElementById('teacherFinger'); el.style.left=data.pointer.teacher.x+'%'; el.style.top=data.pointer.teacher.y+'%'; }
      if(data.pointer.student && data.pointer.student.by!==myId){ let el=document.getElementById('studentFinger'); el.style.left=data.pointer.student.x+'%'; el.style.top=data.pointer.student.y+'%'; }
    }
    if(data.image && data.image.data){ if(data.image.data!==lastImg){ lastImg=data.image.data; showImage(data.image.data); } }
    else{ if(lastImg!==''){ lastImg=''; hideImage(); } }
    if(data.peers && myStream){
      Object.values(data.peers).forEach(p=>{
        if(p.peerId===myPeer.id) return; if(calledPeers[p.peerId]) return; calledPeers[p.peerId]=true;
        try{ let call=myPeer.call(p.peerId,myStream); call.on('stream',rs=>playRemote(rs)); }catch(e){}
      });
    }
  }catch(e){}
}
function startPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=setInterval(poll,150); }
function playRemote(rs){ let a=document.getElementById('remoteAudio'); a.srcObject=rs; a.muted=!speakerOn; a.volume=1; a.play().catch(()=>{ document.addEventListener('click',()=>a.play(),{once:true}); }); }
function makeDraggable(el,key){
  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  el.addEventListener('pointerdown',e=>{
    if((myRole==='teacher'&&key!=='teacher')||(myRole==='student'&&key!=='student')) return;
    dragging=true; el.setPointerCapture(e.pointerId); let b=document.getElementById('board').getBoundingClientRect(); sx=e.clientX; sy=e.clientY; let r=el.getBoundingClientRect(); ox=((r.left+30-b.left)/b.width)*100; oy=((r.top+40-b.top)/b.height)*100;
  });
  el.addEventListener('pointermove',e=>{
    if(!dragging) return; if((myRole==='teacher'&&key!=='teacher')||(myRole==='student'&&key!=='student')) return;
    let b=document.getElementById('board').getBoundingClientRect(); let px=Math.max(2,Math.min(98,ox+((e.clientX-sx)/b.width)*100)); let py=Math.max(5,Math.min(95,oy+((e.clientY-sy)/b.height)*100));
    el.style.left=px+'%'; el.style.top=py+'%'; let now=Date.now(); if(now-lastPointerSent>30){ lastPointerSent=now; sendToSheet({room:roomId,type:'pointer',key:key,x:px,y:py,by:myId}); }
  });
  el.addEventListener('pointerup',()=>{ if(!dragging) return; dragging=false; let b=document.getElementById('board').getBoundingClientRect(); let r=el.getBoundingClientRect(); sendToSheet({room:roomId,type:'pointer',key:key,x:((r.left+30-b.left)/b.width)*100,y:((r.top+40-b.top)/b.height)*100,by:myId}); });
}
document.getElementById('imgInput').addEventListener('change',e=>{
  let file=e.target.files[0]; if(!file) return; let reader=new FileReader();
  reader.onload=()=>{ let img=new Image(); img.onload=()=>{ let c=document.createElement('canvas'); let maxW=800; let r=Math.min(1,maxW/img.width); c.width=img.width*r; c.height=img.height*r; c.getContext('2d').drawImage(img,0,0,c.width,c.height); let d=c.toDataURL('image/jpeg',0.55); showImage(d); sendToSheet({room:roomId,type:'image',data:d,[STRIPPED] }; img.src=reader.result; }; reader.readAsDataURL(file);
});
function showImage(d){ let img=document.getElementById('boardImg'); img.src=d; img.classList.remove('hidden'); document.getElementById('noImgText').style.display='none'; }
function hideImage(){ document.getElementById('boardImg').classList.add('hidden'); document.getElementById('noImgText').style.display='flex'; }
function deleteImage(){ lastImg=''; hideImage(); sendToSheet({room:roomId,type:'clearImage'}); }
function initVoice(){
  myPeer=new Peer('a2z-'+roomId+'-'+myRole+'-'+myId,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}});
  myPeer.on('open',async()=>{
    sendToSheet({room:roomId,type:'peer',peerId:myPeer.id,role:myRole});
    try{ myStream=await getClearAudio(); myStream.getAudioTracks().forEach(t=>t.enabled=false); }catch(e){}
  });
  myPeer.on('call',call=>{
    getClearAudio().then(stream=>{
      if(!myStream) myStream=stream;
      try{ let s=call.peerConnection.getSenders().find(x=>x.track&&x.track.kind==='audio'); if(s&&s.setParameters){ let pr=s.getParameters(); if(!pr.encodings) pr.encodings=[{}]; pr.encodings[0].maxBitrate=32000; s.setParameters(pr); } }catch(e){}
      call.answer(myStream); call.on('stream',rs=>playRemote(rs));
    });
  });
}
async function getClearAudio(){ return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,sampleRate:48000},video:false}); }
function toggleSpeaker(){ speakerOn=!speakerOn; document.getElementById('speakerBtn').innerText=speakerOn?'🔊':'🔇'; document.getElementById('remoteAudio').muted=!speakerOn; document.getElementById('voiceStatus').innerText=speakerOn?T[lang].speakerOn:T[lang].speakerOff; if(speakerOn) document.getElementById('remoteAudio').play().catch(()=>{}); }
async function toggleMic(){
  micOn=!micOn;
  document.getElementById('micBtn').style.background=micOn?'#22c55e':'#ef4444'; document.getElementById('micBtn').innerText=micOn?'🎤':'🔇'; document.getElementById('voiceStatus').innerText=micOn?T[lang].micOn:T[lang].micOff;
  if(micOn){
    try{
      if(!myStream) myStream=await getClearAudio();
      myStream.getAudioTracks().forEach(t=>t.enabled=true);
      calledPeers={}; sendToSheet({room:roomId,type:'peer',peerId:myPeer.id,role:myRole});
      document.getElementById('remoteAudio').play().catch(()=>{});
    }catch(e){ alert(T[lang].alertMic); micOn=false; document.getElementById('micBtn').style.background='#ef4444'; }
  }else{ if(myStream) myStream.getAudioTracks().forEach(t=>t.enabled=false); }
}
function leaveAndBack(){
  if(roomId){ sendToSheet({room:roomId,type:'leave',peerId:myPeer?myPeer.id:myId}); sendToSheet({room:roomId,type:'clearAll'}); }
  lastImg=''; location.href='./digital_home.html?v='+Date.now();
}
window.addEventListener('beforeunload',()=>{ if(roomId){ navigator.sendBeacon(APPS_SCRIPT_URL,JSON.stringify({room:roomId,type:'clearAll'})); } });
applyLang();
</script>
</body>
</html>
