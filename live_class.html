
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Live Class - A-S A2Z</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{font-family:'Hind Siliguri';-webkit-tap-highlight-color:transparent;user-select:none;box-sizing:border-box}
body{margin:0;background:#0f172a;overflow:hidden;height:100dvh}
button{pointer-events:auto !important;touch-action:manipulation !important;cursor:pointer;-webkit-appearance:none}
label{pointer-events:auto !important;touch-action:manipulation !important;cursor:pointer}
#frameWrap{position:absolute;inset:56px 0 76px 0;display:flex;align-items:center;justify-content:center;background:#0f172a;overflow:hidden}
#board{position:relative;width:100%;height:100%;max-width:900px;max-height:100%;background:#000;overflow:hidden}
#boardImg{width:100%;height:100%;object-fit:contain;pointer-events:none}
.finger{position:absolute;width:60px;height:80px;display:flex;flex-direction:column;align-items:center;z-index:50;touch-action:none;transform:translate(-50%,-50%)}
.finger .emoji{font-size:48px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6))}
.finger .label{margin-top:2px;background:#000;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1.5px solid #fff}
.finger.mine .emoji{filter:drop-shadow(0 0 12px rgba(34,197,94,0.9)) drop-shadow(0 4px 8px rgba(0,0,0,0.6))}
.finger.mine .label{background:#22c55e}
.finger.locked{pointer-events:none !important}
#alertBox{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,rgba(15,23,42,0.85),rgba(30,27,75,0.9));backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
#alertBox.show{display:flex}
#alertCard{background:#fff;border-radius:28px;padding:24px 20px;width:100%;max-width:320px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.4)}
#alertIcon{font-size:48px}
#alertMsg{font-weight:900;font-size:16px;color:#0f172a;margin:10px 0 16px;line-height:1.4}
#alertBtn{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;width:100%;padding:12px;border-radius:999px;font-weight:900;font-size:14px;border:none}
</style>
</head>
<body>

<!-- ✅ সুন্দর অ্যালার্ট -->
<div id="alertBox" onclick="hideAlert()">
  <div id="alertCard" onclick="event.stopPropagation()">
    <div id="alertIcon">🔔</div>
    <div id="alertMsg">---</div>
    <button id="alertBtn" onclick="hideAlert()">ঠিক আছে</button>
  </div>
</div>

<!-- TOP -->
<div class="absolute top-0 left-0 right-0 z-[100] bg-black/60 backdrop-blur px-3 py-2 flex items-center gap-2">
  <button id="backBtn" class="w-9 h-9 bg-white text-black rounded-full font-black shrink-0">←</button>
  <div class="flex-1 min-w-0">
    <p class="text-white font-black text-[13px] leading-none" data-t="liveClass">📚 Live Class</p>
    <p class="text-white/60 text-[10px] font-bold mt-0.5"><span data-t="room">Room</span>: <span id="roomLabel">---</span> • <span class="text-emerald-400">● Live</span></p>
  </div>
  <button id="langBtn" class="w-11 h-9 bg-white text-black rounded-full text-[11px] font-black shrink-0">EN</button>
  <label class="bg-emerald-500 text-white text-[11px] font-black px-3 py-2 rounded-full shrink-0"><span data-t="photo">📸 ছবি</span><input type="file" id="imgInput" accept="image/*" class="hidden"></label>
  <button id="deleteBtn" class="bg-red-500 text-white text-[11px] font-black px-3 py-2 rounded-full shrink-0"><span data-t="delete">🗑️ মুছুন</span></button>
</div>

<!-- JOIN -->
<div id="joinBox" class="absolute inset-0 z-[200] bg-slate-900/95 flex items-center justify-center p-6">
  <div class="bg-white rounded-[24px] p-6 w-full max-w-[340px] text-center">
    <p class="text-[48px]">👆👆</p>
    <p class="font-black text-[20px] mt-2" data-t="joinTitle">Live Class</p>
    <input id="roomInput" placeholder="রুম কোড" class="w-full mt-4 border-2 border-slate-200 rounded-full px-4 py-3 text-center font-black text-[16px] outline-none" inputmode="numeric">
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button id="teacherBtn" class="bg-blue-600 text-white py-4 rounded-full font-black text-[14px] active:scale-95" data-t="teacherBtn">👆 টিচার</button>
      <button id="studentBtn" class="bg-emerald-600 text-white py-4 rounded-full font-black text-[14px] active:scale-95" data-t="studentBtn">👆 স্টুডেন্ট</button>
    </div>
    <button id="createBtn" class="w-full mt-2 bg-slate-900 text-white py-4 rounded-full font-black text-[13px] active:scale-95" data-t="createRoom">+ নতুন রুম বানান</button>
    <p class="text-[11px] text-slate-500 mt-4 font-black">Developer JUBAYER A S</p>
    <p id="debugText" class="text-[10px] text-slate-400 mt-1">v3 - Button Fixed</p>
  </div>
</div>

<!-- PIN -->
<div id="pinModal" class="hidden fixed inset-0 z-[300] bg-slate-900/80 backdrop-blur flex items-center justify-center p-6">
  <div class="bg-white rounded-[24px] p-6 w-full max-w-[300px] text-center">
    <p class="text-[40px]">🔐</p>
    <p class="font-black text-[17px] mt-2" data-t="pinTitle">টিচার কোড দিন</p>
    <p class="text-slate-500 text-[11px] font-bold mt-1" data-t="pinDesc">টিচার ছাড়া কেউ এই কোড জানে না</p>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="•••" class="w-full mt-4 border-2 border-blue-200 rounded-full px-4 py-3 text-center font-black text-[20px] outline-none tracking-[8px]">
    <button id="pinEnterBtn" class="w-full mt-3 bg-blue-600 text-white py-3 rounded-full font-black text-[13px]" data-t="enter">প্রবেশ করুন</button>
    <button id="pinCancelBtn" class="w-full mt-2 bg-slate-100 text-slate-600 py-3 rounded-full font-black text-[12px]" data-t="cancel">বাতিল</button>
  </div>
</div>

<!-- BOARD -->
<div id="frameWrap">
  <div id="board">
    <p id="noImgText" class="absolute inset-0 flex items-center justify-center text-white/40 font-black text-[14px] text-center px-6" data-t="uploadText">📸 উপরে ছবি আপলোড করুন</p>
    <img id="boardImg" class="hidden">
    <div id="teacherFinger" class="finger locked" style="left:20%;top:30%;"><span class="emoji">👆</span><span class="label" data-t="teacherLabel">টিচার</span></div>
    <div id="studentFinger" class="finger locked" style="left:70%;top:30%;"><span class="emoji">👆</span><span class="label" data-t="studentLabel">স্টুডেন্ট</span></div>
  </div>
</div>

<!-- BOTTOM -->
<div class="absolute bottom-0 left-0 right-0 z-[100] bg-black/80 backdrop-blur px-4 py-3 flex items-center justify-between gap-3">
  <div class="flex items-center gap-2 min-w-0">
    <span id="myRoleBadge" class="bg-white/20 text-white text-[11px] font-black px-3 py-1.5 rounded-full shrink-0">---</span>
    <span id="voiceStatus" class="text-white/70 text-[11px] font-bold" data-t="micOff">🎤 কথা বন্ধ</span>
  </div>
  <div class="flex gap-2 shrink-0">
    <button id="speakerBtn" class="w-12 h-12 bg-white rounded-full text-[22px] flex items-center justify-center shadow">🔊</button>
    <button id="micBtn" class="w-12 h-12 bg-red-500 text-white rounded-full text-[22px] flex items-center justify-center shadow">🔇</button>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>

<script>
// ===== সব ভ্যারিয়েবল আগে - এরপর আর আটকাবে না =====
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNxqVW6RX0eH9e9JCTVNvF2hLBfgRZy972_gavzXE2axmSADefYV04gqWh0sFxpIoBgA/exec";
var TEACHER_PIN = "123";
var lang = localStorage.getItem('live_lang') || 'bn';
var myRole='', roomId='', myPeer=null, myStream=null, speakerOn=true, micOn=false;
var myId='U'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
var lastImg='', lastPointerSent=0, pendingRole='', pollTimer=null, calledPeers={};

var T={
bn:{liveClass:'📚 Live Class',room:'Room',photo:'📸 ছবি',delete:'🗑️ মুছুন',joinTitle:'Live Class',teacherBtn:'👆 টিচার',studentBtn:'👆 স্টুডেন্ট',createRoom:'+ নতুন রুম বানান',pinTitle:'টিচার কোড দিন',pinDesc:'টিচার ছাড়া কেউ এই কোড জানে না',enter:'প্রবেশ করুন',cancel:'বাতিল',uploadText:'📸 উপরে ছবি আপলোড করুন',teacherLabel:'টিচার',studentLabel:'স্টুডেন্ট',micOff:'🎤 কথা বন্ধ',micOn:'🎤 আপনার কথা যাচ্ছে',speakerOn:'🔊 শুনছেন',speakerOff:'🔇 স্পিকার বন্ধ',roomPlaceholder:'রুম কোড',alertRoom:'রুম কোড দিন',alertWrongPin:'ভুল কোড! টিচার কোড সঠিক নয়',alertWrongRoom:'ভুল রুম কোড! সঠিক কোড দিন',alertCheck:'রুম চেক করা যাচ্ছে না, আবার চেষ্টা করুন',alertMic:'Mic Permission Allow করেন',alertRoomCode:'আপনার রুম কোড: ',badgeTeacher:'👆 টিচার',badgeStudent:'👆 স্টুডেন্ট'},
en:{liveClass:'📚 Live Class',room:'Room',photo:'📸 Photo',delete:'🗑️ Delete',joinTitle:'Live Class',teacherBtn:'👆 Teacher',studentBtn:'👆 Student',createRoom:'+ Create New Room',pinTitle:'Enter Teacher Code',pinDesc:'Only teacher knows this code',enter:'Enter',cancel:'Cancel',uploadText:'📸 Upload photo from top',teacherLabel:'Teacher',studentLabel:'Student',micOff:'🎤 Muted',micOn:'🎤 Your voice is going',speakerOn:'🔊 Listening',speakerOff:'🔇 Speaker Off',roomPlaceholder:'Room Code',alertRoom:'Enter Room Code',alertWrongPin:'Wrong Code! Teacher code is not correct',alertWrongRoom:'Wrong Room Code! Enter correct code',alertCheck:'Cannot check room, try again',alertMic:'Please Allow Mic Permission',alertRoomCode:'Your Room Code: ',badgeTeacher:'👆 Teacher',badgeStudent:'👆 Student'}
};

function showAlert(msg, icon){
  document.getElementById('alertMsg').innerText = msg;
  document.getElementById('alertIcon').innerText = icon || '🔔';
  document.getElementById('alertBox').classList.add('show');
  document.getElementById('alertBtn').innerText = (lang==='bn' ? 'ঠিক আছে' : 'OK');
}
function hideAlert(){ document.getElementById('alertBox').classList.remove('show'); }

function applyLang(){
  document.querySelectorAll('[data-t]').forEach(function(el){ var k=el.getAttribute('data-t'); if(T[lang][k]) el.innerText=T[lang][k]; });
  document.getElementById('roomInput').placeholder=T[lang].roomPlaceholder;
  document.getElementById('langBtn').innerText=lang==='bn'?'EN':'BN';
  if(myRole){ document.getElementById('myRoleBadge').innerText=myRole==='teacher'?T[lang].badgeTeacher:T[lang].badgeStudent; document.getElementById('voiceStatus').innerText=micOn?T[lang].micOn:T[lang].micOff; }
}
function toggleLang(){ lang=lang==='bn'?'en':'bn'; localStorage.setItem('live_lang',lang); applyLang(); }

function createRoom(){
  var code=Math.floor(1000+Math.random()*9000).toString();
  document.getElementById('roomInput').value=code;
  sendToSheet({room:code,type:'createRoom'});
  sendToSheet({room:code,type:'clearAll'});
  showAlert(T[lang].alertRoomCode+code,'🎉');
}
function joinAs(role){
  roomId=document.getElementById('roomInput').value.trim();
  if(!roomId){ showAlert(T[lang].alertRoom,'⚠️'); return; }
  if(role==='teacher'){
    pendingRole='teacher';
    document.getElementById('pinInput').value='';
    document.getElementById('pinModal').classList.remove('hidden');
    setTimeout(function(){ document.getElementById('pinInput').focus(); },100);
    return;
  }
  enterRoom('student');
}
function closePin(){ document.getElementById('pinModal').classList.add('hidden'); pendingRole=''; }
function checkTeacherPin(){
  var pin=document.getElementById('pinInput').value.trim();
  if(pin!==TEACHER_PIN){ showAlert(T[lang].alertWrongPin,'❌'); document.getElementById('pinInput').value=''; return; }
  document.getElementById('pinModal').classList.add('hidden');
  enterRoom('teacher');
}
function enterRoom(role){
  if(role==='teacher'){ sendToSheet({room:roomId,type:'createRoom'}); sendToSheet({room:roomId,type:'clearAll'}); sendToSheet({room:roomId,type:'createRoom'}); }
  fetch(APPS_SCRIPT_URL+"?action=checkRoom&room="+roomId+"&t="+Date.now())
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data.exists){ showAlert(T[lang].alertWrongRoom,'❌'); return; }
    myRole=role;
    document.getElementById('joinBox').style.display='none';
    document.getElementById('roomLabel').innerText=roomId;
    document.getElementById('myRoleBadge').innerText=role==='teacher'?T[lang].badgeTeacher:T[lang].badgeStudent;
    var t=document.getElementById('teacherFinger'), s=document.getElementById('studentFinger');
    if(role==='teacher'){ t.classList.remove('locked'); t.classList.add('mine'); t.style.pointerEvents='auto'; s.classList.remove('mine'); s.classList.add('locked'); s.style.pointerEvents='none'; makeDraggable(t,'teacher'); }
    else{ s.classList.remove('locked'); s.classList.add('mine'); s.style.pointerEvents='auto'; t.classList.remove('mine'); t.classList.add('locked'); t.style.pointerEvents='none'; makeDraggable(s,'student'); }
    startPolling(); initVoice();
  })
  .catch(function(){ showAlert(T[lang].alertCheck,'⚠️'); });
}
function sendToSheet(p){ try{ fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(p)}); }catch(e){} }
function poll(){
  if(!roomId) return;
  fetch(APPS_SCRIPT_URL+"?action=getState&room="+roomId+"&t="+Date.now())
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(data.pointer){
      if(data.pointer.teacher && data.pointer.teacher.by!==myId){ var el=document.getElementById('teacherFinger'); el.style.left=data.pointer.teacher.x+'%'; el.style.top=data.pointer.teacher.y+'%'; }
      if(data.pointer.student && data.pointer.student.by!==myId){ var el2=document.getElementById('studentFinger'); el2.style.left=data.pointer.student.x+'%'; el2.style.top=data.pointer.student.y+'%'; }
    }
    if(data.image && data.image.data){ if(data.image.data!==lastImg){ lastImg=data.image.data; showImage(data.image.data); } }
    else{ if(lastImg!==''){ lastImg=''; hideImage(); } }
    if(data.peers && myStream){
      Object.values(data.peers).forEach(function(p){
        if(p.peerId===myPeer.id) return; if(calledPeers[p.peerId]) return; calledPeers[p.peerId]=true;
        try{ var call=myPeer.call(p.peerId,myStream); call.on('stream',function(rs){ playRemote(rs); }); }catch(e){}
      });
    }
  }).catch(function(){});
}
function startPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=setInterval(poll,150); }
function playRemote(rs){ var a=document.getElementById('remoteAudio'); a.srcObject=rs; a.muted=!speakerOn; a.volume=1; a.play().catch(function(){ document.addEventListener('click',function(){ a.play(); },{once:true}); }); }
function makeDraggable(el,key){
  var dragging=false,sx=0,sy=0,ox=0,oy=0;
  el.addEventListener('pointerdown',function(e){
    if((myRole==='teacher'&&key!=='teacher')||(myRole==='student'&&key!=='student')) return;
    dragging=true; try{ el.setPointerCapture(e.pointerId); }catch(err){}
    var b=document.getElementById('board').getBoundingClientRect(); sx=e.clientX; sy=e.clientY; var r=el.getBoundingClientRect(); ox=((r.left+30-b.left)/b.width)*100; oy=((r.top+40-b.top)/b.height)*100;
  });
  el.addEventListener('pointermove',function(e){
    if(!dragging) return; if((myRole==='teacher'&&key!=='teacher')||(myRole==='student'&&key!=='student')) return;
    var b=document.getElementById('board').getBoundingClientRect(); var px=Math.max(2,Math.min(98,ox+((e.clientX-sx)/b.width)*100)); var py=Math.max(5,Math.min(95,oy+((e.clientY-sy)/b.height)*100));
    el.style.left=px+'%'; el.style.top=py+'%'; var now=Date.now(); if(now-lastPointerSent>30){ lastPointerSent=now; sendToSheet({room:roomId,type:'pointer',key:key,x:px,y:py,by:myId}); }
  });
  var end=function(){ if(!dragging) return; dragging=false; var b=document.getElementById('board').getBoundingClientRect(); var r=el.getBoundingClientRect(); sendToSheet({room:roomId,type:'pointer',key:key,x:((r.left+30-b.left)/b.width)*100,y:((r.top+40-b.top)/b.height)*100,by:myId}); };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
}
function showImage(d){ var img=document.getElementById('boardImg'); img.src=d; img.classList.remove('hidden'); document.getElementById('noImgText').style.display='none'; }
function hideImage(){ document.getElementById('boardImg').classList.add('hidden'); document.getElementById('noImgText').style.display='flex'; }
function deleteImage(){ lastImg=''; hideImage(); sendToSheet({room:roomId,type:'clearImage'}); }
function initVoice(){
  myPeer=new Peer('a2z-'+roomId+'-'+myRole+'-'+myId,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}});
  myPeer.on('open',function(){
    sendToSheet({room:roomId,type:'peer',peerId:myPeer.id,role:myRole});
    getClearAudio().then(function(st){ myStream=st; myStream.getAudioTracks().forEach(function(t){ t.enabled=false; }); }).catch(function(){});
  });
  myPeer.on('call',function(call){
    getClearAudio().then(function(stream){
      if(!myStream) myStream=stream;
      try{ var s=call.peerConnection.getSenders().find(function(x){ return x.track&&x.track.kind==='audio'; }); if(s&&s.setParameters){ var pr=s.getParameters(); if(!pr.encodings) pr.encodings=[{}]; pr.encodings[0].maxBitrate=32000; s.setParameters(pr); } }catch(e){}
      call.answer(myStream); call.on('stream',function(rs){ playRemote(rs); });
    });
  });
}
function getClearAudio(){ return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,sampleRate:48000},video:false}); }
function toggleSpeaker(){ speakerOn=!speakerOn; document.getElementById('speakerBtn').innerText=speakerOn?'🔊':'🔇'; document.getElementById('remoteAudio').muted=!speakerOn; document.getElementById('voiceStatus').innerText=speakerOn?T[lang].speakerOn:T[lang].speakerOff; if(speakerOn) document.getElementById('remoteAudio').play().catch(function(){}); }
function toggleMic(){
  micOn=!micOn;
  document.getElementById('micBtn').style.background=micOn?'#22c55e':'#ef4444'; document.getElementById('micBtn').innerText=micOn?'🎤':'🔇'; document.getElementById('voiceStatus').innerText=micOn?T[lang].micOn:T[lang].micOff;
  if(micOn){
    getClearAudio().then(function(st){
      if(!myStream) myStream=st;
      myStream.getAudioTracks().forEach(function(t){ t.enabled=true; });
      calledPeers={}; sendToSheet({room:roomId,type:'peer',peerId:myPeer.id,role:myRole});
      document.getElementById('remoteAudio').play().catch(function(){});
    }).catch(function(){ showAlert(T[lang].alertMic,'🎤'); micOn=false; document.getElementById('micBtn').style.background='#ef4444'; });
  }else{ if(myStream) myStream.getAudioTracks().forEach(function(t){ t.enabled=false; }); }
}
function leaveAndBack(){
  if(roomId){ sendToSheet({room:roomId,type:'leave',peerId:myPeer?myPeer.id:myId}); sendToSheet({room:roomId,type:'clearAll'}); }
  lastImg=''; location.href='./digital_home.html?v='+Date.now();
}

// ===== ✅ বাটনগুলো এখানে সরাসরি লাগানো - ১০০% চলবে =====
document.getElementById('teacherBtn').addEventListener('click', function(){ joinAs('teacher'); });
document.getElementById('studentBtn').addEventListener('click', function(){ joinAs('student'); });
document.getElementById('createBtn').addEventListener('click', function(){ createRoom(); });
document.getElementById('langBtn').addEventListener('click', function(){ toggleLang(); });
document.getElementById('backBtn').addEventListener('click', function(){ leaveAndBack(); });
document.getElementById('deleteBtn').addEventListener('click', function(){ deleteImage(); });
document.getElementById('speakerBtn').addEventListener('click', function(){ toggleSpeaker(); });
document.getElementById('micBtn').addEventListener('click', function(){ toggleMic(); });
document.getElementById('pinEnterBtn').addEventListener('click', function(){ checkTeacherPin(); });
document.getElementById('pinCancelBtn').addEventListener('click', function(){ closePin(); });
document.getElementById('alertBtn').addEventListener('click', function(){ hideAlert(); });

document.getElementById('imgInput').addEventListener('change', function(e){
  var file=e.target.files[0]; if(!file) return; var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'); var maxW=800; var r=Math.min(1,maxW/img.width); c.width=img.width*r; c.height=img.height*r; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var d=c.toDataURL('image/jpeg',0.55); showImage(d); sendToSheet({room:roomId,type:'image',data:d,[STRIPPED]
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
});

window.addEventListener('beforeunload', function(){ if(roomId){ navigator.sendBeacon(APPS_SCRIPT_URL, JSON.stringify({room:roomId,type:'clearAll'})); } });
applyLang();
</script>
</body>
</html>
