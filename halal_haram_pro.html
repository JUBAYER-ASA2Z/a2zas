<!DOCTYPE html>
<html lang="bn" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Halal Scan Pro - Bilingual</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Hind Siliguri'; user-select:none; -webkit-tap-highlight-color:transparent; box-sizing:border-box}
body{margin:0;background:#0b1120; display:flex; justify-content:center; overflow:hidden}
.app{width:100%; max-width:480px; height:100vh; background: radial-gradient(circle at 50% 0%, #1e293b, #020617 70%); position:relative; overflow:hidden}
.silver-badge{
  background: linear-gradient(145deg,#f8fafc,#cbd5e1,#f1f5f9,#94a3b8);
  color:#0f172a; border:1.5px solid #fff; box-shadow:0 0 12px rgba(255,255,255,0.5), inset 0 1px 0 #fff;
  font-weight:900; border-radius:999px; padding:5px 14px; font-size:13px; font-family:'Orbitron';
}
.item{position:absolute; width:74px; height:74px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border:2px solid rgba(255,255,255,0.8); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:34px; cursor:pointer; box-shadow:0 10px 25px rgba(0,0,0,0.4); transition:transform 0.12s}
.item:active{transform:scale(0.88)}
.fall{animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-90px)} to{transform:translateY(115vh)}}
.plus{position:absolute; font-weight:900; font-size:24px; animation:pop 0.9s forwards; pointer-events:none; z-index:30; font-family:'Orbitron'}
@keyframes pop{0%{transform:translateY(0) scale(0.5); opacity:1}100%{transform:translateY(-80px) scale(1.4); opacity:0}}
.dev-tag{font-size:9px; letter-spacing:1.5px; opacity:0.6; font-family:'Orbitron';}
.lang-btn{border:1.5px solid rgba(255,255,255,0.3); border-radius:999px; padding:4px 10px; font-size:11px; font-weight:900; font-family:'Orbitron'; cursor:pointer; transition:0.2s}
.lang-btn.active{background:white; color:black; border-color:white; box-shadow:0 0 10px rgba(255,255,255,0.5)}
</style>
</head>
<body>
<div class="app" id="gameArea">
  <!-- Top Bar -->
  <div class="absolute top-0 w-full z-10 px-4 py-3 flex justify-between items-center bg-gradient-to-b from-black/60 to-transparent">
    <button onclick="history.back()" class="w-8 h-8 bg-white/15 backdrop-blur rounded-full text-white">‹</button>
    <div class="flex flex-col items-center">
      <div class="flex gap-1.5 mb-1.5">
        <div id="btnBN" onclick="setLang('bn')" class="lang-btn active text-white">BN</div>
        <div id="btnEN" onclick="setLang('en')" class="lang-btn text-white">EN</div>
      </div>
      <div class="silver-badge"><span id="t_coin">🪙</span> <span id="score">0</span></div>
      <div class="dev-tag text-white mt-1">DEV: JUBAYER AHMED</div>
    </div>
    <div class="text-right">
      <div class="bg-white/15 backdrop-blur px-2.5 py-1 rounded-full text-[11px] text-white font-bold"><span id="t_haramLabel">❌ Haram</span>: <span id="haramCount">0</span>/2</div>
    </div>
  </div>

  <div class="absolute top-[84px] w-full text-center z-10">
    <p id="t_subtitle" class="text-[10px] text-cyan-300 font-bold tracking-[2px] opacity-80">শুধু আইটেম দেখে চিনতে হবে</p>
  </div>

  <!-- Start -->
  <div id="startScreen" class="absolute inset-0 z-30 bg-[#020617]/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
    <div class="w-20 h-20 rounded-[24px] bg-white flex items-center justify-center text-[42px] shadow-[0_0_40px_rgba(255,255,255,0.3)]">👁️</div>
    <p id="t_title" class="text-white font-black text-[26px] mt-4 tracking-tight">HALAL SCAN <span class="text-cyan-400">PRO</span></p>
    <p id="t_desc" class="text-zinc-400 text-[12px] mt-2 leading-[18px]">সব আইটেম দেখতে একই।<br>শুধু ভিতরের আইটেম দেখে চিনতে হবে।</p>
    <div id="t_rule" class="mt-5 bg-amber-500/10 border border-amber-500/30 text-amber-300 rounded-xl px-4 py-2 text-[11px] font-bold">⚠️ ২ টা হারামে ক্লিক = Game Over</div>
    <div class="mt-4 grid grid-cols-2 gap-2 text-[11px] w-full">
      <div id="t_halalInfo" class="bg-green-500/10 border border-green-500/30 text-green-300 rounded-xl p-2">✅ Halal = +10</div>
      <div id="t_haramInfo" class="bg-red-500/10 border border-red-500/30 text-red-300 rounded-xl p-2">❌ Haram = -10</div>
    </div>
    <button id="t_startBtn" onclick="startGame()" class="mt-6 w-full bg-white text-black font-black py-3.5 rounded-full text-[15px] shadow-[0_0_20px_rgba(255,255,255,0.4)]">START SCAN ▶️</button>
    <p class="dev-tag text-white mt-6">DEVELOPED BY JUBAYER AHMED • A-S A2Z v2.0</p>
  </div>

  <!-- Over -->
  <div id="overScreen" class="hidden absolute inset-0 z-30 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
    <div id="overIcon" class="text-[60px]">💀</div>
    <p id="overTitle" class="text-white font-black text-[22px] mt-2">GAME OVER</p>
    <div class="silver-badge mt-4 text-[18px] px-6 py-2">🪙 <span id="finalScore">0</span></div>
    <p id="overReason" class="text-red-300 text-[12px] mt-3 font-bold"></p>
    <button id="t_retryBtn" onclick="startGame()" class="mt-6 w-full bg-white text-black font-black py-3.5 rounded-full">RETRY SCAN 🔄</button>
    <p class="dev-tag text-white mt-4">JUBAYER AHMED</p>
  </div>
</div>

<script>
const LANG = {
  bn: {
    subtitle: 'শুধু আইটেম দেখে চিনতে হবে • একই ব্যাকগ্রাউন্ড',
    title: 'HALAL SCAN <span class="text-cyan-400">PRO</span>',
    desc: 'সব আইটেম দেখতে একই।<br>শুধু ভিতরের আইটেম দেখে চিনতে হবে।',
    rule: '⚠️ ২ টা হারামে ক্লিক = গেম শেষ',
    halalInfo: '✅ হালাল = +10 পয়েন্ট',
    haramInfo: '❌ হারাম = -10 পয়েন্ট',
    startBtn: 'স্ক্যান শুরু করো ▶️',
    haramLabel: '❌ হারাম',
    overByHaramTitle: '২ টা হারাম ক্লিক!',
    overByHaramReason: 'তুমি ২ টা হারাম আইটেমে ক্লিক করেছো।<br>আল্লাহ হারাম থেকে বাঁচার তৌফিক দিন।',
    overCompleteTitle: 'স্ক্যান সম্পূর্ণ!',
    overCompleteReason: 'মাশাআল্লাহ! স্কোর: ',
    retryBtn: 'আবার খেলো 🔄'
  },
  en: {
    subtitle: 'IDENTIFY BY ITEM ONLY • SAME BACKGROUND',
    title: 'HALAL SCAN <span class="text-cyan-400">PRO</span>',
    desc: 'All items look same.<br>Identify by inner item only.',
    rule: '⚠️ 2 Haram Clicks = Game Over',
    halalInfo: '✅ Halal = +10 Points',
    haramInfo: '❌ Haram = -10 Points',
    startBtn: 'START SCAN ▶️',
    haramLabel: '❌ Haram',
    overByHaramTitle: '2 HARAM CLICKED!',
    overByHaramReason: 'You clicked 2 Haram items.<br>May Allah protect you from Haram.',
    overCompleteTitle: 'SCAN COMPLETE!',
    overCompleteReason: 'MashAllah! Score: ',
    retryBtn: 'RETRY SCAN 🔄'
  }
};

let currentLang = localStorage.getItem('halal_lang') || 'bn';
const HALAL = [{e:'🥛'},{e:'🍎'},{e:'🐟'},{e:'🍯'},{e:'🥚'},{e:'🍇'},{e:'🥖'},{e:'🍌'},{e:'🥜'},{e:'🍉'}];
const HARAM = [{e:'🍺'},{e:'🍷'},{e:'🐖'},{e:'🎰'},{e:'🚬'},{e:'🥓'},{e:'🍸'},{e:'💊'}];
let score=0, haramClicked=0, game=false, spawnTimer, clickedIds=new Set(), audioCtx;

function setLang(l){
  currentLang=l; localStorage.setItem('halal_lang',l);
  document.getElementById('btnBN').classList.toggle('active', l==='bn');
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  const t=LANG[l];
  document.getElementById('t_subtitle').innerText=t.subtitle;
  document.getElementById('t_title').innerHTML=t.title;
  document.getElementById('t_desc').innerHTML=t.desc;
  document.getElementById('t_rule').innerText=t.rule;
  document.getElementById('t_halalInfo').innerText=t.halalInfo;
  document.getElementById('t_haramInfo').innerText=t.haramInfo;
  document.getElementById('t_startBtn').innerText=t.startBtn;
  document.getElementById('t_haramLabel').innerText=t.haramLabel;
  document.getElementById('t_retryBtn').innerText=t.retryBtn;
}
setLang(currentLang);

function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playTone(f,type,d,v=0.3){ initAudio(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type=type; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(v,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+d); o.start(); o.stop(audioCtx.currentTime+d); }
function playHalalSound(){ playTone(800,'sine',0.15,0.4); setTimeout(()=>playTone(1200,'sine',0.2,0.4),120); }
function playHaramSound(){ playTone(200,'sawtooth',0.4,0.5); setTimeout(()=>playTone(120,'sawtooth',0.5,0.5),150); }

function startGame(){
  score=0; haramClicked=0; game=true; clickedIds.clear();
  document.getElementById('score').innerText=0; document.getElementById('haramCount').innerText=0;
  document.getElementById('startScreen').classList.add('hidden'); document.getElementById('overScreen').classList.add('hidden');
  document.querySelectorAll('.item').forEach(el=>el.remove());
  spawnTimer=setInterval(spawnItem,550); initAudio();
}
function spawnItem(){
  if(!game) return;
  const isHalal=Math.random()>0.5; const pool=isHalal?HALAL:HARAM; const data=pool[Math.floor(Math.random()*pool.length)]; const id=Date.now()+Math.random();
  const div=document.createElement('div'); div.className='item fall'; div.dataset.type=isHalal?'halal':'haram'; div.dataset.id=id;
  div.style.left=Math.random()*(window.innerWidth<480?window.innerWidth-80:400)+'px'; div.style.animationDuration=(1.8+Math.random()*0.8)+'s'; div.innerHTML=data.e;
  div.onclick=()=>handleClick(div); document.getElementById('gameArea').appendChild(div);
  setTimeout(()=>{ if(div.parentNode) div.remove(); },2600);
}
function handleClick(el){
  const cid=el.dataset.id; if(clickedIds.has(cid)) return; clickedIds.add(cid); el.style.pointerEvents='none';
  const rect=el.getBoundingClientRect(); const plus=document.createElement('div'); plus.className='plus'; plus.style.left=rect.left+10+'px'; plus.style.top=rect.top+'px';
  if(el.dataset.type==='halal'){ score+=10; plus.innerText='+10'; plus.style.color='#22d3ee'; playHalalSound(); el.style.transform='scale(1.5)'; el.style.opacity='0'; }
  else { score-=10; if(score<0) score=0; haramClicked++; plus.innerText='-10'; plus.style.color='#f87171'; playHaramSound(); el.style.transform='scale(0.3) rotate(25deg)'; el.style.opacity='0'; document.getElementById('haramCount').innerText=haramClicked; if(haramClicked>=2) setTimeout(()=>endGame(true),300); }
  document.getElementById('gameArea').appendChild(plus); document.getElementById('score').innerText=score;
  setTimeout(()=>plus.remove(),900); setTimeout(()=>el.remove(),200);
}
function endGame(byHaram=false){
  if(!game) return; game=false; clearInterval(spawnTimer); document.querySelectorAll('.item').forEach(el=>el.remove());
  document.getElementById('finalScore').innerText=score; const t=LANG[currentLang];
  if(byHaram){ document.getElementById('overIcon').innerText='🚫'; document.getElementById('overTitle').innerText=t.overByHaramTitle; document.getElementById('overReason').innerHTML=t.overByHaramReason; }
  else { document.getElementById('overIcon').innerText='🎉'; document.getElementById('overTitle').innerText=t.overCompleteTitle; document.getElementById('overReason').innerHTML=t.overCompleteReason+score; }
  document.getElementById('overScreen').classList.remove('hidden');
}
</script>
</body>
</html>
