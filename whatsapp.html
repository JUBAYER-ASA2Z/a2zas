<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Free Call Chat - A-S A2Z</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700;900&display=swap" rel="stylesheet">
<style>*{font-family:'Hind Siliguri'}.wa-bg{background:#E5DDD5 url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}.scroll-hide::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-[#111]">

<div class="max-w-[430px] mx-auto bg-white min-h-screen flex flex-col shadow-2xl relative">

<!-- ========== TOP BAR LIKE WHATSAPP ========== -->
<div class="bg-[#075E54] text-white h-[58px] flex items-center justify-between px-2 sticky top-0 z-20">
  <div class="flex items-center gap-1">
    <button onclick="history.back()" class="w-8 h-8 rounded-full flex items-center justify-center">←</button>
    <div id="headerProfile" class="w-8 h-8 rounded-full bg-white text-[#075E54] flex items-center justify-center font-black text-[13px]">A</div>
    <div>
      <p id="headerName" class="font-black text-[14px] leading-[14px]">Free Call Chat</p>
      <p id="headerSub" class="text-[10px] opacity-80 leading-[10px]">Online</p>
    </div>
  </div>
  <div class="flex items-center gap-4 text-[20px]">
    <!-- WhatsApp style call buttons -->
    <button id="audioCallBtn" onclick="makeCall('audio')" class="hidden">📞</button>
    <button id="videoCallBtn" onclick="makeCall('video')" class="hidden">🎥</button>
    <button onclick="toggleMenu()" class="text-[22px] px-2">⋮</button>
  </div>
</div>

<!-- 3 DOT MENU -->
<div id="dotMenu" class="hidden absolute top-[58px] right-2 bg-white rounded-[12px] shadow-2xl z-30 w-[200px] border overflow-hidden">
  <button onclick="viewProfile()" class="w-full text-left px-4 py-3 text-[13px] font-bold hover:bg-zinc-50">👤 আমার প্রোফাইল</button>
  <button onclick="showSavedContacts()" class="w-full text-left px-4 py-3 text-[13px] font-bold hover:bg-zinc-50">💾 সেভ করা ID</button>
  <button onclick="clearChat()" class="w-full text-left px-4 py-3 text-[13px] font-bold hover:bg-zinc-50">🗑️ চ্যাট ক্লিয়ার</button>
  <button onclick="doLogout()" class="w-full text-left px-4 py-3 text-[13px] font-bold text-red-600 hover:bg-zinc-50">🚪 লগআউট</button>
</div>

<!-- ========== AUTH BOX ========== -->
<div id="authBox" class="flex-1 flex flex-col justify-center p-6 bg-[#f0f2f5]">
  <center>
    <div class="w-20 h-20 rounded-full bg-[#25D366] flex items-center justify-center text-[36px]">💬</div>
    <h2 class="mt-4 font-black text-[22px]">Free Call Chat</h2>
    <p class="text-[11px] text-zinc-500 mt-1">আপনার A-S A2Z একাউন্ট দিয়েই লগইন করুন</p>
  </center>
  <div class="mt-8 bg-white rounded-[16px] p-5 shadow">
    <div id="loginForm">
      <input id="loginId" placeholder="User ID" class="w-full px-4 py-3 rounded-full border-2 border-zinc-900 text-[13px] font-bold">
      <input id="loginPass" type="password" placeholder="Password" class="w-full mt-3 px-4 py-3 rounded-full border text-[13px] font-bold">
      <button onclick="doLogin()" class="mt-4 w-full py-3 rounded-full bg-[#25D366] text-white font-black">লগইন করুন</button>
      <p class="text-center text-[12px] mt-4">একাউন্ট নেই? <span onclick="showReg()" class="text-blue-600 font-black">রেজিস্ট্রেশন</span></p>
    </div>
    <div id="regForm" class="hidden">
      <input id="regId" placeholder="User ID (6 অক্ষর)" class="w-full px-4 py-3 rounded-full border-2 border-zinc-900 text-[13px] font-bold">
      <input id="regName" placeholder="আপনার নাম" class="w-full mt-3 px-4 py-3 rounded-full border text-[13px] font-bold">
      <input id="regPass" type="password" placeholder="Password" class="w-full mt-3 px-4 py-3 rounded-full border text-[13px] font-bold">
      <button onclick="doReg()" class="mt-4 w-full py-3 rounded-full bg-zinc-900 text-white font-black">একাউন্ট তৈরি</button>
      <p class="text-center text-[12px] mt-4"><span onclick="showLogin()" class="text-blue-600 font-black">লগইন করুন</span></p>
    </div>
    <p id="authMsg" class="mt-3 text-center text-[11px] font-bold"></p>
  </div>
</div>

<!-- ========== MAIN WHATSAPP ========== -->
<div id="waMain" class="hidden flex-1 flex flex-col">

  <!-- Search -->
  <div class="p-2 bg-[#f0f2f5] flex gap-2 border-b">
    <input id="friendId" placeholder="User ID লিখুন (যেমন jubayer01)" class="flex-1 px-4 py-2.5 rounded-full border bg-white text-[12px] font-bold">
    <button onclick="searchUser()" class="px-5 py-2 rounded-full bg-[#075E54] text-white font-black text-[12px]">Search</button>
  </div>

  <!-- User Detail Card (Gold, Name দেখাবে) -->
  <div id="userDetailBox" class="hidden p-3 bg-white border-b">
    <!-- JS দিয়ে ভরবে -->
  </div>

  <!-- Messages -->
  <div id="messages" class="wa-bg flex-1 p-3 space-y-2 overflow-y-auto h-[62vh] scroll-hide"></div>

  <!-- Input -->
  <div class="p-2 bg-[#F0F0F0] flex items-center gap-2 border-t">
    <input id="msgInput" placeholder="মেসেজ লিখুন..." class="flex-1 px-4 py-3 rounded-full border bg-white text-[13px]">
    <button onclick="sendMsg()" class="w-11 h-11 rounded-full bg-[#25D366] text-white text-[18px] flex items-center justify-center">➤</button>
  </div>

</div>
</div>

<!-- CALL SCREEN - WhatsApp Style -->
<div id="callBox" class="hidden fixed inset-0 bg-[#111] z-50 flex flex-col max-w-[430px] mx-auto">
  <div class="flex-1 relative">
    <video id="remoteVideo" autoplay playsinline class="w-full h-full bg-black object-cover"></video>
    <video id="localVideo" autoplay muted playsinline class="w-[90px] h-[120px] absolute top-4 right-4 rounded-[12px] border-2 border-white bg-zinc-800 object-cover"></video>
    <div class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/60 to-transparent text-white">
      <p id="callName" class="font-black text-[18px]">Calling...</p>
      <p id="callStatus" class="text-[11px] opacity-80">Ringing...</p>
    </div>
  </div>
  <div class="p-6 flex justify-center gap-6 bg-[#202c33]">
    <button class="w-12 h-12 rounded-full bg-[#2a3942] text-white">🎙️</button>
    <button onclick="endCall()" class="w-14 h-14 rounded-full bg-red-500 text-white text-2xl">📞</button>
    <button class="w-12 h-12 rounded-full bg-[#2a3942] text-white">🎥</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxEOTS0WcIA92yhFEsc2mqKU7ic8-57n_kFOKcNH-aUCOjuHkMCsVh0ZBhO9X39QdoUdQ/exec";
let peer, myId, friendId, myName;

function toggleMenu(){ document.getElementById('dotMenu').classList.toggle('hidden'); }
function showReg(){ loginForm.classList.add('hidden'); regForm.classList.remove('hidden'); }
function showLogin(){ regForm.classList.add('hidden'); loginForm.classList.remove('hidden'); }
function msg(t,c){ authMsg.innerText=t; authMsg.style.color=c; }

function doLogin(){
  const u = loginId.value.trim().toLowerCase();
  const p = loginPass.value.trim();
  msg("অপেক্ষা করুন...","blue");
  fetch(`${API}?action=login&userId=${u}&pass=${encodeURIComponent(p)}`).then(r=>r.json()).then(d=>{
    if(d.error){ msg("ভুল ID/Password","red"); }
    else{
      localStorage.setItem('a2z_userId', d.userId);
      localStorage.setItem('a2z_name', d.name);
      afterAuth(d.userId, d.name);
    }
  });
}
function doReg(){
  const u = regId.value.trim().toLowerCase();
  const n = regName.value.trim();
  const p = regPass.value.trim();
  if(!/^[a-z0-9]{6,}$/.test(u)){ msg("ID 6 অক্ষরের হতে হবে","red"); return; }
  fetch(`${API}?action=register&userId=${u}&name=${encodeURIComponent(n)}&pass=${encodeURIComponent(p)}`).then(r=>r.json()).then(d=>{
    if(d.error){ msg("এই ID আগেই আছে","red"); }
    else{
      localStorage.setItem('a2z_userId', d.userId);
      localStorage.setItem('a2z_name', n);
      afterAuth(d.userId, n);
    }
  });
}

function afterAuth(id, name){
  myId = id; myName = name;
  authBox.classList.add('hidden');
  waMain.classList.remove('hidden');
  headerName.innerText = name;
  headerSub.innerText = "ID: "+id+" • Gold দেখতে ID সার্চ করুন";
  headerProfile.innerText = name.charAt(0).toUpperCase();
  initPeer();
  loadSavedContacts();
  // URL থেকে user এসেছে কিনা (Index notification থেকে)
  const params = new URLSearchParams(window.location.search);
  if(params.get('user')||params.get('call')){
    friendId = (params.get('user')||params.get('call')).toLowerCase();
    friendId_input.value = friendId;
    searchUser();
    if(params.get('call')) setTimeout(()=>makeCall('audio'), 1500);
  }
}

function initPeer(){
  peer = new Peer(myId, {config:{iceServers:[{urls:"stun:stun.l.google.com:19302"}]}});
  peer.on('call', async call=>{
    // কল আসলে WhatsApp এর মতো
    if(confirm(call.peer+" আপনাকে কল দিচ্ছে। রিসিভ করবেন?")){
      const s = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
      call.answer(s); handleCall(call);
    }
  });
}

// ========== SEARCH USER + SHOW GOLD, NAME, SAVE PERMANENT ==========
async function searchUser(){
  friendId = document.getElementById('friendId').value.trim().toLowerCase();
  if(!friendId) return alert("User ID লিখুন");
  const res = await fetch(`${API}?action=getUserDetail&userId=${friendId}`).then(r=>r.json());
  if(res.error){ alert("User ID পাওয়া যায়নি"); return; }

  // Detail Box দেখাও
  const box = document.getElementById('userDetailBox');
  box.classList.remove('hidden');
  box.innerHTML = `
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-full bg-[#075E54] text-white flex items-center justify-center font-black text-[18px]">${res.name.charAt(0).toUpperCase()}</div>
      <div class="flex-1">
        <p class="font-black text-[15px]">${res.name}</p>
        <p class="text-[11px] text-zinc-500 font-bold">ID: ${res.userId}</p>
        <p class="text-[13px] font-black text-amber-600">💰 ${res.gold||0} Gold</p>
      </div>
      <div class="flex flex-col gap-2">
        <button onclick="saveContact()" class="px-3 py-1 rounded-full bg-zinc-900 text-white text-[10px] font-black">💾 Save</button>
        <button onclick="markRead()" class="px-3 py-1 rounded-full bg-zinc-100 text-[10px] font-bold">Seen</button>
      </div>
    </div>
  `;

  // WhatsApp header এও দেখাও + কল বাটন চালু
  headerName.innerText = res.name;
  headerSub.innerText = "ID: "+res.userId+" • 💰 "+(res.gold||0);
  document.getElementById('audioCallBtn').classList.remove('hidden');
  document.getElementById('videoCallBtn').classList.remove('hidden');

  // Permanent Save
  await fetch(API, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'saveContact', ownerId:myId, contactId:friendId})});

  loadMsgs();
  setInterval(loadMsgs, 3500);
}

async function saveContact(){
  await fetch(API, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'saveContact', ownerId:myId, contactId:friendId})});
  alert("✅ "+friendId+" পার্মানেন্ট সেভ হয়ে গেছে। কখনো ডিলিট হবে না");
}

function getChatId(){ return [myId, friendId].sort().join('_'); }

async function sendMsg(){
  const text = document.getElementById('msgInput').value.trim();
  if(!text||!friendId) return;
  msgInput.value='';
  await fetch(API, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'sendMessage', chatId:getChatId(), fromId:myId, toId:friendId, message:text})});
  setTimeout(loadMsgs, 800);
}

async function loadMsgs(){
  if(!friendId) return;
  const data = await fetch(`${API}?action=getMessages&chatId=${getChatId()}`).then(r=>r.json());
  const box = document.getElementById('messages');
  box.innerHTML='';
  data.forEach(m=>{
    const isMe = m.fromId===myId;
    box.innerHTML+=`<div class="${isMe?'ml-auto bg-[#DCF8C6]':'mr-auto bg-white'} max-w-[75%] px-3 py-2 rounded-[14px] shadow text-[13px]">${m.message}<br><span class="text-[8px] text-zinc-400 float-right">${new Date(Number(m.timestamp)).toLocaleTimeString()}</span></div><div class="clear-both"></div>`;
  });
  box.scrollTop = box.scrollHeight;
}

// ========== CALL LIKE WHATSAPP ==========
async function makeCall(type){
  if(!friendId) return alert("আগে User ID Search করুন");
  // Notification পাঠাও
  await fetch(API, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'sendCall', fromId:myId, toId:friendId, callType:type})});
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:type==='video', audio:true});
    const call = peer.call(friendId, stream);
    handleCall(call);
  }catch{ alert("Camera/Mic Permission দিন"); }
}
function handleCall(call){
  document.getElementById('callBox').classList.remove('hidden');
  document.getElementById('callName').innerText = call.peer;
  document.getElementById('callStatus').innerText = "Connected...";
  call.on('stream', s=>{ remoteVideo.srcObject=s; });
  navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(s=> localVideo.srcObject=s);
  call.on('close', ()=> endCall());
  window._currentCall = call;
}
function endCall(){ if(window._currentCall) window._currentCall.close(); document.getElementById('callBox').classList.add('hidden'); }

async function loadSavedContacts(){
  const my = localStorage.getItem('a2z_userId');
  if(!my) return;
  const list = await fetch(`${API}?action=getContacts&userId=${my}`).then(r=>r.json());
  if(list.length>0){
    console.log("Saved contacts:", list);
  }
}
function showSavedContacts(){
  toggleMenu();
  const my = localStorage.getItem('a2z_userId');
  fetch(`${API}?action=getContacts&userId=${my}`).then(r=>r.json()).then(list=>{
    alert("আপনার সেভ করা ID গুলো:\n"+list.join("\n"));
  });
}
function viewProfile(){
  toggleMenu();
  alert("আপনার ID: "+myId+"\nনাম: "+myName);
}
function clearChat(){ toggleMenu(); document.getElementById('messages').innerHTML=''; }
function doLogout(){ localStorage.removeItem('a2z_userId'); localStorage.removeItem('a2z_name'); location.reload(); }
async function markRead(){
  await fetch(API, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'markRead', toId:myId, fromId:friendId})});
  alert("Seen Done");
}

window.onload=()=>{
  const saved = localStorage.getItem('a2z_userId');
  const savedName = localStorage.getItem('a2z_name');
  if(saved){ afterAuth(saved, savedName||saved); }
}
</script>
</body>
</html>
