<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jubayer Tools</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.dark{ background:#0f172a; color:white; }
.dark.card{ background:#1e293b; color:white; }
</style>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-md mx-auto">

<!-- TOP PROFILE -->
<div class="card bg-white p-4 flex items-center gap-3 m-3 rounded-xl shadow">
<img id="topPhoto" src="https://via.placeholder.com/100" class="w-14 h-14 rounded-full object-cover border">
<div><h2 id="topName" class="font-bold">Guest</h2><p id="topId" class="text-xs text-gray-500">Login করুন</p></div>
<div class="ml-auto flex gap-2">
<i id="secretIcon" class="fa-solid fa-shield-halved text-gray-300 p-2"></i>
</div>
</div>

<!-- ADS BOX -->
<div id="adsBox" class="px-3 space-y-2"></div>
<!-- NOTICE -->
<div id="noticeBox" class="px-3 mt-3"></div>

<!-- MENU -->
<div class="p-3 space-y-2">
<button onclick="openAccount()" class="card w-full bg-white p-4 rounded-xl shadow flex justify-between"><span><i class="fa-solid fa-user mr-2"></i> একাউন্ট</span><i class="fa-solid fa-chevron-right"></i></button>
<button onclick="openSettings()" class="card w-full bg-white p-4 rounded-xl shadow flex justify-between"><span><i class="fa-solid fa-gear mr-2"></i> সেটিং</span><i class="fa-solid fa-chevron-right"></i></button>
<button onclick="openRefer()" class="card w-full bg-white p-4 rounded-xl shadow flex justify-between"><span><i class="fa-solid fa-share mr-2"></i> রেফার</span><i class="fa-solid fa-chevron-right"></i></button>
</div>

<!-- ACCOUNT MODAL -->
<div id="accountModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
<div class="card bg-white w-full max-w-sm rounded-xl p-5">
<div id="loginView">
<h2 class="font-bold text-lg mb-3">একাউন্ট</h2>
<input id="regEmail" placeholder="User ID / Email" class="w-full border p-2 rounded mb-2">
<input id="regPass" type="password" placeholder="Password" class="w-full border p-2 rounded mb-2">
<input id="regName" placeholder="আপনার নাম" class="w-full border p-2 rounded mb-3">
<button onclick="doRegister()" class="w-full bg-blue-600 text-white p-2 rounded mb-2">রেজিস্ট্রেশন</button>
<button onclick="doLogin()" class="w-full bg-green-600 text-white p-2 rounded">লগইন</button>
<p id="authMsg" class="text-xs text-center mt-2"></p>
<button onclick="closeAll()" class="w-full mt-3 text-xs">বন্ধ করুন</button>
</div>
<div id="profileView" class="hidden">
<h2 class="font-bold text-lg mb-3">আমার প্রোফাইল</h2>
<div class="text-center">
<img id="profilePhoto" src="https://via.placeholder.com/150" class="w-24 h-24 rounded-full mx-auto object-cover border">
<input type="file" id="photoInput" accept="image/*" class="text-xs mt-2">
</div>
<input id="editName" placeholder="নাম" class="w-full border p-2 rounded mt-3 mb-2">
<input id="editTitle" placeholder="পদবী (যেমন: Student)" class="w-full border p-2 rounded mb-2">
<textarea id="editBio" placeholder="বিবরণ লিখুন" class="w-full border p-2 rounded mb-3"></textarea>
<button onclick="saveProfileLocal()" class="w-full bg-blue-600 text-white p-2 rounded">Save (শুধু ফোনে থাকবে)</button>
<button onclick="logout()" class="w-full mt-2 bg-red-500 text-white p-2 rounded text-sm">Logout</button>
<button onclick="closeAll()" class="w-full mt-2 text-xs">বন্ধ করুন</button>
<div id="myNotices" class="mt-4 text-left"></div>
</div>
</div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
<div class="card bg-white w-full max-w-sm rounded-xl p-5">
<h2 class="font-bold mb-3">সেটিং</h2>
<label class="flex justify-between mb-3"><span>ভাষা / Language</span><select id="langSel" onchange="changeLang(this.value)" class="border rounded p-1"><option value="bn">বাংলা</option><option value="en">English</option></select></label>
<label class="flex justify-between mb-3"><span>Dark Mode</span><input type="checkbox" id="darkSel" onchange="toggleDark(this.checked)"></label>
<button onclick="closeAll()" class="w-full bg-gray-200 p-2 rounded mt-3">বন্ধ করুন</button>
</div>
</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbzbnWdoV_5z8XHokG41lIZgE6lQvt2qZRDeQeHnp6LaojGj_l_gHp0mQwGsv7bPtHGc/exec";
let clickCount=0, clickTimer=null;

document.getElementById('secretIcon').addEventListener('click',()=>{
 clickCount++; if(clickTimer) clearTimeout(clickTimer);
 clickTimer=setTimeout(()=>clickCount=0,2000);
 if(clickCount>=3){ clickCount=0; let c=prompt("Developer Code:"); if(c==="321123"){ localStorage.setItem('isDev','1'); location.href='developer.html'; } }
});

function loadLocalProfile(){
 let p=JSON.parse(localStorage.getItem('localProfile')||'{}');
 if(p.photo){ document.getElementById('topPhoto').src=p.photo; document.getElementById('profilePhoto').src=p.photo; }
 if(p.name){ document.getElementById('topName').innerText=p.name; document.getElementById('editName').value=p.name; }
 if(p.title) document.getElementById('editTitle').value=p.title;
 if(p.bio) document.getElementById('editBio').value=p.bio;
 let u=JSON.parse(localStorage.getItem('user')||'null');
 if(u){ document.getElementById('topName').innerText=u.name||p.name; document.getElementById('topId').innerText=u.email; openProfile(); }
}
document.getElementById('photoInput').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f) return;
 let r=new FileReader(); r.onload=ev=>{
  let img=new Image(); img.onload=()=>{
   let c=document.createElement('canvas'); let w=200; let h=200; c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
   let d=c.toDataURL('image/jpeg',0.6);
   document.getElementById('profilePhoto').src=d; document.getElementById('topPhoto').src=d;
   let lp=JSON.parse(localStorage.getItem('localProfile')||'{}'); lp.photo=d; localStorage.setItem('localProfile',JSON.stringify(lp));
  }; img.src=ev.target.result;
 }; r.readAsDataURL(f);
});

function saveProfileLocal(){
 let lp=JSON.parse(localStorage.getItem('localProfile')||'{}');
 lp.name=document.getElementById('editName').value; lp.title=document.getElementById('editTitle').value; lp.bio=document.getElementById('editBio').value;
 localStorage.setItem('localProfile',JSON.stringify(lp)); loadLocalProfile(); alert("Saved - শুধু আপনার ফোনে থাকবে ✅");
}
function openAccount(){
 let u=JSON.parse(localStorage.getItem('user')||'null');
 if(u){ document.getElementById('accountModal').classList.remove('hidden'); document.getElementById('loginView').classList.add('hidden'); document.getElementById('profileView').classList.remove('hidden'); loadLocalProfile(); loadMyNotices(); }
 else{ document.getElementById('accountModal').classList.remove('hidden'); document.getElementById('loginView').classList.remove('hidden'); document.getElementById('profileView').classList.add('hidden'); }
}
function openProfile(){}
function closeAll(){ document.getElementById('accountModal').classList.add('hidden'); document.getElementById('settingsModal').classList.add('hidden'); }
function openSettings(){ document.getElementById('settingsModal').classList.remove('hidden'); }
function openRefer(){ alert("Refer: "+(JSON.parse(localStorage.getItem('user')||'{}').email||"Login করুন")); }

function apiPost(a,d){ let fd=new FormData(); fd.append('action',a); for(let k in d) fd.append(k,d[k]); return fetch(API,{method:'POST',body:fd}).then(r=>r.json()); }

function doRegister(){
 apiPost('register',{email:regEmail.value, name:regName.value, pass:regPass.value}).then(r=>{
  if(r.error){ authMsg.innerText=r.error; return; }
  localStorage.setItem('user',JSON.stringify({email:r.email||regEmail.value, name:regName.value}));
  authMsg.innerText="Success ✅"; setTimeout(()=>{ closeAll(); loadLocalProfile(); location.reload(); },800);
 });
}
function doLogin(){
 apiPost('login',{email:regEmail.value, pass:regPass.value}).then(r=>{
  if(r.error){ authMsg.innerText=r.error; return; }
  localStorage.setItem('user',JSON.stringify({email:r.email, name:r.name}));
  closeAll(); loadLocalProfile(); location.reload();
 });
}
function logout(){ localStorage.removeItem('user'); location.reload(); }
function toggleDark(v){ document.body.classList.toggle('dark',v); localStorage.setItem('dark',v); }
function changeLang(v){ localStorage.setItem('lang',v); alert("Language: "+v); }
function loadAds(){ fetch(API+"?action=getAds").then(r=>r.json()).then(l=>{ let h=""; l.forEach(a=>{ h+=`<div class="card bg-white rounded-xl shadow overflow-hidden"><img src="${a.image}" class="w-full h-40 object-cover"><div class="p-2 flex justify-between"><span>${a.title}</span><a href="${a.link}" target="_blank" class="text-blue-600 text-sm">Visit</a></div></div>`; }); document.getElementById('adsBox').innerHTML=h; }); }
function loadNotices(){ fetch(API+"?action=getNotice").then(r=>r.json()).then(l=>{ let h=""; l.forEach(n=>{ h+=`<div class="bg-yellow-100 text-yellow-800 p-2 rounded text-sm mb-1">${n.text}</div>`; }); document.getElementById('noticeBox').innerHTML=h; }); }
function loadMyNotices(){ let u=JSON.parse(localStorage.getItem('user')||'null'); if(!u) return; fetch(API+"?action=getPersonalNotices&email="+u.email).then(r=>r.json()).then(l=>{ let h="<h3 class='font-bold text-sm'>আমার নোটিশ</h3>"; l.forEach(n=>{ h+=`<div class="bg-blue-50 p-2 rounded text-xs mt-1">${n.text}</div>`; }); document.getElementById('myNotices').innerHTML=h; }); }

loadLocalProfile(); loadAds(); loadNotices();
if(localStorage.getItem('dark')==='true'){ document.body.classList.add('dark'); document.getElementById('darkSel').checked=true; }
</script>
</body>
</html>
