<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#fff5f7}
.wrap{max-width:400px;margin:auto;min-height:100vh;background:#fff5f7}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff}
.top-left{display:flex;gap:10px;align-items:center}
.back{width:36px;height:36px;border-radius:50%;border:0;background:#f4f4f5;cursor:pointer}
.lang{display:flex;gap:6px;align-items:center}
.lang button{border:1px solid #ddd;background:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.lang button.active{background:#111;color:#fff;border-color:#111}
.dot{width:24px;height:24px;border-radius:50%;border:1px dashed #ccc;background:#fff;opacity:1;margin-left:4px;cursor:pointer;font-size:10px}
.list{padding:12px}
.item{width:100%;background:#fff;border:1px solid #eee;display:flex;justify-content:space-between;align-items:center;padding:16px 14px;border-radius:14px;margin-bottom:10px;font-weight:600;font-size:15px;cursor:pointer}
.item span{opacity:.6}
.item.disabled{opacity:.4;pointer-events:none;background:#f3f3f3}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="top-left">
<button class="back" onclick="location.href='index.html'">←</button>
<b id="tMenu">মেনু</b>
</div>
<div class="lang">
<button id="bBN" class="active" onclick="setLang('bn')">BN</button>
<button id="bEN" onclick="setLang('en')">EN</button>
<button id="secret" class="dot" title="Developer">●</button>
</div>
</div>
<div class="list">
<button class="item" onclick="location.href='account.html'"><span id="l1">👤 একাউন্ট</span><span>›</span></button>
<button class="item" onclick="location.href='livechat.html'"><span id="l2">💬 লাইভ চ্যাট</span><span>›</span></button>
<button class="item" onclick="location.href='support.html'"><span id="l3">🎧 সাপোর্ট</span><span>›</span></button>
<button class="item disabled"><span id="l4">⚙️ সেটিংস</span><span>🔒</span></button>
</div>
</div>

<script>
// Developer Secret - ৩ বার ট্যাপ
let c=0;
let lastTap=0;
document.getElementById('secret').onclick=()=>{
 let now=Date.now();
 if(now-lastTap>2000) c=0;
 c++; lastTap=now;
 if(c>=3){ 
  c=0; 
  let code=prompt("Developer Code দিন:");
  if(code==="321123" || code==="0626"){ 
    localStorage.setItem('isDev','1'); 
    alert("Developer ON ✅");
    location.href='developer.html'; 
  } else if(code){
    alert("ভুল কোড!");
  }
 }
};

// ব্যাকআপ - মেনু লেখায় ৫ বার ট্যাপ করলেও হবে
let menuTap=0;
document.getElementById('tMenu').onclick=()=>{
  menuTap++;
  setTimeout(()=>menuTap=0,2000);
  if(menuTap>=5){
    menuTap=0;
    document.getElementById('secret').click();
  }
};

function setLang(l){
 localStorage.setItem('lang',l);
 document.getElementById('bBN').classList.toggle('active',l==='bn');
 document.getElementById('bEN').classList.toggle('active',l==='en');
 if(l==='en'){
   tMenu.innerText='Menu';
   l1.innerText='👤 Account';
   l2.innerText='💬 Live Chat';
   l3.innerText='🎧 Support';
   l4.innerText='⚙️ Settings';
 }else{
   tMenu.innerText='মেনু';
   l1.innerText='👤 একাউন্ট';
   l2.innerText='💬 লাইভ চ্যাট';
   l3.innerText='🎧 সাপোর্ট';
   l4.innerText='⚙️ সেটিংস';
 }
}
let saved=localStorage.getItem('lang')||'bn'; setLang(saved);
</script>
</body>
</html>
