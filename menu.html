<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - A-S A 2 Z Final</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:'Hind Siliguri';}</style>
</head>
<body class="bg-black min-h-screen pb-10">
<div class="max-w-[650px] mx-auto bg-black min-h-screen text-white">
<div class="p-5 flex justify-between items-center border-b border-white/10 sticky top-0 bg-black z-50">
<div class="flex items-center"><button onclick="location.href='index.html'" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center mr-3">←</button><h2 class="font-black text-[18px]">My Account</h2></div>
<button onclick="openSettings()" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">⚙️</button>
</div>
<div id="accountContent" class="p-6"></div>
<div id="myNoticeBox" class="px-6"></div>
<div class="px-6 space-y-3 mt-4">
<a href="group-chat.html" class="w-full flex items-center gap-3 p-4 rounded-[14px] bg-zinc-900 font-bold">💬 Live Group Chat <span class="ml-auto bg-green-500 text-[9px] px-2 py-1 rounded-full animate-pulse">LIVE</span></a>
<button onclick="shareApp()" class="w-full flex items-center gap-3 p-4 rounded-[14px] bg-zinc-900 font-bold text-left">🔗 Refer & Share</button>
<a href="support.html" class="w-full flex items-center gap-3 p-4 rounded-[14px] bg-zinc-900 font-bold">🛟 Support</a>
<button onclick="location.href='index.html'" class="w-full flex items-center gap-3 p-4 rounded-[14px] bg-white text-black font-black">🏠 Back To Home</button>
</div>
</div>

<!-- Settings -->
<div id="settingsModal" class="fixed inset-0 z-[100] hidden overflow-y-auto bg-white"><div class="max-w-[650px] mx-auto bg-white min-h-screen"><div class="bg-zinc-900 text-white p-6 flex justify-between items-center"><h2 class="font-black">⚙️ Settings</h2><button onclick="closeSettings()" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">✕</button></div><div class="p-6"><div id="hiddenDevIcon" class="w-24 h-24 rounded-[24px] bg-zinc-100 flex items-center justify-center text-[36px] border-2 border-dashed mx-auto">⚙️</div><p class="text-[11px] text-zinc-400 mt-3 font-bold text-center">3 বার ট্যাপ করুন</p></div></div></div>
<div id="devCodeModal" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-6"><div class="absolute inset-0 bg-black/70" onclick="closeDevCode()"></div><div class="relative w-full max-w-[320px] bg-white rounded-[24px] p-7 text-center"><h3 class="font-black text-black">Developer Code</h3><input id="devCodeInput" type="password" placeholder="••••" class="w-full mt-6 p-4 rounded-[14px] bg-zinc-100 text-center font-black tracking-[8px] text-black text-[20px]"><button onclick="checkDevCode()" class="w-full mt-4 bg-black text-white font-black py-4 rounded-[14px]">UNLOCK</button></div></div>

<!-- DEV PANEL FINAL -->
<div id="devPanel" class="fixed inset-0 z-[300] hidden overflow-y-auto bg-zinc-50"><div class="max-w-[650px] mx-auto bg-white min-h-screen"><div class="bg-black text-white p-6 flex justify-between items-center"><h2 class="font-black">👨‍💻 Developer Final</h2><button onclick="closeDevPanel()" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">✕</button></div><div class="p-5 space-y-6">
<div class="grid grid-cols-3 gap-3"><div class="bg-blue-50 border rounded-[14px] p-4 text-center"><p class="text-[10px] text-zinc-500 font-bold">TODAY</p><p id="statToday" class="font-black text-[22px] text-black">0</p></div><div class="bg-green-50 border rounded-[14px] p-4 text-center"><p class="text-[10px] text-zinc-500 font-bold">TOTAL</p><p id="statTotal" class="font-black text-[22px] text-black">0</p></div><div class="bg-yellow-50 border rounded-[14px] p-4 text-center"><p class="text-[10px] text-zinc-500 font-bold">USERS</p><p id="statUsers" class="font-black text-[22px] text-black">0</p></div></div>

<!-- HOME NOTICE -->
<div class="bg-yellow-50 border-2 border-yellow-400 rounded-[16px] p-5"><h3 class="font-black text-black text-[14px]">🏠 হোম পেজ নোটিশ (index.html)</h3><input id="globalNoticeInput" placeholder="হোম নোটিশ লিখুন..." class="w-full mt-4 p-4 border rounded-[12px] bg-white text-black"><button onclick="saveGlobalNotice()" class="w-full mt-3 bg-black text-white py-3 rounded-[12px] font-bold">💾 Save Home Notice</button><div id="globalNoticeList" class="mt-4 space-y-2"></div></div>

<div class="bg-pink-50 border-2 border-pink-200 rounded-[16px] p-5"><h3 class="font-black text-black">📢 Ads</h3><input id="adTitle" placeholder="Title" class="w-full mt-3 p-3 rounded-[12px] bg-white border text-black"><input id="adLink" placeholder="Link" class="w-full mt-2 p-3 rounded-[12px] bg-white border text-black"><input type="file" id="adImage" accept="image/*" class="w-full mt-2 p-2 bg-white border rounded-[12px] text-black"><button onclick="addAd()" class="w-full mt-3 bg-[#ff3a7a] text-white font-black py-3 rounded-[12px]">+ Add Ad</button><div id="adminAdList" class="mt-3 space-y-2"></div></div>

<!-- ACCOUNTS WITH NOTICE ICON -->
<div class="bg-zinc-50 border rounded-[16px] p-5"><h3 class="font-black text-black">👤 Accounts - Notice + Delete</h3><div class="flex gap-2 mt-3"><button onclick="loadUsers()" class="flex-1 bg-blue-600 text-white py-3 rounded-[12px] font-black text-[12px]">Load</button><button onclick="allowReRegister()" class="flex-1 bg-yellow-400 text-black py-3 rounded-[12px] font-bold text-[12px] border-2 border-black">Allow Re-Reg</button></div>

<div class="bg-white border-2 border-red-200 rounded-[14px] p-4 mt-4"><h4 class="font-black text-[13px] text-black">📩 একসাথে নোটিশ পাঠান</h4><textarea id="personalNoticeText" placeholder="নোটিশ লিখুন..." class="w-full mt-3 p-3 rounded-[12px] bg-zinc-50 border text-black h-[70px] text-[13px]"></textarea><div class="flex gap-2 mt-2"><button onclick="selectAll()" class="text-[11px] bg-zinc-900 text-white px-3 py-1 rounded-full">Select All</button><button onclick="deselectAll()" class="text-[11px] bg-zinc-200 text-black px-3 py-1 rounded-full">Deselect</button></div><button onclick="sendPersonalNotice()" class="w-full mt-3 bg-red-600 text-white font-black py-3 rounded-[12px] text-[13px]">📤 সিলেক্টেডদের পাঠান</button></div>

<div id="userList" class="mt-4 space-y-3"></div>
<h4 class="font-black text-[13px] text-black mt-6">📋 সব পার্সোনাল নোটিশ (ডিলিট করতে পারবেন)</h4><div id="allPersonalNoticeList" class="mt-2 space-y-2"></div>
</div>

</div></div></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxSAJZs1Ql9X5140-RljWLhtR_cCfxKuyofIj6lRALBWxigOgyAdeaniz2Drzid4gbs/exec";
let currentUser=JSON.parse(localStorage.getItem('jubayer_user')||'null');
let tempPhoto=""; let editPhoto="";
function openSettings(){document.getElementById('settingsModal').classList.remove('hidden');let icon=document.getElementById('hiddenDevIcon');let c=0;let t=null;icon.onclick=()=>{c++;clearTimeout(t);t=setTimeout(()=>c=0,2000);if(c>=3){c=0;closeSettings();document.getElementById('devCodeModal').classList.remove('hidden');}};}
function closeSettings(){document.getElementById('settingsModal').classList.add('hidden');}
function closeDevCode(){document.getElementById('devCodeModal').classList.add('hidden');document.getElementById('devCodeInput').value='';}
function checkDevCode(){let code=document.getElementById('devCodeInput').value.trim();if(code===atob('KjMyMTEj')){closeDevCode();document.getElementById('devPanel').classList.remove('hidden');loadStats();loadGlobalNoticeList();loadAdminAds();loadUsers();}else{alert('ভুল কোড!');}}
function closeDevPanel(){document.getElementById('devPanel').classList.add('hidden');}
function shareApp(){if(navigator.share){navigator.share({title:'A-S A 2 Z',url:location.href});}else{prompt('Copy:',location.href);}}
function renderAccount(){let c=document.getElementById('accountContent');let done=localStorage.getItem('a2z_reg_done')==='true';if(!currentUser){let reg=`<div class="mt-8 border-t border-white/10 pt-8"><h3 class="font-black text-white mb-4">Register</h3><input id="r_user" placeholder="Email" class="w-full p-4 rounded-[14px] bg-white text-black"><input id="r_pass" type="password" placeholder="Password" class="w-full mt-3 p-4 rounded-[14px] bg-white text-black"><input type="file" accept="image/*" onchange="handlePhoto(this)" class="w-full mt-4 text-white text-[12px] bg-white/10 p-3 rounded-[12px]"><img id="photoPreview" class="w-24 h-24 rounded-full mt-4 hidden object-cover border-4 border-white/20 mx-auto"><button onclick="doRegister()" class="w-full mt-6 bg-yellow-400 text-black font-black py-4 rounded-[14px] border-2 border-black">Register</button></div>`;if(done) reg=`<div class="bg-white/10 rounded-[16px] p-6 text-center border border-white/10 mt-6"><p class="text-yellow-400 font-black">এই ডিভাইসে ১ বার রেজিস্ট্রেশন হয়েছে</p></div>`;c.innerHTML=`<div class="bg-white rounded-[20px] p-6 text-black"><h3 class="font-black text-[18px]">Login</h3><input id="l_user" placeholder="Email" class="w-full mt-5 p-4 rounded-[14px] bg-zinc-100 border-2 text-black"><input id="l_pass" type="password" placeholder="Password" class="w-full mt-3 p-4 rounded-[14px] bg-zinc-100 border-2 text-black"><button onclick="doLogin()" class="w-full mt-5 bg-black text-white font-black py-4 rounded-[14px]">Login Now</button></div>${reg}`;}else{c.innerHTML=`<div class="text-center"><img src="${currentUser.photo||''}" class="w-28 h-28 rounded-full mx-auto object-cover border-4 border-white/20 ${currentUser.photo?'':'hidden'}"><h3 class="font-black text-[22px] mt-4 text-white">${currentUser.fullName||currentUser.name}</h3><p class="text-[13px] text-zinc-400 mt-1">${currentUser.email}</p><button onclick="openEdit()" class="mt-5 bg-white text-black px-8 py-3 rounded-full font-bold text-[13px]">✏️ Edit</button></div><div id="editBox" class="hidden mt-8 bg-white rounded-[20px] p-6 text-black"><h3 class="font-black">Edit Profile</h3><input id="e_name" value="${currentUser.fullName||''}" placeholder="Full Name" class="w-full mt-4 p-4 rounded-[14px] bg-zinc-100 border-2 text-black"><input id="e_dob" type="date" value="${currentUser.dob||''}" class="w-full mt-3 p-4 rounded-[14px] bg-zinc-100 border-2 text-black"><textarea id="e_bio" placeholder="Bio" class="w-full mt-3 p-4 rounded-[14px] bg-zinc-100 border-2 text-black h-[80px]">${currentUser.bio||''}</textarea><input id="e_pass" type="password" placeholder="New Password" class="w-full mt-3 p-4 rounded-[14px] bg-zinc-100 border-2 text-black"><input type="file" accept="image/*" onchange="handleEditPhoto(this)" class="w-full mt-3 p-3 rounded-[12px] bg-zinc-50 border"><img id="editPreview" src="${currentUser.photo||''}" class="w-24 h-24 rounded-full mt-4 ${currentUser.photo?'':'hidden'} object-cover mx-auto"><button onclick="saveProfile()" class="w-full mt-6 bg-black text-white font-black py-4 rounded-[14px]">Save</button></div><button onclick="logout()" class="w-full mt-8 bg-red-500 text-white font-bold py-4 rounded-[14px]">Logout</button>`; loadMyPersonalNotice();}}
function handlePhoto(i){if(i.files[0]){let r=new FileReader();r.onload=e=>{tempPhoto=e.target.result;let p=document.getElementById('photoPreview');p.src=tempPhoto;p.classList.remove('hidden');};r.readAsDataURL(i.files[0]);}}
function handleEditPhoto(i){if(i.files[0]){let r=new FileReader();r.onload=e=>{editPhoto=e.target.result;let p=document.getElementById('editPreview');p.src=editPhoto;p.classList.remove('hidden');};r.readAsDataURL(i.files[0]);}}
function openEdit(){document.getElementById('editBox').classList.remove('hidden');editPhoto=currentUser.photo||"";}
function doRegister(){let u=document.getElementById('r_user').value.trim();let p=document.getElementById('r_pass').value.trim();if(!u||!p){alert('Fill all');return;}let id=localStorage.getItem('a2z_id')||'a2z_'+Date.now();localStorage.setItem('a2z_id',id);fetch(`${API_URL}?action=register&email=${encodeURIComponent(u)}&name=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}&photo=${encodeURIComponent(tempPhoto)}&deviceId=${id}`).then(r=>r.json()).then(d=>{if(d.error) alert(d.error); else{localStorage.setItem('jubayer_user',JSON.stringify(d));localStorage.setItem('a2z_reg_done','true');location.reload();}});}
function doLogin(){let u=document.getElementById('l_user').value.trim();let p=document.getElementById('l_pass').value.trim();fetch(`${API_URL}?action=login&email=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`).then(r=>r.json()).then(d=>{if(d.error) alert(d.error); else{localStorage.setItem('jubayer_user',JSON.stringify(d));location.reload();}});}
function saveProfile(){let n=document.getElementById('e_name').value.trim();let dob=document.getElementById('e_dob').value;let bio=document.getElementById('e_bio').value.trim();let pass=document.getElementById('e_pass').value.trim();if(!n){alert('Name দিন');return;}let photoToSend=editPhoto||currentUser.photo||"";let url=`${API_URL}?action=updateProfile&email=${encodeURIComponent(currentUser.email)}&fullName=${encodeURIComponent(n)}&dob=${encodeURIComponent(dob)}&bio=${encodeURIComponent(bio)}&pass=${encodeURIComponent(pass)}&photo=${encodeURIComponent(photoToSend)}`;fetch(url).then(r=>r.json()).then(()=>{currentUser.fullName=n;currentUser.dob=dob;currentUser.bio=bio;if(photoToSend) currentUser.photo=photoToSend;localStorage.setItem('jubayer_user',JSON.stringify(currentUser));alert('Saved!');renderAccount();});}
function logout(){localStorage.removeItem('jubayer_user');location.reload();}
function loadStats(){fetch(API_URL+"?action=stats").then(r=>r.json()).then(s=>{document.getElementById('statToday').innerText=s.daily||0;document.getElementById('statTotal').innerText=s.total||0;document.getElementById('statUsers').innerText=s.users||0;});}
function loadUsers(){fetch(API_URL+"?action=getUsers").then(r=>r.json()).then(list=>{let html='';list.forEach(u=>{html+=`<div class="bg-white border-2 rounded-[14px] p-3 flex items-center gap-3 text-black"><input type="checkbox" value="${u.email}" class="userChk w-5 h-5"><img src="${u.photo||'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full object-cover"><div class="flex-1"><p class="font-black text-[12px]">${u.fullName||u.name}</p><p class="text-[10px] text-zinc-500">${u.email}</p></div><button onclick="sendToOne('${u.email}')" class="w-9 h-9 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">📩</button><button onclick="delUser('${u.email}')" class="w-9 h-9 rounded-full bg-red-50 text-red-600 flex items-center justify-center">🗑️</button></div>`;});document.getElementById('userList').innerHTML=html||'No users'; loadAllPersonal();});}
function delUser(e){if(confirm('Delete '+e+'?')) fetch(`${API_URL}?action=deleteUser&email=${encodeURIComponent(e)}`).then(()=>loadUsers());}
function allowReRegister(){localStorage.removeItem('a2z_reg_done');alert('Allow Done');}
function selectAll(){document.querySelectorAll('.userChk').forEach(c=>c.checked=true);} function deselectAll(){document.querySelectorAll('.userChk').forEach(c=>c.checked=false);}
function sendToOne(email){let txt=prompt('Notice for '+email+':'); if(!txt) return; fetch(`${API_URL}?action=addPersonalNotice&text=${encodeURIComponent(txt)}&emails=${encodeURIComponent(email)}`).then(()=>{alert('Sent to '+email); loadAllPersonal();});}
function sendPersonalNotice(){let txt=document.getElementById('personalNoticeText').value.trim(); let checks=document.querySelectorAll('.userChk:checked'); let emails=Array.from(checks).map(c=>c.value).join(','); if(!txt||!emails){alert('নোটিশ + একাউন্ট সিলেক্ট করুন'); return;} fetch(`${API_URL}?action=addPersonalNotice&text=${encodeURIComponent(txt)}&emails=${encodeURIComponent(emails)}`).then(()=>{alert('পাঠানো হয়েছে!'); document.getElementById('personalNoticeText').value=''; loadAllPersonal();});}
function loadAllPersonal(){fetch(API_URL+"?action=getAllPersonalNotices").then(r=>r.json()).then(list=>{let h='';list.forEach(n=>{h+=`<div class="flex justify-between bg-white border rounded-[12px] p-3 text-[11px] text-black"><span><b>${n.email}:</b> ${n.text}</span><button onclick="delPersonal('${n.id}')" class="text-red-500 ml-2 font-bold">✕</button></div>`;}); document.getElementById('allPersonalNoticeList').innerHTML=h||'No personal notice';});}
function delPersonal(id){fetch(`${API_URL}?action=deletePersonalNotice&id=${encodeURIComponent(id)}`).then(()=>loadAllPersonal());}
function addAd(){let title=document.getElementById('adTitle').value.trim();let link=document.getElementById('adLink').value.trim();let file=document.getElementById('adImage').files[0];if(!title){alert('Title');return;}let send=(img)=>{fetch(`${API_URL}?action=addAd&title=${encodeURIComponent(title)}&link=${encodeURIComponent(link)}&image=${encodeURIComponent(img)}`).then(()=>{alert('Ad Added'); document.getElementById('adTitle').value=''; document.getElementById('adLink').value=''; loadAdminAds();});};if(file){let r=new FileReader();r.onload=e=>send(e.target.result);r.readAsDataURL(file);} else send('https://via.placeholder.com/600x300');}
function loadAdminAds(){fetch(API_URL+"?action=getAds").then(r=>r.json()).then(ads=>{let h='';(ads||[]).forEach(ad=>{h+=`<div class="flex gap-3 items-center bg-white border rounded-[14px] p-3"><img src="${ad.image||ad.img}" class="w-20 h-12 object-cover rounded-[10px]"><div class="flex-1"><p class="font-black text-[12px] text-black">${ad.title}</p></div><button onclick="delAd('${ad.id}')" class="w-10 h-10 rounded-full bg-red-50 text-red-500">🗑️</button></div>`;});document.getElementById('adminAdList').innerHTML=h||'No Ads';});}
function delAd(id){fetch(`${API_URL}?action=deleteAd&id=${encodeURIComponent(id)}`).then(()=>loadAdminAds());}
function saveGlobalNotice(){let t=document.getElementById('globalNoticeInput').value.trim();if(!t){alert('Write');return;}fetch(`${API_URL}?action=addNotice&text=${encodeURIComponent(t)}`).then(()=>{alert('Home Notice Saved');document.getElementById('globalNoticeInput').value='';loadGlobalNoticeList();});}
function loadGlobalNoticeList(){fetch(API_URL+"?action=getNotice").then(r=>r.json()).then(list=>{let h='';(list||[]).forEach(n=>{h+=`<div class="flex justify-between bg-white border rounded-[12px] p-3 text-[11px] text-black"><span>${n.text||n.notice}</span><button onclick="delGNotice('${n.id}')" class="text-red-500 font-bold">✕ Delete</button></div>`;});document.getElementById('globalNoticeList').innerHTML=h||'No Home Notice';});}
function delGNotice(id){fetch(`${API_URL}?action=deleteNotice&id=${encodeURIComponent(id)}`).then(()=>loadGlobalNoticeList());}
function loadMyPersonalNotice(){if(!currentUser) return; fetch(`${API_URL}?action=getPersonalNotice&email=${encodeURIComponent(currentUser.email)}`).then(r=>r.json()).then(list=>{let box=document.getElementById('myNoticeBox'); if(!box) return; if(list.length==0){box.innerHTML=''; return;} box.innerHTML=list.map(n=>`<div class="bg-red-500 text-white p-4 rounded-[14px] mt-3 flex gap-3"><span class="text-[20px]">📩</span><div><p class="font-black text-[13px]">Admin Notice</p><p class="text-[12px] mt-1">${n.text}</p></div>`).join('');});}
window.addEventListener('load',()=>{renderAccount();});
</script>
</body>
</html>
