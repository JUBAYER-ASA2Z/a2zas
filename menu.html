<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#fff5f7}
.wrap{max-width:400px;margin:auto;min-height:100vh;background:#fff5f7}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff}
.top-left{display:flex;gap:10px;align-items:center}
.back{width:36px;height:36px;border-radius:50%;border:0;background:#f4f4f5}
.lang{display:flex;gap:6px;align-items:center}
.lang button{border:1px solid #ddd;background:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.lang button.active{background:#111;color:#fff;border-color:#111}
.dot{width:18px;height:18px;border-radius:50%;border:0;background:transparent;opacity:.15;margin-left:4px}
.list{padding:12px}
.item{width:100%;background:#fff;border:1px solid #eee;display:flex;justify-content:space-between;align-items:center;padding:16px 14px;border-radius:14px;margin-bottom:10px;font-weight:600;font-size:15px}
.item span{opacity:.4}
.item.disabled{opacity:.4;pointer-events:none;background:#f3f3f3}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
<div class="top-left">
<button class="back" onclick="location.href='index.html'">←</button>
<b id="tMenu">মেনু</b>
</div>
<div class="lang">
<button id="bBN" class="active" onclick="setLang('bn')">BN</button>
<button id="bEN" onclick="setLang('en')">EN</button>
<button id="secret" class="dot">●</button>
</div>
</div>

<div class="list">
<button class="item" onclick="location.href='account.html'"><span id="l1">👤 একাউন্ট</span><span>›</span></button>
<button class="item" onclick="location.href='livechat.html'"><span id="l2">💬 লাইভ চ্যাট</span><span>›</span></button>
<button class="item" onclick="location.href='support.html'"><span id="l3">🎧 সাপোর্ট</span><span>›</span></button>
<button class="item disabled" onclick="return false"><span id="l4">⚙️ সেটিংস</span><span>🔒</span></button>
</div>

</div>

<script>
// NO API - NO FETCH - NO GOOGLE
let c=0;
document.getElementById('secret').onclick=()=>{
 c++; setTimeout(()=>c=0,2000);
 if(c>=3){ c=0; let code=prompt("Code:"); if(code==="321123"){ localStorage.setItem('isDev','1'); location.href='developer.html'; } }
};

function setLang(l){
 localStorage.setItem('lang',l);
 document.getElementById('bBN').classList.toggle('active',l==='bn');
 document.getElementById('bEN').classList.toggle('active',l==='en');
 if(l==='en'){
   tMenu.innerText='Menu';
   l1.innerText='👤 Account';
   l2.innerText='💬 Live Chat';
   l3.innerText='🎧 Support';
   l4.innerText='⚙️ Settings';
 }else{
   tMenu.innerText='মেনু';
   l1.innerText='👤 একাউন্ট';
   l2.innerText='💬 লাইভ চ্যাট';
   l3.innerText='🎧 সাপোর্ট';
   l4.innerText='⚙️ সেটিংস';
 }
}
let saved=localStorage.getItem('lang')||'bn'; setLang(saved);
</script>
</body>
</html>
