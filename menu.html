<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jubayer Tools</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:sans-serif}</style>
</head>
<body class="bg-gray-100">
<div class="max-w-md mx-auto p-4">
<h1 class="text-xl font-bold text-center mb-4">Jubayer Tools</h1>
<div id="adsBox" class="space-y-3 mb-4"></div>
<div id="authBox" class="bg-white p-4 rounded shadow">
<input id="email" placeholder="Email" class="w-full border p-2 mb-2 rounded">
<input id="pass" type="password" placeholder="Password" class="w-full border p-2 mb-2 rounded">
<input id="name" placeholder="Your Name" class="w-full border p-2 mb-2 rounded">
<button onclick="register()" class="w-full bg-blue-600 text-white p-2 rounded mb-2">Register</button>
<button onclick="login()" class="w-full bg-green-600 text-white p-2 rounded">Login</button>
<p id="msg" class="text-sm mt-2 text-center"></p>
</div>
<div id="adminBox" class="hidden bg-white p-4 rounded shadow mt-4">
<h2 class="font-bold mb-2">Add Ads (Admin)</h2>
<input id="adTitle" placeholder="Title" class="w-full border p-2 mb-2 rounded">
<input id="adLink" placeholder="Link https://" class="w-full border p-2 mb-2 rounded">
<input id="adImage" type="file" accept="image/*" class="w-full border p-2 mb-2 rounded">
<p id="compStatus" class="text-xs text-gray-500 mb-2"></p>
<button onclick="addAd()" class="w-full bg-purple-600 text-white p-2 rounded">Add Ad to Server</button>
<div id="adminAds" class="mt-4"></div>
</div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbzbnWdoV_5z8XHokG41lIZgE6lQvt2qZRDeQeHnp6LaojGj_l_gHp0mQwGsv7bPtHGc/exec";
let adImageData="";

document.getElementById('adImage').addEventListener('change',function(e){
 let f=e.target.files[0]; if(!f) return;
 compress(f, d=>{ adImageData=d; });
});

function compress(file, cb){
 let r=new FileReader();
 r.onload=e=>{
  let img=new Image();
  img.onload=()=>{
   let c=document.createElement('canvas'), maxW=350, w=img.width, h=img.height;
   if(w>maxW||h>maxW){ if(w>h){h*=maxW/w;w=maxW;}else{w*=maxW/h;h=maxW;} }
   c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
   let d=c.toDataURL('image/jpeg',0.35);
   let kb=Math.round(d.length*0.75/1024);
   document.getElementById('compStatus').innerText="Ready "+kb+"KB Safe ✅";
   cb(d);
  }; img.src=e.target.result;
 }; r.readAsDataURL(file);
}

function api(action, data){
 let fd=new FormData(); fd.append('action',action);
 for(let k in data) fd.append(k,data[k]);
 return fetch(API,{method:'POST',body:fd}).then(r=>r.json());
}

function register(){
 api('register',{email:email.value,name:name.value,pass:pass.value}).then(r=>{
  msg.innerText=r.error||"Registered ✅ Now Login"; if(!r.error) loadAds();
 });
}
function login(){
 api('login',{email:email.value,pass:pass.value}).then(r=>{
  if(r.error){msg.innerText=r.error; return;}
  msg.innerText="Login Success ✅ "+r.name;
  document.getElementById('adminBox').classList.remove('hidden');
  loadAds();
 });
}
function addAd(){
 if(!adImageData){alert("ছবি সিলেক্ট করুন"); return;}
 api('addAd',{title:adTitle.value,link:adLink.value,image:adImageData}).then(r=>{
  alert(r.error||"Ad Added ✅"); adImageData=""; loadAds();
 });
}
function loadAds(){
 fetch(API+"?action=getAds").then(r=>r.json()).then(list=>{
  let h=""; list.forEach(a=>{
   h+=`<div class="bg-white rounded shadow overflow-hidden"><img src="${a.image}" class="w-full h-40 object-cover"><div class="p-2 flex justify-between"><span>${a.title}</span><a href="${a.link}" target="_blank" class="text-blue-600">Visit</a></div></div>`;
  });
  document.getElementById('adsBox').innerHTML=h;
  document.getElementById('adminAds').innerHTML=h;
 });
}
loadAds();
</script>
</body>
</html>
