<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Developer Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen">
<div class="max-w-3xl mx-auto p-4">
<h1 class="text-xl font-bold mb-4 text-center">Developer Panel <span class="text-green-400">● LIVE</span></h1>

<!-- VISITS -->
<div class="bg-gray-800 p-4 rounded-xl mb-4">
<h2 class="font-bold mb-2">Visit Counter</h2>
<div class="grid grid-cols-3 gap-2 text-center">
<div class="bg-gray-700 p-3 rounded"><p class="text-xs">আজকের</p><h3 id="todayVisit" class="text-xl font-bold">0</h3></div>
<div class="bg-gray-700 p-3 rounded"><p class="text-xs">Total</p><h3 id="totalVisit" class="text-xl font-bold">0</h3></div>
<div class="bg-gray-700 p-3 rounded"><p class="text-xs">Live Now</p><h3 id="liveVisit" class="text-xl font-bold text-green-400">1</h3></div>
</div>
<button onclick="loadVisits()" class="w-full mt-3 bg-blue-600 p-2 rounded"><i class="fa-solid fa-rotate"></i> Replace / Refresh</button>
</div>

<!-- ADS -->
<div class="bg-gray-800 p-4 rounded-xl mb-4">
<h2 class="font-bold mb-2">বিজ্ঞাপন (Ads)</h2>
<input id="adTitle" placeholder="Title" class="w-full bg-gray-700 p-2 rounded mb-2">
<input id="adLink" placeholder="Link https://" class="w-full bg-gray-700 p-2 rounded mb-2">
<input id="adImage" type="file" accept="image/*" class="w-full bg-gray-700 p-2 rounded mb-2">
<p id="adStatus" class="text-xs mb-2 text-gray-400">যেকোনো সাইজ দেওয়া যাবে</p>
<button onclick="addAd()" class="w-full bg-purple-600 p-2 rounded">Add Ad - সবাই দেখবে</button>
<div id="adsList" class="mt-3 space-y-2"></div>
</div>

<!-- NOTICE + COLOR -->
<div class="bg-gray-800 p-4 rounded-xl mb-4">
<h2 class="font-bold mb-2">Home Notice + Color</h2>
<input id="noticeText" placeholder="নোটিশ লিখুন" class="w-full bg-gray-700 p-2 rounded mb-2">
<input id="noticeColor" type="color" value="#fef9c3" class="w-full h-10 rounded mb-2">
<button onclick="addNotice()" class="w-full bg-yellow-600 p-2 rounded">Add Notice</button>
<div id="noticeList" class="mt-3 space-y-1"></div>
</div>

<!-- ACCOUNTS -->
<div class="bg-gray-800 p-4 rounded-xl mb-4">
<h2 class="font-bold mb-2">All Accounts</h2>
<button onclick="loadAccounts()" class="bg-blue-600 px-3 py-1 rounded text-sm mb-3">Replace / Refresh</button>
<div id="accountsList" class="space-y-2"></div>
</div>

<!-- GLOBAL + PERSONAL NOTICE -->
<div class="bg-gray-800 p-4 rounded-xl mb-4">
<h2 class="font-bold mb-2">নোটিশ পাঠান</h2>
<input id="globalNoticeText" placeholder="সব একাউন্টে যাবে" class="w-full bg-gray-700 p-2 rounded mb-2">
<button onclick="sendGlobalNotice()" class="w-full bg-green-600 p-2 rounded mb-2">সবাইকে পাঠান (Global)</button>
<input id="personalEmail" placeholder="যার Email এ পাঠাবেন" class="w-full bg-gray-700 p-2 rounded mb-2">
<input id="personalText" placeholder="Personal Notice" class="w-full bg-gray-700 p-2 rounded mb-2">
<button onclick="sendPersonal()" class="w-full bg-orange-600 p-2 rounded">Personal পাঠান</button>
<div id="personalList" class="mt-3"></div>
</div>

<button onclick="location.href='menu.html'" class="w-full bg-gray-700 p-3 rounded mt-6">← Menu তে ফিরুন</button>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbzbnWdoV_5z8XHokG41lIZgE6lQvt2qZRDeQeHnp6LaojGj_l_gHp0mQwGsv7bPtHGc/exec";
if(localStorage.getItem('isDev')!=='1'){ location.href='menu.html'; }
let adData="";

document.getElementById('adImage').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f) return;
 let r=new FileReader(); r.onload=ev=>{
  let img=new Image(); img.onload=()=>{
   let c=document.createElement('canvas'); let max=600; let w=img.width, h=img.height;
   if(w>max||h>max){ if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;} }
   c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
   adData=c.toDataURL('image/jpeg',0.6);
   document.getElementById('adStatus').innerText="Ready "+Math.round(adData.length*0.75/1024)+"KB ✅";
  }; img.src=ev.target.result;
 }; r.readAsDataURL(f);
});

function post(a,d){ let fd=new FormData(); fd.append('action',a); for(let k in d) fd.append(k,d[k]); return fetch(API,{method:'POST',body:fd}).then(r=>r.json()); }
function get(a){ return fetch(API+"?action="+a).then(r=>r.json()); }

function loadVisits(){
 // Visit count
 let v=JSON.parse(localStorage.getItem('visitData')||'{}');
 let today=new Date().toDateString();
 if(v.date!==today){ v={date:today, today:1, total:(v.total||0)+1}; } else { v.today++; v.total++; }
 localStorage.setItem('visitData',JSON.stringify(v));
 document.getElementById('todayVisit').innerText=v.today;
 document.getElementById('totalVisit').innerText=v.total;
 document.getElementById('liveVisit').innerText=Math.floor(Math.random()*3+1);
 // Server total
 get('getVisits').then(d=>{ if(d.total) document.getElementById('totalVisit').innerText=d.total+" (Server)"; });
 post('addVisit',{}).then(()=>{});
}
function addAd(){
 if(!adData){ alert("ছবি দিন"); return; }
 post('addAd',{title:adTitle.value, link:adLink.value, image:adData}).then(r=>{ alert("Ad Added ✅"); loadAds(); adData=""; });
}
function loadAds(){
 get('getAds').then(list=>{
  let h=""; list.forEach(a=>{
   h+=`<div class="bg-gray-700 p-2 rounded flex gap-2 items-center"><img src="${a.image}" class="w-12 h-12 object-cover rounded"><div class="flex-1"><p class="text-sm">${a.title}</p><a href="${a.link}" class="text-xs text-blue-300">${a.link}</a></div><button onclick="delAd('${a.id}')" class="bg-red-600 px-2 py-1 rounded text-xs">Delete</button></div>`;
  }); document.getElementById('adsList').innerHTML=h;
 });
}
function delAd(id){ if(confirm("Delete?")) post('deleteAd',{id:id}).then(()=>loadAds()); }

function addNotice(){
 let color=document.getElementById('noticeColor').value;
 post('addNotice',{text:noticeText.value, color:color}).then(()=>{ loadNotice(); });
}
function loadNotice(){
 get('getNotice').then(list=>{
  let h=""; list.forEach(n=>{
   h+=`<div class="flex justify-between bg-gray-700 p-2 rounded text-sm"><span style="color:${n.color||'#fff'}">${n.text}</span><button onclick="delNotice('${n.id}')" class="bg-red-600 px-2 rounded text-xs">X</button></div>`;
  }); document.getElementById('noticeList').innerHTML=h;
 });
}
function delNotice(id){ post('deleteNotice',{id:id}).then(()=>loadNotice()); }

function loadAccounts(){
 get('getUsers').then(list=>{
  let h=""; list.forEach((u,i)=>{
   h+=`<div class="bg-gray-700 p-2 rounded flex justify-between items-center"><span class="text-sm">${i+1}. ${u.email} - ${u.name} - Pass: ${u.pass||'***'}</span><div class="flex gap-1"><button onclick="sendTo('${u.email}')" class="bg-blue-600 px-2 py-1 rounded text-xs"><i class="fa-solid fa-paper-plane"></i></button><button onclick="delUser('${u.email}')" class="bg-red-600 px-2 py-1 rounded text-xs"><i class="fa-solid fa-trash"></i></button></div></div>`;
  }); document.getElementById('accountsList').innerHTML=h;
 });
}
function delUser(email){ if(confirm("Delete "+email+"?")) post('deleteUser',{email:email}).then(()=>loadAccounts()); }
function sendTo(email){ document.getElementById('personalEmail').value=email; window.scrollTo(0,document.body.scrollHeight); }

function sendGlobalNotice(){ post('addNotice',{text:globalNoticeText.value}).then(()=>{ alert("Global Sent ✅"); }); }
function sendPersonal(){
 post('addPersonalNotice',{email:personalEmail.value, text:personalText.value}).then(()=>{ alert("Personal Sent to "+personalEmail.value); loadPersonal(); });
}
function loadPersonal(){
 get('getAllPersonalNotices').then(list=>{
  let h=""; list.forEach(n=>{
   h+=`<div class="bg-gray-700 p-2 rounded text-xs flex justify-between"><span>${n.email}: ${n.text}</span><button onclick="delPNotice('${n.id}')" class="bg-red-600 px-1 rounded">X</button></div>`;
  }); document.getElementById('personalList').innerHTML=h;
 });
}
function delPNotice(id){ post('deletePersonalNotice',{id:id}).then(()=>loadPersonal()); }

loadVisits(); loadAds(); loadNotice(); loadAccounts(); loadPersonal();
</script>
</body>
</html>
