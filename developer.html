<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Developer Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen">
<div class="max-w-3xl mx-auto p-4">
<h1 class="text-xl font-bold mb-4 text-center">Developer Panel <span class="text-green-400">● LIVE</span></h1>

<div class="bg-gray-800 p-4 rounded-xl mb-4">
<h2 class="font-bold mb-2">Visit Counter</h2>
<div class="grid grid-cols-3 gap-2 text-center">
<div class="bg-gray-700 p-3 rounded"><p class="text-xs">আজকের</p><h3 id="todayVisit" class="text-xl font-bold">0</h3></div>
<div class="bg-gray-700 p-3 rounded"><p class="text-xs">Total</p><h3 id="totalVisit" class="text-xl font-bold">0</h3></div>
<div class="bg-gray-700 p-3 rounded"><p class="text-xs">Live Now</p><h3 id="liveVisit" class="text-xl font-bold text-green-400">1</h3></div>
</div>
<button onclick="loadVisits()" class="w-full mt-3 bg-blue-600 p-2 rounded">Refresh</button>
</div>

<!-- ADS - ১০০% ফিক্সড -->
<div class="bg-gray-800 p-4 rounded-xl mb-4">
<h2 class="font-bold mb-2">বিজ্ঞাপন (Ads) <span id="adCount" class="text-xs bg-purple-600 px-2 py-0.5 rounded-full">0</span></h2>
<input id="adTitle" placeholder="Title" class="w-full bg-gray-700 p-2 rounded mb-2">
<input id="adLink" placeholder="Link https://" class="w-full bg-gray-700 p-2 rounded mb-2">
<input id="adImage" type="file" accept="image/*" class="w-full bg-gray-700 p-2 rounded mb-2">
<p id="adStatus" class="text-xs mb-2 text-gray-400">ছবি অটো ছোট হবে</p>
<button onclick="addAd()" class="w-full bg-purple-600 p-2 rounded font-bold">Add Ad - সবাই দেখবে</button>

<div class="mt-4 bg-gray-900 p-2 rounded-lg border border-gray-700">
<p class="text-xs text-gray-400 mb-2"><i class="fa-solid fa-rectangle-ad"></i> লাইভ বিজ্ঞাপন (নিচে দেখাবে + ক্রসে ডিলিট):</p>
<div id="adsList" class="space-y-2 max-h-[500px] overflow-y-auto"></div>
</div>
</div>

<div class="bg-gray-800 p-4 rounded-xl mb-4">
<h2 class="font-bold mb-2">Home Notice + Color</h2>
<input id="noticeText" placeholder="নোটিশ লিখুন" class="w-full bg-gray-700 p-2 rounded mb-2">
<input id="noticeColor" type="color" value="#2563eb" class="w-full h-10 rounded mb-2">
<button onclick="addNotice()" class="w-full bg-yellow-600 p-2 rounded">Add Notice</button>
<div id="noticeList" class="mt-3 space-y-1"></div>
</div>

<!-- ACCOUNTS - ১০০% ফিক্সড User + Pass + ২টা আইকন -->
<div class="bg-gray-800 p-4 rounded-xl mb-4">
<h2 class="font-bold mb-2">All Accounts <span id="accCount" class="text-xs bg-blue-600 px-2 py-0.5 rounded-full">0</span></h2>
<button onclick="loadAccounts()" class="bg-blue-600 px-3 py-1 rounded text-sm mb-3"><i class="fa-solid fa-rotate"></i> Refresh</button>
<div id="accountsList" class="space-y-2 max-h-[600px] overflow-y-auto"></div>
</div>

<div class="bg-gray-800 p-4 rounded-xl mb-4">
<h2 class="font-bold mb-2">নোটিশ পাঠান</h2>
<input id="globalNoticeText" placeholder="সব একাউন্টে যাবে" class="w-full bg-gray-700 p-2 rounded mb-2">
<button onclick="sendGlobalNotice()" class="w-full bg-green-600 p-2 rounded mb-2">সবাইকে পাঠান</button>
<input id="personalEmail" placeholder="UserID / Email - উপরে ✈️ ক্লিক করলে অটো বসবে" class="w-full bg-gray-700 p-2 rounded mb-2 border border-blue-500">
<input id="personalText" placeholder="Personal Notice লিখুন" class="w-full bg-gray-700 p-2 rounded mb-2">
<button onclick="sendPersonal()" class="w-full bg-orange-600 p-2 rounded font-bold">Personal পাঠান</button>
<div id="personalList" class="mt-3 space-y-1"></div>
</div>

<button onclick="location.href='index.html'" class="w-full bg-gray-700 p-3 rounded mt-2">← Home</button>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbzzp1BocPfy59Y0FBNutnHdBq1nY4QfIWwsrIZy-s-ECXHn0hgpq_whU475M1KnqVCC/exec";
if(localStorage.getItem('isDev')!=='1'){ location.href='menu.html'; }
let adData="";
document.getElementById('adImage').addEventListener('change',e=>{
 let f=e.target.files[0]; if(!f) return;
 let r=new FileReader(); r.onload=ev=>{
  let img=new Image(); img.onload=()=>{
   let c=document.createElement('canvas'); let max=500; let w=img.width, h=img.height;
   if(w>max||h>max){ if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;} }
   c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
   adData=c.toDataURL('image/jpeg',0.5);
   adStatus.innerText="Ready "+Math.round(adData.length*0.75/1024)+"KB ✅";
  }; img.src=ev.target.result;
 }; r.readAsDataURL(f);
});
function post(a,d){ let fd=new FormData(); fd.append('action',a); for(let k in d) fd.append(k,d[k]); return fetch(API,{method:'POST',body:fd}).then(r=>r.json()); }
function get(a){ return fetch(API+"?action="+a+"&t="+Date.now()).then(r=>r.json()).catch(()=>[]); }

function loadVisits(){ get('getVisits').then(d=>{ todayVisit.innerText=d.daily||0; totalVisit.innerText=d.total||0; liveVisit.innerText=Math.floor(Math.random()*3+1); }); }

// ADS LOGIC
function addAd(){
 if(!adData){ alert("ছবি সিলেক্ট করুন"); return; }
 if(!adTitle.value){ alert("Title দিন"); return; }
 adStatus.innerText="Uploading...";
 post('addAd',{title:adTitle.value, link:adLink.value, image:adData}).then(()=>{
  alert("Ad Added ✅ নিচে দেখুন");
  adData=""; adTitle.value=""; adLink.value=""; adStatus.innerText="Done ✅";
  document.getElementById('adImage').value="";
  loadAds();
 });
}
function loadAds(){
 adsList.innerHTML="<p class='text-xs text-yellow-300 p-2'>Loading...</p>";
 get('getAdsFull').then(list=>{
  adCount.innerText=list?list.length:0;
  if(!list||list.length==0){ adsList.innerHTML="<p class='text-xs text-gray-400 p-3 text-center border border-dashed rounded'>কোন Ads নেই - Index এ Hide থাকবে</p>"; return; }
  let h="";
  list.reverse().forEach(a=>{
   h+=`<div class="bg-gray-700 p-2 rounded flex gap-3 items-center">
    <img src="${a.image}" class="w-14 h-14 object-cover rounded" onerror="this.src='https://via.placeholder.com/56'">
    <div class="flex-1 overflow-hidden">
      <p class="text-sm font-bold truncate">${a.title}</p>
      <a href="${a.link}" target="_blank" class="text-[11px] text-blue-300 truncate block">${a.link}</a>
    </div>
    <button onclick="delAd('${a.id}')" class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center text-sm hover:bg-red-700"><i class="fa-solid fa-xmark"></i></button>
   </div>`;
  });
  adsList.innerHTML=h;
 });
}
function delAd(id){
 if(!confirm("এই বিজ্ঞাপন ডিলিট করবেন?")) return;
 post('deleteAd',{id:id}).then(()=>{ loadAds(); });
}

// ACCOUNTS LOGIC - User + Pass + Notice Icon
function loadAccounts(){
 accountsList.innerHTML="<p class='text-xs text-yellow-300'>Loading...</p>";
 get('getUsers').then(list=>{
  accCount.innerText=list?list.length:0;
  if(!list||list.length==0){ accountsList.innerHTML="<p class='text-xs text-gray-400 p-2 text-center'>কোন Account নেই</p>"; return; }
  let h="";
  list.reverse().forEach((u)=>{
   let email = u.email || u.userId || "";
   let user = u.user || u.name || email.split('@')[0];
   let pass = u.pass || u.password || "N/A";
   h+=`<div class="bg-gray-700 p-3 rounded flex justify-between items-center border border-gray-600">
     <div class="flex-1 overflow-hidden">
       <p class="text-[11px] font-bold text-green-300"><i class="fa-solid fa-user"></i> ${user}</p>
       <p class="text-[10px] text-gray-300 truncate"><i class="fa-solid fa-envelope"></i> ${email}</p>
       <p class="text-[11px] font-mono bg-gray-900 px-2 py-0.5 rounded mt-1 inline-block"><i class="fa-solid fa-key text-yellow-400"></i> ${pass}</p>
     </div>
     <div class="flex gap-2 ml-2">
       <button onclick="openPersonal('${email}')" title="Personal Notice" class="w-9 h-9 bg-blue-600 rounded-full flex items-center justify-center hover:bg-blue-700"><i class="fa-solid fa-paper-plane text-xs"></i></button>
       <button onclick="delUser('${email}')" title="Delete ID" class="w-9 h-9 bg-red-600 rounded-full flex items-center justify-center hover:bg-red-700"><i class="fa-solid fa-trash text-xs"></i></button>
     </div>
   </div>`;
  });
  accountsList.innerHTML=h;
 });
}
function openPersonal(email){
 personalEmail.value = email;
 personalText.placeholder = email + " কে নোটিশ লিখুন...";
 document.getElementById('personalText').focus();
 window.scrollTo(0, document.body.scrollHeight);
}
function delUser(e){ if(confirm("Delete "+e+"?")) post('deleteUser',{email:e, userId:e}).then(()=>loadAccounts()); }

function addNotice(){ if(!noticeText.value) return; post('addNotice',{text:noticeText.value, color:noticeColor.value}).then(()=>{ noticeText.value=""; loadNotice(); }); }
function loadNotice(){ get('getNotice').then(list=>{ let h=""; list.forEach(n=>{ h+=`<div class="flex justify-between bg-gray-700 p-2 rounded text-sm"><span style="color:${n.color}">${n.text}</span><button onclick="delNotice('${n.id}')" class="bg-red-600 px-2 rounded text-xs">X</button></div>`; }); noticeList.innerHTML=h; }); }
function delNotice(id){ if(confirm("Delete?")) post('deleteNotice',{id:id}).then(()=>loadNotice()); }
function sendGlobalNotice(){ if(!globalNoticeText.value) return; post('addNotice',{text:globalNoticeText.value, color:"#2563eb"}).then(()=>{ alert("Sent All ✅"); globalNoticeText.value=""; loadNotice(); }); }
function sendPersonal(){ if(!personalEmail.value||!personalText.value) return; post('addPersonalNotice',{email:personalEmail.value, text:personalText.value}).then(()=>{ alert("Personal Sent to "+personalEmail.value+" ✅"); personalText.value=""; loadPersonal(); }); }
function loadPersonal(){ get('getAllPersonalNotices').then(list=>{ let h=""; list.reverse().forEach(n=>{ h+=`<div class="bg-gray-700 p-2 rounded text-xs flex justify-between"><span>${n.email}: ${n.text}</span><button onclick="delPNotice('${n.id}')" class="bg-red-600 px-2 rounded">X</button></div>`; }); personalList.innerHTML=h; }); }
function delPNotice(id){ if(confirm("Delete?")) post('deletePersonalNotice',{id:id}).then(()=>loadPersonal()); }

loadVisits(); loadAds(); loadNotice(); loadAccounts(); loadPersonal();
</script>
</body>
</html>
